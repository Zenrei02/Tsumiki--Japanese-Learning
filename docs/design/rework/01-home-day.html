<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tsumiki Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;background:#E9E2D1;color:#2C2A26;-webkit-font-smoothing:antialiased}
a{color:#8C3B2A}a:hover{color:#6E2D20}
.jp{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.tatami{background-color:#C6BE8E;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,rgba(0,0,0,0) 1px 5px),repeating-linear-gradient(0deg,rgba(84,74,34,.18) 0 1px,rgba(0,0,0,0) 1px 3px)}
.washi{background-color:#FBF7EE;background-image:radial-gradient(rgba(120,100,60,.06) 1px,rgba(0,0,0,0) 1px),radial-gradient(rgba(120,100,60,.045) 1px,rgba(0,0,0,0) 1px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border:0;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.01em;transition:transform .08s ease,box-shadow .08s ease,filter .08s ease}
.btn-shu{min-height:56px;padding:0 24px;border-radius:14px;color:#FFF6EC;font-size:17px;background-image:linear-gradient(180deg,#DC4B2E 0%,#C7351B 52%,#AC2B15 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.14),0 4px 0 #7E1F0F,0 8px 18px rgba(126,31,15,.30)}
.btn-shu:hover{filter:brightness(1.04)}
.btn-shu:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 #7E1F0F,0 2px 6px rgba(126,31,15,.3)}
.btn-wood{min-height:52px;padding:0 20px;border-radius:12px;color:#2C2A26;font-size:16px;background-color:#C9A47C;background-image:repeating-linear-gradient(92deg,rgba(60,35,15,.11) 0 2px,rgba(0,0,0,0) 2px 8px,rgba(60,35,15,.06) 8px 10px,rgba(0,0,0,0) 10px 17px),linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 #8A6540,0 6px 12px rgba(90,60,30,.22)}
.btn-wood:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 #8A6540}
.btn-washi{min-height:44px;padding:0 16px;border-radius:12px;color:#2C2A26;font-size:15px;background-color:#FBF7EE;box-shadow:inset 0 0 0 1.5px #D9CFB8,0 2px 0 #CFC4A8}
.btn-washi:active{transform:translateY(1px);box-shadow:inset 0 0 0 1.5px #D9CFB8,0 1px 0 #CFC4A8}
.block{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-sizing:border-box;border-radius:12px;cursor:pointer;border:0;font-family:inherit;color:#FFF8EC;background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(0,0,0,0) 45%,rgba(0,0,0,.10));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 0 #7A5A3C,0 9px 14px rgba(70,45,20,.28);transition:transform .08s ease,box-shadow .08s ease}
.block:active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 #7A5A3C,0 3px 6px rgba(70,45,20,.25)}
.icon{background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#2C2A26}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div class="tatami" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px 12px; background-color: #F6F1E6; box-shadow: 0 1px 0 #D9CFB8">
    <button class="icon" aria-label="Open menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 10px">
      <div class="jp" style="width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #FFF6EC; background-image: linear-gradient(180deg, #DC4B2E, #A82A15); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 #7E1F0F">つ</div>
      <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1">tsumiki</div>
    </div>
    <button class="icon" aria-label="Ambience: bamboo fountain and koto, on" style="color: #2F6F6B">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>
    </button>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 0 0 24px 0">

    <a href="#" aria-label="Your room" style="display: block; text-decoration: none; color: inherit; margin: 0">
      <svg width="390" height="196" viewBox="0 0 390 196" role="img" aria-label="A tatami room: shoji screens, a low table with wooden blocks, a bamboo fountain" style="display: block">
        <defs>
          <pattern id="weave" width="6" height="3" patternUnits="userSpaceOnUse">
            <rect width="6" height="3" fill="#C6BE8E"></rect>
            <rect width="1" height="3" fill="#E4DDB3"></rect>
            <rect y="2" width="6" height="1" fill="#A79E6A"></rect>
          </pattern>
        </defs>
        <rect width="390" height="196" fill="#EFE7D4"></rect>
        <g fill="#F5EEDD" stroke="#B89A72" stroke-width="2">
          <rect x="18" y="8" width="150" height="120"></rect>
          <rect x="222" y="8" width="150" height="120"></rect>
        </g>
        <g stroke="#B89A72" stroke-width="1.4">
          <path d="M18 38h150M18 68h150M18 98h150M56 8v120M93 8v120M130 8v120"></path>
          <path d="M222 38h150M222 68h150M222 98h150M260 8v120M297 8v120M334 8v120"></path>
        </g>
        <rect x="176" y="8" width="38" height="120" fill="#E3D9C3"></rect>
        <rect x="185" y="20" width="20" height="70" rx="2" fill="#FBF7EE" stroke="#B89A72"></rect>
        <text x="195" y="60" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="18" font-weight="700" fill="#2C2A26">つ</text>
        <rect x="0" y="128" width="390" height="8" fill="#5E4630"></rect>
        <rect x="0" y="136" width="390" height="60" fill="url(#weave)"></rect>
        <path d="M0 136h390" stroke="#2B3A55" stroke-width="3"></path>
        <path d="M195 136v60" stroke="#2B3A55" stroke-width="3"></path>
        <g>
          <rect x="112" y="150" width="166" height="12" rx="3" fill="#4A3423"></rect>
          <rect x="120" y="162" width="10" height="16" fill="#3B2A1C"></rect>
          <rect x="260" y="162" width="10" height="16" fill="#3B2A1C"></rect>
          <rect x="150" y="128" width="24" height="22" rx="3" fill="#9C8BC4" stroke="#5B4A7D"></rect>
          <text x="162" y="145" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="14" font-weight="700" fill="#FFF8EC">あ</text>
          <rect x="176" y="128" width="24" height="22" rx="3" fill="#2F6F6B" stroke="#1F4C49"></rect>
          <text x="188" y="145" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="14" font-weight="700" fill="#FFF8EC">文</text>
          <rect x="163" y="106" width="24" height="22" rx="3" fill="#C7351B" stroke="#7E1F0F"></rect>
          <text x="175" y="123" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="14" font-weight="700" fill="#FFF8EC">直</text>
        </g>
        <g>
          <ellipse cx="338" cy="176" rx="34" ry="12" fill="#8E8A80"></ellipse>
          <ellipse cx="338" cy="172" rx="26" ry="8" fill="#5B7C8C"></ellipse>
          <path d="M300 96l40 46" stroke="#7C9A4C" stroke-width="9" stroke-linecap="round"></path>
          <path d="M300 96l40 46" stroke="#5F7B36" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"></path>
          <rect x="332" y="120" width="8" height="52" fill="#5F7B36"></rect>
          <circle cx="346" cy="152" r="3" fill="#9CC3D6"></circle>
          <circle cx="344" cy="162" r="2" fill="#9CC3D6"></circle>
        </g>
        <g>
          <rect x="30" y="112" width="54" height="8" rx="2" fill="#4A3423"></rect>
          <path d="M57 112c-4-14-2-26 6-32" stroke="#6B4E2E" stroke-width="4" fill="none" stroke-linecap="round"></path>
          <circle cx="66" cy="76" r="14" fill="#5E8C61"></circle>
          <circle cx="52" cy="86" r="9" fill="#4E7B52"></circle>
        </g>
      </svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 18px; padding: 0 16px">

      <div class="washi" style="border-radius: 16px; padding: 18px 18px 16px 18px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 3px 0 #CFC4A8, 0 10px 22px rgba(60,45,20,.16); display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #6E6A60">NEXT ON YOUR PATH</div>
        <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
          <span style="font-size: 22px; font-weight: 700; line-height: 1.25">Write one sentence and check it</span>
        </div>
        <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5A564D">in Checker <span class="jp" style="color: #2C2A26">直し</span> — find out what is wrong, what merely sounds off, and why.</p>
        <a href="#" class="btn btn-shu" style="margin-top: 6px; text-decoration: none">Go <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #4A463D">YOUR BLOCKS</div>
        <div class="jp" style="font-size: 13px; color: #4A463D">つみき</div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
        <button class="block" style="height: 104px; background-color: #9C8BC4">
          <span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">あ</span>
          <span style="font-size: 12px; font-weight: 700">Hiragana</span>
        </button>
        <button class="block" style="height: 104px; background-color: #7A66A8">
          <span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">ア</span>
          <span style="font-size: 12px; font-weight: 700">Katakana</span>
        </button>
        <button class="block" style="height: 104px; background-color: #5B4A7D">
          <span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">漢</span>
          <span style="font-size: 12px; font-weight: 700">Kanji</span>
        </button>
        <button class="block" style="height: 104px; background-color: #2F6F6B">
          <span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">文</span>
          <span style="font-size: 12px; font-weight: 700">Grammar</span>
        </button>
        <button class="block" style="height: 104px; background-color: #8A5A3B">
          <span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">言</span>
          <span style="font-size: 12px; font-weight: 700">Vocabulary</span>
        </button>
        <a href="#" class="block" style="height: 104px; background-color: #C7351B; text-decoration: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 0 #7E1F0F, 0 9px 14px rgba(126,31,15,.32)">
          <span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">直</span>
          <span style="font-size: 12px; font-weight: 700">Checker</span>
        </a>
      </div>

      <div style="display: flex; gap: 12px">
        <a href="#" class="btn btn-wood" style="flex-grow: 1; text-decoration: none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
          Room <span class="jp" style="font-weight: 500">へや</span>
        </a>
      </div>
    </div>
  </div>

  <button aria-label="Open the dictionary" class="jp" style="position: absolute; right: 0; top: 400px; width: 34px; height: 104px; border: 0; border-radius: 10px 0 0 10px; cursor: pointer; background-color: #FBF7EE; color: #2C2A26; box-shadow: inset 1.5px 0 0 #D9CFB8, -2px 2px 6px rgba(60,45,20,.18); font-size: 15px; writing-mode: vertical-rl; letter-spacing: .1em">じしょ</button>
</div>
</body>
</html>
