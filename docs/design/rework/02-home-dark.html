<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Variant A · Dusk lantern</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;background:#1B1E2C;color:#F3E9D2;-webkit-font-smoothing:antialiased}
a{color:#E8B86A}a:hover{color:#F3CB86}
.jp{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.tatami{background-color:#5E5B45;background-image:repeating-linear-gradient(90deg,rgba(255,240,200,.10) 0 1px,rgba(0,0,0,0) 1px 5px),repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px)}
.washi{background-color:#F6E9CC;background-image:radial-gradient(rgba(120,90,40,.07) 1px,rgba(0,0,0,0) 1px),radial-gradient(rgba(120,90,40,.05) 1px,rgba(0,0,0,0) 1px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px;color:#2C2A26}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border:0;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.01em;transition:transform .08s ease,box-shadow .08s ease}
.btn-shu{min-height:56px;padding:0 24px;border-radius:14px;color:#FFF6EC;font-size:17px;background-image:linear-gradient(180deg,#E2532F 0%,#C7351B 52%,#A82A15 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.14),0 4px 0 #6E1A0C,0 10px 24px rgba(226,83,47,.35)}
.btn-shu:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 #6E1A0C}
.btn-wood{min-height:52px;padding:0 20px;border-radius:12px;color:#F6E9CC;font-size:16px;background-color:#6B4E33;background-image:repeating-linear-gradient(92deg,rgba(0,0,0,.16) 0 2px,rgba(0,0,0,0) 2px 8px,rgba(0,0,0,.08) 8px 10px,rgba(0,0,0,0) 10px 17px),linear-gradient(180deg,rgba(255,220,160,.14),rgba(0,0,0,.08));box-shadow:inset 0 1px 0 rgba(255,220,160,.25),0 3px 0 #3E2B18,0 6px 12px rgba(0,0,0,.35)}
.btn-wood:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,220,160,.2),0 1px 0 #3E2B18}
.block{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-sizing:border-box;border-radius:12px;cursor:pointer;border:0;font-family:inherit;color:#FFF8EC;background-image:linear-gradient(180deg,rgba(255,225,170,.22),rgba(0,0,0,0) 45%,rgba(0,0,0,.14));box-shadow:inset 0 1px 0 rgba(255,225,170,.35),0 6px 0 #3E2B18,0 9px 16px rgba(0,0,0,.4)}
.block:active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,225,170,.3),0 2px 0 #3E2B18}
.icon{background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#F3E9D2}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div class="tatami" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px 12px; background-color: #23263A; box-shadow: 0 1px 0 #3A3E58">
    <button class="icon" aria-label="Open menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 10px">
      <div class="jp" style="width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #FFF6EC; background-image: linear-gradient(180deg, #E2532F, #A82A15); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 #6E1A0C, 0 0 18px rgba(226,83,47,.45)">つ</div>
      <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1">tsumiki</div>
    </div>
    <button class="icon" aria-label="Ambience: crickets and shamisen, on" style="color: #E8B86A">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>
    </button>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 0 0 24px 0">
    <a href="#" aria-label="Your room at dusk" style="display: block; text-decoration: none; color: inherit">
      <svg width="390" height="196" viewBox="0 0 390 196" role="img" aria-label="A tatami room at dusk: shoji glowing deep blue, an andon paper lantern lighting a low table" style="display: block">
        <defs>
          <radialGradient id="lamp" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFD48A" stop-opacity=".55"></stop><stop offset="1" stop-color="#FFD48A" stop-opacity="0"></stop></radialGradient>
          <pattern id="weave" width="6" height="3" patternUnits="userSpaceOnUse"><rect width="6" height="3" fill="#6B6849"></rect><rect width="1" height="3" fill="#8A8660"></rect><rect y="2" width="6" height="1" fill="#4D4A33"></rect></pattern>
        </defs>
        <rect width="390" height="196" fill="#1B1E2C"></rect>
        <g fill="#26304A" stroke="#4B4A5E" stroke-width="2"><rect x="18" y="8" width="150" height="120"></rect><rect x="222" y="8" width="150" height="120"></rect></g>
        <g stroke="#4B4A5E" stroke-width="1.4"><path d="M18 38h150M18 68h150M18 98h150M56 8v120M93 8v120M130 8v120"></path><path d="M222 38h150M222 68h150M222 98h150M260 8v120M297 8v120M334 8v120"></path></g>
        <rect x="0" y="128" width="390" height="8" fill="#2E2116"></rect>
        <rect x="0" y="136" width="390" height="60" fill="url(#weave)"></rect>
        <path d="M0 136h390M195 136v60" stroke="#141A2C" stroke-width="3"></path>
        <ellipse cx="195" cy="150" rx="170" ry="70" fill="url(#lamp)"></ellipse>
        <rect x="112" y="150" width="166" height="12" rx="3" fill="#3B2A1C"></rect>
        <rect x="120" y="162" width="10" height="16" fill="#2A1D12"></rect><rect x="260" y="162" width="10" height="16" fill="#2A1D12"></rect>
        <g>
          <rect x="160" y="98" width="40" height="54" rx="4" fill="#F6E9CC" stroke="#3B2A1C" stroke-width="2"></rect>
          <path d="M160 116h40M160 134h40M180 98v54" stroke="#3B2A1C" stroke-width="1.5"></path>
          <rect x="166" y="104" width="28" height="42" fill="#FFD48A" opacity=".55"></rect>
          <text x="180" y="130" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="16" font-weight="700" fill="#A82A15">つ</text>
        </g>
        <rect x="222" y="128" width="24" height="22" rx="3" fill="#9C8BC4" stroke="#5B4A7D"></rect>
        <text x="234" y="145" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="14" font-weight="700" fill="#FFF8EC">あ</text>
        <circle cx="330" cy="40" r="14" fill="#F3E9D2" opacity=".9"></circle>
        <circle cx="336" cy="36" r="12" fill="#26304A"></circle>
      </svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 18px; padding: 0 16px">
      <div class="washi" style="border-radius: 16px; padding: 18px 18px 16px 18px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 3px 0 #B99B6A, 0 0 40px rgba(255,212,138,.22), 0 12px 26px rgba(0,0,0,.4); display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #6E6A60">NEXT ON YOUR PATH</div>
        <span style="font-size: 22px; font-weight: 700; line-height: 1.25">Write one sentence and check it</span>
        <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5A564D">in Checker <span class="jp" style="color: #2C2A26">直し</span> — find out what is wrong, what merely sounds off, and why.</p>
        <a href="#" class="btn btn-shu" style="margin-top: 6px; text-decoration: none">Go <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #E8DCC0">YOUR BLOCKS</div>
        <div class="jp" style="font-size: 13px; color: #E8DCC0">つみき</div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
        <button class="block" style="height: 104px; background-color: #9C8BC4"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">あ</span><span style="font-size: 12px; font-weight: 700">Hiragana</span></button>
        <button class="block" style="height: 104px; background-color: #7A66A8"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">ア</span><span style="font-size: 12px; font-weight: 700">Katakana</span></button>
        <button class="block" style="height: 104px; background-color: #5B4A7D"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">漢</span><span style="font-size: 12px; font-weight: 700">Kanji</span></button>
        <button class="block" style="height: 104px; background-color: #2F6F6B"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">文</span><span style="font-size: 12px; font-weight: 700">Grammar</span></button>
        <button class="block" style="height: 104px; background-color: #8A5A3B"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">言</span><span style="font-size: 12px; font-weight: 700">Vocabulary</span></button>
        <a href="#" class="block" style="height: 104px; background-color: #C7351B; text-decoration: none; box-shadow: inset 0 1px 0 rgba(255,225,170,.35), 0 6px 0 #6E1A0C, 0 9px 20px rgba(226,83,47,.4)"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">直</span><span style="font-size: 12px; font-weight: 700">Checker</span></a>
      </div>

      <div style="display: flex; gap: 12px">
        <a href="#" class="btn btn-wood" style="flex-grow: 1; text-decoration: none">Room <span class="jp" style="font-weight: 500">へや</span></a>
      </div>
    </div>
  </div>

  <button aria-label="Open the dictionary" class="jp" style="position: absolute; right: 0; top: 400px; width: 34px; height: 104px; border: 0; border-radius: 10px 0 0 10px; cursor: pointer; background-color: #F6E9CC; color: #2C2A26; box-shadow: inset 1.5px 0 0 #B99B6A, -2px 2px 8px rgba(0,0,0,.4); font-size: 15px; writing-mode: vertical-rl; letter-spacing: .1em">じしょ</button>
</div>
</body>
</html>
