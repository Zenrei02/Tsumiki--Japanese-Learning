<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanji with dictionary bar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;background:#E9E2D1;color:#2C2A26;-webkit-font-smoothing:antialiased}
a{color:#8C3B2A}a:hover{color:#6E2D20}
.jp{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.tatami{background-color:#C6BE8E;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,rgba(0,0,0,0) 1px 5px),repeating-linear-gradient(0deg,rgba(84,74,34,.18) 0 1px,rgba(0,0,0,0) 1px 3px)}
.washi{background-color:#FBF7EE;background-image:radial-gradient(rgba(120,100,60,.06) 1px,rgba(0,0,0,0) 1px),radial-gradient(rgba(120,100,60,.045) 1px,rgba(0,0,0,0) 1px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border:0;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.01em;transition:transform .08s ease,box-shadow .08s ease,filter .08s ease}
.btn-shu{min-height:56px;padding:0 24px;border-radius:14px;color:#FFF6EC;font-size:17px;background-image:linear-gradient(180deg,#DC4B2E 0%,#C7351B 52%,#AC2B15 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.14),0 4px 0 #7E1F0F,0 8px 18px rgba(126,31,15,.30)}
.btn-shu:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 #7E1F0F,0 2px 6px rgba(126,31,15,.3)}
.btn-wood{min-height:44px;padding:0 16px;border-radius:12px;color:#2C2A26;font-size:14px;background-color:#C9A47C;background-image:repeating-linear-gradient(92deg,rgba(60,35,15,.11) 0 2px,rgba(0,0,0,0) 2px 8px,rgba(60,35,15,.06) 8px 10px,rgba(0,0,0,0) 10px 17px),linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 #8A6540,0 6px 12px rgba(90,60,30,.22)}
.btn-wood:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 #8A6540}
.btn-washi{min-height:44px;padding:0 16px;border-radius:12px;color:#2C2A26;font-size:15px;background-color:#FBF7EE;box-shadow:inset 0 0 0 1.5px #D9CFB8,0 2px 0 #CFC4A8}
.seg{display:flex;padding:3px;border-radius:10px;background:#E4DBC6;box-shadow:inset 0 1px 2px rgba(60,45,20,.18)}
.seg button{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;min-height:38px;padding:0 14px;border-radius:8px;background:none;color:#6E6A60}
.seg button.on{background:#FBF7EE;color:#2C2A26;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 1px 3px rgba(60,45,20,.2)}
.icon{background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#2C2A26}
.word{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:none;border:0;cursor:pointer;font-family:inherit;text-align:left;color:#2C2A26;width:100%;box-sizing:border-box}
.word:hover{background:rgba(120,100,60,.08)}
ruby{ruby-position:over}rt{font-size:.5em;color:#6E6A60;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500}
.pop{text-decoration:underline dotted #8A5A3B;text-underline-offset:5px;cursor:pointer}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div class="tatami" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 6px; padding: 12px 12px 8px 8px; background-color: #F6F1E6; box-shadow: 0 1px 0 #D9CFB8, 0 -3px 0 #5B4A7D inset">
    <a href="#" class="icon" aria-label="Back to home" style="text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; align-items: baseline; gap: 10px; flex-grow: 1">
      <span class="jp" style="font-size: 24px; font-weight: 700; line-height: 1">漢字</span>
      <span style="font-size: 15px; font-weight: 700; color: #4A463D">Kanji</span>
    </div>
    <div class="seg" role="group" aria-label="Script">
      <button>かな</button>
      <button class="on">漢字</button>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 24px 16px">

    <div class="washi" style="border-radius: 16px; padding: 16px 18px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 3px 0 #CFC4A8, 0 10px 22px rgba(60,45,20,.16); display: flex; gap: 16px; align-items: center">
      <svg width="132" height="132" viewBox="0 0 109 109" role="img" aria-label="Stroke order for the kanji 日, four strokes" style="flex-shrink: 0; background: #FFFDF7; border-radius: 12px; box-shadow: inset 0 0 0 1.5px #D9CFB8">
        <path d="M0 54.5h109M54.5 0v109" stroke="#E4DBC6" stroke-width="1" stroke-dasharray="3 3"></path>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
          <path d="M30 22v66" stroke="#2C2A26"></path>
          <path d="M30 22h50v66" stroke="#2C2A26"></path>
          <path d="M31 54h48" stroke="#5B4A7D"></path>
          <path d="M31 86h48" stroke="#C4BBD8"></path>
        </g>
        <g font-family="Zen Kaku Gothic New, sans-serif" font-size="10" font-weight="700" fill="#C7351B">
          <text x="19" y="22">1</text><text x="46" y="16">2</text><text x="19" y="58">3</text><text x="19" y="93">4</text>
        </g>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
        <div class="jp" style="font-size: 44px; font-weight: 700; line-height: 1">日</div>
        <div style="font-size: 14px; font-weight: 700">sun · day</div>
        <div style="font-size: 13px; color: #4A463D; line-height: 1.5"><span class="jp">ニチ · ジツ</span><br><span class="jp">ひ · か</span></div>
        <div style="font-size: 12px; color: #6E6A60">Stroke 3 of 4 — trace it</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #4A463D">WORDS YOU ALREADY USE</div>
      <span style="font-size: 12px; color: #4A463D">tap a word</span>
    </div>

    <div class="washi" style="border-radius: 16px; padding: 8px 6px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 3px 0 #CFC4A8, 0 8px 18px rgba(60,45,20,.14); display: flex; flex-direction: column; gap: 2px">
      <button class="word"><span class="jp" style="font-size: 22px"><ruby>今<rt>きょう</rt></ruby>日</span><span style="font-size: 14px; color: #4A463D">today</span></button>
      <button class="word"><span class="jp" style="font-size: 22px"><ruby>日<rt>にほん</rt></ruby>本</span><span style="font-size: 14px; color: #4A463D">Japan</span></button>
      <button class="word"><span class="jp" style="font-size: 22px"><ruby>毎<rt>まい</rt></ruby>日</span><span style="font-size: 14px; color: #4A463D">every day</span></button>
      <button class="word"><span class="jp" style="font-size: 22px"><ruby>日曜<rt>にちよう</rt></ruby>日</span><span style="font-size: 14px; color: #4A463D">Sunday</span></button>
    </div>

    <button class="btn btn-shu" style="margin-top: auto">Trace it <span class="jp" style="font-weight: 600">書く</span></button>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(44,42,38,.32)"></div>

  <aside aria-label="Dictionary" class="washi" style="position: absolute; top: 0; right: 0; bottom: 0; width: 304px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 14px 14px 18px 14px; border-radius: 18px 0 0 18px; box-shadow: -8px 0 28px rgba(44,42,38,.32), inset 3px 0 0 #727171">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span class="jp" style="font-size: 20px; font-weight: 700">じしょ</span>
        <span style="font-size: 13px; font-weight: 700; color: #4A463D">Dictionary</span>
      </div>
      <button class="icon" aria-label="Close dictionary" style="width: 40px; height: 40px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <label for="dict-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search the dictionary</label>
    <input id="dict-q" type="search" placeholder="日, にほん or Japan" style="box-sizing: border-box; width: 100%; min-height: 44px; border: 0; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 15px; background: #FFFDF7; box-shadow: inset 0 0 0 1.5px #D9CFB8; color: #2C2A26">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #4A463D">FROM THIS SCREEN · <span class="jp" style="letter-spacing: 0">日</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
      <div style="border-radius: 12px; background: #FFFDF7; box-shadow: inset 0 0 0 1.5px #D9CFB8; padding: 12px 12px 10px 12px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <span class="jp" style="font-size: 24px"><ruby>日本<rt>にほん</rt></ruby></span>
          <span style="font-size: 12px; color: #6E6A60">noun</span>
        </div>
        <div style="font-size: 14px; color: #2C2A26">Japan</div>
        <div class="jp" style="font-size: 14px; line-height: 1.6; color: #4A463D"><ruby>日本<rt>にほん</rt></ruby>に<ruby>住<rt>す</rt></ruby>んでいます。<span style="font-family: Zen Kaku Gothic New, sans-serif; font-size: 12px; color: #6E6A60"> I live in Japan.</span></div>
        <button class="btn btn-wood" style="align-self: flex-start; margin-top: 4px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"></path></svg>
          Send to Vocabulary
        </button>
      </div>
      <button class="word"><span class="jp" style="font-size: 20px"><ruby>今日<rt>きょう</rt></ruby></span><span style="font-size: 13px; color: #4A463D">today</span></button>
      <button class="word"><span class="jp" style="font-size: 20px"><ruby>毎日<rt>まいにち</rt></ruby></span><span style="font-size: 13px; color: #4A463D">every day</span></button>
      <button class="word"><span class="jp" style="font-size: 20px"><ruby>日曜日<rt>にちようび</rt></ruby></span><span style="font-size: 13px; color: #4A463D">Sunday</span></button>
      <button class="word"><span class="jp" style="font-size: 20px"><ruby>誕生日<rt>たんじょうび</rt></ruby></span><span style="font-size: 13px; color: #4A463D">birthday</span></button>
    </div>
    <a href="#" style="font-size: 13px; text-align: center">Open the full dictionary</a>
  </aside>
</div>
</body>
</html>
