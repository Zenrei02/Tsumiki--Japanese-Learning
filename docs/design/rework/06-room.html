<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room with mini-game overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;background:#E9E2D1;color:#2C2A26;-webkit-font-smoothing:antialiased}
a{color:#8C3B2A}a:hover{color:#6E2D20}
.jp{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.washi{background-color:#FBF7EE;background-image:radial-gradient(rgba(120,100,60,.06) 1px,rgba(0,0,0,0) 1px),radial-gradient(rgba(120,100,60,.045) 1px,rgba(0,0,0,0) 1px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border:0;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.01em;transition:transform .08s ease,box-shadow .08s ease,filter .08s ease}
.btn-shu{min-height:56px;padding:0 24px;border-radius:14px;color:#FFF6EC;font-size:17px;background-image:linear-gradient(180deg,#DC4B2E 0%,#C7351B 52%,#AC2B15 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.14),0 4px 0 #7E1F0F,0 8px 18px rgba(126,31,15,.30)}
.btn-shu:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 #7E1F0F,0 2px 6px rgba(126,31,15,.3)}
.btn-wood{min-height:48px;padding:0 18px;border-radius:12px;color:#2C2A26;font-size:15px;background-color:#C9A47C;background-image:repeating-linear-gradient(92deg,rgba(60,35,15,.11) 0 2px,rgba(0,0,0,0) 2px 8px,rgba(60,35,15,.06) 8px 10px,rgba(0,0,0,0) 10px 17px),linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 #8A6540,0 6px 12px rgba(90,60,30,.22)}
.btn-wood:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 #8A6540}
.icon{background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#2C2A26}
.spot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;border:0;cursor:pointer;font-family:inherit;background:#FBF7EE;box-shadow:inset 0 0 0 1.5px #D9CFB8,0 2px 0 #CFC4A8;color:#2C2A26;font-size:12px;font-weight:700}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #EFE7D4">

  <div style="display: flex; align-items: center; gap: 6px; padding: 12px 12px 8px 8px; background-color: #F6F1E6; box-shadow: 0 1px 0 #D9CFB8; position: relative; z-index: 2">
    <a href="#" class="icon" aria-label="Back to home" style="text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; align-items: baseline; gap: 10px; flex-grow: 1">
      <span class="jp" style="font-size: 24px; font-weight: 700; line-height: 1">へや</span>
      <span style="font-size: 15px; font-weight: 700; color: #4A463D">Your room</span>
    </div>
    <button class="btn btn-wood" style="min-height: 40px; font-size: 13px; padding: 0 12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#C9A24A" stroke="#907119" stroke-width="1.5"><ellipse cx="12" cy="12" rx="7" ry="10"></ellipse><rect x="9.5" y="8" width="5" height="8" rx="1" fill="#907119"></rect></svg>
      Shop
    </button>
  </div>

  <svg width="390" height="560" viewBox="0 0 390 560" role="img" aria-label="Your study room: shoji wall, hanging scroll, low table with your avatar seated, a zen garden tray, a bamboo fountain, and an empty spot for a bonsai" style="display: block">
    <defs>
      <pattern id="weave" width="6" height="3" patternUnits="userSpaceOnUse">
        <rect width="6" height="3" fill="#C6BE8E"></rect>
        <rect width="1" height="3" fill="#E4DDB3"></rect>
        <rect y="2" width="6" height="1" fill="#A79E6A"></rect>
      </pattern>
    </defs>
    <rect width="390" height="560" fill="#EFE7D4"></rect>
    <g fill="#F5EEDD" stroke="#B89A72" stroke-width="2">
      <rect x="10" y="10" width="170" height="250"></rect>
      <rect x="210" y="10" width="170" height="250"></rect>
    </g>
    <g stroke="#B89A72" stroke-width="1.4">
      <path d="M10 60h170M10 110h170M10 160h170M10 210h170M52 10v250M95 10v250M138 10v250"></path>
      <path d="M210 60h170M210 110h170M210 160h170M210 210h170M252 10v250M295 10v250M338 10v250"></path>
    </g>
    <rect x="180" y="10" width="30" height="250" fill="#E3D9C3"></rect>
    <rect x="186" y="30" width="18" height="120" rx="2" fill="#FBF7EE" stroke="#B89A72"></rect>
    <text x="195" y="90" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="16" font-weight="700" fill="#2C2A26">つ</text>
    <rect x="0" y="260" width="390" height="10" fill="#5E4630"></rect>
    <rect x="0" y="270" width="390" height="290" fill="url(#weave)"></rect>
    <g stroke="#2B3A55" stroke-width="4">
      <path d="M0 270h390"></path>
      <path d="M195 270v290"></path>
      <path d="M0 415h390"></path>
    </g>
    <g>
      <path d="M40 200l50 70" stroke="#7C9A4C" stroke-width="10" stroke-linecap="round"></path>
      <rect x="82" y="230" width="9" height="70" fill="#5F7B36"></rect>
      <ellipse cx="88" cy="312" rx="40" ry="14" fill="#8E8A80"></ellipse>
      <ellipse cx="88" cy="307" rx="30" ry="9" fill="#5B7C8C"></ellipse>
      <circle cx="98" cy="288" r="3" fill="#9CC3D6"></circle>
    </g>
    <g>
      <rect x="95" y="340" width="200" height="16" rx="4" fill="#4A3423"></rect>
      <rect x="104" y="356" width="12" height="22" fill="#3B2A1C"></rect>
      <rect x="274" y="356" width="12" height="22" fill="#3B2A1C"></rect>
      <rect x="118" y="322" width="26" height="20" rx="3" fill="#FBF7EE" stroke="#B89A72"></rect>
      <path d="M124 330h14M124 336h10" stroke="#8A7F6F" stroke-width="1.5"></path>
      <rect x="240" y="318" width="22" height="22" rx="3" fill="#2F6F6B" stroke="#1F4C49"></rect>
      <text x="251" y="334" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="13" font-weight="700" fill="#FFF8EC">文</text>
    </g>
    <g>
      <ellipse cx="195" cy="445" rx="46" ry="16" fill="#2B3A55" opacity=".25"></ellipse>
      <path d="M155 440c0-30 18-52 40-52s40 22 40 52z" fill="#3D5A80"></path>
      <path d="M170 392c0-14 11-26 25-26s25 12 25 26v20h-50z" fill="#3D5A80"></path>
      <circle cx="195" cy="352" r="24" fill="#F1D9C0"></circle>
      <path d="M171 348c2-18 14-28 24-28s22 10 24 28c-8-6-16-9-24-9s-16 3-24 9z" fill="#2C2A26"></path>
      <circle cx="187" cy="354" r="2" fill="#2C2A26"></circle>
      <circle cx="203" cy="354" r="2" fill="#2C2A26"></circle>
      <path d="M190 362q5 4 10 0" stroke="#2C2A26" stroke-width="1.5" fill="none" stroke-linecap="round"></path>
    </g>
    <g>
      <rect x="248" y="452" width="122" height="78" rx="6" fill="#6B4E2E"></rect>
      <rect x="254" y="458" width="110" height="66" rx="3" fill="#E8E0C8"></rect>
      <g stroke="#CFC4A8" stroke-width="1.5" fill="none">
        <path d="M260 470h98M260 480h98M260 490h98M260 500h98M260 510h98"></path>
        <circle cx="300" cy="490" r="14"></circle>
        <circle cx="300" cy="490" r="20"></circle>
      </g>
      <ellipse cx="300" cy="488" rx="8" ry="6" fill="#7E7A72"></ellipse>
      <ellipse cx="338" cy="506" rx="6" ry="4" fill="#8E8A80"></ellipse>
    </g>
    <g>
      <rect x="24" y="440" width="96" height="90" rx="10" fill="none" stroke="#8A7F6F" stroke-width="2" stroke-dasharray="6 6"></rect>
      <text x="72" y="480" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif" font-size="12" font-weight="700" fill="#6E6A60">bonsai</text>
      <text x="72" y="498" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif" font-size="11" fill="#8A7F6F">coming later</text>
    </g>
  </svg>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px 16px 0 16px">
    <button class="spot"><span class="jp" style="font-size: 20px">机</span>Table<span style="font-size: 11px; font-weight: 500; color: #6E6A60">Kana match</span></button>
    <button class="spot"><span class="jp" style="font-size: 20px">庭</span>Garden<span style="font-size: 11px; font-weight: 500; color: #6E6A60">Stroke rake</span></button>
    <button class="spot"><span class="jp" style="font-size: 20px">水</span>Fountain<span style="font-size: 11px; font-weight: 500; color: #6E6A60">Listen only</span></button>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 68px; bottom: 0; background: rgba(44,42,38,.30)"></div>

  <div role="dialog" aria-label="Kana match" class="washi" style="position: absolute; left: 22px; right: 22px; top: 300px; border-radius: 18px; padding: 20px 20px 18px 20px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 3px 0 #CFC4A8, 0 18px 40px rgba(44,42,38,.35); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span class="jp" style="font-size: 22px; font-weight: 700">机</span>
        <span style="font-size: 16px; font-weight: 700">Kana match</span>
      </div>
      <button class="icon" aria-label="Close" style="width: 40px; height: 40px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #4A463D">Blocks fall onto the table. Tap the one that reads the sound you hear. Your avatar keeps sitting; the game plays over the room.</p>
    <div style="display: flex; gap: 8px; justify-content: center; padding: 6px 0 2px 0">
      <span class="jp" style="width: 52px; height: 52px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #FFF8EC; background: #9C8BC4; box-shadow: 0 4px 0 #7A5A3C">あ</span>
      <span class="jp" style="width: 52px; height: 52px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #FFF8EC; background: #9C8BC4; box-shadow: 0 4px 0 #7A5A3C">お</span>
      <span class="jp" style="width: 52px; height: 52px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #FFF8EC; background: #9C8BC4; box-shadow: 0 4px 0 #7A5A3C">ぬ</span>
    </div>
    <button class="btn btn-shu">Play <span class="jp" style="font-weight: 600">あそぶ</span></button>
  </div>
</div>
</body>
</html>
