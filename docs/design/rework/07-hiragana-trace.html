<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hiragana · Trace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;background:#E9E2D1;color:#2C2A26;-webkit-font-smoothing:antialiased}
a{color:#8C3B2A}a:hover{color:#6E2D20}
.jp{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.tatami{background-color:#C6BE8E;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,rgba(0,0,0,0) 1px 5px),repeating-linear-gradient(0deg,rgba(84,74,34,.18) 0 1px,rgba(0,0,0,0) 1px 3px)}
.washi{background-color:#FBF7EE;background-image:radial-gradient(rgba(120,100,60,.06) 1px,rgba(0,0,0,0) 1px),radial-gradient(rgba(120,100,60,.045) 1px,rgba(0,0,0,0) 1px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border:0;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.01em;transition:transform .08s ease,box-shadow .08s ease,filter .08s ease}
.btn-shu{min-height:56px;padding:0 24px;border-radius:14px;color:#FFF6EC;font-size:17px;background-image:linear-gradient(180deg,#DC4B2E 0%,#C7351B 52%,#AC2B15 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.14),0 4px 0 #7E1F0F,0 8px 18px rgba(126,31,15,.30)}
.btn-shu:hover{filter:brightness(1.04)}
.btn-shu:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 #7E1F0F,0 2px 6px rgba(126,31,15,.3)}
.btn-washi{min-height:44px;padding:0 16px;border-radius:12px;color:#2C2A26;font-size:15px;background-color:#FBF7EE;box-shadow:inset 0 0 0 1.5px #D9CFB8,0 2px 0 #CFC4A8}
.btn-washi:active{transform:translateY(1px);box-shadow:inset 0 0 0 1.5px #D9CFB8,0 1px 0 #CFC4A8}
.seg{display:flex;padding:3px;border-radius:10px;background:#E4DBC6;box-shadow:inset 0 1px 2px rgba(60,45,20,.18)}
.seg button{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;min-height:38px;padding:0 14px;border-radius:8px;background:none;color:#6E6A60}
.seg button.on{background:#FBF7EE;color:#2C2A26;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 1px 3px rgba(60,45,20,.2)}
.icon{background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#2C2A26}
.card{position:relative;border-radius:14px;padding:14px 16px 14px 18px;background-color:#FBF7EE;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 0 #CFC4A8,0 6px 14px rgba(60,45,20,.12);display:flex;flex-direction:column;gap:6px;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tier)}
ruby{ruby-position:over}rt{font-size:.5em;color:#6E6A60;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500}
.tabs{display:flex;gap:6px;padding:10px 16px 0 16px;background-color:#F6F1E6}
.tabs button{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;min-height:40px;padding:0 14px;border-radius:10px 10px 0 0;background:#E4DBC6;color:#6E6A60;box-shadow:inset 0 -2px 0 rgba(60,45,20,.12)}
.tabs button.on{background:#FBF7EE;color:#2C2A26;box-shadow:inset 0 1.5px 0 #D9CFB8,inset 1.5px 0 0 #D9CFB8,inset -1.5px 0 0 #D9CFB8}
.tile{display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:0;border-radius:8px;cursor:pointer;font-family:"Shippori Mincho",serif;font-weight:700;font-size:20px;color:#2C2A26;background-color:#FBF7EE;box-shadow:inset 0 0 0 1.5px #D9CFB8,0 3px 0 #CFC4A8}
.tile.done{color:#FFF8EC;background-color:#9C8BC4;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #7A5A3C}
.tile.now{color:#FFF8EC;background-color:#C7351B;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #7E1F0F,0 0 0 3px #F6EBD2,0 0 0 5px #C9A24A}
.btn-wood{min-height:52px;padding:0 20px;border-radius:12px;color:#2C2A26;font-size:16px;background-color:#C9A47C;background-image:repeating-linear-gradient(92deg,rgba(60,35,15,.11) 0 2px,rgba(0,0,0,0) 2px 8px,rgba(60,35,15,.06) 8px 10px,rgba(0,0,0,0) 10px 17px),linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 0 #8A6540,0 6px 12px rgba(90,60,30,.22)}
.btn-wood:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 #8A6540}
.word{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:none;border:0;cursor:pointer;font-family:inherit;text-align:left;color:#2C2A26;width:100%;box-sizing:border-box}
.pop{text-decoration:underline dotted #8A5A3B;text-underline-offset:5px;cursor:pointer}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div class="tatami" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 6px; padding: 12px 12px 8px 8px; background-color: #F6F1E6; box-shadow: 0 -3px 0 #9C8BC4 inset">
    <a href="#" class="icon" aria-label="Back to home" style="text-decoration: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; align-items: baseline; gap: 10px; flex-grow: 1">
      <span class="jp" style="font-size: 24px; font-weight: 700; line-height: 1">ひらがな</span>
      <span style="font-size: 15px; font-weight: 700; color: #4A463D">Hiragana</span>
    </div>
    
  </div>
  <div class="tabs" role="tablist" style="box-shadow: 0 1px 0 #D9CFB8"><button class="">Learn</button><button class="">Drill</button><button class="">Listen</button><button class="on">Trace</button><button class="">Free pad</button></div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 24px 16px">

    <div class="washi" style="border-radius: 16px; padding: 14px 18px 12px 18px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 3px 0 #CFC4A8, 0 10px 22px rgba(60,45,20,.16); display: flex; flex-direction: column; gap: 10px; align-items: center">
      <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #6E6A60">TRACE</span>
        <span style="font-size: 12px; color: #4A463D">Follow the grey stroke. Movement, not accuracy.</span>
      </div>
      <svg width="220" height="220" viewBox="0 0 109 109" role="img" aria-label="Tracing box for あ: two strokes done, the third shown as a grey guide" style="background: #FFFDF7; border-radius: 12px; box-shadow: inset 0 0 0 1.5px #D9CFB8">
        <path d="M0 54.5h109M54.5 0v109" stroke="#E4DBC6" stroke-width="1" stroke-dasharray="3 3"></path>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
          <path d="M30 34c12-3 30-5 48-4" stroke="#2C2A26"></path>
          <path d="M50 14c2 24-2 52-12 72" stroke="#2C2A26"></path>
          <path d="M22 60c10 26 40 36 56 26 12-8 12-26-2-32-16-6-30 6-30 20 0 12 10 18 22 14" stroke="#C4BBD8"></path>
          <path d="M22 60c10 26 40 36 56 26" stroke="#C7351B"></path>
        </g>
        <circle cx="78" cy="86" r="5" fill="#C7351B"></circle>
        <g font-family="Zen Kaku Gothic New, sans-serif" font-size="9" font-weight="700" fill="#C7351B"><text x="22" y="30">1</text><text x="54" y="12">2</text><text x="12" y="60">3</text></g>
      </svg>
      <div style="align-self: stretch; display: flex; align-items: center; justify-content: space-between">
        <span class="jp" style="font-size: 34px; font-weight: 700; line-height: 1">あ</span>
        <span style="font-size: 14px; color: #4A463D">a · stroke 3 of 3</span>
        <button class="btn btn-washi" aria-label="Play the sound" style="min-height: 40px; padding: 0 12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15 9a4 4 0 010 6"></path></svg></button>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #4A463D">THIS LESSON</div>
      <span style="font-size: 12px; color: #4A463D">tap to trace</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
      <button class="tile done" style="height: 56px">あ</button>
      <button class="tile done" style="height: 56px">い</button>
      <button class="tile now" style="height: 56px">う</button>
      <button class="tile" style="height: 56px">え</button>
      <button class="tile" style="height: 56px">お</button>
    </div>

    <div class="washi" style="border-radius: 14px; padding: 12px 16px; box-shadow: inset 0 0 0 1.5px #D9CFB8; display: flex; align-items: center; gap: 12px">
      <span class="jp" style="font-size: 26px; font-weight: 700">う</span>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-size: 14px; font-weight: 700">u — like the "oo" in "food", lips relaxed</span>
        <span style="font-size: 12px; color: #4A463D">Two strokes. The second one is a long, easy curve.</span>
      </div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: auto">
      <button class="btn btn-wood" style="flex-grow: 1">Clear</button>
      <button class="btn btn-shu" style="flex-grow: 2">Next <span class="jp" style="font-weight: 600">つぎ</span></button>
    </div>
  </div>

  <button aria-label="Open the dictionary" class="jp" style="position: absolute; right: 0; top: 400px; width: 34px; height: 104px; border: 0; border-radius: 10px 0 0 10px; cursor: pointer; background-color: #FBF7EE; color: #2C2A26; box-shadow: inset 1.5px 0 0 #D9CFB8, -2px 2px 6px rgba(60,45,20,.18); font-size: 15px; writing-mode: vertical-rl; letter-spacing: .1em">じしょ</button>
</div>
</body>
</html>
