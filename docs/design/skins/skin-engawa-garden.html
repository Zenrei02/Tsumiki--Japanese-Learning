<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Variant C · Engawa garden</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;background:#DCE2CF;color:#26302A;-webkit-font-smoothing:antialiased}
a{color:#A63A2B}a:hover{color:#7E2B20}
.jp{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.moss{background-color:#DCE2CF;background-image:radial-gradient(rgba(60,90,50,.10) 1.5px,rgba(0,0,0,0) 1.5px),radial-gradient(rgba(60,90,50,.07) 1px,rgba(0,0,0,0) 1px);background-size:14px 14px,9px 9px;background-position:0 0,5px 7px}
.deck{background-color:#B78F62;background-image:repeating-linear-gradient(0deg,rgba(60,35,15,.22) 0 2px,rgba(0,0,0,0) 2px 26px),repeating-linear-gradient(91deg,rgba(60,35,15,.08) 0 1px,rgba(0,0,0,0) 1px 9px)}
.washi{background-color:#FAF8F0;background-image:radial-gradient(rgba(90,100,60,.06) 1px,rgba(0,0,0,0) 1px);background-size:9px 9px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border:0;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.01em;transition:transform .08s ease,box-shadow .08s ease}
.btn-torii{min-height:56px;padding:0 24px;border-radius:14px;color:#FFF6EC;font-size:17px;background-image:linear-gradient(180deg,#E0532F 0%,#C7351B 52%,#A82A15 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 4px 0 #7E1F0F,0 8px 18px rgba(126,31,15,.28)}
.btn-torii:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 #7E1F0F}
.btn-cedar{min-height:52px;padding:0 20px;border-radius:12px;color:#FFF6EC;font-size:16px;background-color:#7A5238;background-image:repeating-linear-gradient(92deg,rgba(0,0,0,.14) 0 2px,rgba(0,0,0,0) 2px 8px,rgba(0,0,0,.07) 8px 10px,rgba(0,0,0,0) 10px 17px),linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 #4A3020,0 6px 12px rgba(40,25,10,.28)}
.btn-cedar:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 0 #4A3020}
.stone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-sizing:border-box;border-radius:46% 54% 50% 50% / 52% 48% 52% 48%;cursor:pointer;border:0;font-family:inherit;color:#FFF8EC;background-image:linear-gradient(160deg,rgba(255,255,255,.22),rgba(0,0,0,0) 50%,rgba(0,0,0,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 0 rgba(60,70,50,.55),0 10px 16px rgba(40,50,30,.3)}
.stone:active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 0 rgba(60,70,50,.55)}
.icon{background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#26302A}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div class="moss" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div class="deck" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px 12px; box-shadow: 0 2px 0 #7A5238">
    <button class="icon" aria-label="Open menu" style="color: #FFF6EC">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <div style="display: flex; align-items: center; gap: 10px; color: #FFF6EC">
      <div class="jp" style="width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #FFF6EC; background-image: linear-gradient(180deg, #E0532F, #A82A15); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 #7E1F0F">つ</div>
      <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1">tsumiki</div>
    </div>
    <button class="icon" aria-label="Ambience: birds and running water, on" style="color: #FFF6EC">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>
    </button>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 0 0 24px 0">
    <a href="#" aria-label="Your garden" style="display: block; text-decoration: none; color: inherit">
      <svg width="390" height="196" viewBox="0 0 390 196" role="img" aria-label="A view from the engawa veranda: raked gravel, a maple, a stone lantern and a bamboo fountain" style="display: block">
        <rect width="390" height="196" fill="#CFE0DF"></rect>
        <path d="M0 70q90-40 190-10t200-20v150H0z" fill="#8FB58A"></path>
        <path d="M0 110q120-30 220 0t170-10v96H0z" fill="#6E9A6A"></path>
        <rect x="0" y="150" width="390" height="46" fill="#E5DFC8"></rect>
        <g stroke="#CFC7A8" stroke-width="1.5"><path d="M0 158h390M0 166h390M0 174h390M0 182h390M0 190h390"></path></g>
        <g stroke="#CFC7A8" stroke-width="1.5" fill="none"><circle cx="120" cy="172" r="12"></circle><circle cx="120" cy="172" r="19"></circle></g>
        <ellipse cx="120" cy="170" rx="9" ry="6" fill="#6F6B63"></ellipse>
        <ellipse cx="250" cy="185" rx="12" ry="6" fill="#7E7A72"></ellipse>
        <g><path d="M60 150V96" stroke="#5A3E2A" stroke-width="6"></path><circle cx="60" cy="86" r="30" fill="#C7452F"></circle><circle cx="42" cy="98" r="18" fill="#D9573C"></circle><circle cx="80" cy="98" r="18" fill="#A83A26"></circle></g>
        <g><rect x="318" y="118" width="26" height="8" fill="#7E7A72"></rect><rect x="323" y="126" width="16" height="16" fill="#8E8A80"></rect><rect x="314" y="142" width="34" height="6" fill="#7E7A72"></rect><rect x="327" y="148" width="8" height="30" fill="#8E8A80"></rect><rect x="316" y="178" width="30" height="8" rx="2" fill="#7E7A72"></rect><path d="M331 106l-16 12h32z" fill="#6F6B63"></path></g>
        <g><path d="M200 88l30 40" stroke="#7C9A4C" stroke-width="8" stroke-linecap="round"></path><rect x="224" y="112" width="7" height="40" fill="#5F7B36"></rect><ellipse cx="228" cy="156" rx="26" ry="9" fill="#8E8A80"></ellipse><ellipse cx="228" cy="153" rx="18" ry="6" fill="#5B7C8C"></ellipse></g>
        <rect x="0" y="0" width="390" height="14" fill="#7A5238"></rect>
        <rect x="0" y="0" width="14" height="196" fill="#7A5238"></rect>
        <rect x="376" y="0" width="14" height="196" fill="#7A5238"></rect>
      </svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 18px; padding: 0 16px">
      <div class="washi" style="border-radius: 16px; padding: 18px 18px 16px 18px; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 3px 0 #B9BFA6, 0 10px 22px rgba(40,50,30,.18); display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #5E6B58">NEXT ON YOUR PATH</div>
        <span style="font-size: 22px; font-weight: 700; line-height: 1.25">Write one sentence and check it</span>
        <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #4E5A49">in Checker <span class="jp" style="color: #26302A">直し</span> — find out what is wrong, what merely sounds off, and why.</p>
        <a href="#" class="btn btn-torii" style="margin-top: 6px; text-decoration: none">Go <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #3E4A3A">STEPPING STONES</div>
        <div class="jp" style="font-size: 13px; color: #3E4A3A">飛び石</div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
        <button class="stone" style="height: 104px; background-color: #8C7DB0"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">あ</span><span style="font-size: 12px; font-weight: 700">Hiragana</span></button>
        <button class="stone" style="height: 104px; background-color: #6F5C9A"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">ア</span><span style="font-size: 12px; font-weight: 700">Katakana</span></button>
        <button class="stone" style="height: 104px; background-color: #544470"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">漢</span><span style="font-size: 12px; font-weight: 700">Kanji</span></button>
        <button class="stone" style="height: 104px; background-color: #2F6F6B"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">文</span><span style="font-size: 12px; font-weight: 700">Grammar</span></button>
        <button class="stone" style="height: 104px; background-color: #7E5A3B"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">言</span><span style="font-size: 12px; font-weight: 700">Vocabulary</span></button>
        <a href="#" class="stone" style="height: 104px; background-color: #C7351B; text-decoration: none"><span class="jp" style="font-size: 40px; font-weight: 700; line-height: 1">直</span><span style="font-size: 12px; font-weight: 700">Checker</span></a>
      </div>

      <div style="display: flex; gap: 12px">
        <a href="#" class="btn btn-cedar" style="flex-grow: 1; text-decoration: none">Garden <span class="jp" style="font-weight: 500">にわ</span></a>
      </div>
    </div>
  </div>

  <button aria-label="Open the dictionary" class="jp" style="position: absolute; right: 0; top: 400px; width: 34px; height: 104px; border: 0; border-radius: 10px 0 0 10px; cursor: pointer; background-color: #FAF8F0; color: #26302A; box-shadow: inset 1.5px 0 0 #B9BFA6, -2px 2px 6px rgba(40,50,30,.25); font-size: 15px; writing-mode: vertical-rl; letter-spacing: .1em">じしょ</button>
</div>
</body>
</html>
