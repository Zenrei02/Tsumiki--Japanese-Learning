<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Variant D · Tokyo transit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;background:#EEEEEA;color:#1E1F22;-webkit-font-smoothing:antialiased}
a{color:#C7351B}a:hover{color:#9E2813}
.jp{font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif}
.concrete{background-color:#EEEEEA;background-image:radial-gradient(rgba(0,0,0,.05) 1px,rgba(0,0,0,0) 1px);background-size:6px 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border:0;cursor:pointer;font-family:inherit;font-weight:900;letter-spacing:.02em;transition:transform .08s ease,box-shadow .08s ease}
.btn-go{min-height:56px;padding:0 24px;border-radius:10px;color:#FFFFFF;font-size:17px;background:#C7351B;box-shadow:0 4px 0 #8E261F,0 8px 16px rgba(199,53,27,.28)}
.btn-go:active{transform:translateY(3px);box-shadow:0 1px 0 #8E261F}
.btn-ic{min-height:52px;padding:0 20px;border-radius:10px;color:#1E1F22;font-size:16px;background:#FFFFFF;box-shadow:inset 0 0 0 2px #1E1F22,0 3px 0 #1E1F22}
.btn-ic:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #1E1F22,0 1px 0 #1E1F22}
.roundel{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-sizing:border-box;cursor:pointer;border:0;font-family:inherit;color:#1E1F22;background:#FFFFFF;border-radius:14px;box-shadow:0 4px 0 #C9C9C2,0 6px 12px rgba(0,0,0,.10)}
.roundel:active{transform:translateY(3px);box-shadow:0 1px 0 #C9C9C2}
.ring{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#1E1F22;background:#FFFFFF;box-sizing:border-box;border:5px solid var(--line)}
.icon{background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;color:#1E1F22}
</style>
<style>body{display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>
<div class="concrete" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; flex-direction: column; background: #FFFFFF; box-shadow: 0 2px 0 #1E1F22">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 0 12px">
      <button class="icon" aria-label="Open menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 0">
        <div style="font-size: 26px; font-weight: 900; line-height: 1.1; letter-spacing: .12em">つみき</div>
        <div style="font-size: 15px; font-weight: 700; letter-spacing: .06em; line-height: 1.2">tsumiki</div>
      </div>
      <button class="icon" aria-label="Ambience: station chime and platform, on" style="color: #C7351B">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>
      </button>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 8px 16px; font-size: 11px; font-weight: 700; color: #5A5B60">
      <span>◀ ひらがな</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #C7351B; display: inline-block"></span>TS 01</span>
      <span>直し ▶</span>
    </div>
    <div style="height: 10px; background: #C7351B"></div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 0 0 24px 0">
    <a href="#" aria-label="Your platform" style="display: block; text-decoration: none; color: inherit">
      <svg width="390" height="176" viewBox="0 0 390 176" role="img" aria-label="A Tokyo station platform: a train arriving, the yellow tactile strip, a vending machine" style="display: block">
        <rect width="390" height="176" fill="#DDE3EC"></rect>
        <rect x="0" y="0" width="390" height="70" fill="#C9D3E2"></rect>
        <g fill="#B4C0D2"><rect x="30" y="8" width="60" height="62"></rect><rect x="120" y="14" width="40" height="56"></rect><rect x="200" y="4" width="70" height="66"></rect><rect x="300" y="18" width="50" height="52"></rect></g>
        <rect x="0" y="70" width="390" height="10" fill="#9AA5B4"></rect>
        <rect x="0" y="80" width="390" height="96" fill="#D8D8D2"></rect>
        <rect x="0" y="136" width="390" height="10" fill="#F2C744"></rect>
        <g stroke="#E0B12E" stroke-width="1"><path d="M0 139h390M0 143h390"></path></g>
        <g>
          <rect x="60" y="46" width="270" height="88" rx="14" fill="#F4F4F0" stroke="#1E1F22" stroke-width="2"></rect>
          <rect x="60" y="100" width="270" height="10" fill="#2F6F6B"></rect>
          <rect x="80" y="60" width="60" height="30" rx="4" fill="#3B4A5C"></rect><rect x="165" y="60" width="60" height="30" rx="4" fill="#3B4A5C"></rect><rect x="250" y="60" width="60" height="30" rx="4" fill="#3B4A5C"></rect>
          <rect x="180" y="118" width="30" height="8" rx="2" fill="#F6E27A"></rect>
          <text x="195" y="82" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">つみき行</text>
        </g>
        <g>
          <rect x="336" y="72" width="40" height="66" rx="3" fill="#C7351B"></rect>
          <rect x="341" y="78" width="30" height="34" fill="#F4F4F0"></rect>
          <g fill="#3D5A80"><rect x="344" y="82" width="6" height="12"></rect><rect x="353" y="82" width="6" height="12"></rect><rect x="362" y="82" width="6" height="12"></rect><rect x="344" y="97" width="6" height="12"></rect><rect x="353" y="97" width="6" height="12"></rect><rect x="362" y="97" width="6" height="12"></rect></g>
          <rect x="344" y="118" width="24" height="10" fill="#1E1F22"></rect>
        </g>
        <g>
          <rect x="12" y="84" width="28" height="54" rx="2" fill="#FFFFFF" stroke="#1E1F22" stroke-width="1.5"></rect>
          <text x="26" y="112" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif" font-size="13" font-weight="900" fill="#1E1F22" writing-mode="tb" glyph-orientation-vertical="0">つみき</text>
        </g>
      </svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 0 16px">
      <div style="border-radius: 12px; background: #FFFFFF; box-shadow: 0 3px 0 #C9C9C2, 0 8px 18px rgba(0,0,0,.10); display: flex; overflow: hidden">
        <div style="width: 14px; background: repeating-linear-gradient(180deg, #C7351B 0 8px, #FFFFFF 8px 14px)"></div>
        <div style="padding: 16px 16px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
          <div style="font-size: 11px; font-weight: 900; letter-spacing: .12em; color: #5A5B60">NEXT DEPARTURE</div>
          <span style="font-size: 22px; font-weight: 900; line-height: 1.25">Write one sentence and check it</span>
          <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #4A4B50">Platform <span style="font-weight: 900; color: #C7351B">直し</span> · find out what is wrong, what merely sounds off, and why.</p>
          <a href="#" class="btn btn-go" style="margin-top: 4px; text-decoration: none">Board <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-size: 11px; font-weight: 900; letter-spacing: .12em; color: #3A3B40">LINES</div>
        <div style="font-size: 12px; font-weight: 700; color: #3A3B40">路線図</div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <button class="roundel" style="height: 106px"><span class="ring" style="--line: #9C8BC4">あ</span><span style="font-size: 12px; font-weight: 700">Hiragana</span></button>
        <button class="roundel" style="height: 106px"><span class="ring" style="--line: #7A66A8">ア</span><span style="font-size: 12px; font-weight: 700">Katakana</span></button>
        <button class="roundel" style="height: 106px"><span class="ring" style="--line: #5B4A7D">漢</span><span style="font-size: 12px; font-weight: 700">Kanji</span></button>
        <button class="roundel" style="height: 106px"><span class="ring" style="--line: #2F6F6B">文</span><span style="font-size: 12px; font-weight: 700">Grammar</span></button>
        <button class="roundel" style="height: 106px"><span class="ring" style="--line: #8A5A3B">言</span><span style="font-size: 12px; font-weight: 700">Vocabulary</span></button>
        <a href="#" class="roundel" style="height: 106px; text-decoration: none; background: #C7351B; color: #FFFFFF; box-shadow: 0 4px 0 #8E261F, 0 6px 12px rgba(199,53,27,.3)"><span class="ring" style="--line: #FFFFFF; background: #C7351B; color: #FFFFFF">直</span><span style="font-size: 12px; font-weight: 700">Checker</span></a>
      </div>

      <div style="display: flex; gap: 12px">
        <a href="#" class="btn btn-ic" style="flex-grow: 1; text-decoration: none">Room <span style="font-weight: 500">へや</span></a>
      </div>
    </div>
  </div>

  <button aria-label="Open the dictionary" style="position: absolute; right: 0; top: 400px; width: 34px; height: 104px; border: 0; border-radius: 8px 0 0 8px; cursor: pointer; background: #FFFFFF; color: #1E1F22; box-shadow: inset 2px 0 0 #1E1F22, inset 0 2px 0 #1E1F22, inset 0 -2px 0 #1E1F22; font-size: 14px; font-weight: 900; writing-mode: vertical-rl; letter-spacing: .12em">じしょ</button>
</div>
</body>
</html>
