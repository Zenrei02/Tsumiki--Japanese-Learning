。", "I speak nothing but Japanese."]], "orphanWr": [], "flags": ["The rural cash-only detail is resident experience rather than a sourced statistic; the national figure is sourced, the local inference is not."], "claims": ["Cashless payments reached 42.8% of consumer spending in 2024 (METI)", "Japan's long-term cashless target is 80%, with 65% by 2030"], "sources": ["https://www.meti.go.jp/english/press/2025/0331_001.html"]}, {"id": "counters", "step": "Step 3 · Joining, choosing & counting", "jp": "一つ・二人・三枚 (counters)", "en": "how to count things", "setting": {"scene": "A greengrocer with everything in open boxes and no barcodes, which means saying out loud how many you want rather than putting them in a basket and letting a machine work it out. There are four people behind you. The number is the easy part; the word that has to follow it is not.", "jp": "りんごを三つ買いました。", "en": "I bought three apples.", "pattern": "三つ"}, "ext": [{"kind": "flip", "scene": "At the counter next door you order for two, which needs the counter for people — and that one has irregular readings in exactly the places you will need most often.", "jp": "二人です。", "en": "Two people — read ふたり, not におん.", "t": null}, {"kind": "wrinkle", "scene": "You try to put the number in front of the fruit the way English does and the sentence comes apart. The count does not glue to the noun; it floats along behind the particle, just in front of the verb.", "jp": "りんごを三つ買いました。", "en": "Never 三つりんごを — the count floats after the particle.", "t": "The count doesn't glue to the noun the way English does (\"three apples\") — it floats after the particle: りんごを三つ買いました, never 三つりんごを."}], "what": "You can't put a number straight next to a noun. Japanese pairs every number with a counter word matching the kind of thing counted — much like English says two sheets of paper rather than two papers, except Japanese does it for everything.", "build": "The all-purpose set 一つ、二つ、三つ… covers most objects up to ten and is the one to learn first. Then 〜人 for people, 〜枚 for flat things (paper, shirts, tickets), 〜本 for long things (bottles, pens), 〜冊 for books. Position: the number goes after the noun and its particle — りんごを三つ買いました, not 三つのりんごを.", "when": "Shopping, ordering, saying how many of anything there are.", "watch": "一人 and 二人 are read ひとり and ふたり — irregular, extremely common, worth memorizing today. Beyond that, don't try to learn every counter now; 〜つ will carry you through most conversations, and a wrong counter is understood while a missing one is not.", "ex": [["りんごを三つ買いました。", "I bought three apples."], ["学生が二人います。", "There are two students."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-counters", "step": "Step 3 · Joining, choosing & counting", "jp": "三本は「さんぼん」", "en": "picking the counter, hearing the shift", "setting": {"scene": "small izakaya on a Friday with the whole section, and you have been sent to the counter to order for the table. Two beers is a sentence you have practised. It comes out fine. Three of them, twenty minutes later, does not — because the number and the counter change each other's sound when they meet.", "jp": "ビールを二本ください。", "en": "Two beers, please — 二本 stays plain: にほん.", "pattern": "二本"}, "ext": [{"kind": "flip", "scene": "The second round is three, and the word you practised has quietly changed shape in your mouth. Nothing about the writing warned you; this is a sound rule, learned by ear and drilled as a chant.", "jp": "ビールを三本ください。", "en": "Three beers — さんぼん, not さんほん.", "t": null}, {"kind": "extra", "scene": "Somebody asks for something you have no counter for at all, and uses the all-purpose one instead, and nothing whatever goes wrong. That is the escape hatch, and it is always a sentence.", "jp": "みっつください。", "en": "Three, please — 〜つ rescues almost anything.", "t": "Priorities, because there are dozens of counters and you do not need them. ひとり and ふたり are non-negotiable. The 〜本 row is the classic shift set. Past that, relax — a wrong counter is understood and gently corrected, while a MISSING one is genuinely broken."}], "what": "No English equivalent — you say 'two coffees' and move on. Japanese asks two questions of everything you count: which counter word, and what the number does to its sound.", "build": "Counter first: 〜人 people, 〜枚 flat things, 〜本 long things, 〜冊 bound things, 〜匹 small animals, 〜つ for anything you're unsure of. Then the sound: some numbers fuse with some counters — 一本 いっぽん, 三本 さんぼん, 六本 ろっぽん — while 二本 にほん stays plain. The shifts are the same clipping-and-voicing machinery the kana modules taught, running at conversation speed.", "when": "Ordering two beers, buying three tickets, counting anything out loud — daily, in other words.", "watch": "Priorities. ひとり and ふたり are non-negotiable. The 〜本 row is the classic shift set — drill いっぽん・にほん・さんぼん as a chant until it stops being arithmetic. Past that, relax: a wrong counter is understood and gently corrected, while a MISSING one (りんご三ください) is genuinely broken. When stuck, 〜つ — みっつください is always a sentence.", "ex": [["ビールを二本ください。", "Long thing → 本, and 二本 stays plain: にほん."], ["ビールを三本ください。", "Same counter, new sound: さんぼん."], ["切手を三枚買いました。", "Flat thing → 枚, no shift: さんまい."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "gurai", "step": "Step 3 · Joining, choosing & counting", "jp": "〜ぐらい / くらい", "en": "about (an amount)", "setting": {"scene": "The school wants to know how long your commute is, for the paperwork that decides your travel allowance. You have done it eleven times and it has never taken the same number of minutes twice. The form has a box for a number and no box for it depends, so the sentence needs a way to say roughly.", "jp": "三十分ぐらいかかります。", "en": "It takes about thirty minutes.", "pattern": "ぐらい"}, "ext": [{"kind": "flip", "scene": "The same form asks how much you spend on it a month, and the answer is another number you cannot pin down. The same word fuzzes an amount of money exactly as it fuzzed an amount of time.", "jp": "一万円ぐらいです。", "en": "About ten thousand yen.", "t": null}, {"kind": "wrinkle", "scene": "The next box wants what time you leave the house, and reaching for the same word puts a smear across a point on the clock rather than across a length. There is a different word for that, and it is the next lesson.", "jp": "七時ごろ出ます。", "en": "I leave around seven — a point in time takes ごろ.", "t": "ぐらい fuzzes AMOUNTS; ごろ — next lesson — fuzzes POINTS in time. About thirty minutes → ぐらい; around seven o'clock → ごろ."}], "what": "Softens a quantity or a length of time to an approximation.", "build": "[number + counter] ぐらい. ぐらい and くらい are the same word — use whichever comes out.", "when": "三十分ぐらい, 十人ぐらい, 千円ぐらい, 三年ぐらい.", "watch": "This is for how much and how long. For roughly when, you need ごろ — the next lesson.", "ex": [["三十分ぐらいかかります。", "It takes about 30 minutes."], ["十人ぐらい来ました。", "About ten people came."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "一万円 uses 万, outside KANJI_DICT — furigana needed."], "claims": [], "sources": []}, {"id": "goro", "step": "Step 3 · Joining, choosing & counting", "jp": "〜ごろ", "en": "around (a time)", "setting": {"scene": "The neighbour who signs for your parcels wants to know when you are usually back, so she knows when it is worth ringing the bell rather than leaving a card. You are back at about the same time every day and at exactly that time on no day at all, and she is asking about a point on the clock rather than a length of anything.", "jp": "七時ごろ帰ります。", "en": "I get home around seven.", "pattern": "ごろ"}, "ext": [{"kind": "flip", "scene": "You ask her the same thing back, because there is a parcel of hers you have taken in twice, and the question uses the same word about the same kind of time.", "jp": "何時ごろですか。", "en": "About what time?", "t": null}, {"kind": "wrinkle", "scene": "You write it down for her with the time particle in as well, out of habit, and it is one piece too many — this word has already done that job on its way past.", "jp": "七時ごろ帰ります。", "en": "No に needed — ごろ replaces it rather than joining it.", "t": "ごろ usually replaces に rather than stacking with it — 七時ごろ帰ります, no に needed."}], "what": "Softens a point on the clock or calendar.", "build": "[time] ごろ — and it swallows the に. 七時ごろ帰ります, not 七時ごろに帰ります.", "when": "七時ごろ, 三月ごろ, 十日ごろ.", "watch": "Duration takes ぐらい, a point in time takes ごろ. 三十分ごろ is wrong (that's a length), and 七時ぐらい, while heard, is looser than 七時ごろ.", "ex": [["七時ごろ帰ります。", "I'll go home around seven."], ["三月ごろ日本に来ました。", "I came to Japan around March."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-slots", "step": "Step 3 · Joining, choosing & counting", "jp": "語順のめやす", "en": "the default running order", "setting": {"scene": "You write three sentences in the school's shared notebook about where you were on Tuesday, and every particle in them is right. The teacher who reads it says it is perfectly clear and slightly odd, and cannot immediately say why. Nothing is wrong. The pieces are in an order nobody would choose.", "jp": "昨日、図書館で本を読みました。", "en": "Time, place, object, verb — the neutral order.", "pattern": null}, "ext": [{"kind": "flip", "scene": "You rewrite the second sentence into the default running order and it stops sounding translated, without a single word being added or removed. The particles were carrying the meaning all along; what the order was carrying was the ease.", "jp": "月曜日、公園で友達に会いました。", "en": "Monday, at the park, met a friend.", "t": null}, {"kind": "extra", "scene": "You try putting the place first instead, to stress it, and the sentence survives intact — because the particle sitting on it says what that piece is doing regardless of where in the line it happens to stand.", "jp": "図書館で昨日本を読みました。", "en": "Same sentence, place fronted for emphasis — still fine.", "t": "Exactly one thing cannot move: the verb stays last. Everything else negotiates, and moving a piece earlier gives it emphasis rather than breaking anything. That is why particles carry so much weight here — English uses position to show who did what to whom, and Japanese has spent that budget elsewhere."}], "what": "Japanese word order is famously flexible, and the reason is the particle system itself: because the particles identify what each piece is doing, you can move most pieces around without breaking anything. But flexible isn't random, and there is a default order that sounds neutral.", "build": "Time, then place, then who else is involved, then the thing the action lands on, then the verb: 昨日、図書館で友達と本を読みました. Move something to the front and you've emphasized it. Leave it to the end and it sounds like an afterthought.", "when": "Any sentence with more than two pieces in it. When a sentence feels off but every particle checks out, order is usually the culprit.", "watch": "Exactly one thing cannot move: the verb stays last. Everything else negotiates. That's the whole reason particles carry so much weight — English uses position to show who did what to whom, and Japanese uses が, に and を instead, which frees the positions up for emphasis.", "ex": [["昨日、図書館で本を読みました。", "Time, place, object, verb — the neutral order."], ["本は昨日読みました。", "Object pulled to the front as the topic: as for the book, I read it yesterday."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "dict", "step": "Step 4 · Verbs: from dictionary form up", "jp": "辞書形 (dictionary form)", "en": "the base every other form bends from", "setting": {"scene": "A group chat with three other teachers, set up on your second day, which is where the actual information about the school lives — what time the gate is locked, whose turn it is on Saturday. You have been answering in full polite sentences and it reads like a letter from a bank. Everyone else is writing in the shortest form there is.", "jp": "明日学校へ行く。", "en": "I'll go to school tomorrow. (casual)", "pattern": "行く"}, "ext": [{"kind": "flip", "scene": "Somebody asks what time you eat, meaning whether you will be in the staffroom at noon, and the answer is the same bare form — it is not shorthand or laziness, it is the shape a dictionary would list and the shape everything else is built from.", "jp": "十二時に食べる。", "en": "I eat at twelve.", "t": null}, {"kind": "wrinkle", "scene": "You use the same form in an email to the teacher who runs your section, and it arrives like answering a work message with 'yeah, going'. Nothing was ungrammatical. The register was two floors below the room.", "jp": "明日、学校へ行きます。", "en": "Same sentence, polite — です・ます for anyone but friends.", "t": "Plain form ends sentences among friends; です・ます ends them everywhere else. Which one you reach for is a register dial — a skill lesson later this step sets it deliberately."}], "what": "The plain, unchanged shape of a verb — the one a dictionary lists. 食べる, 飲む, 行く. Everything else in this step is made by bending this form.", "build": "It always ends in an u-sound: る, む, く, ぐ, す, つ, ぬ, ぶ, う. If a Japanese verb doesn't end that way, it isn't in dictionary form.", "when": "Two jobs. It's casual present and future speech on its own, and it slots unchanged into larger patterns — 〜つもりです, 〜まえに, 〜のが好きです.", "watch": "On its own it's casual. Ending a sentence with 行く to a teacher or a stranger is the equivalent of answering a work email with \"yeah, going.\"", "ex": [["明日学校へ行く。", "I'll go to school tomorrow. (casual)"], ["日本語を話すのが好きです。", "I like speaking Japanese. (dictionary form inside a pattern)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "masu", "step": "Step 4 · Verbs: from dictionary form up", "jp": "〜ます / ません", "en": "the polite everyday form", "setting": {"scene": "The first parents' evening, and you have twelve conversations to get through with people you have never met, about children you have known for three weeks. Whatever else you get wrong tonight, the ending on every verb should be the same one — the safe adult default, the form that is never wrong with a stranger.", "jp": "毎日勉強します。", "en": "He studies every day.", "pattern": "します"}, "ext": [{"kind": "flip", "scene": "A parent asks what time you get in and you answer about yourself for the first time all evening. Same ending, your own verb, and the tense is sitting inside it rather than being added on afterwards.", "jp": "毎日七時に起きます。", "en": "I get up at seven every day.", "t": null}, {"kind": "wrinkle", "scene": "How a verb reaches this ending depends on which family it belongs to, and you have been guessing all evening — mostly correctly, which is worse, because you have no idea why. The next lesson sorts every verb you will meet.", "jp": "食べます。飲みます。します。", "en": "Three families, three routes to the same ending.", "t": "How a verb reaches its ます form depends on its type — る-verbs swap る for ます, う-verbs shift the last sound to the い row, する・来る do their own thing. The next lesson sorts every verb you'll meet into those three boxes."}], "what": "The form you'll use most as an adult in Japan. It carries politeness without any formality beyond it — it's neutral, not stiff.", "build": "Take the verb's stem and add ます, or ません for the negative. Getting the stem is a two-family problem, and the very next lesson solves it.", "when": "Strangers, colleagues, shop staff, teachers, anyone older, anyone you've just met. When in doubt, ます.", "watch": "ます itself carries the tense, so you don't add anything else: 食べますです isn't a thing. And ません covers both \"don't\" and \"won't\" — Japanese doesn't split those.", "ex": [["毎日勉強します。", "I study every day."], ["肉を食べません。", "I don't eat meat."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-verbtypes", "step": "Step 4 · Verbs: from dictionary form up", "jp": "Go と Ichi", "en": "the two verb families", "setting": {"scene": "You have started keeping verbs in a notebook and the list has stopped being useful, because it is alphabetical and the language does not care about that. Every verb you meet belongs to one of two families, the family decides how it bends, and telling them apart is a two-second test you can run on sight.", "jp": "食べる → 食べます", "en": "Ichi: drop る, add ます.", "pattern": "食べます"}, "ext": [{"kind": "flip", "scene": "You re-sort the notebook into two columns and the test does most of the work by itself: if it does not end in る it is the other family, guaranteed, no exceptions to worry about.", "jp": "行く → 行きます", "en": "Go: the last sound shifts to the い row.", "t": null}, {"kind": "extra", "scene": "Two verbs you use daily — going home and going in — fail the test. They look like one family and belong to the other, and there are five of them worth memorising as a block.", "jp": "帰る → 帰ります", "en": "Looks Ichi, is Go — 帰ります, not 帰る→帰ます.", "t": "A handful end in いる or える and are Go anyway: 帰る, 入る, 走る, 切る, 知る. They are common enough to be worth learning as a set today rather than meeting one at a time in the middle of a sentence."}], "what": "Every Japanese verb belongs to one of two families — plus exactly two exceptions, する and 来る, and that is the whole system. The family decides how every single form is built: learn a verb's family once and you never have to think about it again. Textbooks call the families godan and ichidan — from here we'll just say Go and Ichi.", "build": "Ichi verbs drop る and add the ending: 食べる → 食べます. Go verbs shift their final sound to the i-row first: 飲む → 飲みます, 行く → 行きます, 買う → 買います.", "when": "Sorting them: if a verb doesn't end in る, it's Go, guaranteed. If it ends in る, look at the vowel before it — える or いる usually means Ichi (食べる, 見る), while ある, うる, おる means Go (作る, 乗る). する and 来る ignore this test entirely — they are the two irregulars, and later lessons give each its own forms. There are no others hiding.", "watch": "A handful of verbs end in いる or える and are Go anyway: 帰る, 入る, 走る, 切る, 知る. They're common enough that it's worth learning these five as a set now rather than being surprised by 帰ります later.", "ex": [["食べる → 食べます", "Ichi: drop る, add ます."], ["飲む → 飲みます", "Go: む → み, add ます."], ["帰る → 帰ります", "Looks Ichi, behaves Go."], ["する → します・来る → 来ます", "The two exceptions — small enough to just memorise."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-suruverbs", "step": "Step 4 · Verbs: from dictionary form up", "jp": "する と 来る", "en": "the two exceptions, and the one that builds new verbs", "setting": {"scene": "Your vocabulary list has forty two-kanji nouns on it and you have been learning them as nouns. Somebody points out that most of them are also verbs — that one small word turns almost any of them into something you can do — and the list quietly doubles in value without a single new entry.", "jp": "毎日、日本語を勉強します。", "en": "I study Japanese every day.", "pattern": "勉強します"}, "ext": [{"kind": "flip", "scene": "You try it on a noun nobody taught you as a verb and it works, which is the point: the pattern is productive, so every word of that shape you learn from now on arrives with a verb attached.", "jp": "毎日、散歩します。", "en": "I take a walk every day.", "t": null}, {"kind": "extra", "scene": "You run the two-column test on it out of habit and get an answer that does not exist. These two verbs sit outside the system entirely, and there are only two of them.", "jp": "来ます。します。", "en": "The two irregulars — learned whole, not sorted.", "t": "The sorting test from the last lesson does not apply to these, and trying to apply it is the classic accident: 勉強する is neither family, so 勉強しります and 勉強しる are both wrong. It and 来る are simply irregular, and they are the two most common verbs in the language."}], "what": "The last lesson promised these two their own forms; this is it. する and 来る are the only irregular verbs in the language — but する is not just an exception to memorise. It is the machine Japanese uses to turn nouns into verbs, which makes it the single most productive verb you will meet.", "build": "Noun + する makes a verb — textbooks call these サ変動詞, or just する-verbs. Put する directly after the noun: 勉強 (study) → 勉強する, 電話 (telephone) → 電話する, 掃除 (cleaning) → 掃除する, 予約 (reservation) → 予約する. It works on borrowed words too — コピーする, チェックする, メールする. The compound then conjugates exactly as する does: 勉強します, 勉強した, 勉強して, 勉強しない. Learn する's forms once and you have conjugated every one of these at the same time.  する: します・した・して・しない, and the potential is できる, not される. 来る: きます・きた・きて・こない — the kanji stays 来 while the sound moves く → き → こ, which is the part that actually catches people.", "when": "Constantly, and more often as your vocabulary grows — most two-kanji activity words work this way, so every noun of that shape you learn is quietly also a verb. 日本語を勉強しています。明日、予約します。", "watch": "The sorting test from the last lesson does not apply to these, and trying to apply it is the classic accident: 勉強する is neither Go nor Ichi, so 勉強しります and 勉強しる are both wrong — it is します, full stop.  You may also meet 勉強をする, with を. It is not an error; it loosens the compound back into 'do studying', and it is slightly heavier. The catch is that you cannot then stack another を — 日本語を勉強する is fine, 日本語を勉強をする is not, because a clause takes one を.", "ex": [["毎晩、日本語を勉強します。", "The noun 勉強 plus する. One を, on 日本語."], ["友達に電話しました。", "電話 is a telephone; 電話する is to make a call."], ["明日、友達が来ます。", "来る → きます. The reading moves, the kanji doesn't."], ["昨日は来ませんでした。", "And the negative stem is こ — 来ない, 来ません."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "散歩 arrives properly in Step 7; used here as a familiar noun+する."], "claims": [], "sources": []}, {"id": "ta-plain", "step": "Step 4 · Verbs: from dictionary form up", "jp": "〜た / 〜ない (plain past & negative)", "en": "the sound changes everything else depends on", "setting": {"scene": "Saturday, and three of the teachers have taken you to a ramen place near the station, which is the first time all month anybody has spoken to you at normal speed. Every sentence at the table ends in a sound you half recognise and cannot produce, and all of them are about what happened last night.", "jp": "昨日、ラーメンを食べた。", "en": "I ate ramen yesterday. (casual)", "pattern": "食べた"}, "ext": [{"kind": "flip", "scene": "Somebody asks whether you went to the festival and you answer in the same register for the first time — the plain past, at a table where nobody is anybody's teacher for the evening.", "jp": "行った。", "en": "I went.", "t": null}, {"kind": "wrinkle", "scene": "The shape is not new. It is built exactly like the connector form coming in two lessons, with one sound swapped at the end, so learning either of them hands you the other for nothing.", "jp": "飲んで / 飲んだ", "en": "Same machinery, one sound apart.", "t": "The plain past た is built exactly like the て-form with a た instead — 飲んで/飲んだ, 行って/行った. Learn one, get the other free (て arrives two lessons on)."}], "what": "The casual past and casual negative. They matter beyond casual speech: several later patterns (〜たあとで, 〜たり, 〜ないでください) attach to these forms, so the sound changes here get reused constantly.", "build": "Ichi verbs are easy: drop る, add た or ない — 食べた, 食べない. Go verbs change their final sound for the past. う・つ・る → った (買った, 待った, 帰った). む・ぬ・ぶ → んだ (飲んだ, 遊んだ). く → いた (書いた), ぐ → いだ (泳いだ). す → した (話した). For the negative, shift the final sound to the a-row and add ない: 飲む → 飲まない, 行く → 行かない.", "when": "Talking to close friends and family, and as the raw material for later grammar.", "watch": "Four irregulars, and they're all high-frequency: 行く → 行った (not 行いた), する → した / しない, 来る → 来た / 来ない, and ある → あった but ない (never あらない). Verbs ending in う take わ in the negative: 買う → 買わない.", "ex": [["昨日、ラーメンを食べた。", "I ate ramen yesterday. (casual)"], ["今日は行かない。", "I'm not going today. (casual)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "ラーメン is katakana and unlisted; it appears in the module's own example."], "claims": [], "sources": []}, {"id": "mashita", "step": "Step 4 · Verbs: from dictionary form up", "jp": "〜ました / ませんでした", "en": "polite past", "setting": {"scene": "Monday morning, and the section head asks what you did at the weekend — the same question the table asked on Saturday night, in a room where the answer cannot possibly be the same shape. Same event, same verb, same week, and one whole floor up in politeness because of who is standing in front of you.", "jp": "昨日映画を見ました。", "en": "I watched a film yesterday.", "pattern": "ました"}, "ext": [{"kind": "flip", "scene": "She asks whether you have eaten, meaning this morning, and the negative version of the same tense arrives by exactly the same route — nothing new to learn and nothing to sort, just one piece swapped at the end of the word.", "jp": "朝ごはんを食べませんでした。", "en": "I didn't eat breakfast.", "t": null}, {"kind": "wrinkle", "scene": "You reach for the plain past you learned on Saturday and try to make it polite by adding to the end of it, which produces something that is not a word. This form is built from the ます stem, and it ignores the sound-change chart entirely.", "jp": "飲みました。", "en": "Not 飲んだました — built from the stem, not the plain past.", "t": "Every verb builds this the same way once it has its ます form — which is why the ます machinery came first. No new sorting to learn here."}], "what": "The past tense of ます — what you'll actually say in most adult conversations.", "build": "Stem + ました, or ませんでした for the past negative. Same stem, same two families as before: 食べました, 飲みました.", "when": "Reporting anything that already happened, at any level of politeness above \"close friend.\"", "watch": "The polite past ignores the sound-change chart entirely — it's built from the stem, not from the た-form. 飲んだました is a common early mistake; it's just 飲みました.", "ex": [["昨日映画を見ました。", "I watched a movie yesterday."], ["朝ごはんを食べませんでした。", "I didn't eat breakfast."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "te", "step": "Step 4 · Verbs: from dictionary form up", "jp": "て形 (te-form)", "en": "the connector everything plugs into", "setting": {"scene": "The morning routine you have to describe for the school's health form is four actions long and you can say all four of them separately. What you cannot do is join them, so the answer reads like a telegram. This one form is the connector every later pattern plugs into, and it is the hardest conjugation in the whole stage.", "jp": "朝起きて、顔を洗います。", "en": "I get up and wash my face.", "pattern": "起きて"}, "ext": [{"kind": "flip", "scene": "You chain the rest of it yourself and the whole morning arrives as a single sentence rather than four. Only the last verb carries the tense for any of it; everything in front is simply hooked on and takes whatever that final verb decides.", "jp": "朝ごはんを食べて、学校へ行きます。", "en": "I eat breakfast and go to school.", "t": null}, {"kind": "wrinkle", "scene": "Which sound the form takes depends on the verb's last kana, and the chart has six rows and one outright liar in it — the verb for going, which does not behave like the row it belongs to.", "jp": "行って", "en": "行く breaks its own row — 行いて is wrong.", "t": "The sound changes sort by the verb's last kana: む・ぶ・ぬ → んで, く → いて (but 行く → 行って), ぐ → いで, う・つ・る → って, す → して. る-verbs just swap る for て. It's the hardest conjugation of Stage 1 — hence the pool below."}], "what": "The most useful form in beginner Japanese. It isn't a tense and it can't end a sentence on its own — it's a hand-off, saying \"…and then\" or \"…so that\" to whatever follows.", "build": "Exactly the chart you learned for 〜た, with て and で swapped in. う・つ・る → って (買って, 待って, 帰って). む・ぬ・ぶ → んで (飲んで, 遊んで). く → いて (書いて), ぐ → いで (泳いで). す → して (話して). Ichi verbs drop る and add て: 食べて. Irregulars: 行く → 行って, する → して, 来る → 来て.", "when": "It unlocks most of the rest of this course: 〜てください (requests), 〜ています (ongoing), 〜てもいい (permission), 〜てから (sequence) — plus simply chaining actions together in one sentence.", "watch": "The て-form carries no tense of its own. The final verb sets the tense for the whole sentence: 朝起きて、顔を洗いました is entirely past, even though 起きて looks unmarked. Learn this chart properly now — you'll use it every day for the rest of the course.", "ex": [["朝起きて、顔を洗います。", "I get up and wash my face."], ["ここに名前を書いてください。", "Please write your name here."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "顔 and 洗う sit outside the Step 4 bank; both are in the module's own example."], "claims": [], "sources": []}, {"id": "teiru", "step": "Step 4 · Verbs: from dictionary form up", "jp": "〜ています (ongoing)", "en": "happening right now", "setting": {"scene": "A phone call from the school office at ten past eight, asking where you are, and the honest answer is on a platform two stations away watching a delay board. What the question wants is not what you did or what you will do but what is happening at this exact moment, which needs a form English builds with is and Japanese builds onto the verb.", "jp": "今、雨が降っています。", "en": "It's raining now.", "pattern": "降っています"}, "ext": [{"kind": "flip", "scene": "She asks what you can see from where you are standing, and you describe the platform — the same shape, this time in your own sentence, with everything in it happening at the moment you say it.", "jp": "今、電車を待っています。", "en": "I'm waiting for the train now.", "t": null}, {"kind": "wrinkle", "scene": "You use it about where you live and it comes out meaning something you did not intend — because this form has a second life, and the next lesson is entirely about the difference.", "jp": "東京に住んでいます。", "en": "I live in Tokyo — not 'in the middle of living'.", "t": "ています has a second life — states that continue (living somewhere, being married). The very next lesson takes that on; don't be surprised when 住んでいます isn't \"in the middle of living.\""}], "what": "The closest thing Japanese has to \"is doing\" — an action in progress at this moment.", "build": "て-form + います. Plain version: て-form + いる.", "when": "Describing what's going on as you speak: it's raining, he's watching TV, I'm eating.", "watch": "In real speech the い almost always disappears — 見ています becomes 見てる. That's the next culture lesson, and it's what you'll actually hear.", "ex": [["今、雨が降っています。", "It's raining now."], ["弟はテレビを見ています。", "My brother is watching TV."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "待つ is Step 5 bank; used one step early in a natural sentence."], "claims": [], "sources": []}, {"id": "teiru2", "step": "Step 4 · Verbs: from dictionary form up", "jp": "〜ています (habit / state)", "en": "a state that stuck", "setting": {"scene": "New class, first lesson, and thirty-four children want to know everything about you at once — where you live, whether you are married, whether you have a dog. All three answers describe a state you are in now, and every one of them got there because something happened in the past and then stopped changing.", "jp": "東京に住んでいます。", "en": "I live in Tokyo.", "pattern": "住んでいます"}, "ext": [{"kind": "flip", "scene": "They ask about the teacher who left, and the same form describes where she is now — a result that is still standing, not an action anybody is in the middle of.", "jp": "国に帰っています。", "en": "She's gone back to her country (and is there).", "t": null}, {"kind": "wrinkle", "scene": "You answer the where-do-you-live question with the plain polite form instead, and it lands as a plan rather than a fact — as though you were describing a move you have not made yet.", "jp": "東京に住んでいます。", "en": "住みます would sound like a moving plan, not a life.", "t": "A handful of verbs live almost entirely in this form: 住んでいます, 結婚しています, 知っています. Saying 住みます for \"I live in Tokyo\" is the classic miss — it sounds like a moving plan."}], "what": "The same form doing a genuinely different job: not \"is doing\" but \"did, and the result is still true.\" 住んでいる isn't in the middle of moving in — they moved in, and they're still there.", "build": "Same shape as before.", "when": "住んでいます (live somewhere), 働いています (work somewhere), 結婚しています (be married), 知っています (know), 持っています (have).", "watch": "These trip up English speakers because English uses a simple present for them. \"I live in Tokyo\" must be 住んでいます — 住みます is wrong. And 知っています has an irregular negative: 知りません, never 知っていません.", "ex": [["東京に住んでいます。", "I live in Tokyo."], ["銀行で働いています。", "I work at a bank."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-transitive", "step": "Step 4 · Verbs: from dictionary form up", "jp": "自動詞・他動詞", "en": "verbs that come in pairs", "setting": {"scene": "You come back to the staffroom after lunch and the window is open. It was shut when you left. Nobody is standing near it and nobody is going to be blamed. What you want to say is a description of the room, not a report of anyone's action — and English hands you one verb for both jobs with no warning that a choice is being made.", "jp": "窓が開いています。", "en": "The window is open.", "pattern": "開いています"}, "ext": [{"kind": "flip", "scene": "You close it, and now there is a person in the sentence — you — which means the other twin of the same verb, and the particle changes to match without you touching it.", "jp": "窓を閉めました。", "en": "I closed the window.", "t": null}, {"kind": "extra", "scene": "You write it in the shared notebook with the wrong twin and the wrong particle, and the sentence is broken in two places at once, neither of which English would have flagged.", "jp": "窓が閉まりました。", "en": "The window closed — no one did it, so が and the happen-twin.", "t": "The self-check that catches it: if you find を sitting in front of an it-just-happens verb, one of the two is wrong. 窓を閉まりました is wrong twice — 閉まる cannot take を, and a person closing something needs 閉めました."}], "what": "English uses one verb for both sides of an action: I opened the door, and the door opened. Japanese uses two different verbs. 開ける is what a person does to a door; 開く is what the door does on its own. There is no overlap, and English gives you no warning that a choice is being made.", "build": "The pairs travel in recognisable families: 開ける/開く, 閉める/閉まる, 始める/始まる, 止める/止まる, 出す/出る, 入れる/入る, つける/つく, 消す/消える. The particle has to agree with the verb you picked — the someone-does-it verb takes を (窓を開けます), the it-just-happens verb takes が (窓が開きます). Choose the verb first and the particle follows automatically.", "when": "Constantly, and especially with 〜ています. 窓が開いています describes a window that is open, which is what you would actually say about a room. 窓を開けています means you are in the middle of opening it right now, which is rarely the point.", "watch": "This is the error the checker flags hardest, because there is nothing in English to warn you. 窓を閉まりました is wrong twice: 閉まる is the intransitive verb so it cannot take を, and a person closing something needs 閉めました. Useful self-check — if you find を sitting in front of an intransitive verb, one of the two is wrong. You'll meet this again in Step 10, where a second, unrelated family of が verbs arrives — keeping the two がs apart is that lesson's whole point.", "ex": [["窓を閉めました。", "I closed the window. (I did it → を + transitive)"], ["窓が閉まりました。", "The window closed. (it happened → が + intransitive)"], ["電気がついています。", "The light is on. (state, from the intransitive)"], ["会議は三時に始まります。", "The meeting starts at three. (it starts itself)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "mou", "step": "Step 4 · Verbs: from dictionary form up", "jp": "もう〜ました", "en": "already done", "setting": {"scene": "Half past twelve and the section head is doing the rounds before the afternoon meeting, checking who still needs to eat, who has sent the forms in, who has done the thing they said they would do at nine. Every question she asks is about whether something is finished, and every answer is one word plus a past tense.", "jp": "もう昼ごはんを食べました。", "en": "I've already eaten lunch.", "pattern": "もう"}, "ext": [{"kind": "flip", "scene": "You ask her the same about the paperwork you handed in on Friday, because nobody has said anything since and the deadline was yesterday. Same word, your question, checking a door is shut.", "jp": "もう見ましたか。", "en": "Have you already looked at it?", "t": null}, {"kind": "wrinkle", "scene": "Its mirror turns up in the next answer down the row — somebody has not eaten, and the not-yet version pairs with a different ending entirely. The two words are one system: door closed, door still open.", "jp": "まだ食べていません。", "en": "Not yet — まだ pairs with ていません.", "t": "もう pairs with completed forms. Its mirror まだ — next lesson — pairs with ていません. The two lessons are one system: door closed, door still open."}], "what": "もう plus a past verb reports that something is finished.", "build": "もう + past tense. Answering \"yes\" to もう〜ましたか is just はい、もう〜ました.", "when": "Confirming completion — homework, lunch, a task someone asked about.", "watch": "もう has two other lives worth recognizing: with a negative it means \"no longer\" (もう飲みません — I don't drink any more), and before a number it means \"another\" (もう一つ).", "ex": [["もう昼ごはんを食べました。", "I already ate lunch."], ["宿題はもう終わりました。", "The homework is already finished."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "mada", "step": "Step 4 · Verbs: from dictionary form up", "jp": "まだ〜ていません", "en": "not yet", "setting": {"scene": "The medical for the job is at two and the instruction sheet said nothing after midnight. At half past one somebody offers you a biscuit and you have to explain, in a staffroom, that you have not eaten — not that you did not eat, which is a different sentence and closes a door that is still very much open.", "jp": "まだ食べていません。", "en": "I haven't eaten yet.", "pattern": "まだ"}, "ext": [{"kind": "flip", "scene": "At the clinic the nurse asks whether the forms came back from the school and you use the same shape about somebody else's outstanding job — still open, still expected, not yet done.", "jp": "まだ来ていません。", "en": "It hasn't come yet.", "t": null}, {"kind": "wrinkle", "scene": "You say it with the ordinary polite past instead and it reports that eating simply did not happen — historical, finished, nothing pending. Not-yet-ness is a present state and it needs the present-state form.", "jp": "まだ食べていません。", "en": "Not まだ食べませんでした — that closes the door.", "t": "The classic overreach: まだ食べませんでした. ませんでした reports that eating simply didn't happen — closed, historical. Not-yet-ness is a present state, and it needs ていません."}], "what": "The natural answer to もう〜ましたか when the answer is no.", "build": "まだ + て-form + いません. Not the plain past negative.", "when": "Anything still outstanding but expected.", "watch": "まだ食べませんでした is grammatical but wrong in feel — it says \"I didn't eat, end of story.\" ていません keeps the door open: it hasn't happened yet, but it will. Separately, まだ before an adjective just means \"still\": まだ忙しいです.", "ex": [["まだ食べていません。", "I haven't eaten yet."], ["レポートはまだ書いていません。", "I haven't written the report yet."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-future", "step": "Step 4 · Verbs: from dictionary form up", "jp": "未来形はない", "en": "there is no future tense", "setting": {"scene": "You spend twenty minutes hunting for the future tense, because the school calendar for next term needs describing and every sentence you want is about something that has not happened yet. There is nothing to find. The form you already have covers habits, plans, promises and scheduled events without changing shape.", "jp": "毎日コーヒーを飲みます。", "en": "I drink coffee every day. (habit)", "pattern": "飲みます"}, "ext": [{"kind": "flip", "scene": "You write the line about next Monday with the identical ending you used for the habit, and nothing whatever marks it as future except the word for Monday sitting at the front. If you know it is happening, the non-past says so.", "jp": "月曜日に行きます。", "en": "I'm going on Monday.", "t": null}, {"kind": "extra", "scene": "You add a word you half-remember meaning will, and the sentence stops being a plan and becomes a forecast — which is not what a calendar means at all, and quietly downgrades something you know into something you suspect.", "jp": "明日、行きます。", "en": "Not 行くでしょう — that's 'probably', not 'will'.", "t": "The instinct to hunt for a future marker produces things like 行くでしょう where a plain 行きます was wanted. でしょう is a guess, not a tense — reaching for it to mean 'will' quietly downgrades a fact into a probably."}], "what": "Japanese has two tenses, not three: past, and everything else. There is no equivalent of \"will.\" 行きます is both \"I go\" and \"I will go,\" and nothing about the verb changes between them.", "build": "Nothing to build — that's the point. To place something in the future, add a time word instead: 明日行きます, 来週会います, 三時に始まります.", "when": "Habits, plans, promises, scheduled events — all of it uses the same non-past form.", "watch": "The instinct to hunt for a future marker is strong, and it produces things like 行くでしょう where a plain 行きます was wanted. If you know it's happening, use the non-past. でしょう (Step 7) means you're guessing.", "ex": [["毎日コーヒーを飲みます。", "I drink coffee every day. (habit)"], ["明日、友達に会います。", "I'll meet a friend tomorrow. (future — same form, context decides)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-register", "step": "Step 4 · Verbs: from dictionary form up", "jp": "です・ます or plain?", "en": "choosing your politeness", "setting": {"scene": "Two conversations, four minutes apart, in the same room. One with the teacher you eat lunch with every day; one with the section head who signs your leave. The words are nearly identical and the endings cannot be, and the level tracks your relationship with the person rather than the subject or your mood.", "jp": "先生、明日は休みます。", "en": "To a teacher: polite.", "pattern": "休みます"}, "ext": [{"kind": "flip", "scene": "You say the same thing to the friend at the next desk on your way out and drop a whole floor without thinking about it, which is exactly right — the dial moved because the listener moved, not because the news did.", "jp": "明日、休む。", "en": "Same news, to a friend.", "t": null}, {"kind": "extra", "scene": "Halfway through a longer conversation with the section head you relax, and a single plain verb slips in among the polite ones. Nobody says anything about it and nobody needs to. Everybody in the room heard it happen.", "jp": "休みます。", "en": "Hold the level you started on.", "t": "The classic error is not picking the wrong level. It is drifting between them inside one conversation, which reads as unstable rather than casual — pick a level per listener at the start and hold it to the end."}], "what": "Every Japanese sentence you produce carries a politeness level, whether you chose one or not. You can't opt out — even the plain form is a choice, and listeners hear it.", "build": "です/ます with strangers, teachers, staff, colleagues, anyone older. Plain form with close friends, family, and children.", "when": "Pick a level per listener at the start of a conversation and hold it. The level tracks your relationship with the person you're speaking to, not your mood or the topic.", "watch": "The classic error isn't picking the wrong level — it's drifting between them mid-conversation, which reads as unstable rather than casual. That's why this lesson asks for two sentences instead of one: consistency is the skill being tested.", "ex": [["先生、明日は休みます。", "To a teacher: polite."], ["明日、休むよ。", "To a friend: plain."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-nounmod", "step": "Step 4 · Verbs: from dictionary form up", "jp": "名詞修飾 (noun modification)", "en": "describing a noun with a whole clause", "setting": {"scene": "The end-of-term report wants a sentence about the children who joined late, and you cannot build it — every version needs a joining word that does not exist. Japanese puts the whole description in front of the noun with nothing between them, and this is the single structure that turns short sentences into real ones.", "jp": "離婚した人は、もう一度結婚しますか。", "en": "Do people who have divorced marry again?", "pattern": "した人"}, "ext": [{"kind": "flip", "scene": "You write your own line about the class and the clause slots in front of the noun with no connector at all — no who, no that, nothing to translate, which is exactly why it feels wrong for the first month.", "jp": "昨日来た学生は日本人です。", "en": "The student who came yesterday is Japanese.", "t": null}, {"kind": "extra", "scene": "Your first attempt is polite inside the clause, which nothing in English would warn you about, and the politeness belongs at the very end of the sentence rather than in the middle of it.", "jp": "昨日来た学生です。", "en": "Not 昨日来ました学生 — politeness waits for the end.", "t": "Three specific errors. Never です or ます inside the clause — 離婚しました人 is wrong, it is 離婚した人. Never insert a joining word, because there is no equivalent of who or that. And never add の, which is for joining nouns, not clauses."}], "what": "English puts a describing phrase after the noun: people who are divorced, the book I read yesterday, a friend who lives in Tokyo. Japanese puts it in front, with nothing joining the two: 離婚した人, 昨日読んだ本, 東京に住んでいる友達. There is no word for who, which, or that — the clause just sits there, and the noun it describes comes last.", "build": "Take a full sentence, put it in PLAIN form, and park it directly before the noun. 人が離婚した becomes 離婚した人. Every plain form works: 食べない人 a person who doesn't eat, 母が作る料理 food my mother makes, 母が作った料理 food my mother made. If the clause has its own subject, mark it with が — は cannot appear inside.", "when": "The moment you want a subject bigger than one word. This is the single structure that moves a learner from short sentences to real ones, and every later pattern that looks complicated (〜とき, 〜まえに, 〜のが好き) is this same shape underneath.", "watch": "Three specific errors. Never です or ます inside the clause: 離婚しました人 is wrong, it's 離婚した人. Never insert a joining word — there's no equivalent of who or that, and adding の doesn't help. And は inside the clause is wrong: 私が読んだ本, never 私は読んだ本. One nuance worth carrying over from Step 4: 結婚した人 is someone who got married, while 結婚している人 is someone who is married — the same past-versus-state split you met with 〜ています.", "ex": [["離婚した人は、もう一度結婚しますか。", "Do people who have divorced marry again? (clause before the noun, no joining word)"], ["これは母が作った料理です。", "This is food my mother made. (the clause's own subject takes が)"], ["東京に住んでいる友達がいます。", "I have a friend who lives in Tokyo."], ["昨日買った本はとても面白かったです。", "The book I bought yesterday was very interesting."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "離婚/結婚 sit well outside Step 4 vocabulary; they are the module's own example sentence, kept for fidelity."], "claims": [], "sources": []}, {"id": "tekudasai", "step": "Step 5 · Requests, permission & obligation", "jp": "〜てください", "en": "please do", "setting": {"scene": "The bank again, and the account has hit a problem that needs the teller to fetch somebody. She asks you to sit down, and then you need to ask her something back — the neutral polite request, the one that works on counters, taxi drivers and teachers, and the only one you have.", "jp": "ちょっと待ってください。", "en": "Please wait a moment.", "pattern": "てください"}, "ext": [{"kind": "flip", "scene": "The form has to go to the school for a stamp and back here by Friday, so you ask the office to look at it today rather than tomorrow. Your request this time, same shape, on a verb of your own.", "jp": "今日、見てください。", "en": "Please look at it today.", "t": null}, {"kind": "wrinkle", "scene": "The answer side is part of the pattern and it is not always a word for yes. いいですよ and どうぞ are both agreement — and a hesitant ちょっと with nothing after it is very often the whole answer.", "jp": "ちょっと…", "en": "A no wearing softness — take the hesitation as the answer.", "t": "The answer side is part of the pattern: いいですよ and どうぞ are yes — and a hesitant ちょっと… usually IS the answer, a no wearing softness."}], "what": "The all-purpose polite request: please do this. It is built on the て-form, which is a large part of why the て-form was worth the sweat.", "build": "て-form + ください: 待ってください, 話してください. You will also hear the softer 〜てくださいませんか — recognize it; producing it can wait.", "when": "Asking anyone to do anything politely — counters, teachers, taxi drivers. The neutral default for requests to people you are not close to.", "watch": "However polite, it is still an instruction — for favours from superiors, お願いします or the invitation forms do the job more gracefully. And bare ください with を asks for a THING: 水をください. The split is clean: を + noun for things, て + verb for actions.", "ex": [["ちょっと待ってください。", "Please wait a moment."], ["ゆっくり話してください。", "Please speak slowly."], ["すみません、写真を撮ってください。— いいですよ。", "Asking a stranger for a photo — request and easy grant."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "naidekudasai", "step": "Step 5 · Requests, permission & obligation", "jp": "〜ないでください", "en": "please don't", "setting": {"scene": "A school trip to a temple, thirty-four children, and a member of staff comes over to you rather than to them — which means whatever is about to be said is for you to pass on. Inside the hall, no photographs. It is a request rather than a rule on a sign, and the form matches that.", "jp": "ここで写真を撮らないでください。", "en": "Please don't take photos here.", "pattern": "ないでください"}, "ext": [{"kind": "flip", "scene": "You turn round and say it to the class, and then say a gentler one to the child who has been worrying all morning about getting something wrong — the same shape, doing comfort rather than instruction.", "jp": "心配しないでください。", "en": "Please don't worry.", "t": null}, {"kind": "wrinkle", "scene": "On the way out there is a sign that means the same thing in a completely different voice: not a person asking this person now, but a standing rule that was true before you arrived.", "jp": "ここでたばこを吸ってはいけません。", "en": "No smoking here — a rule, not a request.", "t": "ないでください asks someone to refrain; てはいけません (two lessons on) forbids outright. The first is a request, the second a rule."}], "what": "The please-don't — a request pointed at not-doing.", "build": "ない-form + でください: 撮らないでください, 心配しないでください. The negative lives on ない; there is no ませんでください.", "when": "House rules, gentle warnings, and asking someone to stop — softly.", "watch": "Delivery sets the temperature: 心配しないでください is comfort, not command. Keep it apart from てはいけません two lessons on — ないでください asks THIS person, now; てはいけません states a standing rule that applies to everyone.", "ex": [["ここで写真を撮らないでください。", "Please don't take photos here."], ["心配しないでください。", "Please don't worry."], ["忘れないでくださいね。", "A gentle reminder — the ね from Step 1 softens it further."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "心配 uses kanji outside KANJI_DICT — furigana needed. Kept because 心配しないでください is the module's own example and the most useful sentence in the lesson."], "claims": [], "sources": []}, {"id": "temoii", "step": "Step 5 · Requests, permission & obligation", "jp": "〜てもいいです", "en": "may / it's okay to", "setting": {"scene": "The staffroom has assigned desks and one spare, and you have been standing with a laptop for four minutes because nobody has told you whether the spare is spare. Japanese social space runs on asking first, and this is the asking — before you sit, borrow, photograph, or leave early.", "jp": "ここに座ってもいいですか。", "en": "May I sit here?", "pattern": "てもいいですか"}, "ext": [{"kind": "flip", "scene": "Later you need the good stapler off somebody else's desk, and the same question does it — asking before taking is not deference here, it is the ordinary running order.", "jp": "使ってもいいですか。", "en": "May I use it?", "t": null}, {"kind": "wrinkle", "scene": "Reading the answer is half the skill. どうぞ is yes and needs no words around it. あ、ちょっと… is a no wearing softness, and pressing past it makes things worse in both directions at once.", "jp": "あ、ちょっと…", "en": "That's the no. Don't ask twice.", "t": "Reading the answer is half the skill: どうぞ is yes. あ、ちょっと… is a no wearing softness — pressing past it makes things worse in both directions."}], "what": "Permission, in both directions: 〜てもいいですか asks it, 〜てもいいですよ grants it. The question form is the one you will use daily — this is HOW you ask 'may I'.", "build": "て-form + もいいですか to ask; drop the か to grant. Literally 'even if I do it, is it good?' — which is what the も is doing there.", "when": "Before touching, sitting, photographing, borrowing, leaving early. Japanese social space runs on asking first, and this form is the asking.", "watch": "Learn the answers with the question. Yes: いいですよ, or just どうぞ. A real no usually avoids だめ — you will hear ちょっと… or すみません、それは…. Hesitation IS the answer; take it as one.", "ex": [["ここに座ってもいいですか。", "May I sit here?"], ["帰ってもいいですよ。", "You may go home."], ["写真を撮ってもいいですか。— どうぞ。", "Asking permission, and the friendly grant."], ["入ってもいいですか。— あ、ちょっと…", "The soft refusal — the trailing ちょっと is a complete answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "tewaikemasen", "step": "Step 5 · Requests, permission & obligation", "jp": "〜てはいけません", "en": "must not", "setting": {"scene": "The pool, the first hot week, and the rules are on a board by the gate in language that does not soften anything. Some of it is pictures. Most of it is one pattern, repeated, which is the pattern signage uses when the rule was true before you arrived and will be true after you leave.", "jp": "ここでたばこを吸ってはいけません。", "en": "You must not smoke here.", "pattern": "てはいけません"}, "ext": [{"kind": "flip", "scene": "You have to put it into English for the class and then back into Japanese for the parent who arrives late, and it is the same flat shape both times — no room in it and none intended.", "jp": "ここに入ってはいけません。", "en": "You must not go in here.", "t": null}, {"kind": "wrinkle", "scene": "You use it on a child who is about to do something harmless and it lands far heavier than you meant. To stop a person, rather than state a rule, the gentler request form is the right tool.", "jp": "入らないでください。", "en": "Please don't go in — asking a person, not quoting a rule.", "t": "This is the strong, signage-and-rules form. Softer real-life refusals usually reach for ちょっと… or ないでください — save てはいけません for actual rules."}], "what": "Prohibition as a standing rule: must not. Impersonal — it belongs to the place or the situation, not to you.", "build": "て-form + はいけません. The written は is the particle, read wa — the kana lesson's rule on duty.", "when": "Rules attached to places: signs, classrooms, hospitals, pools. Often what a sign means even when the sign just says 禁止.", "watch": "Strong and flat — to stop a PERSON, ないでください is kinder. And hold the triangle corner: must-not is this; don't-have-to is なくてもいい, built from entirely different parts. English builds both from 'must'; Japanese never does.", "ex": [["ここでたばこを吸ってはいけません。", "You must not smoke here."], ["授業中に寝てはいけません。", "You must not sleep in class."], ["この部屋を使ってはいけません。", "A rule about the room — it applies to everyone, not just you."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "nakereba", "step": "Step 5 · Requests, permission & obligation", "jp": "〜なければなりません", "en": "must / have to", "setting": {"scene": "The clinic sends you home with a week of tablets and an instruction that is not a suggestion, and the pharmacist writes it into the booklet you now carry. Every day, whether or not you feel any better. The sentence for a duty like that is built out of pieces you already own, assembled in a shape English does not have.", "jp": "毎日薬を飲まなければなりません。", "en": "I have to take medicine every day.", "pattern": "なければなりません"}, "ext": [{"kind": "flip", "scene": "Six o'clock, and you are the first to leave a room where nobody has moved — so you say why, and this is the polite exit as much as it is an obligation.", "jp": "もう帰らなければなりません。", "en": "I have to go now.", "t": null}, {"kind": "wrinkle", "scene": "Taken apart, the sentence says that if you do not drink it, it will not do. There is no direct word for must anywhere in it — the obligation is built by ruling out the not-doing, which is why the shape looks so long for so small an idea.", "jp": "飲まなければなりません。", "en": "Literally: if I don't drink it, it won't do.", "t": "The double negative is doing the work: \"if I don't drink it, it won't do.\" Japanese states obligation by ruling out NOT doing — there is no direct \"must\" verb."}], "what": "Obligation: must, have to. Japanese builds it as a double negative — 'if I do not do it, it will not do' — which is why the pieces look the way they do.", "build": "ない-form, drop the い, + ければなりません: 飲まなければなりません. 〜ないといけません means the same with a lighter step — the modular slots are two lessons on.", "when": "Duties, deadlines, medicine, early alarms — and the polite exit: もう帰らなければなりません.", "watch": "About yourself it states duty; aimed at the listener it can order them around — 行かなければなりませんよ is bossy. And keep the direction straight: this whole assembly means MUST DO. Must-NOT lives next door in てはいけません.", "ex": [["毎日薬を飲まなければなりません。", "I have to take medicine every day."], ["明日早く起きなければなりません。", "I must get up early tomorrow."], ["もう帰らなければなりません。", "The polite exit line — duty offered as courtesy."]], "orphanWr": [], "flags": [], "claims": ["Prescriptions are dispensed by a pharmacy rather than the clinic, and recorded in a patient-held booklet"], "sources": ["https://japanlivinglife.com/articles/prescription-medicine-japan-guide"]}, {"id": "nakutemoii", "step": "Step 5 · Requests, permission & obligation", "jp": "〜なくてもいいです", "en": "don't have to", "setting": {"scene": "Saturday practice is optional this month and one family has spent four minutes apologising for something they do not need to apologise for. You have one sentence in which to release them, and the sentence that forbids them is built from entirely different parts — but English builds both out of the same words, so the instinct is to negate must and hope.", "jp": "明日は来なくてもいいです。", "en": "You don't have to come tomorrow.", "pattern": "なくてもいいです"}, "ext": [{"kind": "flip", "scene": "A colleague asks whether she has to fill in the second form as well, and you get to be the one giving mercy — same shape, answering a must-I question with a no that grants rather than forbids.", "jp": "書かなくてもいいです。", "en": "You don't have to write it.", "t": null}, {"kind": "wrinkle", "scene": "Say the other one by mistake and you have banned a child from the school on Saturday. Both sentences are perfectly grammatical and nothing warns you that the message inverted.", "jp": "来てはいけません。", "en": "You must NOT come — a different sentence entirely.", "t": "Don't-have-to and must-not both FEEL like negatives of must in English. They are different sentences here: 来なくてもいいです releases; 来てはいけません forbids. The skill lesson next drills the triangle."}], "what": "Permission not to: you don't have to. The kind corner of the obligation triangle.", "build": "ない-form, drop the い, + くてもいいです — the same skeleton as てもいい: 'even if you don't, it's fine.'", "when": "Reassuring people, lightening loads, and answering must-I questions with mercy.", "watch": "This is the corner English miswires — the skill builder two lessons on drills it. Notice the negotiation pair: 行かなければなりませんか asks the obligation; いいえ、行かなくてもいいですよ is its kind release.", "ex": [["明日は来なくてもいいです。", "You don't have to come tomorrow."], ["急がなくてもいいですよ。", "You don't have to hurry."], ["明日も来なければなりませんか。— いいえ、来なくてもいいですよ。", "The obligation question and its kind answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-must", "step": "Step 5 · Requests, permission & obligation", "jp": "「must」の三すくみ", "en": "must, must-not, don't-have-to", "setting": {"scene": "Three sentences from this step form a triangle, and one corner of it is where English speakers do real damage. Must do, must not do, and do not have to do — the first two feel like opposites and the third feels like a negative of the first, which is exactly the wiring that sends a family home thinking their son is banned.", "jp": "来なくてもいいです。", "en": "You don't have to come.", "pattern": "なくてもいいです"}, "ext": [{"kind": "flip", "scene": "You draw the triangle out on paper for yourself, and the two dangerous corners share no material at all: one is the negative form plus permission, the other is the connector form plus prohibition. Nothing about them overlaps.", "jp": "来てはいけません。", "en": "You must not come — different parts, opposite meaning.", "t": null}, {"kind": "extra", "scene": "You hear four different versions of the same obligation in one week and assume they are four patterns. They are two slots with three fillings each, and every combination means what you think it means.", "jp": "行かないといけない。", "en": "Same meaning, lighter register — two slots, swapped.", "t": "The must corner itself is modular: なければ, ないと or なきゃ on the left; なりません, いけません or だめ on the right. Most combinations work and mean the same thing, so learn two slots rather than six patterns — and note the double negative is doing the work in all of them, which is why adding your own extra negative is the one honestly wrong move."}], "what": "Three patterns from this step form a triangle English wires differently, and the miswiring is invisible until it does real damage: しなければなりません (must do), してはいけません (must not do), しなくてもいいです (don't have to do).", "build": "The dangerous corner is the third. English builds 'must not' and 'don't have to' from the same material, so the instinct is to negate 'must' and hope. Japanese splits them completely: negative form + なくてもいい grants permission NOT to do; て-form + はいけない prohibits. The two share nothing.", "when": "Rules, obligations, reassurances. Telling someone 来なくてもいいです (you don't have to come) when you meant 来てはいけません (you must not come) — or the reverse — flips the message, and both sentences are grammatical, so nothing warns you.", "watch": "The 'must' pattern itself is modular: なければ, ないと or なきゃ on the left; なりません, いけません or だめ on the right. Most combinations work and mean the same thing — 行かないといけない, 行かなきゃだめ — so don't memorize six patterns, memorize two slots. The double negative is doing the work in all of them ('if you don't go, it won't do'), which is why adding your own extra negative on top is the one honestly wrong move.", "ex": [["明日は来なくてもいいです。", "Don't have to — permission not to."], ["ここに入ってはいけません。", "Must not — prohibition. A different corner entirely."], ["薬を飲まないといけません。", "The same 'must' as なければなりません — two slots, many fillings."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "mashou", "step": "Step 6 · Invitations, desire & intention", "jp": "〜ましょう", "en": "let's", "setting": {"scene": "Six o'clock, the last two people in the staffroom, and both of you have been finding small things to do for twenty minutes. The decision is essentially already made and somebody has to say it out loud. This form does not ask — it moves a group that has already agreed.", "jp": "一緒に帰りましょう。", "en": "Let's go home together.", "pattern": "ましょう"}, "ext": [{"kind": "flip", "scene": "At the station you both look at the same shop at the same moment, which is agreement enough on its own — so the sentence skips the asking entirely and goes straight to the deciding, which is what this form is for.", "jp": "お茶を飲みましょう。", "en": "Let's have some tea.", "t": null}, {"kind": "wrinkle", "scene": "You use it on somebody you have known for four days and it assumes rather more than you have. For a genuine invitation, one that leaves the other person somewhere to stand, there is a softer opener two lessons away.", "jp": "一緒に帰りませんか。", "en": "Won't you go home together? — leaves room to decline.", "t": "ましょう assumes the decision is basically made. For a genuine invitation that leaves room to decline, ませんか — two lessons on — is the polite opener."}], "what": "Let's — proposing joint action as though it is as good as agreed.", "build": "ます-stem + ましょう: 行きましょう, 始めましょう, 食べましょう.", "when": "Moving a group: let's start, let's eat, let's go. Also self-encouragement, said to no one in particular.", "watch": "ましょう assumes the other person is on board. If it is a genuine question, ましょうか (next lesson); if you are inviting rather than deciding, ませんか (softer still). The three form a ladder of presumption — pick by how sure you are they want it.", "ex": [["一緒に帰りましょう。", "Let's go home together."], ["昼ごはんを食べましょう。", "Let's eat lunch."], ["じゃ、そろそろ行きましょう。", "Moving the group — decided together, announced kindly."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "mashouka", "step": "Step 6 · Invitations, desire & intention", "jp": "〜ましょうか", "en": "shall I / shall we?", "setting": {"scene": "The teacher across the desk is carrying a box of textbooks with her chin on top of it and has said nothing, because saying something would be asking. You are not deciding anything jointly here — you are offering, which is the same form with one syllable added and a completely different social job.", "jp": "手伝いましょうか。", "en": "Shall I help you?", "pattern": "ましょうか"}, "ext": [{"kind": "flip", "scene": "Later it is genuinely joint — the two of you are standing in front of a window nobody has opened all afternoon, and the question is what to do rather than whether you will do it for her.", "jp": "窓を開けましょうか。", "en": "Shall we open the window?", "t": null}, {"kind": "extra", "scene": "She answers with two words and you have to know which of them was a yes. One hands you the box; the other means she has it, thank you, and neither contains a no.", "jp": "大丈夫です。", "en": "I'm fine, thanks — a polite decline, not a yes.", "t": "Learn the replies with the offer. お願いします accepts gratefully; 大丈夫です declines politely — the same 大丈夫 from the convenience store lesson, doing the same work. And the か is load-bearing: 手伝いますか asks whether you help in general, which is a different question."}], "what": "Two jobs in one form: shall we? — the genuine-question version of ましょう — and shall I?, the polite offer of help.", "build": "ます-stem + ましょうか: 何を食べましょうか (deciding together), 手伝いましょうか (offering).", "when": "Deciding jointly, and offering: to carry, to open, to help, to pick someone up.", "watch": "As an offer, learn the replies with it: お願いします accepts gratefully; 大丈夫です declines politely — the same 大丈夫 from the konbini lesson. And the か is load-bearing: 手伝いますか asks whether you WILL help; 手伝いましょうか offers to.", "ex": [["手伝いましょうか。", "Shall I help you?"], ["窓を開けましょうか。", "Shall I open the window?"], ["荷物を持ちましょうか。— すみません、お願いします。", "The offer, and its grateful yes."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "masenka", "step": "Step 6 · Invitations, desire & intention", "jp": "〜ませんか", "en": "won't you ...? (invitation)", "setting": {"scene": "A month in. The teacher at the next desk has stayed late twice this week and you would like to suggest lunch, without putting her in the position of turning you down to your face — which she would find harder than you would. The negative question builds the exit into the grammar.", "jp": "一緒に昼ごはんを食べませんか。", "en": "Won't you have lunch with me?", "pattern": "ませんか"}, "ext": [{"kind": "flip", "scene": "It goes well enough that you try a second one for the weekend, aimed slightly upward — at somebody senior, where the room to decline matters more rather than less.", "jp": "一緒に映画を見ませんか。", "en": "Won't you come and see a film?", "t": null}, {"kind": "wrinkle", "scene": "The answer is not はい or いいえ. Acceptance comes as いいですね or ぜひ; the refusal comes as ちょっと, trailing off into nothing, and the trailing off is the entire message.", "jp": "いいですね。", "en": "That'd be nice — the acceptance, where a bare はい would be odd.", "t": "Negative on purpose: \"won't you\" presses less than \"will you.\" Answers matter too — いいですね！ accepts; ちょっと… declines softly, and the culture stop right after this is about exactly that."}], "what": "The polite invitation: won't you? Softest of the three proposal forms because the negative question builds room-to-decline into the grammar itself.", "build": "ます-stem negative + か: 見ませんか, 行きませんか, 飲みませんか.", "when": "First invitations, and any invitation upward in politeness — colleagues, seniors, people you'd like to know better.", "watch": "Two earlier lessons come due here at once. The answer to listen for is the soft no — 日曜日はちょっと…. And per the yes/no drill: accepting an invitation is ぜひ or いいですね, almost never a bare はい — answer the invitation, not the grammar.", "ex": [["一緒に映画を見ませんか。", "Won't you watch a movie with me?"], ["お茶を飲みませんか。", "Won't you have some tea?"], ["今度一緒に食べませんか。— いいですね！", "Invitation, and the enthusiastic accept."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "tai", "step": "Step 6 · Invitations, desire & intention", "jp": "〜たいです", "en": "want to do", "setting": {"scene": "The end-of-year form asks where you would like to be placed next April, and it is the first document since you arrived that has asked what you want rather than what you are. Your own wishes, stated flat, in a form that belongs to you and only to you.", "jp": "日本へ行きたいです。", "en": "I want to go to Japan.", "pattern": "たいです"}, "ext": [{"kind": "flip", "scene": "Somebody asks over lunch what you want to eat, which is this same form pointed at you between equals — and answering it is the easiest complete sentence you have built all week, because it is about the one mind you have access to.", "jp": "お茶を飲みたいです。", "en": "I want some tea.", "t": null}, {"kind": "wrinkle", "scene": "You use it about your sister, who has been talking about visiting for months, and the sentence claims to know something you cannot know. Japanese marks other people's insides differently, and the machinery for it arrives in Stage 2.", "jp": "妹は行きたがっています。", "en": "My sister wants to go — read from outside, not claimed.", "t": "たい is for your OWN wants. Announcing someone else's inner state — 彼は行きたいです — overreaches what you can know; Japanese marks other minds differently (Stage 2 has the machinery)."}], "what": "Wanting to DO something, spoken from the inside: たい bends the verb into an adjective of desire.", "build": "ます-stem + たい(です), then conjugate like an い-adjective: 行きたくない, 行きたかった. The object often switches to が: 水が飲みたい.", "when": "Your own wishes, plans, and cravings — and asking about them between equals: 何がしたいですか.", "watch": "たい reports your OWN inner state. Asking a superior 何を食べたいですか peers inside them — 何にしますか does the job politely. And third parties are off limits: 妹は行きたいです claims to feel her wanting; Japanese reroutes that through 〜たがっている, which arrives in Stage 2.", "ex": [["日本へ行きたいです。", "I want to go to Japan."], ["水が飲みたいです。", "I want to drink water."], ["日本で何がしたいですか。— 京都に行きたいです。", "The want-question between equals, and its answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "行きたがっている is Stage 2 grammar, shown here only as the correct alternative."], "claims": [], "sources": []}, {"id": "hoshii", "step": "Step 6 · Invitations, desire & intention", "jp": "〜がほしいです", "en": "want (a thing)", "setting": {"scene": "The apartment came with a fridge, a light and nothing else, and four weeks in you have a list on the back of an envelope. Somebody at work asks what you still need, and the answer is about things rather than actions — which Japanese splits into two different words where English uses one.", "jp": "新しいかばんがほしいです。", "en": "I want a new bag.", "pattern": "がほしいです"}, "ext": [{"kind": "flip", "scene": "Your birthday is in three weeks and the interrogation has started early. Same word, same particle — and the particle is the thing to watch, because the thing you want is not something you are doing anything to.", "jp": "車がほしいです。", "en": "I want a car.", "t": null}, {"kind": "wrinkle", "scene": "Half your list is not things at all but things you want to do, and those need the other form entirely. A new bag wants one word; buying the bag wants the other.", "jp": "かばんを買いたいです。", "en": "I want to buy a bag — actions take たい.", "t": "ほしい wants THINGS; たい wants ACTIONS. A new bag → ほしい; to buy the bag → 買いたい. English \"want\" covers both, which is why the split needs deliberate reps."}], "what": "Wanting a THING. The wanted thing takes が, and the word behaves like an い-adjective.", "build": "[thing] が ほしいです; ほしくない, ほしかった.", "when": "Shopping, wishlists, and the birthday interrogation: 何がほしいですか.", "watch": "The same inner-state restriction as たい: your own wanting only; other people's runs through ほしがっている (Stage 2). And when OFFERING something to a superior, ほしいですか pries — いかがですか is the graceful version; recognize it now.", "ex": [["新しいかばんがほしいです。", "I want a new bag."], ["時間がほしいです。", "I want time."], ["誕生日に何がほしいですか。— 新しいかばんがほしいです。", "The wish question — が on the wanted thing, both directions."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "tsumori", "step": "Step 6 · Invitations, desire & intention", "jp": "〜つもりです", "en": "intend to", "setting": {"scene": "Leave has to go in by the end of the month and the section head is asking everyone in turn what they are doing in August. Two of your colleagues answer with something vague. Yours is not vague — the flights are booked — and there is a form for a plan you have actually committed to.", "jp": "夏に国へ帰るつもりです。", "en": "I intend to go home in the summer.", "pattern": "つもりです"}, "ext": [{"kind": "flip", "scene": "She asks what you will do about the apartment while you are away, and the answer is another real decision rather than a hope — the same shape, on a verb of your own.", "jp": "友達に会うつもりです。", "en": "I intend to see a friend.", "t": null}, {"kind": "wrinkle", "scene": "You build it off the polite form out of habit and it will not take it. This pattern grabs the plain verb, and all the politeness waits at the very end, on the last word — the same division of labour as describing a noun with a clause.", "jp": "帰るつもりです。", "en": "Never 帰りますつもり — plain form, politeness at the end.", "t": "つもり follows the PLAIN form: 帰るつもり, never 帰りますつもり. The politeness waits at the very end, on です — the same division of labor as noun modification."}], "what": "Stated intention: a plan you have actually settled on, not a mood.", "build": "Dictionary form + つもりです. Negative plans put the ない first: 行かないつもりです — intending NOT to.", "when": "Answering what-are-you-doing questions with commitment: 夏休みは何をするつもりですか.", "watch": "つもり claims real intention — for a soft maybe, Japanese reaches for 〜たいと思います, which completes in Step 12 when と思います arrives. And the past, 〜るつもりでした, means intended-but-didn't: quiet regret built into tense.", "ex": [["夏に国へ帰るつもりです。", "I intend to return to my country in summer."], ["車を買うつもりです。", "I plan to buy a car."], ["夏休みは何をするつもりですか。— 国へ帰るつもりです。", "Plan question, committed answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "niiku", "step": "Step 6 · Invitations, desire & intention", "jp": "〜に行きます", "en": "go (somewhere) to do", "setting": {"scene": "Saturday, and the list is four errands long: the bank, the ward office, the shop by the station, and the friend who has been holding a parcel for you since Tuesday. Every one of them is a place plus a reason for going there, and Japanese has one pattern that carries both at once.", "jp": "デパートへ買い物に行きます。", "en": "I'm going to the department store to shop.", "pattern": "に行きます"}, "ext": [{"kind": "flip", "scene": "You tell the neighbour where you are off to, and the purpose slot takes a verb this time rather than a noun — but not a whole verb, only the front half of one.", "jp": "友達に会いに行きます。", "en": "I'm going to meet a friend.", "t": null}, {"kind": "wrinkle", "scene": "You try to put the whole verb in the purpose slot and the sentence refuses. It takes a noun or a stem — never a complete clause, which is the shape English keeps trying to hand it.", "jp": "会いに行きます。", "en": "Not 会うに行く, not 会ってに — the stem, 会い.", "t": "The purpose slot takes a noun (買い物) or a verb STEM (会い) — never a whole clause. \"To meet\" is 会いに, not 会うに and not 会ってに."}], "what": "Movement with a mission: a purpose + に + a motion verb says you're going somewhere in order to do something.", "build": "Take the ます form and drop ます to get the stem — 会います → 会い — then stem + に + 行く／来る／帰る. Action nouns slot in directly: 買い物に行きます.", "when": "Any errand — shopping, meeting someone, swimming. One of the most-used everyday patterns there is.", "watch": "The purpose slot holds a stem or a noun, never a whole clause: 会いに行く, not 会うに行く. And the destination keeps its own particle separately — デパートへ買い物に行きます carries both.", "ex": [["デパートへ買い物に行きます。", "I go to the department store to shop."], ["友達に会いに行きました。", "I went to meet a friend."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "デパート and 買い物 sit outside the Step 6 bank; both are in the module's own example."], "claims": [], "sources": []}, {"id": "tekara", "step": "Step 7 · Linking actions & time", "jp": "〜てから", "en": "after doing", "setting": {"scene": "School lunch is eaten in the classroom with the children, and there is an order to it that nobody writes down: hands, then seats, then the greeting, then anybody touches anything. On your first day you sat down at the wrong point in that sequence and thirty-four children noticed before the teacher did.", "jp": "手を洗ってから食べます。", "en": "We eat after washing our hands.", "pattern": "てから"}, "ext": [{"kind": "flip", "scene": "By the second week you are the one saying it, to a child who has arrived at the table with the sequence in the wrong order. Same shape, your mouth, and the sentence is doing a job rather than describing one.", "jp": "手を洗ってから座ってください。", "en": "Please sit down after washing your hands.", "t": null}, {"kind": "wrinkle", "scene": "The same two kana turn up four lessons later meaning because, and nothing about the characters tells you which is which. The joint does: this one glues to a connector form, the other to a whole finished clause.", "jp": "暑いから、窓を開けました。", "en": "Because it was hot, I opened the window — から on a clause.", "t": "This から glues to a て-form. The reason-から (Step 11) glues to a whole finished clause — same kana, different joint, and the joint tells you which one you're hearing."}], "what": "After doing X, Y — two actions chained in strict order on the て-form.", "build": "て-form + から, then the next clause: 手を洗ってから、食べます.", "when": "Routines, instructions, itineraries — anywhere order matters.", "watch": "This から is pure sequence — the reason-から (Step 11) attaches to whole clauses, this one to て-forms; position tells them apart. Tense lives only at the
