"\"stayed home\" — the result"]], "segNote": "The piling-on joint: cheap — and on top of that, good.", "hl": "それに", "id": "sorede", "step": "Step 21 · Reasons, concessions & flow", "jp": "それで・それに・だから", "en": "the paragraph joints, upgraded", "setting": {"scene": "Telling a story of any length in Japanese means joining sentences rather than clauses, and the words that do that are not the ones you have been using inside sentences. Half of storytelling is the noises the listener makes, and one of these words is theirs rather than yours.", "jp": "雨が降りました。それで、家にいました。", "en": "It rained. So I stayed in.", "pattern": "それで"}, "ext": [{"kind": "flip", "scene": "You add the one that piles on rather than concludes, which is what you want when the second sentence is more of the same rather than a consequence of the first.", "jp": "安いです。それに、おいしいです。", "en": "It's cheap. And what's more, it's good.", "t": null}, {"kind": "wrinkle", "scene": "Two social traps in one lesson. Opening a reply with the because-word can land as like-I-said; and the bare so-then with the pitch rising is the listener's nudge for you to keep going.", "jp": "それで？", "en": "…and then? — the listener's nudge, not yours.", "t": "だから opening a reply can sound like \"like I SAID.\" And bare それで？ with rising pitch is the listener's nudge — \"…and then?\" Half of storytelling is the audience saying it."}], "what": "Step 11 gave you でも and それから; here are the working joints of real paragraphs: それで (and so — consequence), それに (and on top of that — addition), だから (that's why — the blunt conclusion).", "build": "All three open a new sentence, exactly like でも. それで links a result; それに piles on a point; だから draws the line under the reasons.", "when": "Anything longer than two sentences — which is to say, everything from here on.", "watch": "だから opening a REPLY can land as impatience — \"like I SAID.\" And bare それで？ with rising pitch is the listener's nudge: \"…and then?\" — half of storytelling is the audience saying it.", "ex": [["雨が降りました。それで、家にいました。", "It rained. So I stayed in."], ["この店は安いです。それに、おいしいです。", "Cheap — and on top of that, good."], ["明日は会議です。だから、早く寝ます。", "Meeting tomorrow. That's why I'm turning in early."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-noni", "step": "Step 21 · Reasons, concessions & flow", "jp": "のに vs ても vs が", "en": "three concessions, three temperatures", "setting": {"scene": "Three ways to say but, and they are not interchangeable — they are three temperatures. One notes the contrast and moves on. One grants the objection and continues anyway. One aches. Picking the hot one for a trivial contrast is the error, and it reads as sulking.", "jp": "高いですが、買います。", "en": "Pricey, but I'm buying it — cool.", "pattern": "ですが"}, "ext": [{"kind": "flip", "scene": "You build the middle temperature about the same purchase, conceding the price rather than merely noting it in passing, which is a different claim about how much the objection actually weighed.", "jp": "高くても、買います。", "en": "Even if it's pricey, I'm buying it.", "t": null}, {"kind": "extra", "scene": "You use the hot one about a shop being shut on a Tuesday, which is not a betrayal of anything, and it comes out sounding like a complaint about the universe.", "jp": "高いのに、買いました。", "en": "Save this heat for something that deserves it.", "t": "のに is the strong stuff. Spent on trivia it reads as sulking; saved for a real betrayal of expectation it lands perfectly. When unsure, けど is never wrong — it is the neutral setting and nobody has ever been offended by it."}], "what": "Same facts, different hearts: が/けど states the contrast (cool), ても overrides it (determined), のに aches over it (felt). Choosing is emotional work, not grammar work.", "build": "Neutral report → が/けど. Condition conceded, action anyway → ても. Expectation betrayed, feeling on the table → のに.", "when": "Every contrast you write from now on — the temperature is always a choice.", "watch": "のに is the strong stuff: spent on trivia it reads as sulking, saved for real betrayals it lands perfectly. When unsure, けど is never wrong — just cooler.", "ex": [["高いですが、買います。", "Cool: noted, buying anyway."], ["高くても、買います。", "Determined: price be damned."], ["高かったのに、壊れました。", "Felt: after what I paid — it broke."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["行く", "\"go\" — plain, as the box demands"], ["かどうか", "THE POINT — かどうか: the yes/no question, sealed and embedded", 1], ["、", "a breath"], ["まだ", "\"yet\" — Step 4's door-holder"], ["決めていません。", "\"haven't decided\" — the outer verb the box hands itself to"]], "segNote": "", "hl": "かどうか", "id": "kadouka", "step": "Step 22 · Wrapping thoughts", "jp": "〜かどうか", "en": "whether or not — a question, boxed", "setting": {"scene": "The section head asks whether you are coming back next year and the honest answer is that you have not decided. Saying that in Japanese needs the undecided thing packed into a box and dropped into a sentence about deciding — a whole question, boxed, sitting where a noun would sit.", "jp": "行くかどうか、まだ決めていません。", "en": "Whether I'll go — still undecided.", "pattern": "かどうか"}, "ext": [{"kind": "flip", "scene": "You ask her something in the same shape about a meeting nobody has confirmed yet, and the box behaves like any other noun in the sentence once it has been closed up.", "jp": "会議があるかどうか、わかりません。", "en": "I don't know whether there's a meeting.", "t": null}, {"kind": "wrinkle", "scene": "The politeness comes off inside the box. Boxes take plain contents only, and leaving the polite ending in is the error that marks a sentence as assembled rather than as spoken.", "jp": "学生かどうか", "en": "Never 学生ですかどうか — plain inside the box.", "t": "です drops inside the box: 学生かどうか, never 学生ですかどうか. Boxes take plain contents."}], "what": "A yes/no question sealed in a box and set inside another sentence: 行くかどうか、まだ決めていません — whether I'll go, still undecided.", "build": "Plain clause + かどうか + the outer verb: わかりません, 決めていません, 聞いてみます. The box carries its own か — the sentence end needs nothing extra.", "when": "Undecided plans, unchecked facts, things you mean to ask someone.", "watch": "です drops inside the box: 学生かどうか, never 学生ですかどうか. The box takes plain contents only.", "ex": [["行くかどうか、まだ決めていません。", "Whether I'll go — still undecided."], ["おいしいかどうか、食べてみましょう。", "Whether it's good — let's try it and see. (Step 13's てみる, on the case.)"], ["田中さんが来るかどうか、わかりません。", "Whether Tanaka's coming, I can't say."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["誰", "\"who\" — the question word, staying in its slot"], ["が", "question words keep their が (Step 1's rule survives embedding)"], ["来る", "\"comes\" — plain form"], ["か", "THE POINT — か seals the open question into a box", 1], ["、", "a breath"], ["わかりません。", "\"I don't know\" — the outer verb"]], "segNote": "", "hl": "か", "id": "ka-embed", "step": "Step 22 · Wrapping thoughts", "jp": "疑問詞＋か", "en": "the open question, boxed", "setting": {"scene": "Same machinery as the last lesson, open question this time. Not whether somebody is coming but who — and the who has to go inside the box along with the rest of the question, after which the whole box sits inside a sentence about not knowing.", "jp": "誰が来るか、わかりません。", "en": "Who's coming — no idea.", "pattern": "来るか"}, "ext": [{"kind": "flip", "scene": "You build one about a word rather than a person, which is the shape half your questions will take for the next year — asking about the content of something you cannot yet read.", "jp": "どういう意味か、わかりません。", "en": "I don't know what it means.", "t": null}, {"kind": "wrinkle", "scene": "Collision with Step 11: the same two kana standing alone mean somebody. The verb inside the box is the tell — a boxed question has one, and an indefinite has nothing at all.", "jp": "誰か / 誰が来るか", "en": "Somebody / who's coming — the verb tells you which.", "t": "Collision alert: 誰か alone = SOMEBODY (Step 11); 誰が来るか = a boxed question. The verb inside the box is the tell."}], "what": "Open questions box up too: 誰が来るか、わかりません — who's coming, I don't know. The question word stays in its slot; か seals the box.", "build": "Question-word clause + か + the outer verb: 何を食べるか、決めましょう. どこで買ったか、忘れました.", "when": "I-don't-know, let's-decide, I-forget — daily sentences all.", "watch": "Collision alert: 誰か standing alone is SOMEBODY (Step 11); 誰が来るか is a boxed question. The verb inside the box is the tell — Step 11's 誰か has none.", "ex": [["誰が来るか、わかりません。", "Who's coming — no idea."], ["何を食べるか、決めましょう。", "Let's decide what to eat."], ["どこで買ったか、忘れました。", "Where I bought it — forgotten."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["弟", "my brother"], ["が", "clause-internal subject — が, as Step 11 taught"], ["歌う", "\"sing\" — plain form"], ["のを", "THE POINT — の nominalizes the live, witnessed act; を hands it to the verb", 1], ["聞きました。", "\"heard\" — a sensing verb; の's home ground"]], "segNote": "The fixed house: ability always takes こと — no taste involved.", "hl": "ことができます", "id": "koto-no", "step": "Step 22 · Wrapping thoughts", "jp": "こと vs の", "en": "the two nominalizers, side by side", "setting": {"scene": "Two sentences about your younger brother five minutes apart. In the first you are reporting something you heard through the wall at eleven last night. In the second you are telling somebody what he is like — a standing fact, true whether or not anybody is listening.", "jp": "弟が歌うのを聞きました。", "en": "I heard my brother singing — live, sensed.", "pattern": "のを"}, "ext": [{"kind": "flip", "scene": "The second sentence steps back out of the moment and into a standing fact about him, and the nominaliser cools accordingly — same brother, same verb, an entirely different distance.", "jp": "弟は歌うことが好きです。", "en": "He likes singing.", "t": null}, {"kind": "wrinkle", "scene": "Where both fit, one runs warm and spoken and the other cool and written. Where the houses are fixed there is no choice at all, and there are only two of those.", "jp": "読むのが好き / 読むことが好き", "en": "Warm and spoken / cool and written.", "t": "Where both fit (読むのが好き／読むことが好き), の runs warm and spoken, こと cool and written. Where the houses are fixed, there is no choice at all."}], "what": "Both turn actions into things — Step 10's の and this stage's こと finally meet. The split: の stays close to the senses and the live moment; こと steps back into fact and habit.", "build": "の for what's witnessed as it happens: 弟が歌うのを聞きました. こと for the abstract: ability (話すことができる), experience (行ったことがある), decisions (行くことにした). Many spots accept both: 読むのが好き／読むことが好き.", "when": "Every nominalization from here on — which is to say, constantly.", "watch": "Two fixed houses never move: 〜ことができる and 〜たことがある take こと, always. The sensing verbs (見る, 聞く) all but demand の. Where both fit, の runs warmer and more spoken, こと cooler and more written.", "ex": [["弟が歌うのを聞きました。", "I heard my brother singing — live, sensed → の."], ["日本語を話すことができます。", "Ability, abstract → こと (fixed house)."], ["本を読むのが好きです。", "Both would work here — の keeps it warm."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["すみません", "the opener that buys goodwill"], ["、", "a breath"], ["どういう", "\"what kind of\" — こそあど's ど-row, grown up"], ["意味", "meaning"], ["ですか。", "THE POINT — どういう意味ですか: the learner's power question", 1]], "segNote": "The answer's shape: [expression]は[explanation]という意味です — Step 11's naming という, aimed at meanings.", "hl": "という意味", "id": "toiuimi", "step": "Step 22 · Wrapping thoughts", "jp": "〜という意味", "en": "asking what things mean", "setting": {"scene": "A word on a notice on the staffroom door that you can read aloud and cannot understand, which is a different problem from the one you have been solving all year. Up to now you have been asking what things are called. This asks what something means, and they are not the same question.", "jp": "すみません、どういう意味ですか。", "en": "Sorry — what does that mean?", "pattern": "どういう意味"}, "ext": [{"kind": "flip", "scene": "You use it about a word somebody says rather than one you read, and it is the single most useful sentence in this step — the one that keeps a conversation going instead of ending it.", "jp": "その言葉はどういう意味ですか。", "en": "What does that word mean?", "t": null}, {"kind": "wrinkle", "scene": "Keep the two learner-questions apart. One asks for the word and grows your vocabulary forwards; the other asks for the sense and grows it backwards from something you already met.", "jp": "何といいますか / どういう意味ですか", "en": "What's it called / what does it mean.", "t": "Keep the two learner-questions straight: 何といいますか asks for the WORD; どういう意味ですか asks for the SENSE. One grows vocabulary forward, the other backward."}], "what": "The learner's power tool: どういう意味ですか — what does that mean? — and the answer's shape, 〜という意味です. This is how confusion becomes vocabulary, in real time.", "build": "Asking: [expression]はどういう意味ですか. Answering: [expression]は[explanation]という意味です — Step 11's naming という, now working on meanings.", "when": "Every conversation in which you are a learner — which is all of them, for a happy long while.", "watch": "Two different questions, keep them straight: 何といいますか asks for the WORD (\"what's this called?\"); どういう意味ですか asks for the SENSE (\"what does it mean?\"). One fills your vocabulary forward, the other backward.", "ex": [["すみません、どういう意味ですか。", "Sorry — what does that mean?"], ["「直す」は「もう一度よくする」という意味です。", "\\\"Naosu\\\" means \\\"to make good again.\\\" (Yes, the app is named after it.)"], ["この漢字はどういう意味ですか。", "What does this kanji mean?"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-kotono", "step": "Step 22 · Wrapping thoughts", "jp": "ことが好き？のが好き？", "en": "the nominalizer choice drill", "setting": {"scene": "Two nominalisers, and most of the time either one will do — which is exactly why the few places that refuse one of them are worth memorising rather than reasoning about. There are two fixed houses in the language and everything outside them is taste.", "jp": "泳ぐことができます。", "en": "I can swim — a fixed house, こと.", "pattern": "ことができます"}, "ext": [{"kind": "flip", "scene": "You build the other fixed house, the experience one from Step 18, and it takes the same nominaliser for the same reason — the construction owns it, and no judgement is involved.", "jp": "行ったことがあります。", "en": "I've been — the other fixed house.", "t": null}, {"kind": "extra", "scene": "You put the warm spoken one into the ability construction, which is the one place in the language it cannot go, and the sentence stops being Japanese at that exact syllable.", "jp": "話すのができます", "en": "Wrong — ことができる owns its noun.", "t": "The error that grates most is の in こと's fixed house — 話すのができます. The fixed houses are few: 〜ことができる and 〜たことがある, always こと. Guard those two and the rest of the choice is taste rather than grammar."}], "what": "Where both fit, taste decides — but two houses are fixed and the senses have a favorite. Sorting fast keeps your sentences from stalling mid-thought.", "build": "Run the checks in order: ことができる/たことがある construction? → こと, no choice. Sensing verb (見る・聞く) on something live? → の. Neither? → both fine; pick の for warmth, こと for print.", "when": "Every time an action needs to become a thing.", "watch": "The error that grates most: 話すのができます — の in こと's fixed house. The fixed houses are few; guard them and the rest is taste.", "ex": [["泳ぐことができます。", "Fixed house — こと."], ["妹が泳ぐのを見ました。", "Watched it live — の."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "泳ぐ is outside the Step 22 bank; from the module's own example."], "claims": [], "sources": []}, {"seg": [["弟", "my brother — a mind that isn't yours"], ["は", "topic marker"], ["公園", "the park"], ["へ", "destination marker"], ["行きたがっています。", "THE POINT — たい minus い + がる: showing SIGNS of wanting, worn as ている", 1]], "segNote": "The negative observes an absence of signs — no visible wanting anywhere near those vegetables.", "hl": "食べたがりません", "id": "garu", "step": "Step 23 · Other minds", "jp": "〜がる・〜たがる", "en": "showing signs of wanting", "setting": {"scene": "A boy in your class has been at the window for ten minutes while the rest are outside. He has not said anything and you have not asked. You mention it to the teacher next to you, and what you have is what you can see — not what he told you, and not what you know.", "jp": "弟は公園へ行きたがっています。", "en": "My brother's desperate to go to the park.", "pattern": "たがっています"}, "ext": [{"kind": "flip", "scene": "You say your own version of the same want straight out, because your own head is the one place you are allowed to report from directly — and the contrast between the two sentences is the whole lesson.", "jp": "私は行きたいです。", "en": "I want to go.", "t": null}, {"kind": "wrinkle", "scene": "The particle moves along with the machinery. Your own want leans on one of them; the observed behaviour takes the other, because a state has become something you are watching somebody do.", "jp": "水が飲みたい / 水を飲みたがっている", "en": "State takes が; observed behaviour takes を.", "t": "The particle shifts with the machinery: たい leaned が (水が飲みたい); たがる takes を (水を飲みたがっている). State became behavior; the grammar follows."}], "what": "The machinery tai promised back in Step 6: you cannot FEEL someone else's wanting, so Japanese marks what you can SEE — the signs. 弟は行きたがっています: he's showing every sign of wanting to go.", "build": "Drop the い from たい (or from a feeling-adjective) and add がる: 行きたい → 行きたがる, usually worn as ている: 行きたがっています. The がる verb takes を where たい leaned が.", "when": "Reporting anyone else's wants and feelings — the honest, native way.", "watch": "私は行きたい／弟は行きたがっている — the line English never draws. たい about a third person claims telepathy; がる claims observation, which is all you actually have.", "ex": [["弟は公園へ行きたがっています。", "My brother's dying to go to the park — visibly."], ["子どもは野菜を食べたがりません。", "The kid shows no signs of wanting those vegetables."], ["私は公園へ行きたいです。", "ME, I want to go — first person keeps たい."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["妹", "my sister"], ["は", "topic marker"], ["新しい", "new"], ["かばん", "bag"], ["を", "THE PARTICLE TELL — ほしがる takes を where ほしい leaned が"], ["ほしがっています。", "THE POINT — ほしい minus い + がる: her wanting, as visible behavior", 1]], "segNote": "Habitual observation: kids want everything, observably, daily.", "hl": "ほしがります", "id": "hoshigaru", "step": "Step 23 · Other minds", "jp": "ほしがる", "en": "the noun-want, other-minds edition", "setting": {"scene": "Your sister has walked past the same shop window four times this month and has mentioned the bag in it twice without ever saying she wants it. You are not claiming to know her mind — you are reporting what anybody watching would have noticed, which is a different sentence.", "jp": "妹は新しいかばんをほしがっています。", "en": "My sister's got her eye on a new bag.", "pattern": "ほしがっています"}, "ext": [{"kind": "flip", "scene": "Your own version of the same want takes the plain form and the other particle, and putting the two sentences side by side is the fastest way to feel the line the language is drawing.", "jp": "私はかばんがほしいです。", "en": "I want a bag.", "t": null}, {"kind": "wrinkle", "scene": "The particle swap is not decoration, it is the grammar itself: one marks the target of a state, the other marks the object of behaviour that you are standing there watching.", "jp": "かばんがほしい / かばんをほしがっている", "en": "State keeps が; behaviour takes を.", "t": "The swap in one line: 私はかばんがほしい／妹はかばんをほしがっている. State keeps が; behavior takes を."}], "what": "Step 6's ほしい, run through the same machine: 私はほしい, but 妹はほしがっている — she's showing signs of wanting it.", "build": "ほしい → ほしがる, usually ほしがっています. And the particle swaps: が with ほしい becomes を with ほしがる — 新しいかばんをほしがっています.", "when": "Gifts, kids in shops, anyone whose wanting you can only witness.", "watch": "The particle swap IS the grammar: が marks the state's target, を marks the observed behavior's object. If you catch yourself writing 妹はかばんがほしいです, the telepathy alarm should ring.", "ex": [["妹は新しいかばんをほしがっています。", "My sister's got her eye on a new bag — visibly."], ["子どもは何でもほしがります。", "Kids want everything — as behavior, observable daily."], ["私はかばんがほしいです。", "MY want keeps ほしい and が — first person, direct line."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-minds", "step": "Step 23 · Other minds", "jp": "私は行きたい、彼は行きたがっている", "en": "the my-mind/your-mind line", "setting": {"scene": "One line runs through the whole language and this is where it gets named: inner states are first-person territory. Your own wants go flat. Everyone else's reach you as signs, as appearances, or as words they said — and claiming direct access to another mind is the error this drill hunts.", "jp": "私は行きたいです。", "en": "Mine — stated directly.", "pattern": "行きたい"}, "ext": [{"kind": "flip", "scene": "You report somebody else's want three different ways in one conversation — what you can see, what it looks like, and what they actually told you — and none of the three claims to be inside their head.", "jp": "行きたいと言っています。", "en": "He says he wants to go — reported, not claimed.", "t": null}, {"kind": "extra", "scene": "You ask a colleague what she wants to do at the weekend using the plain form, and it is entirely correct — because asking somebody is not the same as claiming to know.", "jp": "何がしたいですか。", "en": "What do you want to do? — asking is fine.", "t": "Questions are the exception that proves the rule: 行きたいですか asks the person directly, so たい is fine there — you are requesting the first-person report rather than faking it. The restriction is on asserting somebody else's insides, not on discussing them."}], "what": "One line runs through the whole language: inner states are first-person territory. Everyone else's mind reaches you as signs (がる), appearances (そう・よう — Step 15 was building this all along), or words (と言っています). Claiming direct access to another mind is the L1 error this drill hunts.", "build": "Mine → たい・ほしい, stated flat. Theirs, visible → たがる・ほしがる. Theirs, read from looks → 行きたそうです・ほしいようです. Theirs, reported → 行きたいと言っています.", "when": "Every sentence about what anyone else feels or wants — which is half of all gossip and most of all kindness.", "watch": "Questions are the exception that proves the rule: 行きたいですか asks the person directly, so たい is fine — you're requesting the first-person report, not faking it.", "ex": [["私は行きたいです。", "Mine — direct."], ["弟は行きたがっています。", "His — as signs."], ["田中さんは行きたいと言っています。", "Tanaka's — as reported words."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}]};
let li = 0, pi = 0, showMeta = false;
const esc = s => (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(t, p){ t = esc(t); if(!p) return t; const i = t.indexOf(esc(p));
  return i<0 ? t : t.slice(0,i)+'<span class="hl">'+esc(p)+'</span>'+t.slice(i+esc(p).length); }
function jpbox(jp, en, p){ return '<div class="jpbox"><div class="l">'+hl(jp,p)+'</div><div class="g">'+esc(en)+'</div></div>'; }

function pages(L){
  const out = [{k:'setting'},{k:'idea'},{k:'apart'}];
  if(L.ex.length>1) out.push({k:'again'});
  L.ext.forEach((e,i)=>out.push({k:'ext',i}));
  if(L.watch || L.orphanWr.length) out.push({k:'watch'});
  out.push({k:'try'});
  return out;
}
function render(){
  const L = D.lessons[li], P = pages(L); if(pi>=P.length) pi = P.length-1;
  const pg = P[pi]; let h = '';
  h += '<h2>'+esc(L.jp)+'</h2><div class="en">'+esc(L.en)+' &middot; '+esc(L.step)+'</div>';
  if(pg.k==='setting'){
    h += '<div class="kicker">THE SITUATION</div><p class="body">'+esc(L.setting.scene)+'</p>'
       + jpbox(L.setting.jp, L.setting.en, L.setting.pattern);
  } else if(pg.k==='idea'){
    h += '<div class="kicker">THE IDEA</div><p class="body">'+esc(L.what)+'</p>';
    if(L.when) h += '<div class="kicker">WHEN YOU\'D USE IT</div><p class="body">'+esc(L.when)+'</p>';
  } else if(pg.k==='apart'){
    h += '<div class="kicker">ONE SENTENCE, TAKEN APART</div>';
    if(L.ex[0]){ h += '<div class="jpbox" style="border:0;padding-left:0"><div class="l" style="font-size:23px">'
      + esc(L.ex[0][0]) + '</div><div class="g">' + esc(L.ex[0][1]) + '</div></div>'; }
    if(L.seg.length){
      h += L.seg.map(function(t){ var tgt = t[2];
        return '<div class="seg'+(tgt?' target':'')+'"><span class="segjp'+(tgt?' tj':'')+'">'+esc(t[0])+'</span>'
             + '<span style="font-size:13px;color:var(--sub);line-height:1.6">'
             + (tgt?'<span class="tag">THE POINT · </span>':'')+esc(t[1])+'</span></div>'; }).join('');
      if(L.segNote) h += '<p class="body" style="font-size:13px;color:var(--sub);margin-top:12px">'+esc(L.segNote)+'</p>';
    } else {
      h += '<p class="body" style="color:var(--sub);font-size:13px">This point has no <code>DEEP.seg</code> in the module, so there is nothing to take apart — the live app skips straight past this page.</p>';
    }
  } else if(pg.k==='again'){
    h += '<div class="kicker">HOW IT\'S BUILT — AND SIGHTED AGAIN</div>';
    if(L.build) h += '<p class="body">'+esc(L.build)+'</p>';
    L.ex.slice(1).forEach(e => h += jpbox(e[0], e[1], null));
  } else if(pg.k==='ext'){
    const e = L.ext[pg.i];
    const label = e.kind==='flip' ? 'NOW YOU SAY IT' : 'A WRINKLE';
    h += '<div class="kicker'+(e.kind==='flip'?'':' red')+'">'+label+'</div>';
    h += '<p class="body">'+esc(e.scene)+'</p>';
    if(e.t) h += '<div class="wrbox">'+esc(e.t)+'</div>';
    h += jpbox(e.jp, e.en, null);
    h += '<div class="seg"><span class="tag">'+e.kind.toUpperCase()+'</span><span style="font-size:12px;color:var(--sub)">'
       + (e.kind==='flip' ? 'The learner\'s side, different object — this is what replaces the abstract “when”.'
          : e.kind==='wrinkle' ? 'Text above comes from the module\'s own DEEP wrinkle, not from the arcs file.'
          : 'A wrinkle the module did not have; the arc supplies its text.')+'</span></div>';
  } else if(pg.k==='watch'){
    h += '<div class="kicker red">WATCH OUT</div><p class="body">'+esc(L.watch)+'</p>';
    L.orphanWr.forEach(t => h += '<div class="wrbox">'+esc(t)+'</div>');
  } else {
    h += '<div class="kicker">NOW IT\'S YOURS</div><p class="body">You\'ve seen it, seen it taken apart, and seen its edges. In the app this hands off to the drill and free writing.</p>';
  }
  h += '<nav><button class="nav" '+(pi?'':'disabled')+' onclick="go(-1)">← Back</button><div class="dots">'
     + P.map((p,i)=>'<button class="dot'+(i===pi?' on':'')+'" onclick="jump('+i+')" title="'+p.k+'"></button>').join('')
     + '</div><button class="nav primary" '+(pi<P.length-1?'':'disabled')+' onclick="go(1)">Next →</button></nav>';
  document.getElementById('card').innerHTML = h;
  document.getElementById('meta').innerHTML = showMeta
    ? ('<b>'+esc(L.id)+'</b> — '+P.length+' pages · '+L.ext.length+' extension(s)'
       + (L.flags.length ? '<br><b>flags:</b> '+L.flags.map(esc).join(' · ') : '')
       + (L.claims.length ? '<br><b>claims:</b> '+L.claims.map(esc).join(' · ') : '')
       + (L.sources.length ? '<br><b>sources:</b> '+L.sources.length : ''))
    : '';
  document.querySelectorAll('.pt').forEach((b,i)=>b.classList.toggle('on', i===li));
}
function go(d){ const P=pages(D.lessons[li]); pi=Math.max(0,Math.min(P.length-1,pi+d)); render(); }
function jump(i){ pi=i; render(); }
function pick(i){ li=i; pi=0; render(); document.getElementById('main').scrollTop=0; }
addEventListener('keydown', e => { if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1);
  if(e.key==='r'||e.key==='R'){ showMeta=!showMeta; document.getElementById('rv').textContent = showMeta?'hide reviewer notes':'reviewer notes'; render(); } });
function toggleMeta(){ showMeta=!showMeta; document.getElementById('rv').textContent = showMeta?'hide reviewer notes':'reviewer notes'; render(); }
(function(){ let h='', cur=null;
  D.lessons.forEach((L,i)=>{ if(L.step!==cur){ cur=L.step; h+='<div class="stepname">'+esc(cur)+'</div>'; }
    h += '<button class="pt" onclick="pick('+i+')">'+esc(L.jp)+'<small>'+esc(L.en)+'</small></button>'; });
  document.getElementById('list').innerHTML=h; })();
render();
</script></body></html>
