s の's fourth job — the one Step 3's drill promised was coming. Don't drop it: 読むが好き is broken; the verb can't take が until の makes it a noun. こと also works (読むことが好きです) — slightly stiffer, at home in writing; both are correct.", "ex": [["本を読むのが好きです。", "I like reading books."], ["料理を作るのが好きです。", "I like cooking."], ["何をするのが好きですか。— 音楽を聞くのが好きです。", "The hobby question — の quietly making nouns of verbs, twice."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["日本語", "Japanese"], ["が", "the able-to thing takes が"], ["少し", "\"a little\""], ["話せます。", "THE POINT — the potential form: can-do built into the verb; 話す → 話せる", 1]], "segNote": "Can-the-card-be-used — ability of things, not just people.", "hl": "使えます", "id": "potential", "step": "Step 10 · Comparing & preferring", "jp": "可能形 (〜られる / 〜える)", "en": "saying you can do something", "setting": {"scene": "The phone shop again, a year on, and the question is whether the card in your hand will work in their machine. It is a question about capability rather than about anybody's intention, and Japanese builds that into the verb itself rather than adding a word in front of it.", "jp": "日本語が少し話せます。", "en": "I can speak a little Japanese.", "pattern": "話せます"}, "ext": [{"kind": "flip", "scene": "You ask about the card, which is a capability belonging to an object rather than a person — the same form, and the grammar does not care that nobody involved has a will.", "jp": "この店でカードが使えますか。", "en": "Can I use a card in this shop?", "t": null}, {"kind": "wrinkle", "scene": "How the verb bends depends on which family it is in, and the thing you are able to do switches its particle at the same time — from the object marker to the one this whole step has been drumming.", "jp": "朝早く起きられません。", "en": "I can't get up early — 起きる → 起きられる, negated.", "t": "う-verbs shift to the え row (話す→話せる, 使う→使える); る-verbs take られる (起きる→起きられる); する→できる, 来る→来られる. And the able-to thing takes が."}], "what": "English adds a separate word, can. Japanese bends the verb itself. There is no equivalent of can sitting in front — the ability is baked into the ending.", "build": "Ichi verbs drop る and add られる: 食べる → 食べられる, 見る → 見られる. Go verbs shift their final sound to the e-row and add る: 話す → 話せる, 読む → 読める, 行く → 行ける, 買う → 買える. Two irregulars, both common: する → できる, 来る → 来られる.", "when": "Ability, but just as often permission or possibility — この店でカードが使えますか asks whether cards are accepted, not whether you personally are capable.", "watch": "The object usually switches from を to が: 日本語が話せます, not 日本語を話せます. This is the が-trap the next lesson drills. Also worth knowing early — for Ichi verbs the potential form is identical to the passive, so 食べられる means both can eat and is eaten. Context sorts it out, which is exactly why casual speech shortens the potential to 食べれる.", "ex": [["日本語が少し話せます。", "I can speak a little Japanese."], ["この店でカードが使えますか。", "Can I use a card at this shop?"], ["朝早く起きられません。", "I can't get up early."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "早く sits outside the Step 10 bank; from the module's own wrinkle."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-transitive2", "step": "Step 10 · Comparing & preferring", "jp": "自動詞・他動詞 · second look", "en": "two different がs are about to collide", "setting": {"scene": "Two unrelated particles are about to collide in the same paragraph. One is the が you learned in Step 4, belonging to the twin of a verb that happens by itself. The other is the が this whole step has been handing out to 好き, わかる and the potential form. Same kana, entirely different reasons.", "jp": "ドアが開きました。", "en": "The door opened by itself.", "pattern": "が開きました"}, "ext": [{"kind": "flip", "scene": "One sentence later you use the other kind about something you like, and nothing on the page distinguishes them — which is fine as long as you know which of the two you are writing at the time.", "jp": "音楽が好きです。", "en": "I like music — the state-family's が.", "t": null}, {"kind": "extra", "scene": "You write a paragraph with four of them in it and two are one kind and two the other. Reading it back, the only way to check is to ask of each one what job it thought it was doing.", "jp": "窓が閉まりました。日本語がわかります。", "en": "The window closed. I understand Japanese. Two がs, two reasons.", "t": "The Step 4 self-check still holds and matters more here: を in front of an it-just-happens verb is always an error. What is new is that this step's compositions are full of both がs at once, so naming which one you are using keeps both honest."}], "what": "Step 4 taught the verb pairs and their particles: を for the twin you do, が for the twin that happens. The reason it resurfaces here, of all places: this step hands out が for a completely different reason, and the two がs need to stay apart in your head.", "build": "ドアが開きました — が because 開く is the twin that happens by itself. 音楽が好きです — が because 好き belongs to the small set that demands it. Same particle, two unrelated reasons. In both cases the particle follows the verb's nature; what differs is which nature.", "when": "Any time you catch yourself about to write が and can't say which rule put it there. Say the reason out loud: 'happens by itself', or 'one of the が words'. If neither fits, the particle is probably wrong.", "watch": "The self-check from Step 4 still holds — を in front of an intransitive verb is always an error — and it matters more now, because this step's compositions are full of both がs at once. 窓が開いています and 犬が好きです earn their がs entirely differently.", "ex": [["ドアが開きました。", "It happened by itself → the intransitive twin's が."], ["音楽が好きです。", "A が word → the other が. Same particle, different law."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-ganotwo", "step": "Step 10 · Comparing & preferring", "jp": "を じゃなくて が", "en": "the が-not-を reflex", "setting": {"scene": "This step's real subject is not comparison at all. It is が turning up in exactly the places English swears there should be an object, and the composition ahead is a minefield of them on purpose — every 好き, 上手, 下手 and わかる in anything you write deserves a second look before you hand it in.", "jp": "日本語がわかります。", "en": "I understand Japanese.", "pattern": "がわかります"}, "ext": [{"kind": "flip", "scene": "You check your own newsletter paragraph and find three places where you reached for the object marker out of habit. All three are about states rather than actions, and all three want the other particle.", "jp": "新しいくつがほしいです。", "en": "I want new shoes — ほしい takes が too.", "t": null}, {"kind": "extra", "scene": "The last sentence of the paragraph is about something you are good at, and the particle is right while the word is not — modest about the grammar, immodest about the claim.", "jp": "料理が得意です。", "en": "Cooking is my strong suit — not 私は料理が上手です.", "t": "One more trap in the same family: 上手 is not used about yourself. 得意 states a strength plainly and modestly; 上手 aimed inward reads as self-praise, whatever the particle is doing."}], "what": "", "build": "", "when": "", "watch": "", "ex": [], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "くつ and 料理 sit outside the Step 10 bank; くつ is from the module's own example."], "claims": [], "sources": []}, {"seg": [["暑い", "\"it's hot\" — the reason clause"], ["から、", "THE POINT — \"because / so\": closes the reason, which comes FIRST", 1], ["窓", "the window"], ["を", "object marker"], ["開けました。", "\"opened\" — the result"]], "segNote": "", "hl": "から", "id": "kara-because", "step": "Step 11 · Reasons, contrast & connectors", "jp": "〜から (because)", "en": "because / so", "setting": {"scene": "The staffroom in August with the windows shut because of the insects and the air conditioning fighting a losing battle. Somebody has to say why they are opening one, and in Japanese the reason goes first and the consequence second — which is the mirror of the English sentence you are translating in your head.", "jp": "暑いから、窓を開けました。", "en": "Because it was hot, I opened the window.", "pattern": "から"}, "ext": [{"kind": "flip", "scene": "Ten minutes later you leave early for the clinic, and saying why is the same shape with your own reason in front — the order stops feeling backwards somewhere around the fourth time you build it.", "jp": "頭が痛いから、帰ります。", "en": "I've got a headache, so I'm going home.", "t": null}, {"kind": "wrinkle", "scene": "Asked directly why, the reason can stand entirely on its own with nothing after it — and note the joint: this one takes a whole finished clause, where the から from Step 7 took a connector form.", "jp": "忙しいからです。", "en": "Because I'm busy — the reason alone, closed with です.", "t": "Answering どうして, the reason stands alone with からです: 働きたいからです. And reason-から takes a whole clause — the after-から (Step 7) takes a て-form. The joint tells them apart."}], "what": "Reason first, から, then the result — Japanese states the cause before the effect.", "build": "[reason clause] から、[result]. Standalone answer: 〜からです.", "when": "Explaining yourself, and answering どうして — where 〜からです is the complete polite answer.", "watch": "The order is the mirror of English 'because', which trails its reason — flip your instinct. After a NOUN, から means from (Step 3); after a clause, because — position decides. And a から on every sentence reads as defending yourself; ので, next lesson, is the pressure valve.", "ex": [["暑いから、窓を開けました。", "Because it's hot, I opened the window."], ["時間がないから、急ぎましょう。", "We have no time, so let's hurry."], ["どうして日本語を勉強していますか。— 日本で働きたいからです。", "The why-question and its complete からです answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["頭", "head"], ["が", "subject marker"], ["痛いので、", "THE POINT — ので: the gentler because — reason laid down as circumstance", 1], ["帰ります。", "\"I'm going home\""]], "segNote": "Nouns and な-adjectives bring な before ので: 雨なので. The bare noun + ので is the classic slip.", "hl": "なので", "id": "node", "step": "Step 11 · Reasons, contrast & connectors", "jp": "〜ので", "en": "because (softer)", "setting": {"scene": "Leaving before the section head does, for the second time this week, with a genuine reason and no wish to sound like you are asserting it. There are two words for because and they differ in force: one states a reason, the other presents it as circumstance, and workplace exits reach for the second.", "jp": "頭が痛いので、帰ります。", "en": "I'm going home because I have a headache.", "pattern": "ので"}, "ext": [{"kind": "flip", "scene": "An email to somebody senior about a deadline you will miss, where the softer of the two is doing real work — it hands over a circumstance rather than pushing a justification across the desk.", "jp": "時間がないので、明日します。", "en": "There's no time, so I'll do it tomorrow.", "t": null}, {"kind": "wrinkle", "scene": "A noun in front of it needs a syllable you would not predict — the same one that turns up before ん in the explanatory form from Step 3, doing exactly the same joining job.", "jp": "雨なので、行きません。", "en": "It's raining, so I won't go — 雨なので, never 雨だので.", "t": "から asserts a reason; ので presents it as circumstance — softer, which is why excuses and workplace exits (お先に失礼します) prefer it."}], "what": "The softer because — presenting the reason as circumstance rather than argument.", "build": "Plain clause + ので. Nouns and な-adjectives interpose な: 雨なので, 静かなので.", "when": "Polite explanations, requests, and apologies — where から might sound like pleading a case, ので simply reports how things stand.", "watch": "The な is the trap: 雨だので is wrong, 雨なので is right — the same な that appears before ん in 学生なんです, doing the same job. Writing to anyone senior, reach for ので; it reads as adult.", "ex": [["頭が痛いので、帰ります。", "I'm going home because I have a headache."], ["雨なので、家にいます。", "Since it's raining, I'll stay home."], ["頭が痛いので、お先に失礼します。", "The polite early exit — reason as circumstance, not excuse."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["高いですが、", "THE POINT — clause + が: \"but\" — the polite connector that turns the corner", 1], ["おいしいです。", "\"it's delicious\" — the second, contrasting leg"]], "segNote": "けど is the everyday spoken \"but\" — same joint, more relaxed register.", "hl": "けど", "id": "ga-but", "step": "Step 11 · Reasons, contrast & connectors", "jp": "〜が / けど (but)", "en": "but / although", "setting": {"scene": "A restaurant recommendation you want to give honestly, which means saying two things that pull against each other in one sentence. The connector that joins opposing halves is a kana you already know as a particle, doing an entirely unrelated job in an entirely different position.", "jp": "高いですが、おいしいです。", "en": "It's expensive, but it's good.", "pattern": "が、"}, "ext": [{"kind": "flip", "scene": "You use the casual cousin of it with the teacher you eat lunch with, which is the same joint one register down and by far the more common of the two in speech.", "jp": "忙しいけど、行きます。", "en": "I'm busy, but I'll go.", "t": null}, {"kind": "wrinkle", "scene": "Then it turns up as a cushion in front of a question, meaning almost nothing at all — not contradiction but courtesy, the polite throat-clearing before you ask a stranger for something.", "jp": "すみませんが、駅はどこですか。", "en": "Excuse me, but where's the station? — が as a cushion.", "t": "すみませんが、… is が's second life: a cushion before a request, meaning almost nothing. And this clause-が has no relation to the particle が — position tells you which is which."}], "what": "Joining two clauses that pull against each other: but.", "build": "[clause] が、[clause] — neutral-polite. けど is its casual cousin, けれど and けれども climb back up the formality ladder.", "when": "Contrasts, concessions, and the polite preamble — すみませんが、 before a request isn't contrasting anything; it's cushioning.", "watch": "That preamble-が is worth having on purpose: すみませんが、駅はどこですか reads as courtesy, not contradiction. And the trailing-off usage — ending AT the けど — is its own move, covered next lesson; don't read those sentences as unfinished.", "ex": [["高いですが、おいしいです。", "It's expensive, but delicious."], ["行きたいけど、時間がありません。", "I want to go, but I have no time."], ["すみませんが、駅はどこですか。", "The cushion-が — no contrast, pure courtesy."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["雨でした。", "\"It was raining.\" — a full sentence, full stop"], ["でも、", "THE POINT — sentence-opening \"but\": でも restarts and turns the corner", 1], ["出かけました。", "\"(I) went out anyway.\""]], "segNote": "The same opening slot carries other connectors — それから (\"and then\") strings a day together.", "hl": "それから", "id": "demo", "step": "Step 11 · Reasons, contrast & connectors", "jp": "でも / そして / それから", "en": "but / and / and then", "setting": {"scene": "Writing the first long thing you have written in Japanese — three paragraphs for the school newsletter — and everything you produce comes out as one enormous sentence, because the words you know for but and and then all join clauses. The ones that start new sentences are different words, and mixing them up is the visible learner seam.", "jp": "雨でした。でも、出かけました。", "en": "It was raining. But I went out.", "pattern": "でも"}, "ext": [{"kind": "flip", "scene": "You break the second paragraph in half and open the new sentence with it, which is the only position it can take — and the paragraph immediately stops sounding like one breath.", "jp": "でも、時間がありませんでした。", "en": "But there wasn't any time.", "t": null}, {"kind": "wrinkle", "scene": "Mid-sentence, the job belongs to the other two words entirely. English uses one word in both positions, so the split has to be watched every single time you join two halves rather than start something new.", "jp": "雨でしたが、出かけました。", "en": "Same meaning, joined rather than started — が, not でも.", "t": "Mid-sentence \"but\" is が/けど; でも only opens a NEW sentence. Same meaning, different positions — English \"but\" covers both, so the split needs watching."}], "what": "The sentence-starters: でも (but), そして (and), それから (and then) — connection across a full stop.", "build": "Start the new sentence with them: 雨でした。でも、出かけました。", "when": "Longer thoughts, stories, and anywhere one sentence isn't enough — which is soon.", "watch": "でも STARTS sentences; が and けど JOIN clauses — でも in the middle of a sentence is the visible learner seam. それから sequences (and then); そして adds without sequencing. Speech also opens with で alone — a clipped それで — recognize it.", "ex": [["雨でした。でも、出かけました。", "It was raining. But I went out."], ["朝ごはんを食べました。それから、学校へ行きました。", "I ate breakfast. Then I went to school."], ["朝ごはんを食べました。それから、学校へ行きました。", "Sequence across the full stop."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["「花」", "\"Hana\" — the name, quoted"], ["という", "THE POINT — [name] という [thing]: \"the … called …\" — introduces names the listener may not know", 1], ["映画", "movie — the category the name belongs to"], ["を", "object marker"], ["見ました。", "\"watched\""]], "segNote": "", "hl": "という", "id": "toiu", "step": "Step 11 · Reasons, contrast & connectors", "jp": "〜という", "en": "called / named", "setting": {"scene": "Somebody recommends a film and you catch the shape of the sentence but not the name inside it, which is the ordinary condition of your life here. The frame that attaches a name to a thing is one pattern — and run backwards it becomes the single most useful question a learner can own.", "jp": "「花」という映画を見ました。", "en": "I watched a film called 'Hana'.", "pattern": "という"}, "ext": [{"kind": "flip", "scene": "You use it about the place near the station whose name you finally learned, which is the first time all month you have introduced something rather than asked about it.", "jp": "「さくら」という店に行きました。", "en": "I went to a shop called Sakura.", "t": null}, {"kind": "wrinkle", "scene": "Then the machine runs the other way. Anything you can point at, you can now get the name of — and the answer comes back inside the same frame you asked in.", "jp": "これは日本語で何といいますか。", "en": "What's this called in Japanese?", "t": "Asking for a word runs the same machine backwards — the survival question for every learner."}], "what": "Introducing a name the listener may not know: called, named.", "build": "[name] という [noun]: 「花」という映画, ポチという犬.", "when": "Titles, names, new words — and the learner's power tool: asking what things are called.", "watch": "The question form is the treasure here: これは日本語で何といいますか asks the name of anything you can point at, and the answer comes back in the same frame — 「はさみ」といいます. One pattern, infinite vocabulary lessons, free.", "ex": [["「花」という映画を見ました。", "I watched a movie called 'Hana'."], ["ポチという犬を飼っています。", "I have a dog named Pochi."], ["これは日本語で何といいますか。— 「はさみ」といいます。", "The what's-it-called question — infinite vocabulary, one frame."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "花 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"seg": [["どうして", "THE POINT — \"why\": the question that expects a から answer", 1], ["遅れましたか。", "\"were (you) late?\""]], "segNote": "The paired answer: reason + からです. Question and answer are one system — learn them together.", "hl": "からです", "id": "doushite", "step": "Step 11 · Reasons, contrast & connectors", "jp": "どうして / なぜ〜からです", "en": "why? ... because", "setting": {"scene": "A child has handed nothing in for a week and you have to ask why, in a language where the bare why-question presses considerably harder than its English translation does. The word itself is easy and you have known it since Step 1. The register it lands in, said flat to a twelve-year-old, is the whole of the problem.", "jp": "どうして遅れましたか。", "en": "Why were you late?", "pattern": "どうして"}, "ext": [{"kind": "flip", "scene": "You answer one yourself at the end of the day, about the meeting you missed, and the reply comes back in the frame the question set up — the reason, closed off with the ending from two lessons ago.", "jp": "時間がなかったからです。", "en": "Because there wasn't time.", "t": null}, {"kind": "wrinkle", "scene": "Asked flat, it can land as a demand for justification rather than a question. The explanatory syllable from Step 3 cushions it into curiosity, and in real speech between people it is almost always there.", "jp": "どうして遅れたんですか。", "en": "Why were you late? — the ん softens the asking.", "t": "In real speech the question usually softens with ん: どうして遅れたんですか. A bare どうしてですか can land as blunt — the ん cushions the asking."}], "what": "Asking why, and answering it as a pair: どうして…か。— 〜からです。", "build": "どうして (neutral-polite), なぜ (formal, written), なんで (casual) — three registers of the same question. Answer with 〜からです.", "when": "Any why. どうしてですか alone follows anything anyone says.", "watch": "Bare why-questions can press hard in Japanese — どうして来ないんですか with the explanatory ん (Step 3's cc) softens the demand into curiosity. Choose the register with the relationship: なんで with friends, どうして as default, なぜ on paper.", "ex": [["どうして遅れましたか。", "Why were you late?"], ["電車が止まったからです。", "Because the train stopped."], ["どうして遅れたんですか。— 電車が止まったからです。", "Why softened with ん, answered with からです."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["何か", "THE POINT — question word + か: \"something\" — the question goes vague", 1], ["食べたいです。", "\"want to eat\""]], "segNote": "The set is fully regular: 何か something, 誰か someone, どこか somewhere, いつか someday.", "hl": "どこか", "id": "nanika", "step": "Step 11 · Reasons, contrast & connectors", "jp": "何か / どこか / だれか", "en": "something / somewhere / someone", "setting": {"scene": "Half past nine at night in a town where two things are open, and the question is not what you want but whether you want anything at all. Japanese builds indefinite words out of the question words you already own, plus one kana — and the difference between them and the questions they came from is one syllable wide.", "jp": "何か食べたいです。", "en": "I want to eat something.", "pattern": "何か"}, "ext": [{"kind": "flip", "scene": "Somebody asks where you are going on Sunday and the honest answer is nowhere decided yet — which is the same construction built on a different question word, and it works on every one of them.", "jp": "どこかへ行きます。", "en": "I'm going somewhere.", "t": null}, {"kind": "wrinkle", "scene": "Particles mostly drop off these, and the one-syllable difference decides what kind of answer you are asking for — whether you ate anything is a yes-or-no; what you ate is a list.", "jp": "何か食べましたか。", "en": "Did you eat anything? — a yes/no, not a what.", "t": "Particles often drop after these: 何か食べたい needs no を; どこかへ行く keeps its へ. When unsure, dropping is the safer-sounding move."}], "what": "Something, someone, somewhere — question words plus か stop asking and start gesturing.", "build": "何か, 誰か, どこか, いつか. Particles often drop after them: 何か食べたい.", "when": "Offers, vague plans, and half-formed wants: 何か飲みますか。どこか行きたいです。", "watch": "The one-syllable trap: 何か食べましたか asks WHETHER you ate (yes/no); 何を食べましたか asks WHAT you ate (content). Answer type follows question type — a はい to the を-version answers a question nobody asked. sb-negq's statement-tracking rule, from the other side.", "ex": [["何か食べたいです。", "I want to eat something."], ["どこかへ行きましょう。", "Let's go somewhere."], ["何か飲みますか。— はい、じゃあお茶をください。", "The something-offer: a yes/no question wearing a question word."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-orthography", "step": "Step 11 · Reasons, contrast & connectors", "jp": "漢字とかな", "en": "which script a word gets", "setting": {"scene": "The newsletter draft comes back from the teacher who checks it with four words changed out of kanji and into kana, and none of them were wrong. Which script a word gets is convention rather than rule, and over-using kanji is the more common learner error — not under-using it.", "jp": "きれいな部屋です。", "en": "Conventionally kana, even though 綺麗 exists.", "pattern": "きれい"}, "ext": [{"kind": "flip", "scene": "You rewrite two more of your own on the same principle, and the paragraph stops looking like it was assembled out of a dictionary and starts looking like ordinary writing.", "jp": "ちょっと難しいです。", "en": "A little difficult — kana, by convention.", "t": null}, {"kind": "extra", "scene": "Nothing you wrote would have been marked incorrect by anybody. It simply read as though it had been written by someone with a dictionary open, which after four months it had not been.", "jp": "部屋はきれいです。", "en": "Kana here reads as ordinary; kanji would read as formal.", "t": "This is also why the checker treats script choice as a note rather than an error. A word written in kanji where convention prefers kana is not wrong; it is loud, and loudness is a register problem rather than a grammar one."}], "what": "Japanese has no spelling in the English sense — you can't misspell 食べる. What it has instead is convention about which script each word wears, and wearing the wrong one reads as odd rather than incorrect.", "build": "The rough division: content words take kanji (食べる, 時間, 会社), grammar takes kana (は, を, ます, ください, から), and loanwords take katakana. A handful of very common words are conventionally kana even though kanji exist for them — ある, いる, する, とても, ちょっと, きれい.", "when": "Every time you write. Handwriting and typing pull in opposite directions: typing hands you kanji for free, so learners routinely over-convert.", "watch": "Over-using kanji is the more common learner error, not under-using — 綺麗 exists but きれい is what ordinary writing uses. This is also why the grader marks kana-where-kanji-is-standard as worth knowing rather than a fix: it isn't wrong, just a chance to level up. The genuine trap is homophones, where the kanji carries the whole meaning: 暑い and 熱い, 会う and 合う, 帰る and 変える.", "ex": [["きれいな部屋です。", "Conventionally kana, even though 綺麗 exists."], ["暑い日に熱いお茶を飲みます。", "A hot day and hot tea — identical sound, different kanji."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "難しい and 綺麗 sit outside the Step 11 bank; both are from the module's own example.", "難 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-waga2", "step": "Step 11 · Reasons, contrast & connectors", "jp": "は vs が · second look", "en": "the refresher, with everything you know now", "setting": {"scene": "The two particles from Step 2 come back with everything you have learned since standing behind them. The topic set at the front of a sentence carries on through the contrast in the middle of it, which is a thing you could not have seen in Step 2 because you had no contrast to see it with.", "jp": "この店は高いですが、おいしいです。", "en": "Topic は carries through the contrast.", "pattern": "は"}, "ext": [{"kind": "flip", "scene": "You write your own two-clause sentence about the flat and the topic set at the front holds for both halves without being said twice — which is most of what makes long sentences bearable to read.", "jp": "この部屋は広いですが、寒いです。", "en": "This room is spacious but cold.", "t": null}, {"kind": "extra", "scene": "The paragraph you have just written has six of them in it, and every single one still answers the same question the Step 2 test asked. The rule did not grow any more complicated; the sentences around it did.", "jp": "誰が来ましたか。— 田中さんが来ました。", "en": "Who came? — Tanaka did. Question and answer, both が.", "t": "The test has not changed since Step 2: if the sentence answers which one, it takes が; if it names what you are already discussing, it takes は. What has changed is the length of the sentences you are testing."}], "what": "", "build": "", "when": "", "watch": "", "ex": [], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-pronouns2", "step": "Step 11 · Reasons, contrast & connectors", "jp": "私・あなた · second look", "en": "when the pronoun must stay", "setting": {"scene": "Step 3 told you to delete the word for I, and you took it to heart, and now you have deleted one that was doing a job. A describing clause needs its own subject inside it — and inside that clause, the subject takes the other particle, which is the part nobody warns you about.", "jp": "私が好きなスポーツはテニスです。", "en": "私 stays: the clause needs its own subject, and it takes が.", "pattern": "私が"}, "ext": [{"kind": "flip", "scene": "You write another one about a book rather than a sport, and the same structure needs the same word in the same place — not because the sentence is about you, but because the clause inside it is.", "jp": "私が読んだ本は面白かったです。", "en": "The book I read was interesting.", "t": null}, {"kind": "extra", "scene": "Reading back a paragraph you pruned last week, two sentences have lost the subject of a clause — and now they describe somebody unspecified doing something you had meant to claim as your own.", "jp": "私が作った料理です。", "en": "It's food I made — drop 私が and the cook goes missing.", "t": "The over-correction is real and it produces sentences that are wrong in a new way. Deleting every 私 is as mechanical as inserting every 私 was; what changed in Step 3 was the default, not the rule."}], "what": "Step 3's advice was delete it — and it couldn't be finished there, because the main place 私 genuinely earns its keep needs grammar you didn't have yet: a whole clause describing a noun (Step 4's 名詞修飾).", "build": "A describing clause carries its own subject slot, and when that subject isn't obvious from context, it has to be said: 私が好きなスポーツはテニスです — the 私が belongs to the clause, telling you whose liking it is. Swap the subject and the clause follows: 母が作った料理. Inside a describing clause the subject takes が, never は — the rule from the lesson next door.", "when": "Describing clauses whose subject needs saying, direct contrast (私は行きますが、妹は行きません — Step 3 already gave you this one), answers to だれが questions, and introducing yourself.", "watch": "The over-correction is real: learners who took Step 3 to heart start deleting every 私, and then a sentence like 私が好きなスポーツはテニスです looks 'too English' to them. It isn't — it is exactly how a native speaker says it when the clause needs an owner. Deleting the pronoun is a default, not a law.", "ex": [["私が好きなスポーツはテニスです。", "私 stays: the describing clause needs its own subject — and it takes が."], ["母が作った料理がいちばんおいしいです。", "Same slot, different owner — the clause says whose."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "スポーツ, テニス, 面白い, 料理 sit outside the Step 11 bank; スポーツ/テニス are from the module's own example."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-omou", "step": "Step 12 · Past N5 · the shape-changers", "jp": "〜と思います", "en": "reporting a thought, back to front", "setting": {"scene": "A planning meeting where you have an opinion and no wish to state it as fact, because you have been here five months and the people around the table have been here twenty years. Japanese puts the whole thought first and the reporting verb last, which is the same back-to-front shape as describing a noun with a clause.", "jp": "この店は高いと思います。", "en": "I think this shop is expensive.", "pattern": "と思います"}, "ext": [{"kind": "flip", "scene": "Somebody asks what you reckon about the timing and you build your own — the clause in front stays plain however polite the ending gets, which is the whole division of labour.", "jp": "時間がないと思います。", "en": "I think there isn't time.", "t": null}, {"kind": "extra", "scene": "Your first attempt is polite in the middle, where the politeness does not belong, and your second negates the wrong half of the sentence — both of which sound like careful English and like nothing anybody here says.", "jp": "来ないと思います。", "en": "I think he won't come — negate the thought, not the thinking.", "t": "です never appears in front of と思います — 高いですと思います is wrong; it is 高いと思います. Nouns and な-adjectives take だ instead: 学生だと思います. And Japanese negates the thought rather than the reporting, so 来ないと思います is what gets said, not 来ると思いません."}], "what": "To report a thought, a quote, or anything anyone said, Japanese puts the whole reported thing FIRST and the reporting verb last — the same back-to-front shape you met with noun modification. English says I think that this shop is expensive. Japanese says this-shop-is-expensive, I-think.", "build": "[a complete sentence in PLAIN form] + と思います. 高いと思います. The same frame carries 〜と言いました (said) and 〜と聞きました (heard). The clause before と stays plain however polite the ending is.", "when": "Opinions, hedging, and repeating what someone told you. It is also how you stop stating everything as flat fact, which is most of what makes writing sound adult rather than robotic.", "watch": "です never appears before と思います — 高いですと思います is wrong; it is 高いと思います. Nouns and な-adjectives need だ instead: 学生だと思います. And Japanese negates the thought rather than the verb, so 来ないと思います (I think he won't come) is far more natural than 来ると思いません.", "ex": [["この店は高いと思います。", "I think this shop is expensive."], ["彼は学生だと思います。", "I think he's a student. (noun → だ)"], ["明日は来ないと思います。", "I don't think he'll come tomorrow. (negate the thought)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["私", "I — the one it happened to"], ["は", "topic marker"], ["先生", "the teacher — the doer"], ["に", "the doer takes に in a passive"], ["名前", "name"], ["を", "object marker"], ["聞かれました。", "THE POINT — the passive: done-to-me; 聞く → 聞かれる", 1]], "segNote": "Passives describe things too — the shop is used by many people, as an ongoing state.", "hl": "使われています", "id": "passive", "step": "Step 12 · Past N5 · the shape-changers", "jp": "受身形 (〜られる)", "en": "when it happens to you", "setting": {"scene": "Your name got read out in the morning meeting in connection with a form you had not been told about, and telling that story afterwards needs a shape where the thing happens to you rather than by you. English mostly avoids this by rearranging the sentence; Japanese bends the verb.", "jp": "私は先生に名前を聞かれました。", "en": "The teacher asked me my name.", "pattern": "聞かれました"}, "ext": [{"kind": "flip", "scene": "You use it about something smaller and more annoying — the umbrella that went from the stand by the door — and the person responsible does not have to appear in the sentence at all.", "jp": "かさを取られました。", "en": "My umbrella was taken.", "t": null}, {"kind": "wrinkle", "scene": "Then the version English has no grammar for whatsoever: the weather doing something to you. Japanese lets an event happen to a person grammatically, and the sentence carries the grievance without a single word of complaint in it.", "jp": "雨に降られました。", "en": "I got rained on — the suffering passive.", "t": "雨に降られました — the \"suffering passive\": it rained ON me. Japanese lets events happen TO you grammatically; English has to paraphrase."}], "what": "The passive, and the reason it belongs here rather than later: for Ichi verbs it is the exact same form as the potential you just learned. 見られる means both can be seen and is being seen, and the only way to tell is the rest of the sentence.", "build": "Ichi verbs: drop る, add られる — 見る → 見られる. Go verbs shift their final sound to the a-row and add れる — 読む → 読まれる, 言う → 言われる, 使う → 使われる. Irregular: する → される, 来る → 来られる. The person it happened to becomes the topic, and the one who did it takes に: 私は先生に名前を聞かれました.", "when": "Far more often than English passive, because Japanese uses it to say something happened to me, often with a flavour of inconvenience. 雨に降られました means I got rained on, and there is genuine complaint in it.", "watch": "Because Go verbs use the a-row (読まれる) and their potential uses the e-row (読める), those two stay comfortably apart. Ichi verbs give you no such help. This collision is the whole reason casual speech invented 見れる for the potential — the shortcut exists to protect the distinction.", "ex": [["私は先生に名前を聞かれました。", "The teacher asked me my name. (it happened to me)"], ["この店は多くの人に使われています。", "This shop is used by a lot of people."], ["雨に降られました。", "I got caught in the rain. (and I'm not pleased)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "かさ and 取る sit outside the Step 12 bank; かさ arrives in Step 13.", "取 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"seg": [["時間", "time"], ["が", "subject of ある"], ["あったら、", "THE POINT — た-form + ら: \"if / when it happens\" — Stage 1's everyday if", 1], ["行きます。", "\"I'll go\""]], "segNote": "The other Stage 1 if: 〜と, for machine-like certainty — press it and it opens, every time, no exceptions.", "hl": "と", "id": "tara", "step": "Step 12 · Past N5 · the shape-changers", "jp": "〜たら / 〜と", "en": "if, and when", "setting": {"scene": "A trip with two colleagues and one of them wants a phone call when you land, which is a sentence with a condition in front of it and an instruction behind. Japanese has four words for if and this stage teaches two of them — and only one of the two can be followed by a request.", "jp": "時間があったら、行きます。", "en": "If I have time, I'll go.", "pattern": "たら"}, "ext": [{"kind": "flip", "scene": "You make the promise yourself, to the colleague who asked for it, which is exactly the sentence this whole lesson exists for: a condition in front, and something you are undertaking to do about it behind.", "jp": "日本に着いたら、電話してください。", "en": "Call me when you get to Japan.", "t": null}, {"kind": "wrinkle", "scene": "The other one from this step cannot carry that. It describes something automatic, so a request behind it makes no sense — and the remaining two ifs are deferred to Stage 2, which is a deferral rather than an omission.", "jp": "冬になると、寒くなります。", "en": "When winter comes it gets cold — と is automatic, no requests.", "t": "Japanese has four ifs — たら・と・ば・なら. Stage 1 teaches たら and と; ば and なら arrive in Stage 2. An honest deferral, not an omission."}], "what": "English leans on one word, if, and lets context sort out whether you mean a real possibility or an inevitable consequence. Japanese splits those apart, and picking the wrong one changes what you are claiming about the world.", "build": "〜たら is built from the plain past: 食べる → 食べたら, 行く → 行ったら, 高い → 高かったら. It covers both if and when for one-off events. 〜と attaches to the plain non-past (行くと) and means every single time, without exception — a law of nature, not a plan.", "when": "〜たら for anything that might or might not happen, and for when-then sequences. 〜と for machines, rules, and reliable consequences: このボタンを押すと、ドアが開きます.", "watch": "〜と cannot be followed by a request, an invitation, or anything expressing your will — 東京に行くと、電話してください is wrong, because 〜と describes automatic consequences and a request is not automatic. Use 〜たら. Note also that 〜たら is built from the た-form, which means every sound change you learned in Step 4 is working for you here. One more thing, so the map is honest: Japanese has four ifs — 〜たら, 〜と, 〜ば, 〜なら. Stage 1 gives you the first two; 〜ば and 〜なら arrive in Stage 2, and the four-way choice only makes sense once they do.", "ex": [["時間があったら、行きます。", "If I have time, I'll go."], ["このボタンを押すと、ドアが開きます。", "Press this button and the door opens. (every time)"], ["日本に着いたら、電話してください。", "When you arrive in Japan, please call. (a request → たら)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "着く and 電話 sit outside the Step 12 bank; both are from the module's own wrinkle."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "teshimau", "step": "Step 13 · て-form, second wind", "jp": "〜てしまう", "en": "done — completely, or regrettably", "setting": {"scene": "The gate at the station, and your wallet is not in your bag. You stand still and go back through the morning — the bakery, the bus, the bench outside where you sat to answer a message. Somebody you half know from the platform stops and asks what is wrong, and the sentence carries the regret inside the verb rather than beside it.", "jp": "財布を落としてしまいました。", "en": "I've gone and dropped my wallet.", "pattern": "てしまいました"}, "ext": [{"kind": "flip", "scene": "Two hours later, at the police box filling in the lost-property form, the officer asks whether you have finished. You have — the whole thing, every box. Same ending, no regret in it at all this time, just completion.", "jp": "全部書いてしまいました。", "en": "I've finished writing it all.", "t": null}, {"kind": "extra", "scene": "You tell a colleague you passed something using the same ending, meaning to sound modest about it, and it lands as though passing had been a misfortune that befell you.", "jp": "忘れちゃった。", "en": "Forgot it — the spoken compression of 忘れてしまった.", "t": "Context picks the flavour, and the past tense with an unfortunate object almost always reads as regret. Do not reach for it on happy outcomes — 合格してしまいました reads as 'I regrettably passed'. In speech it compresses to ちゃう / じゃう, which is the culture stop two lessons ahead: 忘れちゃった IS 忘れてしまった."}], "what": "One ending, two flavours sharing a root: the action went all the way. Neutrally that's completion — 最後まで読んでしまいました, read to the very end. Emotionally it's a result you can't take back — 財布を落としてしまいました, and the regret lives inside the verb rather than being added to it.", "build": "て-form + しまう, which then conjugates like any Go verb: 食べてしまいます, 食べてしまいました.", "when": "Finishing things entirely, and reporting accidents, losses, and things said that shouldn't have been. English needs a whole phrase — 'went and lost it', 'ended up eating it all'; Japanese folds it into the verb.", "watch": "Context picks the flavour, and the past tense with an unfortunate object almost always reads as regret. Don't reach for it on happy outcomes — 合格してしまいました reads as 'I regrettably passed'. In speech this compresses to ちゃう / じゃう — the culture stop two lessons ahead — so 忘れちゃった IS 忘れてしまった, not a verb you never learned.", "ex": [["宿題を全部やってしまいました。", "Completion: every bit of it, done."], ["電車の中でかさを忘れてしまいました。", "Regret: the umbrella is gone, and the verb says how you feel about it."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "teoku", "step": "Step 13 · て-form, second wind", "jp": "〜ておく", "en": "do it now, for later", "setting": {"scene": "Golden Week is six weeks off and everybody in the staffroom has already booked. You have learned this the expensive way once: the trains sell out, the hotels sell out, and the difference between doing a thing now and doing it in May is whether the thing is possible at all. The verb has the later built into it.", "jp": "ホテルを予約しておきました。", "en": "I booked the hotel ahead — so that later works.", "pattern": "ておきました"}, "ext": [{"kind": "flip", "scene": "You do the same for the person going with you, buying the tickets on a Tuesday for a trip in May, and the sentence says why you are doing it now rather than simply that you are doing it.", "jp": "チケットを買っておきます。", "en": "I'll buy the tickets in advance.", "t": null}, {"kind": "extra", "scene": "You use it about something with no later attached — a coffee, this afternoon — and it puzzles the person you say it to, because they are still waiting to hear what the preparation was for.", "jp": "買います。", "en": "Just buying it — no later, so no ておく.", "t": "The trap is translating it as plain future. 買います says you will buy it; 買っておきます says you are buying it now so that later works. If you cannot name the later, you do not want this form."}], "what": "An action done in advance so that later goes smoothly. English says 'ahead of time' or 'go ahead and'; Japanese puts the preparation inside the verb: ホテルを予約しておきます — book it now, because the trip is coming.", "build": "て-form + おく: 買っておく, 作っておく, 調べておく. Polite 〜ておきます, past 〜ておきました.", "when": "Preparations of every size — chilling drinks before guests arrive, reading the papers before the meeting, leaving a note before going out. A quieter second use points the same idea at not-doing: そのままにしておいてください, leave it as it is.", "watch": "The trap is translating it as plain future. 買います says you will buy it; 買っておきます says you're buying it now so that later works. If you can't name the 'later', ておく is the wrong tool. Speech clips it to とく — 買っとく — same culture stop as ちゃう.", "ex": [["ホテルを予約しておきました。", "Booked ahead — the later is already in the verb's mind."], ["飲み物を冷やしておいてください。", "Please chill the drinks (for when they're needed)."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "予約 uses 約, outside KANJI_DICT — furigana needed; it is the module's own example word for this point."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "tearu", "step": "Step 13 · て-form, second wind", "jp": "〜てある", "en": "it's been done, and it shows", "setting": {"scene": "You come into the meeting room ten minutes early and the window is open, the chairs are out, and the handouts are squared on the table. None of that happened by itself. Somebody came in before you and did it on purpose, and Japanese has a form that says exactly that — the state, with the intention still visible in it.", "jp": "窓が開けてあります。", "en": "The window has been opened — on purpose.", "pattern": "てあります"}, "ext": [{"kind": "flip", "scene": "You do the same for the person after you, leaving the lights on and the board wiped, and say so on the way out — reporting a state you deliberately produced rather than an action you performed.", "jp": "電気がつけてあります。", "en": "The lights have been left on (for you).", "t": null}, {"kind": "extra", "scene": "Later the same window is open again and this time nobody did it, because the catch is broken. The sentence has to change, because there is no longer any intention in the room to report.", "jp": "窓が開いています。", "en": "The window is open — no story, nobody's doing.", "t": "This corners the transitivity work from Steps 4 and 10, so slow down. 窓が開いている is intransitive + ている: it happens to be open, no story. 窓が開けてある is transitive + てある: somebody opened it and meant it. Same window, two different claims about the world."}], "what": "A state that exists because somebody deliberately made it: 窓が開けてあります — the window stands open, and someone opened it on purpose. English needs the awkward 'has been opened (and still is)'; Japanese keeps a form for exactly this.", "build": "て-form of a TRANSITIVE verb + ある, and the thing takes が: 窓が開けてある, 晩ご飯が作ってある. The doer goes unmentioned — the point is the arranged state, not who arranged it.", "when": "Describing preparations already in place — very often the visible result of someone's earlier ておく. 予約してあります: the booking exists; relax.", "watch": "This corners the transitivity work from Steps 4 and 10, so slow down. 窓が開いている (intransitive + ている): it happens to be open, no story. 窓が開けてある (transitive + てある): it's open because someone wanted it open. Same window, different claim about intent. And yes — the particle really is が on a transitive verb's object here, the one place your を-reflex must stand down.", "ex": [["窓が開けてあります。", "Open on purpose — the state carries the intent."], ["晩ご飯はもう作ってあります。", "Dinner's already made (someone saw to it)."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["このケーキ", "this cake — the unknown"], ["を", "object marker"], ["食べてみました。", "THE POINT — て-form + みる: did it once, to see", 1]], "segNote": "みる conjugates like the 見る it came from — and 〜てみたいです (want to try) is the stack you'll use most.", "hl": "話してみます", "id": "temiru", "step": "Step 13 · て-form, second wind", "jp": "〜てみる", "en": "try doing — do it and see", "setting": {"scene": "A new place has opened by the station and the queue outside it is the only recommendation anybody can give you. Nobody in the staffroom has been. The verb you need is not about effort or difficulty — it is about not knowing how a thing will turn out until you have done it.", "jp": "このケーキを食べてみました。", "en": "I tried the cake — to see.", "pattern": "てみました"}, "ext": [{"kind": "flip", "scene": "You suggest it to somebody else the same week, which is the form's other half — an invitation to go and find out, with the outcome honestly unknown to both of you at the time of asking.", "jp": "行ってみませんか。", "en": "Shall we go and see?", "t": null}, {"kind": "wrinkle", "scene": "You use it about a jar you cannot get the lid off, meaning that you struggled with it, and the form does not carry that at all — this is about an unknown result, not a hard task.", "jp": "食べてみます。", "en": "I'll try it and see — experiment, not effort.", "t": "Trying-as-experiment, not trying-as-effort: てみる means the result is unknown, not that the task is hard."}], "what": "Do it, and see what happens: て-form + みる turns any action into an experiment. 食べてみる — try eating it; the claim is only that you'll do it once and find out.", "build": "て-form + みる, which then conjugates like the verb 見る it came from: 食べてみます, 食べてみました, 食べてみたいです — that last stack, try-want-to, is everywhere.", "when": "First attempts, tastings, fittings, and gentle invitations: 使ってみてください — please give it a try.", "watch": "てみる is trying-as-experiment, not trying-as-effort. Struggling to open a stuck jar isn't 開けてみる — that machinery comes later. Here you simply don't know the result yet.", "ex": [["このケーキを食べてみました。", "I tried the cake — to see."], ["日本語で話してみます。", "I'll try speaking in Japanese."], ["この服を着てみてもいいですか。", "May I try this on? — てみる riding Step 5's permission ask."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["雨", "rain"], ["が", "subject marker"], ["降ってきました。", "THE POINT — て-form + くる: the change arrived TOWARD now (and onto you)", 1]], "segNote": "The mirror: ていく sends the change away from now — from here on, hotter and hotter.", "hl": "なっていきます", "id": "teikutekuru", "step": "Step 13 · て-form, second wind", "jp": "〜ていく・〜てくる", "en": "change, moving away and toward", "setting": {"scene": "You have come to collect the new card and the clerk is explaining what happens next. Over sixteen and staying more than three months, you must have it on you every day — not a photocopy, not a photograph on your phone, the card itself, with a fine of up to two hundred thousand yen if an officer asks and you cannot produce it. She slides it across and tells you what to do with it.", "jp": "カードを持っていってください。", "en": "Take the card with you — away from here, from now on.", "pattern": "持っていって"}, "ext": [{"kind": "flip", "scene": "Six weeks later you leave a spare key with the neighbour who signs for your parcels, and she asks whether to keep it or bring it back on Saturday. Same pair of verbs, your mouth, and the direction is the only thing that decides which.", "jp": "鍵を持ってきてください。", "en": "Please bring the key (here) — toward me.", "t": null}, {"kind": "wrinkle", "scene": "You have been saying this pattern since your first week without knowing it was one. The phrase you use walking out of the door every morning is these two verbs, fossilised.", "jp": "いってきます。", "en": "Off I go — and I'll come back.", "t": "You've said this pattern daily since Step 1: いってきます — \"I go and come (back)\" — is ていく・てくる fossilized into the leaving-home ritual."}], "what": "行く and 来る, attached to a て-form, stop being about walking: they give an action a DIRECTION relative to now. 暖かくなってきました — it's been getting warm (change arriving toward the present); これから寒くなっていきます — it'll go on getting cold (change heading away from now).", "build": "て-form + いく (away from now, or physically away): 持っていく — take along. て-form + くる (toward now, or physically toward): 持ってくる — bring. The literal senses — take and bring — are the everyday workhorses.", "when": "Carrying things (持っていく・持ってくる is daily vocabulary), and narrating change: だんだん〜てきた for what's been building, 〜ていく for what lies ahead.", "watch": "ちょっと行ってきます — \"off I go (and I'll be back)\" — is this pattern fossilized into the leaving-home ritual いってきます from Step 1's greetings. The grammar was hiding in the phrase all along.", "ex": [["雨が降ってきました。", "It's started raining — the change arrived on you."], ["これから暑くなっていきます。", "From here it'll keep getting hotter."], ["お茶を持ってきてください。", "Please bring some tea."]], "orphanWr": [], "flags": ["Short-term visitors, diplomats and special permanent residents are outside this rule; the setting states the conditions rather than generalising to every foreigner.", "鍵 is outside KANJI_DICT — furigana needed."], "claims": ["Mid-to-long-term residents aged 16 and over must carry the residence card at all times", "The card is issued to foreign nationals staying more than three months", "A photocopy or phone photograph does not satisfy the requirement", "Failure to carry it is punishable by a fine of up to ¥200,000; refusing to present it carries up to one year's imprisonment or the same fine"], "sources": ["https://www.keishicho.metro.tokyo.lg.jp/multilingual/english/finding_services/living_guide/living_guide_e_4.html", "https://oharalaw-japan.com/2016/02/24/do-foreigners-in-japan-need-to-carry-their-residence-card-at-all-times/", "https://life.m-ri.co.jp/en/zairyu-card-guide.html"]}, {"seg": [["友達", "my friend — the giver of the favor"], ["が", "the giver takes が with くれる"], ["宿題", "homework"], ["を", "object of the helping"], ["手伝ってくれました。", "THE POINT — て-form + くれました: the act flowed toward me, as a kindness", 1]], "segNote": "Outward now: my act, my kindness — あげる. The receiver takes に.", "hl": "あげました", "id": "teageru", "step": "Step 14 · Giving, receiving & kindness", "jp": "〜てあげる・〜てくれる・〜てもらう", "en": "favors, seen from each end", "setting": {"scene": "You were three days behind on marking after being ill and somebody quietly took half the pile. Reporting that in Japanese needs more than the verb for help, because there is a version of the sentence that states the labour and a version that thanks it, and native ears notice which one you chose.", "jp": "友達が宿題を手伝ってくれました。", "en": "A friend helped me with the homework.", "pattern": "てくれました"}, "ext": [{"kind": "flip", "scene": "The following week you take somebody else's pile, and telling it from your own side needs the outward verb — which, said to the person's face, is the one to be careful with.", "jp": "妹の宿題を手伝ってあげました。", "en": "I helped my sister with her homework.", "t": null}, {"kind": "wrinkle", "scene": "Drop the kindness verb and the sentence still works and still reports the same event — it simply stops thanking anyone, and that absence is audible to everybody in the room.", "jp": "母が朝ごはんを作ってくれました。", "en": "My mother made breakfast for me — 作りました alone would be a cold report.", "t": "Cold report versus kindness: 母は朝ごはんを作りました states labor; adding くれる thanks it. Native ears notice the くれる that isn't there."}], "what": "Step 8 taught the giving triangle for THINGS. Attach the same three verbs to a て-form and the triangle now moves ACTIONS: help given, help received, help arranged. English says \"for me\" or says nothing at all — Japanese builds the direction of the kindness into the verb itself.", "build": "て-form + あげる (I do it for someone), + くれる (someone does it for ME), + もらう (I receive the doing). 手伝ってあげる・手伝ってくれる・手伝ってもらう — one act of helping, three camera angles.", "when": "Constantly. Daily Japanese marks who benefited from almost every act; leaving the verb off (母は朝ごはんを作りました) is grammatical but oddly cold — it reports labor without acknowledging the kindness.", "watch": "てあげる said TO the person you're helping can sound like presenting a bill — \"I'll do this FOR you.\" Fine in the third person; offering help directly, reach for 手伝いましょうか (Step 6) instead.", "ex": [["友達が宿題を手伝ってくれました。", "My friend helped me with my homework — a kindness toward me."], ["私は妹に本を読んであげました。", "I read my little sister a book — my kindness outward."], ["田中さんに写真を撮ってもらいました。", "I had Tanaka take a photo — the favor, received."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["田中さん", "Tanaka — the giver, and the subject of this telling"], ["が", "くれる puts the giver on stage with が"], ["本", "a book"], ["を", "object marker"], ["くれました。", "THE POINT — the frame: くれる tells the gift from the giver's side; もらう could tell the same gift from mine", 1]], "segNote": "The identical event — the subject switched to me, and 田中さん dropped to に.", "hl": "もらいました", "id": "ageru2", "step": "Step 14 · Giving, receiving & kindness", "jp": "あげる・くれる・もらう · 二回目", "en": "the same event, told twice", "setting": {"scene": "A colleague is leaving at the end of the month and there are presents going in three directions at once — from the section to her, from her to the section, and one from you personally. Every one of those is the same event seen from a different seat, and Japanese makes you pick the seat before you pick the verb.", "jp": "田中さんが本をくれました。", "en": "Tanaka gave me a book — told from her side.", "pattern": "くれました"}, "ext": [{"kind": "flip", "scene": "You tell the same event from your own end instead, which changes the verb and moves the particle onto the giver — and both sentences are equally true of one book changing hands.", "jp": "田中さんに本をもらいました。", "en": "I got a book from Tanaka.", "t": null}, {"kind": "wrinkle", "scene": "Mix the two frames and you reverse who did what. The verb and the particles have to be telling the same story, and checking that they are is the whole discipline of this lesson.", "jp": "田中さんがもらいました。", "en": "This says TANAKA received — the opposite event.", "t": "Frame-mixing is the wreck: 田中さんがもらいました says TANAKA received something. Verb and particles must tell the same story, always."}], "what": "Step 8's triangle, second look — because one real event can be told from two corners. 田中さんが本をくれました and 田中さんに本をもらいました describe the SAME gift. What changes is the subject: who your sentence is about.", "build": "くれる: the GIVER is the subject, marked が — 田中さんが（私に）くれました. もらう: the RECEIVER is the subject — （私は）田中さんにもらいました, and the giver drops to に. Same event, two frames; the particles swap roles with the verb.", "when": "Choose by what the surrounding story is about. Talking about Tanaka's generosity → くれる keeps him on stage. Talking about your day and what came into it → もらう keeps you there.", "watch": "The classic wreck is mixing frames: 田中さんがもらいました reads as \"TANAKA received\" — the opposite event. Before anything else, check that verb and particles are telling the same story.", "ex": [["田中さんが本をくれました。", "Tanaka gave me a book — told from his side."], ["田中さんに本をもらいました。", "I got a book from Tanaka — the same gift, told from mine."], ["誰にもらいましたか。— 母にもらいました。", "Who was it from? — From my mom."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["先生", "the teacher — above me on the politeness axis"], ["に", "the giver of the favor, に as with もらう"], ["漢字", "kanji"], ["を", "object marker"], ["教えて", "\"teach\" — て-form, attached exactly as in the plain triangle"], ["いただきました。", "THE POINT — もらう in formal dress: received, upward, gratefully", 1]], "segNote": "くれる's formal twin — the giver stays on stage as subject; the kindness bows.", "hl": "くださいました", "id": "itadaku", "step": "Step 14 · Giving, receiving & kindness", "jp": "いただく・くださる・さしあげる", "en": "the giving verbs, dressed up", "setting": {"scene": "The head of section spent forty minutes after work going through your kanji with you, which is a favour from a long way up. The giving verbs you have been using since Step 8 still apply — the directions and particles do not move — but the altitude of the other person does, and the verbs change clothes to match.", "jp": "先生に漢字を教えていただきました。", "en": "The teacher kindly taught me kanji.", "pattern": "いただきました"}, "ext": [{"kind": "flip", "scene": "Told from her side of the desk rather than from yours, the same favour needs the elevated version of the toward-me verb — the same event, the same direction, and one rung further up.", "jp": "先生が教えてくださいました。", "en": "The teacher kindly taught me.", "t": null}, {"kind": "wrinkle", "scene": "The map is the one you already own with a second storey built on top: もらう becomes いただく, くれる becomes くださる, あげる becomes さしあげる, and not one of the directions moved an inch.", "jp": "いただきます。", "en": "The one you already say before meals — the same verb, all along.", "t": "The map, whole: もらう→いただく, くれる→くださる, あげる→さしあげる. Directions and particles unchanged — only the altitude of the other party moved."}], "what": "The triangle has a formal wardrobe. もらう has いただく, くれる has くださる, あげる has さしあげる — the same three directions, worn when the other party stands above you: teachers, bosses, customers, strangers being kind.", "build": "Drop-in replacements, て-forms and all: 先生に教えていただきました, 先生が教えてくださいました. The directions and particles are exactly the plain triangle's — only the altitude changed.", "when": "Any favor crossing upward. You already say the most famous one: いただきます before meals is this verb — you have been receiving the meal politely all along.", "watch": "さしあげる is rare in speech and easily servile — offers of help upward usually hide in other forms (お手伝いしましょうか). This is your first real taste of keigo; the full system opens Stage 3, spaced out, and these three verbs are its seed.", "ex": [["先生に漢字を教えていただきました。", "The teacher kindly taught me kanji — received, upward."], ["先生が本をくださいました。", "The teacher kindly gave me a book."], ["「いただきます」は、この動詞です。", "The before-meals いただきます is this verb — receiving, politely."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["友達", "my friend — the hoped-for doer"], ["に", "the doer takes に"], ["来てほしいです。", "THE POINT — て-form + ほしい: wanting the ACT, from them", 1]], "segNote": "The んですが… trailing setup — Step 3's ん and the soft trailing-off, working together on one small favor.", "hl": "手伝ってほしい", "id": "tehoshii", "step": "Step 14 · Giving, receiving & kindness", "jp": "〜てほしい", "en": "wanting someone else to do it", "setting": {"scene": "The photograph for the leaving card needs taking and you are the only one who has not been asked to be in it. What you want is not a thing and it is not an action of your own — it is an action performed by somebody else, which is a third kind of wanting and gets its own machinery.", "jp": "友達に来てほしいです。", "en": "I want my friend to come.", "pattern": "てほしい"}, "ext": [{"kind": "flip", "scene": "You use it on something smaller and more awkward, about a colleague who has been leaving the meeting-room window open in February — still your want, still about somebody else's action.", "jp": "窓を閉めてほしいです。", "en": "I want them to close the window.", "t": null}, {"kind": "wrinkle", "scene": "Three wants, three machines, and English covers all three with a single word. A thing, an act of your own, and an act of somebody else's — the middle one you have had since Step 6.", "jp": "水がほしい。飲みたい。飲んでほしい。", "en": "Want a thing / want to drink / want them to drink.", "t": "Three wants, three machines: 水がほしい (a thing), 飲みたい (my own act), 飲んでほしい (someone else's act). English covers all three with \"want\" — Japanese never does."}], "what": "ほしい (Step 6) wanted things. Attach it to a て-form and you want an ACTION — from someone else. 来てほしい: I want you to come.", "build": "[person] に + て-form + ほしい: 友達に来てほしいです. The wanter is you; the hoped-for doer takes に. The negative wish is 〜ないでほしい: 吸わないでほしい — a please-don't, wished rather than requested.", "when": "Softer than a request — てください asks; てほしい confesses. Real speech floats it with Step 3's ん: 手伝ってほしいんですが…, the classic favor opener that trails off before even asking.", "watch": "It's still YOUR want — same first-person gravity as たい and ほしい. Claiming to know what someone else wants done needs the other-minds machinery at the end of this stage.", "ex": [["友達に来てほしいです。", "I want my friend to come."], ["ちょっと手伝ってほしいんですが…。", "I could use a little help… — the favor opener."], ["ここでたばこを吸わないでほしいです。", "I'd rather you didn't smoke here."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-kuremorau", "step": "Step 14 · Giving, receiving & kindness", "jp": "くれる vs もらう", "en": "one kindness, two sentences", "setting": {"scene": "Your car would not start and a neighbour drove you to work. That evening you tell it twice — once to somebody who asks how you got in, and once to somebody who asks who the man in the car was. Learners freeze mid-sentence choosing between the two verbs, and they are freezing in the wrong place.", "jp": "妹が写真を撮ってくれました。", "en": "My sister took the photo for me — her frame, が.", "pattern": "てくれました"}, "ext": [{"kind": "flip", "scene": "Asked the other question, the frame moves onto you and the verb is forced — so the skill is picking whose story this is before you open your mouth, after which no decision remains.", "jp": "妹に写真を撮ってもらいました。", "en": "I had my sister take the photo.", "t": null}, {"kind": "extra", "scene": "You reach for the particle that means from, which is not wrong and is not what anybody around you actually says. The giver takes に, and it looks like a destination until it stops looking like one.", "jp": "友達にもらいました。", "en": "Got it from a friend — に marks the giver.", "t": "The に in a もらう sentence is the GIVER, not a destination — 友達にもらいました is from the friend. English 'from' tempts から, which also works with people; に is simply the more common choice."}], "what": "Learners freeze mid-sentence deciding between these two — because they're deciding in the wrong place. The skill is picking the FRAME first: who is this sentence about? After that the verb is forced and no decision remains.", "build": "About the giver → くれる, giver が. About you, the receiver → もらう, giver に. Run the check before you speak, not during.", "when": "Every time a favor enters a story — and especially in answers, where the question sets the frame: 誰が手伝ってくれましたか keeps the giver's frame; your own day's story invites もらう.", "watch": "The に in a もらう sentence is the GIVER, not a destination — 友達にもらいました is from the friend. English \"from\" tempts から, which also works with people; に is simply the more common choice.", "ex": [["妹が写真を撮ってくれました。", "About my sister's kindness — her frame, が."], ["先生に直してもらいました。", "About my problem getting fixed — my frame, giver に."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["明日", "tomorrow — bare"], ["は", "topic marker"], ["雨", "rain — a noun, attaching bare: no だ"], ["かもしれません。", "THE POINT — \"might be\": the claim lowered to an honest maybe", 1]], "segNote": "", "hl": "かもしれません", "id": "kamo", "step": "Step 15 · Guessing, seeming & hearsay", "jp": "〜かもしれません", "en": "might be — the honest maybe", "setting": {"scene": "Sports day is Saturday and somebody has to decide by Friday lunchtime whether to move it. You have looked at the same forecast everyone else has looked at and you have no more idea than they do. What the sentence needs is a claim small enough to be honest.", "jp": "明日は雨かもしれません。", "en": "It might rain tomorrow.", "pattern": "かもしれません"}, "ext": [{"kind": "flip", "scene": "Asked about a colleague's plans rather than about the weather, you hedge in exactly the same way — because somebody else's Saturday is precisely as unknowable to you as the sky over the field is.", "jp": "田中さんは来ないかもしれません。", "en": "Tanaka might not come.", "t": null}, {"kind": "wrinkle", "scene": "There is a certainty dial here and this step keeps adding stops to it — flat statement, then probably, then maybe. Swapping one for another changes how much you have promised the listener.", "jp": "明日は雨でしょう。", "en": "Probably rain — でしょう leans further than かも.", "t": "The certainty dial so far: です (it is) → でしょう (probably) → かもしれません (maybe). This step adds more stops — keep placing each new form on the dial."}], "what": "The claim-lowerer: attach it to a finished thought and you're at maybe — fifty-fifty or below, with no embarrassment owed if it turns out wrong.", "build": "Plain form + かもしれません: 行くかもしれません, 高かったかもしれません. Nouns and な-adjectives attach bare — 雨かもしれません, no だ. Friends clip it to かも.", "when": "Plans not yet firm, guesses you're not ready to defend, the weather, other people's whereabouts.", "watch": "でしょう (Step 7) leans probable; かもしれません sits at maybe. Swapping them changes how much you're promising — the certainty dial matters more in Japanese than in English.", "ex": [["明日は雨かもしれません。", "It might rain tomorrow — a real maybe."], ["田中さんは来ないかもしれません。", "Tanaka might not come."], ["もう帰ったかもしれません。", "He may have already gone home."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["チケット", "the ticket — the receipt this reasoning stands on"], ["を", "object marker"], ["買いましたから", "\"because (he) bought it\" — the reason, stated"], ["、", "a breath"], ["来る", "\"come\" — plain form"], ["はずです。", "THE POINT — \"should\": the conclusion that follows from what you know", 1]], "segNote": "", "hl": "はずです", "id": "hazu", "step": "Step 15 · Guessing, seeming & hearsay", "jp": "〜はずです", "en": "should be — expectation with receipts", "setting": {"scene": "Somebody has not arrived and the meeting cannot start without them. You are not guessing here — you watched them buy the ticket on Wednesday and they messaged the section at seven this morning. This is expectation with evidence behind it, and Japanese keeps that firmly apart from a hopeful maybe.", "jp": "チケットを買いましたから、来るはずです。", "en": "He bought a ticket, so he should be coming.", "pattern": "はずです"}, "ext": [{"kind": "flip", "scene": "You use it about a shop rather than about a person, on the strength of an opening-hours sign you read yourself last week — the receipts are the thing that earns you this form rather than the weaker one.", "jp": "今日は開いているはずです。", "en": "It should be open today.", "t": null}, {"kind": "wrinkle", "scene": "Run the same reasoning backwards and what you get is a flat denial: not that the thing is unlikely, but that the evidence you are already holding in your hand rules it out completely.", "jp": "そんなはずがありません。", "en": "There's no way — the reasoning, reversed.", "t": "はずがない runs the same reasoning in reverse — \"there's no way.\""}], "what": "はず says the conclusion FOLLOWS from something you know: he bought a ticket, so he should be coming. Not hope — reasoning, said aloud.", "build": "Plain form + はずです: 来るはずです. Nouns take の (学生のはずです); な-adjectives keep な (静かなはずです).", "when": "Schedules, logic, vouching: the store should be open (today's no holiday); this answer should be right (I checked twice).", "watch": "If nothing backs it, you wanted かもしれません or でしょう instead. And 〜はずがない runs the reasoning in reverse: can't possibly be.", "ex": [["チケットを買いましたから、来るはずです。", "He bought a ticket, so he should be coming."], ["今日は休みじゃないから、店は開いているはずです。", "It's not a holiday — the shop should be open."], ["そんなはずがありません。", "That can't be right."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["誰も", "nobody — question word + も under a negative"], ["いない", "\"isn't there\" — plain negative"], ["ようです。", "THE POINT — \"seems\": judged from what's in front of you", 1]], "segNote": "Same judgment, casual dress — and みたい attaches bare to nouns where よう wants の.", "hl": "みたいです", "id": "youda", "step": "Step 15 · Guessing, seeming & hearsay", "jp": "〜ようです・みたいです", "en": "seems so — judged by eye", "setting": {"scene": "The flat opposite has had no lights on for a fortnight and the post is stacking up in the box downstairs. Nobody has told you anything. What you have is your own eyes, which is a specific kind of evidence and gets its own form.", "jp": "誰もいないようです。", "en": "Seems nobody's home.", "pattern": "ようです"}, "ext": [{"kind": "flip", "scene": "You say the same about a colleague who has been at her desk since seven and has not touched the tea beside her — again judged by looking, not by anything anybody said.", "jp": "忙しいようです。", "en": "She seems busy.", "t": null}, {"kind": "wrinkle", "scene": "The casual cousin means the same thing and joins onto words differently, and よう turns out to be the choosier of the two about what it is willing to sit behind in a sentence.", "jp": "雨みたいです。", "en": "Looks like rain — みたい joins bare where よう wants の.", "t": "The joints differ by family: 雨のようです but 雨みたいです; 静かなようです but 静かみたいです. よう is choosier than みたい."}], "what": "A judgment from evidence in front of you: the lights are off, so nobody's home — it seems. みたいです is the same claim in casual dress.", "build": "Plain form + ようです. Nouns take の before よう (雨のようです); な-adjectives keep な. みたい attaches bare to everything: 雨みたいです.", "when": "Reading situations aloud — someone seems busy, the shop seems closed, he seems to have caught a cold.", "watch": "ようだ judges from YOUR observation; らしい (next) leans on what you heard. The source of the evidence picks the form.", "ex": [["誰もいないようです。", "Seems nobody's home — the lights are off."], ["田中さんは忙しいみたいです。", "Tanaka seems busy — casual dress."], ["雨のようです。", "Seems to be rain — の joins the noun."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["田中さん", "Tanaka"], ["は", "topic marker"], ["結婚する", "\"will marry\" — plain form"], ["らしいです。", "THE POINT — \"apparently\": rumor absorbed, source blurred", 1]], "segNote": "", "hl": "らしい", "id": "rashii", "step": "Step 15 · Guessing, seeming & hearsay", "jp": "〜らしい", "en": "apparently — seeming at second hand", "setting": {"scene": "The bakery by the station has been shut a week with nothing on the door, and three people have given you three reasons — the owner's health, the rent, a daughter in Osaka. Not one of them has spoken to the owner. Somebody asks what you have heard, and the honest answer passes it on without vouching for it.", "jp": "田中さんは結婚するらしいです。", "en": "Apparently Tanaka's getting married.", "pattern": "らしい"}, "ext": [{"kind": "flip", "scene": "You pass on the shop rumour yourself the same afternoon, in the same shape, and the form is doing something honest — it marks the sentence as second-hand rather than dressing it up as knowledge.", "jp": "閉まるらしいです。", "en": "Apparently it's closing.", "t": null}, {"kind": "wrinkle", "scene": "Then the same word turns up meaning something else entirely — not what you heard about a thing, but the thing being properly and characteristically itself, which context has to separate.", "jp": "彼は学生らしいです。", "en": "He's student-like — or: apparently he's a student. Context decides.", "t": "らしい's second job — true to type: 春らしい天気 is weather being properly spring. Same word, different machine; context decides which is running."}], "what": "A judgment leaning on what you heard or read, your own eyes only half-involved. Rumor absorbed, source blurred: apparently they're getting married.", "build": "Plain form + らしい: 結婚するらしいです. Nouns attach bare: 学生らしいです.", "when": "Passing on what's circulating without vouching for it — shop closures, engagements, transfers: the natural habitat of らしい.", "watch": "らしい has a second job: true-to-type. 春らしい天気 is weather that's properly spring; 学生らしい服 is student-LIKE clothes. Same word, different machine — context decides.", "ex": [["田中さんは結婚するらしいです。", "Apparently Tanaka's getting married."], ["あの店は閉まるらしいです。", "Apparently that shop is closing."], ["彼は学生らしいです。", "Apparently he's a student — or: he's every inch one. Context picks."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["雨", "rain"], ["が", "subject marker"], ["降りそうです。", "THE POINT — verb STEM + そう: about to, by the look of it", 1]], "segNote": "い-adjectives drop the い: おいしい → おいしそう. First impressions, before first bites.", "hl": "おいしそう", "id": "souda-mite", "step": "Step 15 · Guessing, seeming & hearsay", "jp": "〜そうです（様子）", "en": "looks about to", "setting": {"scene": "The sky over the school field has gone the colour it goes about twenty minutes before everything gets wet, and three hundred children are outside. Nobody has forecast anything. You are reading the sky itself, and the form for that attaches to the front half of the verb.", "jp": "雨が降りそうです。", "en": "Looks like rain any minute.", "pattern": "降りそう"}, "ext": [{"kind": "flip", "scene": "You use it about a shelf in the staffroom that has been leaning since March, which is the same reading-from-appearance applied to something that has not actually happened yet and may never.", "jp": "落ちそうです。", "en": "It looks like it's about to fall.", "t": null}, {"kind": "wrinkle", "scene": "Two of the commonest adjectives in the whole language refuse this pattern outright and take shapes you simply have to learn whole, because nothing about the rule predicts either of them.", "jp": "よさそうです。なさそうです。", "en": "いい → よさそう, ない → なさそう.", "t": "Two irregulars to memorize whole: いい → よさそう, ない → なさそう."}], "what": "Read straight off the surface: 降りそう — rain any minute, by the look of the sky; おいしそう — looks delicious, untasted. It claims only what the surface shows.", "build": "Verb STEM + そう: 降りそうです, 落ちそうです. い-adjectives drop the い: おいしそう, 高そう. いい is irregular — よさそう; ない → なさそう.", "when": "Imminent things and first impressions — food you haven't tried, rain that hasn't landed, a bag about to fall off the desk.", "watch": "This そう takes STEMS; the hearsay そう (next lesson) takes finished plain forms. 降りそう (looks like rain) vs 降るそう (I hear it'll rain) — one kana apart. The skill lesson after next drills exactly this.", "ex": [["雨が降りそうです。", "Looks like rain any minute."], ["このケーキはおいしそうです。", "This cake looks delicious."], ["かばんが落ちそうです。", "That bag's about to fall."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["明日", "tomorrow — bare"], ["は", "topic marker"], ["雨", "rain"], ["が", "subject of 降る"], ["降るそうです。", "THE POINT — PLAIN FORM + そうです: heard whole, passed on whole", 1]], "segNote": "", "hl": "そうです", "id": "souda-denbun", "step": "Step 15 · Guessing, seeming & hearsay", "jp": "〜そうです（伝聞）", "en": "I hear that…", "setting": {"scene": "The forecast at seven said it plainly and you are repeating it to somebody who did not see it. This is not your judgement and not a rumour with a blurred source — there is a nameable thing that said so, and the form stands on it.", "jp": "明日は雨が降るそうです。", "en": "I hear it'll rain tomorrow.", "pattern": "降るそう"}, "ext": [{"kind": "flip", "scene": "You relay something a colleague told you directly, which is the same form with a different source — and the confidence in it scales with how nameable that source is.", "jp": "会議は三時からだそうです。", "en": "I hear the meeting's from three.", "t": null}, {"kind": "wrinkle", "scene": "One kana apart from yesterday's lesson, and it changes what you are claiming about where the information came from — whether you looked at the sky yourself, or somebody told you about it.", "jp": "降りそう / 降るそう", "en": "Looks like rain / I hear it'll rain.", "t": "らしい blurs its source; this そう stands on one — the forecast, the friend who told you. Confidence scales with how name
