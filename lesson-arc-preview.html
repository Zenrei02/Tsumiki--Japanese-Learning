able the source is."}], "what": "Hearsay with a straight face: 降るそうです — I hear it will rain; the forecast said so. Information passed on whole, source implied and standing behind it.", "build": "PLAIN FORM + そうです — the finished clause, untouched: 降るそうです, 高いそうです, 学生だそうです (nouns need だ). Tense and negation live INSIDE the clause: 降らないそうです, 降ったそうです.", "when": "Relaying news, forecasts, what someone told you — with more confidence than らしい, because the source is nameable.", "watch": "Never そうでした, never そうじゃないです — this そう itself won't conjugate. If the news is past or negative, the clause inside carries it.", "ex": [["明日は雨が降るそうです。", "I hear it'll rain tomorrow — the forecast says so."], ["あの店は安いそうです。", "That shop's cheap, I hear."], ["田中さんは学生だそうです。", "I hear Tanaka's a student — だ before hearsay そう."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "会議 is Step 12 bank; 三時 uses 時, in KANJI_DICT."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-sou", "step": "Step 15 · Guessing, seeming & hearsay", "jp": "降りそう・降るそう・そうですね", "en": "one syllable, three machines", "setting": {"scene": "Three things ending in the same syllable arrive in the same week and mean different things: the sky looks like rain, the forecast says rain, and somebody agrees with you about the weather. One kana decides which, and misreading it claims sight where you meant rumour.", "jp": "雨が降りそうです。", "en": "The sky says so.", "pattern": "降りそう"}, "ext": [{"kind": "flip", "scene": "You build the other two yourself in the same conversation, and the test is what stands in front of the syllable — the front half of a verb, or a whole finished one.", "jp": "雨が降るそうです。", "en": "The forecast says so.", "t": null}, {"kind": "extra", "scene": "Somebody says the third one back to you across a desk and for a moment you parse it as one of the other two, which is the entire reason this lesson exists at this point in the step.", "jp": "そうですね。", "en": "Agreement — not evidence at all.", "t": "The third is not this machine at all: そうですね is agreement, the conversational noise from Step 1 wearing the same syllables. Nothing in the writing separates the three — only what sits in front of them, and what the conversation is doing."}], "what": "Three near-identical shapes, three different claims: 降りそうです reads the sky, 降るそうです repeats the forecast, そうですね agrees with your neighbor. English needs three different sentences; Japanese splits them by what そう attaches to.", "build": "The attach point is everything. STEM + そう = looks-about-to. PLAIN CLAUSE + そう = hearsay. Bare そうです（ね） standing alone = the everyday agreement — cc-yes, from all the way back in Step 1, finally meeting its relatives.", "when": "Weather talk runs on all three at once — which is why this drill exists, and why it waited until both parents were taught.", "watch": "One kana decides: 降り (stem) versus 降る (plain). Misread it and you claim sight where you meant rumor. When in doubt, listen for what stands before そう.", "ex": [["雨が降りそうです。", "The sky says so."], ["雨が降るそうです。", "The news says so."], ["いい天気ですね。— そうですね。", "The neighbor says so — and you agree."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["聞けば", "THE POINT — え-row + ば: \"if you ask\" — condition as equation", 1], ["、", "a breath"], ["わかります。", "\"you'll understand\" — what follows from the condition"]], "segNote": "い-adjectives take ければ — the same machine as なければなりません, now meeting its family.", "hl": "安ければ", "id": "ba", "step": "Step 16 · The four ifs", "jp": "〜ば", "en": "the logical if", "setting": {"scene": "A student has been stuck on the same thing for three lessons and will not put a hand up. What you want to say is a plain logical consequence — do this, and that follows — with no invitation and no request attached to it, which is what this if is for.", "jp": "聞けば、わかります。", "en": "Ask, and you'll understand.", "pattern": "聞けば"}, "ext": [{"kind": "flip", "scene": "You use it about yourself, in the staffroom, about the reading you cannot do — the same shape, a condition and its result, with the focus on what would follow.", "jp": "読めば、わかります。", "en": "If I read it, I'll understand.", "t": null}, {"kind": "wrinkle", "scene": "You have been conjugating this form since Step 5 without knowing it was one. The long obligation pattern you learned for medicine and deadlines is this if in disguise, doing precisely this job.", "jp": "飲まなければなりません。", "en": "If I don't drink it, it won't do — a ば-sentence all along.", "t": "Step 5's obligation was a ば-sentence in disguise: 飲まなければなりません — \"if you don't drink it, it won't do.\" You've conjugated ば for months."}], "what": "Condition as equation: if X holds, Y follows. The most neutral of the four ifs — the one proverbs and general advice run on: 聞けば、わかります — ask, and you'll understand.", "build": "う-verbs shift the last sound to the え row + ば (行く→行けば, 飲む→飲めば); る-verbs take れば (食べれば); い-adjectives take ければ (安ければ). Negative: なければ. する→すれば, 来る→来れば, いい→よければ.", "when": "General truths and conditions where the focus falls on WHAT FOLLOWS: 安ければ、買います — IF it's cheap (that's the open question), I'll buy.", "watch": "You've been conjugating ば for months without knowing it: なければなりません is \"if you don't…, it won't do\" — Step 5's obligation was a ば-sentence all along. One care: requests after ば sound stiff unless the condition is a state (時間があれば、来てください is fine); when the condition is an action and the follow-up is your will, たら is safer.", "ex": [["聞けば、わかります。", "Ask, and you'll understand."], ["安ければ、買います。", "If it's cheap, I'll buy it."], ["時間があれば、来てください。", "If you have time, please come — a state, so ば carries the request fine."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["京都", "Kyoto — their plan, not yours"], ["へ", "destination marker"], ["行くなら", "THE POINT — plain clause + なら: \"if that's the situation…\" — a borrowed topic", 1], ["、", "a breath"], ["電車", "the train"], ["が", "subject marker"], ["いいですよ。", "\"is good\" — advice attached, with よ delivering the news"]], "segNote": "Bare noun + なら — the topic lifted straight out of the other person's sentence.", "hl": "なら", "id": "nara", "step": "Step 16 · The four ifs", "jp": "〜なら", "en": "the topical if", "setting": {"scene": "You are moving west and you mention it in the staffroom, and somebody asks what you are taking. Japan runs on two mains frequencies — Tokyo and everything east on 50 Hz, Osaka and everything west on 60 — because in the 1890s the Tokyo company bought German generators and the Osaka company bought American ones, and nobody ever unified them. Most modern appliances cope. Yours is fifteen years old.", "jp": "大阪なら、その電子レンジは使えません。", "en": "If it's Osaka — that microwave won't work.", "pattern": "なら"}, "ext": [{"kind": "flip", "scene": "Somebody else mentions a trip to Kyoto and you hang advice off what they just said, which is what this if is for — it picks up the other person's topic rather than proposing one.", "jp": "京都へ行くなら、電車がいいですよ。", "en": "If Kyoto's the plan, the train's your friend.", "t": null}, {"kind": "wrinkle", "scene": "This is the only one of the four that can advise about something happening BEFORE its own condition — buy the ticket, then go. No other if can point backward like that.", "jp": "行くなら、チケットを買っておいてください。", "en": "If you're going, buy the ticket first.", "t": "なら's superpower: its advice can happen BEFORE its condition. 行くなら、チケットを買っておいてください — the buying comes first. No other if can point backward."}], "what": "\"If that's the situation we're talking about…\" なら takes what the other person said — or what context offers — and builds on it: going to Kyoto? — なら, take the train.", "build": "Plain clause or bare noun + なら: 行くなら, 京都なら. No だ after nouns.", "when": "Advice and reactions. 京都なら、電車がいいですよ answers someone's plan; お茶なら、あの店 answers someone's craving. The condition is borrowed, not predicted.", "watch": "なら is the only if that can point BACKWARD in time: 行くなら、チケットを買っておいてください — the buying happens BEFORE the going. たら's result always follows its condition; なら's advice may precede it. None of the other ifs can do this.", "ex": [["京都へ行くなら、電車がいいですよ。", "If you're going to Kyoto, the train's your friend."], ["お茶なら、あの店が安いです。", "If it's tea you're after, that shop is cheap."], ["行くなら、早く行きましょう。", "If we're going, let's go early."]], "orphanWr": [], "flags": ["大阪 uses 阪, outside KANJI_DICT — furigana needed.", "Which specific appliances still fail across the line is stated loosely on purpose; the sourced claim is the split and its history."], "claims": ["Eastern Honshu and Hokkaido run at 50 Hz; western Honshu, Kyushu, Shikoku and Okinawa at 60 Hz", "Tokyo Electric Light bought 50 Hz AEG generators around 1895-96; Osaka Electric Light bought 60 Hz generators from GE's predecessor shortly after", "No regulation required a single frequency at the time, and later unification was judged too costly"], "sources": ["https://www.japantimes.co.jp/news/2011/07/19/reference/japans-incompatible-power-grids/", "https://shulman-advisory.com/everything-you-need-to-know-about-the-japanese-electricity-grid/"]}, {"seg": [["先生", "the teacher"], ["に", "the one to ask"], ["聞いたら", "\"if you asked\" — the たら form doing its usual work"], ["どうですか。", "THE POINT — たら + どうですか: \"how about…?\" — the decision stays theirs", 1]], "segNote": "", "hl": "どうですか", "id": "taradou", "step": "Step 16 · The four ifs", "jp": "〜たらどうですか", "en": "advice wearing an if", "setting": {"scene": "A colleague has been at her desk until nine every night for a fortnight and has started making the kind of small mistakes that people make when they are tired. Saying so directly is not available to you. What is available is advice wearing the clothes of a question.", "jp": "先生に聞いたらどうですか。", "en": "How about asking the teacher?", "pattern": "たらどうですか"}, "ext": [{"kind": "flip", "scene": "You aim it at the actual problem rather than at a convenient proxy, and cushion it — because the same words delivered flat carry an accusation that the softened version does not.", "jp": "少し休んだらどうですか。", "en": "How about taking a bit of a rest?", "t": null}, {"kind": "wrinkle", "scene": "Tone is the entire game with this one. Delivered flat and unhedged, it reads as why-haven't-you-already, which is the exact opposite of the thing the form was actually built to do.", "jp": "少し休んだらどうですか。", "en": "Keep it light — cushion it with 少し or でも.", "t": "Tone is the whole game: flat delivery reads as \"why haven't you already?\" Keep it light, cushion it with 少し or でも."}], "what": "\"How about if you…?\" — a suggestion that leaves the decision entirely with the other person.", "build": "たら-form + どうですか: 先生に聞いたらどうですか. Among friends it clips to 〜たらどう？, or even a bare 〜たら？ with rising pitch.", "when": "The natural next move after someone tells you a problem — suggesting without pushing.", "watch": "Tone matters: said flat, 〜たらどうですか can land as \"why haven't you already?\" Keep it light, or cushion it: 少し休んだらどうですか.", "ex": [["先生に聞いたらどうですか。", "How about asking the teacher?"], ["少し休んだらどうですか。", "How about resting a little?"], ["医者に行ったらどうですか。", "Maybe see a doctor?"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-if4", "step": "Step 16 · The four ifs", "jp": "たら・と・ば・なら", "en": "four ifs, four claims", "setting": {"scene": "Four words for if, and Stage 1 gave you two of them. The remaining two arrive here, and the choice between all four is not about grammar being fussy — each one makes a different claim about how the condition and the result are related.", "jp": "時間があったら、行きます。", "en": "If I have time, I'll go — one-off possibility.", "pattern": "たら"}, "ext": [{"kind": "flip", "scene": "You build the automatic one about something that happens every single year without anybody's involvement, which is the version of the four that cannot be followed by a request or an invitation.", "jp": "冬になると、寒くなります。", "en": "When winter comes, it gets cold.", "t": null}, {"kind": "extra", "scene": "You try to attach a request to the automatic one and the sentence refuses on meaning rather than on form — nothing is ungrammatical, it simply claims something nobody in the room meant.", "jp": "東京に行くと、電話してください。", "en": "Wrong: と can't carry a request.", "t": "Two hard walls, everything else is tuning. と never precedes a request, an invitation or an act of will, because it describes automatic consequence. And なら is the only backward-pointing if. Where two feel right they often both are — choose by what you are claiming, not by fear."}], "what": "The set is complete — the promise Step 12 planted is kept. Four ifs, four claims: たら (one-off, if-or-when), と (every time, automatic), ば (logical equation, focus on the result), なら (borrowed topic, advice attached). Many sentences accept two of them; the choice tunes what you're claiming.", "build": "Quick tells: a request or invitation follows → たら (or なら). A law of nature → と. A proverb, or the condition is the open question → ば. Reacting to their plan → なら — and only なら can advise about BEFORE the condition.", "when": "Every if-sentence from now on. When two feel right, they often both are — choose by claim, not by fear.", "watch": "Two hard walls, everything else is tuning: と never precedes a request or act of will; なら is the only backward-pointing if.", "ex": [["時間があったら、行きます。", "One-off possibility → たら."], ["春になると、暖かくなります。", "Every year, automatically → と."], ["行くなら、早く。", "Their plan, your advice → なら."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["そろそろ", "\"about time to…\" — the word that loves this form"], ["帰ろう。", "THE POINT — the volitional: お-row + う, \"let's / I'll\" in plain clothes", 1]], "segNote": "る-verbs take よう — 見る → 見よう. The casual invitation, ready to go.", "hl": "見よう", "id": "you-vol", "step": "Step 17 · Intentions, decisions & change", "jp": "〜よう（意向形）", "en": "the plain let's", "setting": {"scene": "Nine at night, the staffroom is down to two people, and the other one left an hour ago in everything but the physical sense. Nobody is deciding anything jointly here — this is the sentence you say to yourself, out loud, to make the getting-up happen.", "jp": "そろそろ帰ろう。", "en": "Right — time to head home.", "pattern": "帰ろう"}, "ext": [{"kind": "flip", "scene": "Saturday, and you use it on a friend rather than on yourself, which is the same form pointed outward — the casual version of the let's you have had since Step 6.", "jp": "一緒に行こう。", "en": "Let's go together.", "t": null}, {"kind": "wrinkle", "scene": "The polite one you already know turns out to have been this form in a coat the whole time. Same meaning, same job, two registers, and which you reach for tracks who is standing in the room.", "jp": "行きましょう / 行こう", "en": "One meaning, two registers.", "t": "ましょう was this form wearing polite dress all along: 行きましょう／行こう, one meaning, two registers."}], "what": "ましょう's plain twin — the volitional: 行こう is \"let's go\" among friends, and \"right, I'll go\" said to yourself. Half of everyday self-talk runs on it.", "build": "う-verbs shift the last sound to the お-row + う: 行く→行こう, 飲む→飲もう. る-verbs take よう: 食べよう. する→しよう, 来る→来よう.", "when": "Casual proposals (映画を見よう！), and decisions muttered at yourself (そろそろ帰ろう). It's also the base the next lesson builds plans on.", "watch": "The register split is the usual one: ましょう for anyone, 〜よう for friends and diaries. Same meaning, different clothes.", "ex": [["そろそろ帰ろう。", "Time to head home — said to yourself."], ["一緒に映画を見よう。", "Let's watch a movie — the casual invitation."], ["今日は早く寝よう。", "Tonight, early to bed — a small resolution."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["来年", "next year — bare time word"], ["、", "a breath"], ["日本", "Japan"], ["へ", "destination marker"], ["行こう", "the volitional — the intention itself"], ["と思っています。", "THE POINT — quoting your own plan: it's been on your mind", 1]], "segNote": "買う → 買おう before the quote — the volitional machinery from last lesson, in its day job.", "hl": "買おう", "id": "youtoomou", "step": "Step 17 · Intentions, decisions & change", "jp": "〜ようと思っています", "en": "a plan you're carrying", "setting": {"scene": "The visa runs to next March and the question of whether you stay has been sitting at the back of your head since about November. Nobody has asked you outright until now, over lunch, and the honest answer is not a decision and not a whim — it is something you have been carrying.", "jp": "来年、日本へ行こうと思っています。", "en": "I'm thinking of going to Japan next year.", "pattern": "と思っています"}, "ext": [{"kind": "flip", "scene": "Somebody asks about something smaller — the course you keep mentioning — and the same shape says you have been turning it over rather than that you decided it just now.", "jp": "日本語を勉強しようと思っています。", "en": "I've been thinking of studying Japanese.", "t": null}, {"kind": "wrinkle", "scene": "Drop the continuing form and the sentence moves the decision to this second, which is a different claim about your own head — and the ています is doing exactly the state-work it has done since Step 4.", "jp": "行こうと思います。", "en": "I've just decided — deciding now, not carrying a plan.", "t": "と思います = deciding this second; と思っています = carrying the plan already. The ています is doing its usual state-work on your own head."}], "what": "The volitional grows up: よう + と思っています states a plan that's been living in your head — \"I'm thinking I'll…\" Softer than つもり, warmer than a schedule.", "build": "Volitional + と思っています: 日本へ行こうと思っています. The と is Step 12's quoting と — you're quoting your own intention, so everything before it stays plain.", "when": "Sharing plans without carving them in stone — the default way to say what's next in your life.", "watch": "と思います marks a decision forming right now, this second; と思っています means it's been on your mind a while. The ています does its usual state-work.", "ex": [["来年、日本へ行こうと思っています。", "I'm thinking of going to Japan next year."], ["新しい車を買おうと思っています。", "I've been thinking I'll buy a new car."], ["日本語をもっと勉強しようと思っています。", "Planning to study more Japanese."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["日本", "Japan"], ["へ", "destination marker"], ["行く", "\"go\" — plain form"], ["ことにしました。", "THE POINT — こと + にする: the choice, performed — and it was YOURS", 1]], "segNote": "Deciding not to: the ない form goes inside, the machinery outside stays identical.", "hl": "吸わないことにしました", "id": "kotonisuru", "step": "Step 17 · Intentions, decisions & change", "jp": "〜ことにする", "en": "deciding it — your choice", "setting": {"scene": "The form for next year's contract has been on the desk for eight days and has to go back on Friday. At some point on the Wednesday the turning-it-over stops and something else happens instead, and the language has a form for exactly that moment — the point where you become the one who chose.", "jp": "日本へ行くことにしました。", "en": "I've decided to go to Japan.", "pattern": "ことにしました"}, "ext": [{"kind": "flip", "scene": "You use it on something small the same afternoon, about the smoking you have been meaning to stop, and it is the same form doing the same job on a much smaller decision.", "jp": "たばこをやめることにしました。", "en": "I've decided to give up smoking.", "t": null}, {"kind": "wrinkle", "scene": "Put the continuing form on it and the decision stops being a single moment and becomes a rule you re-make every morning, which is what a habit actually is when you look at it closely.", "jp": "毎朝散歩することにしています。", "en": "I make it a rule to walk every morning.", "t": "ことにしている — with ている — is a decision renewed daily, a personal rule: 毎朝散歩することにしています."}], "what": "The moment of choosing, marked: 行くことにしました — I've decided to go. The decision is yours, and ことにする performs it.", "build": "Plain form + ことにする: 行くことにします／しました. Deciding NOT to: 行かないことにしました — the negative lives inside, as usual.", "when": "Announcing choices — quitting, starting, going, skipping dessert.", "watch": "ことにしている, with ている, is a decision you keep re-making — a personal rule: 毎朝散歩することにしています, I make it a rule to walk every morning.", "ex": [["日本へ行くことにしました。", "I've decided to go to Japan."], ["たばこを吸わないことにしました。", "I've decided to quit smoking."], ["毎朝散歩することにしています。", "I make it a rule to walk every morning."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["来月", "next month"], ["、", "a breath"], ["東京", "Tokyo"], ["へ", "destination marker"], ["行く", "\"go\" — plain form"], ["ことになりました。", "THE POINT — こと + になる: it came about — decided above your head (or framed that way)", 1]], "segNote": "The standard wedding announcement — and nobody hears an arranged marriage in it. Modesty wears なる.", "hl": "ことになりました", "id": "kotoninaru", "step": "Step 17 · Intentions, decisions & change", "jp": "〜ことになる", "en": "it's been decided", "setting": {"scene": "You find out at the Monday meeting, along with everybody else, that you are going to the Tokyo office next month. Nobody consulted you and nobody is pretending they did. There is a form for a decision that arrived rather than one you made, and it is not passive-aggressive — it is simply how the announcement is shaped.", "jp": "来月、東京へ行くことになりました。", "en": "It's been decided — I'm off to Tokyo next month.", "pattern": "ことになりました"}, "ext": [{"kind": "flip", "scene": "You relay it to somebody outside the section the same way, and the form does something useful: it reports the outcome without putting anybody in the sentence to be blamed or thanked for it.", "jp": "会議は三時からになりました。", "en": "The meeting's been moved to three.", "t": null}, {"kind": "wrinkle", "scene": "With the continuing form on it, it stops being an announcement and becomes a standing arrangement — the way things are done here, with no decider visible anywhere in the sentence at all.", "jp": "ここでは靴を脱ぐことになっています。", "en": "Shoes come off here — that's just how it is.", "t": "ことになっている is the standing arrangement: ここでは靴を脱ぐことになっています — that's just how it is here. Rules love this form."}], "what": "The same shape with なる: it has come about — decided by someone else, by circumstances, by the world. 行くことになりました: it's been arranged that I'm going.", "build": "Plain form + ことになる. The standing-rule version is ことになっている: ここでは靴を脱ぐことになっています — shoes off here, that's the arrangement.", "when": "Transfers, schedules, rules — anything settled above your head, or politely framed as if it were.", "watch": "The modesty twist: Japanese often announces even CHOSEN things with なる — 結婚することになりました is the standard wedding announcement, and no one hears an arranged marriage in it. Grammar says arrival; culture says humility.", "ex": [["来月、東京へ行くことになりました。", "It's been decided — I'm off to Tokyo next month."], ["結婚することになりました。", "We're getting married — the standard announcement."], ["ここでは靴を脱ぐことになっています。", "Shoes off here — that's the standing arrangement."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["明日", "tomorrow — bare"], ["、", "a breath"], ["京都", "Kyoto"], ["へ", "destination marker"], ["行く", "\"go\" — plain form"], ["予定です。", "THE POINT — 予定: the calendar's word — booked, neutral, factual", 1]], "segNote": "", "hl": "予定", "id": "yotei", "step": "Step 17 · Intentions, decisions & change", "jp": "〜予定です", "en": "on the schedule", "setting": {"scene": "Two questions in one conversation that sound identical in English. What do you intend to do in August, and what is actually in the calendar for August. One of those lives in your chest and one of them lives on a shared spreadsheet the office can see, and Japanese does not use the same word for both.", "jp": "明日、京都へ行く予定です。", "en": "I'm scheduled to go to Kyoto tomorrow.", "pattern": "予定です"}, "ext": [{"kind": "flip", "scene": "Asked about the same trip by a friend rather than by the office, you switch to the one that reports intention instead — both are true of one journey, and you pick by which you are being asked about.", "jp": "京都へ行くつもりです。", "en": "I intend to go to Kyoto.", "t": null}, {"kind": "wrinkle", "scene": "The distinction survives even when the two disagree, which is the useful case: something can sit on the calendar that you have no intention of doing, and something can be fully intended and nowhere in writing.", "jp": "来年、帰る予定です。", "en": "Scheduled to go home next year — the calendar's version.", "t": "つもり lives in your chest; 予定 lives in the calendar. Both can be true of one trip — report whichever you mean."}], "what": "The planner's word: 予定 is neutral, factual, datebook-flavored. No chest, no fate — just the calendar.", "build": "Plain form + 予定です: 行く予定です. As a noun it stands alone too: 明日は予定があります — I have plans.", "when": "Itineraries, meetings, departures — where つもり would sound personal and ことになりました would sound eventful, 予定 just sounds booked.", "watch": "つもり lives in your chest; 予定 lives in the calendar. Both can be true of the same trip — pick by which you're reporting.", "ex": [["明日、京都へ行く予定です。", "Scheduled to go to Kyoto tomorrow."], ["会議は三時に始まる予定です。", "The meeting is set to start at three."], ["来週帰る予定です。", "Due back next week."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["日本語", "Japanese"], ["が", "the able-to thing keeps its が"], ["話せる", "\"can speak\" — the potential, from Step 10"], ["ようになりました。", "THE POINT — ようになる: the line was crossed; the change ARRIVED", 1]], "segNote": "Not one early morning — a new normal. ようになる reports arrivals, not events.", "hl": "起きるようになりました", "id": "youninaru", "step": "Step 17 · Intentions, decisions & change", "jp": "〜ようになる", "en": "change arrives", "setting": {"scene": "Somebody at the year-end party says your Japanese has changed and you disagree, and then realise on the train home that you understood most of the party. Nothing happened on any particular day. What the sentence has to report is the arrival of a change rather than an event.", "jp": "日本語が話せるようになりました。", "en": "I've become able to speak Japanese.", "pattern": "ようになりました"}, "ext": [{"kind": "flip", "scene": "You say it about a habit rather than an ability, about the mornings that used to be impossible, and it is the same claim — a new state, arrived at, with no single moment to point to.", "jp": "毎朝早く起きるようになりました。", "en": "I've got to where I get up early.", "t": null}, {"kind": "wrinkle", "scene": "It runs in the other direction too, and the reverse is the one people forget — a thing you used to do and have stopped doing is the same arrival, arriving negatively.", "jp": "たばこを吸わなくなりました。", "en": "I've stopped smoking — the change, arriving the other way.", "t": "The reverse change is 〜なくなる: 食べなくなりました — stopped eating it. Arrival works in both directions."}], "what": "Crossing a line, marked: what you couldn't do, you now can; what you didn't do, you now do. 話せるようになりました — I've become able to speak.", "build": "Plain form — very often the potential — + ようになる: 読めるようになる. The reverse change is 〜なくなる: 食べなくなりました, stopped eating it.", "when": "Progress reports. This is the sentence shape your own study lives in: 漢字が読めるようになりました.", "watch": "ようになる reports the arrival of a change, not a single event. 早く起きました is one morning; 早く起きるようになりました is a new you.", "ex": [["日本語が話せるようになりました。", "I've become able to speak Japanese."], ["毎朝早く起きるようになりました。", "I've started waking early — the habit arrived."], ["妹は野菜を食べるようになりました。", "My sister eats vegetables now — the change happened."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["毎日", "every day"], ["日本語", "Japanese"], ["を", "object marker"], ["話す", "\"speak\" — plain form"], ["ようにしています。", "THE POINT — ようにする: the standing effort — steering, not yet arrived", 1]], "segNote": "Avoidance steers the same wheel: ない form + ようにしています.", "hl": "吸わないようにしています", "id": "younisuru", "step": "Step 17 · Intentions, decisions & change", "jp": "〜ようにする", "en": "steering yourself", "setting": {"scene": "The difference between the person who improved and the person who did not is usually not talent, and at some point you decide to be deliberate about it. This form is the effort rather than the result — the steering, before there is anything to report.", "jp": "毎日日本語を話すようにしています。", "en": "I make a point of speaking Japanese every day.", "pattern": "ようにしています"}, "ext": [{"kind": "flip", "scene": "You use it about something you are trying to stop rather than start, which takes the negative inside the clause and leaves the steering machinery on the outside completely untouched.", "jp": "たばこを吸わないようにしています。", "en": "I'm making a point of not smoking.", "t": null}, {"kind": "wrinkle", "scene": "Put this lesson beside the last one and you have the entire arc of a habit in two sentences: the trying, and then months later, without any particular day to point at, the arriving.", "jp": "早く起きるようにしています → 早く起きるようになりました", "en": "The effort, then the arrival.", "t": "The full arc of a habit: 早く起きるようにしています (the effort) → 早く起きるようになりました (the arrival). Two lessons, one life."}], "what": "The steering wheel: a standing effort to make a behavior true. 毎日話すようにしています — I make a point of speaking daily. Not yet arrival; deliberate motion toward it.", "build": "Plain form + ようにする; ようにしています for the ongoing effort; avoiding something: 〜ないようにしています.", "when": "Habits under construction, doctor's orders, resolutions that need renewing every morning.", "watch": "する steers, なる reports arrival — Step 9's 暖かくする／暖かくなる split, one floor up. The next lesson locks the whole axis in.", "ex": [["毎日日本語を話すようにしています。", "I make a point of speaking Japanese daily."], ["たばこを吸わないようにしています。", "I'm trying to keep off the cigarettes."], ["早く寝るようにします。", "I'll try to get to bed early — the resolution."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-suru-naru", "step": "Step 17 · Intentions, decisions & change", "jp": "する系 vs なる系", "en": "who's driving the change?", "setting": {"scene": "One axis runs through this entire step and it is not really about grammar: did you choose it, or did it come about? Every pair in the step splits on that one question, and Step 9's warming-the-room versus the-room-warmed was the first rung of the very same ladder.", "jp": "日本へ行くことにしました。", "en": "I chose it — する.", "pattern": "ことにしました"}, "ext": [{"kind": "flip", "scene": "You build the other half about the same trip, as though the office had decided it, and nothing changes except who is holding the steering wheel — which is the only thing this axis measures.", "jp": "日本へ行くことになりました。", "en": "It was decided — なる.", "t": null}, {"kind": "extra", "scene": "Somebody announces their own wedding using the it-was-decided form and for a second you almost congratulate them on their bad luck, before the register catches up with what they actually meant.", "jp": "結婚することになりました。", "en": "We're getting married — chosen, announced modestly.", "t": "Culture bends the grammar here and it is worth knowing before you mis-hear somebody. Announcements often prefer なる even for things that were plainly chosen — 結婚することになりました is the standard wedding announcement, and nobody hears it as an accident. When you hear なる, do not assume nobody chose."}], "what": "One axis runs through this whole step: did you choose it, or did it come about? ことにする／ことになる and ようにする／ようになる differ only there — and Step 9's 暖かくする／暖かくなる was the first rung of the same ladder.", "build": "する = agency: you decide (ことにする), you steer (ようにする). なる = arrival: it got decided (ことになる), it became true (ようになる). The attach points are identical within each pair; only the driver changes.", "when": "Any sentence about change or decision — pick the verb by who's at the wheel.", "watch": "Culture bends grammar here: announcements often prefer なる even for chosen things (結婚することになりました). When you hear なる, don't assume nobody chose — assume somebody's being modest.", "ex": [["日本へ行くことにしました。", "I chose it — する."], ["日本へ行くことになりました。", "It came about — なる (perhaps modestly)."], ["早く起きるようにしています。→ 早く起きるようになりました。", "The effort, then the arrival — the full arc of a habit."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["日本語", "Japanese"], ["を", "object of the inner verb — を survives here, unlike with 話せる"], ["話す", "\"speak\" — plain form"], ["ことができます。", "THE POINT — こと + できる: ability in formal dress", 1]], "segNote": "Sign-Japanese: tickets MAY BE purchased here. Announcements love this shape.", "hl": "買うことができます", "id": "kotogadekiru", "step": "Step 18 · Ability, experience & degrees", "jp": "〜ことができる", "en": "ability, in formal dress", "setting": {"scene": "A form for a course you want to take, with a box asking what you can do, and a space for it in writing rather than in conversation. You have had the short potential form since Step 10 and it is not wrong here — but written Japanese leans on the longer, flatter version, and this is the register the box is asking for.", "jp": "日本語を話すことができます。", "en": "I can speak Japanese — stated formally.", "pattern": "ことができます"}, "ext": [{"kind": "flip", "scene": "You use it about something narrower further down the same form, where the formality is doing real work — a claim about capability on a document that somebody is going to file and keep.", "jp": "漢字を読むことができます。", "en": "I can read kanji.", "t": null}, {"kind": "wrinkle", "scene": "You try to combine it with the short potential you already know, stacking two ability machines into a single sentence, and the result means nothing at all in any register of the language.", "jp": "話せることができる", "en": "Wrong — one ability machine per sentence.", "t": "One ability machine per sentence: 話せることができる stacks two potentials into nonsense."}], "what": "The potential form's Sunday clothes: plain verb + ことができる says the same thing, one register up — the shape signs, announcements, and careful writing prefer.", "build": "Plain form + ことができる: 話すことができます. Tense and negation land on できる: できません, できました.", "when": "Formal contexts, and any verb whose potential form feels clumsy in the mouth. In everyday speech, 話せます usually wins — it's shorter.", "watch": "Don't double the ability: 話せることができる stacks two potentials into nonsense. One machine per sentence.", "ex": [["日本語を話すことができます。", "I can speak Japanese — stated formally."], ["ここでチケットを買うことができます。", "Tickets may be purchased here — sign-Japanese."], ["漢字を書くことができません。", "I cannot write kanji (yet — the syllabus disagrees)."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["日本", "Japan"], ["へ", "destination marker"], ["行った", "\"went\" — plain PAST; the machine insists on it"], ["ことがあります。", "THE POINT — た + ことがある: it has happened in your life, at least once", 1]], "segNote": "The have-you-ever question — travel talk's favorite opener.", "hl": "食べたことがありますか", "id": "takotogaaru", "step": "Step 18 · Ability, experience & degrees", "jp": "〜たことがある", "en": "ever done it — experience as grammar", "setting": {"scene": "A new colleague arrives and the getting-to-know-you questions start, and half of them are about whether you have ever done a thing rather than when you did it. English uses a tense for this; Japanese uses a whole construction, and the difference is that this one refuses to carry a date.", "jp": "日本へ行ったことがあります。", "en": "I've been to Japan.", "pattern": "たことがあります"}, "ext": [{"kind": "flip", "scene": "You ask it back about something specific, which is the shape most of this conversation will take for the next twenty minutes — ever, at any point, with no interest in which year.", "jp": "すしを食べたことがありますか。", "en": "Have you ever eaten sushi?", "t": null}, {"kind": "wrinkle", "scene": "Put a date in the sentence and the whole construction becomes wrong, because you have stopped asking about experience and started reporting an event — and the plain past does that job already.", "jp": "去年、日本へ行きました。", "en": "Went last year — a WHEN means plain past, not ことがある.", "t": "Ever versus then: 行ったことがある carries no date. If your sentence has a WHEN, use plain past — 去年行きました, never 去年行ったことがあります."}], "what": "It's happened at least once in your life, and there's a form for exactly that: 日本へ行ったことがあります — I've been to Japan.", "build": "Plain PAST + ことがある. Never: 行ったことがありません. The have-you-ever question: 〜たことがありますか.", "when": "Firsts, travel talk, interviews — anywhere lifetime experience is the topic.", "watch": "行ったことがある (ever, sometime) versus 行きました (went, then). If the sentence carries a WHEN, use the plain past — 去年日本へ行ったことがあります mixes the two and grates.", "ex": [["日本へ行ったことがあります。", "I've been to Japan."], ["すしを食べたことがありますか。", "Have you ever had sushi?"], ["京都へ行ったことがありません。", "Never been to Kyoto — yet."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "去年 uses 去, outside KANJI_DICT — furigana needed."], "claims": [], "sources": []}, {"seg": [["朝ごはん", "breakfast"], ["を", "object marker"], ["食べない", "\"don't eat\" — plain NON-past, negative"], ["ことがあります。", "THE POINT — non-past + ことがある: it sometimes happens", 1]], "segNote": "Sometimes-truths about your own routine — the honest exceptions.", "hl": "働くことがあります", "id": "kotogaaru", "step": "Step 18 · Ability, experience & degrees", "jp": "〜ことがある", "en": "sometimes happens", "setting": {"scene": "The medical form asks how often rather than whether, and there is a row of boxes between always and never that you have no vocabulary for. What you need is a way to say that a thing happens sometimes — not habitually, not never, just occasionally enough to be worth writing down.", "jp": "朝ごはんを食べないことがあります。", "en": "Some mornings I skip breakfast.", "pattern": "ことがあります"}, "ext": [{"kind": "flip", "scene": "The doctor asks about something else in the same shape, and you answer it yourself — the construction reports frequency somewhere between rarely and regularly, which is where most true answers live.", "jp": "時々、日曜日も働くことがあります。", "en": "Sometimes I work Sundays too.", "t": null}, {"kind": "wrinkle", "scene": "One kana of tense in front separates this from last lesson entirely. Past means ever, across a whole life. Present means sometimes, in an ordinary week. Nothing else in the sentence changes at all.", "jp": "食べたことがある / 食べることがある", "en": "Have eaten, ever / sometimes eat.", "t": "One kana flips it: 食べたことがある (ever) / 食べることがある (sometimes). Tense before こと is the entire difference."}], "what": "The same machine in the present tense makes a different claim: it sometimes happens. 朝ごはんを食べないことがあります — some mornings I skip.", "build": "Plain NON-PAST + ことがある, with 時々 often riding along for honesty.", "when": "Habits with exceptions, occasional slips, sometimes-truths.", "watch": "One kana of tense flips the whole meaning: 食べたことがある — have eaten, ever; 食べることがある — sometimes eat. The た is the entire difference.", "ex": [["朝ごはんを食べないことがあります。", "Some mornings I skip breakfast."], ["日曜日も働くことがあります。", "Sometimes I work Sundays too."], ["時々、映画を見に行くことがあります。", "Now and then I go see a movie."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["昨日", "yesterday"], ["は", "topic marker"], ["食べすぎました。", "THE POINT — stem + すぎる: past the right amount", 1]], "segNote": "い-adjectives drop the い first: 高い → 高すぎる.", "hl": "高すぎます", "id": "sugiru", "step": "Step 18 · Ability, experience & degrees", "jp": "〜すぎる", "en": "too much — the overdose suffix", "setting": {"scene": "The end-of-year party, the second one this week, and the walk to the station is being done slowly by everybody. What you want to say is not that you ate a lot but that you ate more than was wise, which is a judgement rather than a measurement and gets its own suffix.", "jp": "昨日は食べすぎました。", "en": "I ate too much yesterday.", "pattern": "すぎました"}, "ext": [{"kind": "flip", "scene": "You use it about something that is not food, about the evening rather than the meal, and it attaches to the front half of a verb exactly the same way.", "jp": "昨日は話しすぎました。", "en": "I talked too much last night.", "t": null}, {"kind": "wrinkle", "scene": "It chains with the regret ending from Step 13 so naturally that the two behave like one word, and in real speech the combination is what you will hear rather than either of them alone.", "jp": "テレビを見すぎてしまいました。", "en": "Watched too much television, alas.", "t": "It chains with Step 13's regret: 食べすぎてしまいました — overate, alas — is practically one word in real life."}], "what": "Attach すぎる and anything tips past its right amount: 食べすぎました — ate too much; 高すぎます — too expensive.", "build": "Verb stem + すぎる (食べすぎる); い-adjectives drop the い (高すぎる); な-adjectives attach bare (静かすぎる). The result conjugates as a る-verb.", "when": "Complaints and confessions — the two moods it was born for.", "watch": "すぎる is a judgment, not a measurement — too much FOR something. And it chains beautifully with Step 13: 食べすぎてしまいました, overate-regrettably, is practically one word in real life.", "ex": [["昨日は食べすぎました。", "I ate too much yesterday."], ["この店は高すぎます。", "This place is just too expensive."], ["テレビを見すぎてしまいました。", "Watched too much TV — and regret it."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["この本", "this book"], ["は", "topic marker"], ["読みやすいです。", "THE POINT — stem + やすい: easy-to, built into the verb", 1]], "segNote": "The dark twin: stem + にくい, hard-to. Both conjugate on as い-adjectives.", "hl": "書きにくい", "id": "yasui-nikui", "step": "Step 18 · Ability, experience & degrees", "jp": "〜やすい・〜にくい", "en": "easy-to, hard-to", "setting": {"scene": "Two textbooks for the same course, and the section head wants to know which to order for next year. One of them is not harder — it is worse laid out, with handwriting samples nobody can decipher. That distinction is the whole lesson: this pair describes the thing's character, not your ability.", "jp": "この本は読みやすいです。", "en": "This book is easy to read.", "pattern": "読みやすい"}, "ext": [{"kind": "flip", "scene": "You say the opposite about the other one, and notice that the sentence blames the book rather than the reader — which is the point, and is also the tactful way to say it in a meeting.", "jp": "この字は読みにくいです。", "en": "This handwriting is hard to read.", "t": null}, {"kind": "wrinkle", "scene": "The easy-to half sounds exactly like the word for cheap and has nothing whatever to do with it — same sound, unrelated word, and only what it attaches to tells them apart.", "jp": "使いやすい / 安い", "en": "Easy to use / cheap — same sound, no relation.", "t": "About the thing, not your skill: 読みにくい字 blames the handwriting. And this やすい is not 安い — same sound, unrelated word."}], "what": "Easy-to and hard-to, built into the verb itself: 読みやすい — easy to read; 読みにくい — hard to read.", "build": "Verb stem + やすい／にくい: 使いやすい, 書きにくい. The result is a full い-adjective and conjugates like one: 読みやすかったです.", "when": "Reviews and preferences — pens, books, apps, explanations, cities: everything gets rated on this axis.", "watch": "It describes the THING's character, not your skill: 読みにくい字 blames the handwriting, not your eyes. (やすい here has nothing to do with 安い cheap — same sound, different word.)", "ex": [["この本は読みやすいです。", "This book is easy to read."], ["このペンは書きにくいです。", "This pen is hard to write with."], ["田中さんの話はわかりやすいです。", "Tanaka's explanations are easy to follow."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["田中さん", "Tanaka"], ["は", "topic marker"], ["東京", "Tokyo"], ["に", "location of the resulting state"], ["行っています。", "THE POINT — change-verb + ている: the state AFTER the change. He's not traveling; he's THERE", 1]], "segNote": "起きる is an instant — so ている is the awake-state after it, not a slow-motion rising.", "hl": "起きています", "id": "teiru3", "step": "Step 18 · Ability, experience & degrees", "jp": "〜ている · 三回目", "en": "the third pass: verb nature decides", "setting": {"scene": "Third time this form has come round and this is the pass where the rule finally becomes sayable. Somebody asks where a colleague is, and the answer uses the same ending you have used for rain falling and for living in a city — three different jobs from one shape, and the verb decides which.", "jp": "田中さんは東京に行っています。", "en": "Tanaka has gone to Tokyo — and is there now.", "pattern": "行っています"}, "ext": [{"kind": "flip", "scene": "You use it about yourself in the middle of doing something, which is the version you met first — and the shape has not changed at all between the two sentences.", "jp": "今、レポートを書いています。", "en": "I'm writing the report now.", "t": null}, {"kind": "wrinkle", "scene": "The rule, at last, in a form you can say out loud: a verb naming an instant change wears this as a result, and a verb naming an activity wears it as the middle. Knowing which you hold answers it every time.", "jp": "知っています。住んでいます。", "en": "Instant-change verbs, worn as results.", "t": "The rule, finally statable: verbs naming an instant change wear ている as result (行っている, 知っている, 住んでいる); verbs naming an activity wear it as the middle (食べている, 読んでいる). Ask the verb which it is."}], "what": "The pass Steps 4 promised: with real verb breadth in hand, ている's split finally shows its rule. Change-verbs wear ている as RESULT; activity-verbs wear it as IN-PROGRESS.", "build": "Ask what the verb names. An instant change (行く, 来る, 起きる, 結婚する) → ている is the state AFTER: 行っている = is there, gone. A stretch of activity (食べる, 読む, 書く) → ている is the MIDDLE of it.", "when": "The classic trap this defuses: 田中さんは東京に行っています does NOT mean he's mid-journey. He went, and he's there.", "watch": "The state-pairs English blurs: 知っています (I know), 持っています (I have), 住んでいます (I live) — all change-verbs worn as results, which is why Step 4's teiru2 felt odd and now doesn't. When a ている surprises you, ask what kind of verb it rides.", "ex": [["田中さんは東京に行っています。", "Tanaka has gone to Tokyo — and is there now."], ["弟はもう起きています。", "My brother is up — awake as a state, not mid-rising."], ["今、昼ごはんを食べています。", "Eating lunch right now — a true middle."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["寝ている", "\"sleeping\" — the span, held open with ている"], ["間に", "THE POINT — 間 + に: at a point INSIDE the span (without に, the whole stretch)", 1], ["、", "a breath"], ["電話", "a phone call"], ["が", "subject marker"], ["ありました。", "\"there was\" — one event, landing once"]], "segNote": "Nouns join with の — and no に here means the working filled the WHOLE break.", "hl": "の間", "id": "aida", "step": "Step 19 · Time's edges", "jp": "〜間・〜間に", "en": "during — whole span, or a point inside", "setting": {"scene": "You slept through your phone and there are two missed calls and a message from the office. Explaining it needs a stretch of time and something that happened inside that stretch, and Japanese makes you say which of the two you mean with one extra kana.", "jp": "寝ている間に、電話がありました。", "en": "While I slept, a call came.", "pattern": "間に"}, "ext": [{"kind": "flip", "scene": "You use the other version about the same nap, where the action fills the whole span rather than landing at one point inside it — and the kana comes off.", "jp": "夏休みの間、日本語を勉強しました。", "en": "I studied Japanese all through the summer break.", "t": null}, {"kind": "wrinkle", "scene": "The main verb has to agree with the choice you made: one-shot events take the kana, span-filling actions do not. It is a promise about how the verb behaves rather than about the length of the time.", "jp": "授業の間、寝ていました。", "en": "Slept through the whole lesson — span, so no に.", "t": "The main verb must agree: one-shot events take 間に; span-filling actions take bare 間. The に is a promise about how the verb behaves."}], "what": "During, split in two: 間 for something filling the WHOLE span (夏休みの間、働きました — all through it), 間に for something landing at a POINT inside it (夏休みの間に、京都へ行きました — at some point during).", "build": "Noun + の間（に）; clause + 間（に）, the clause usually in ている: 寝ている間に. The に is the entire difference — with it, a point inside; without it, the full stretch.", "when": "Vacations, absences, while-you-were-out events, and while-you-slept ones.", "watch": "The main verb must agree with your choice: span-filling actions ride 間, one-shot actions ride 間に. 寝ている間に電話がありました — the call landed once, inside the sleeping.", "ex": [["寝ている間に、電話がありました。", "While I slept, a call came — one point inside the span."], ["夏休みの間、毎日働きました。", "All through summer break, I worked — the whole span."], ["授業の間、静かにしてください。", "Please keep quiet for the whole class."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["五時", "five o'clock — the deadline"], ["までに", "THE POINT — までに: BY then, done at or before", 1], ["帰ります。", "\"go home\" — a one-shot completion"]], "segNote": "Without the に: working UNTIL five — the state holds right up to the line.", "hl": "まで", "id": "madeni", "step": "Step 19 · Time's edges", "jp": "〜までに", "en": "by — the deadline まで isn't", "setting": {"scene": "Two sentences on the same staffroom whiteboard, both with times in them, and they mean opposite things about what happens at that hour. The meeting runs to three. The report has to be in by three. English leans on until for both, and the difference is a deadline.", "jp": "五時までに帰ります。", "en": "I'll be home by five.", "pattern": "までに"}, "ext": [{"kind": "flip", "scene": "You write the other one for your own row on the board, about something that continues rather than something that completes, and the kana comes off again without anything else changing.", "jp": "三時まで会議があります。", "en": "There's a meeting until three.", "t": null}, {"kind": "wrinkle", "scene": "The verb test never fails and takes about a second: does the action continue up to the time, or complete by it? Continuing takes the short one, completing takes the long one.", "jp": "三時までにレポートを出します。", "en": "I'll hand the report in by three.", "t": "The verb-test never fails: continues to the time → まで; completes by the time → までに."}], "what": "By, not until. までに sets a deadline — done at or before that time. まで holds a state up to a time. One kana apart, a missed train between them.", "build": "Time + までに + a one-shot action: 五時までに帰ります. Time + まで + a continuing state: 五時まで働きます.", "when": "Deadlines, submissions, last trains — anywhere lateness has a price.", "watch": "The test is the verb: does it CONTINUE up to the time (まで), or COMPLETE by it (までに)? 三時まで会議があります; 三時までにレポートを出します.", "ex": [["五時までに帰ります。", "I'll be home BY five — done by then."], ["五時まで働きます。", "I work UNTIL five — continuing to then."], ["明日までにレポートを書いてください。", "Please write the report by tomorrow."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["今", "now — this form's favorite word"], ["、", "a breath"], ["家", "the house"], ["を", "を with 出る — leaving a place takes を"], ["出るところです。", "THE POINT — plain non-past + ところ: on the verge, caught at the doorway", 1]], "segNote": "ている + ところ — caught mid-act. The three tenses of ところ are three freeze-frames.", "hl": "食べているところ", "id": "tokoro", "step": "Step 19 · Time's edges", "jp": "〜るところ・〜ているところ・〜たところ", "en": "where you are in the act", "setting": {"scene": "A phone call at the exact moment you are putting your shoes on, asking whether you have left yet. There are three honest answers depending on which second you are standing in — about to, in the middle of, just finished — and Japanese has a single frame with three settings for exactly this.", "jp": "今、家を出るところです。", "en": "I'm just about to leave.", "pattern": "ところです"}, "ext": [{"kind": "flip", "scene": "They ring again forty minutes later and the answer has moved two settings along the same frame, which is the only thing about the sentence that changed between the two calls.", "jp": "今、着いたところです。", "en": "I've just this second arrived.", "t": null}, {"kind": "wrinkle", "scene": "The just-finished setting is strictly this instant, and next lesson's near-synonym is not — which is why one of them can stretch to a month and this one cannot stretch past a minute.", "jp": "今帰ってきたところです。", "en": "Just got back — and it can only mean just now.", "t": "たところ is strictly this-instant; たばかり (next) stretches with felt recency. 今帰ってきたところ can only be now; 先月来たばかり can be a month old."}], "what": "ところ — \"place\" — turned into time: where you ARE inside an action. 食べるところ (about to), 食べているところ (mid-act), 食べたところ (just did).", "build": "Plain non-past + ところ = on the verge. ている + ところ = caught in the middle. Plain past + ところ = fresh off it. Usually closed with です.", "when": "The phone-answer sentence: 今、出るところです — just heading out. Timing talk, gentle excuses, doorway conversations.", "watch": "たところ is strictly this-moment fresh; たばかり (next lesson) stretches with your FEELING of recency. The next drill splits them.", "ex": [["今、家を出るところです。", "Just about to leave the house."], ["今、昼ごはんを食べているところです。", "In the middle of lunch right now."], ["今、帰ってきたところです。", "Just this minute got home."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["先月", "last month — a real calendar distance"], ["、", "a breath"], ["日本", "Japan"], ["に", "destination"], ["来たばかりです。", "THE POINT — plain past + ばかり: just arrived, by the clock of feeling", 1]], "segNote": "The learner's shield: I've only just started — so be patient with me.", "hl": "始めたばかり", "id": "bakari", "step": "Step 19 · Time's edges", "jp": "〜たばかり", "en": "just did it — as felt", "setting": {"scene": "Six weeks in and somebody at a dinner asks how the Japanese is coming along. Six weeks is not new by the calendar — it is two pay slips and a haircut — but from the inside it is still the first week, and the question deserves the inside answer.", "jp": "先月、日本に来たばかりです。", "en": "I only just came to Japan.", "pattern": "ばかり"}, "ext": [{"kind": "flip", "scene": "You use it about the job rather than about the country, which is also a small request folded into a statement about time — be patient with me, I have only just got here.", "jp": "始めたばかりです。", "en": "I've only just started.", "t": null}, {"kind": "wrinkle", "scene": "This one measures by feel and last lesson's measures by clock. A month can still be this if it still feels fresh; claiming the strict one about last month would simply be false.", "jp": "先月来たばかりです。", "en": "Elastic — where たところ could not stretch at all.", "t": "ばかり is elastic where ところ is strict: a month can still be ばかり if it feels fresh. Claiming 先月来たところ, though, would be false — the instant is long gone."}], "what": "Recency by your own clock: 先月日本に来たばかりです — only just arrived. A month ago by the calendar; fresh by feel — and ばかり sides with the feel.", "build": "Plain past + ばかりです.", "when": "Excusing inexperience and marking new arrivals: 始めたばかりです — I've only just started (so be patient with me).", "watch": "たところ is objective this-instant; たばかり is subjective recency — a month can be ばかり if it still feels that way. The elasticity is the point, not a flaw.", "ex": [["先月、日本に来たばかりです。", "I only just came to Japan — last month, but it's fresh."], ["日本語を始めたばかりです。", "I've only just started Japanese."], ["さっき食べたばかりです。", "I literally just ate."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["朝ごはん", "breakfast"], ["を", "object marker"], ["食べないで", "THE POINT — ない + で: without doing — the missing accompaniment", 1], ["学校", "school"], ["へ", "destination marker"], ["行きました。", "\"went\" — the main act, minus its usual companion"]], "segNote": "The brave version: writing kanji without looking. ないで marks what DIDN'T come along.", "hl": "見ないで", "id": "naide", "step": "Step 19 · Time's edges", "jp": "〜ないで", "en": "without doing", "setting": {"scene": "A morning that went wrong in a specific way: the alarm, the train, and out of the door with nothing eaten. What the sentence has to report is not a reason for anything but the manner of the going — the same action, minus something that normally belongs in it.", "jp": "朝ごはんを食べないで学校へ行きました。", "en": "I went to school without breakfast.", "pattern": "ないで"}, "ext": [{"kind": "flip", "scene": "You use it about the report you handed in, which was finished and not checked — again a manner rather than an excuse, and the distinction matters to how the sentence lands.", "jp": "読まないで出しました。", "en": "I handed it in without reading it.", "t": null}, {"kind": "wrinkle", "scene": "Written Japanese swaps in a shorter form that means exactly the same thing in formal dress. Worth recognising now on documents and notices, and worth producing yourself considerably later on.", "jp": "食べずに", "en": "Same meaning, written register — 〜ずに.", "t": "Written Japanese swaps in 〜ずに: 食べずに. Same meaning, formal dress — recognize it now, produce it later."}], "what": "The missing accompaniment: ないで hangs a not-done action off the main one. 朝ごはんを食べないで学校へ行きました — went to school without eating.", "build": "ない form + で, then the main clause. The formal written twin is 〜ずに: 食べずに.", "when": "Skipped steps, forgotten steps, minimalist mornings, brave attempts (見ないで書く — writing without looking).", "watch": "Not the same as なくて, which gives a REASON and pairs with feelings or results. ないで is manner — HOW the main act was done, minus something.", "ex": [["朝ごはんを食べないで学校へ行きました。", "Went to school without breakfast."], ["何も見ないで漢字を書きました。", "Wrote the kanji without looking at anything."], ["寝ないで勉強しました。", "Studied without sleeping — not recommended, grammatically flawless."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-madeni", "step": "Step 19 · Time's edges", "jp": "まで vs までに", "en": "until vs by", "setting": {"scene": "The trap is real and it is not subtle once you see it: English leans on until for two things Japanese keeps apart. One is a stretch the action fills. The other is a deadline the action has to beat. Getting them the wrong way round tells your section head something untrue about when the work will exist.", "jp": "三時まで会議があります。", "en": "The meeting RUNS until three.", "pattern": "まで"}, "ext": [{"kind": "flip", "scene": "You write the deadline version yourself for the thing you owe her by Friday, and the whole difference between the two rows on the board turns out to be one kana that converts a duration into a due date.", "jp": "三時までにレポートを出します。", "en": "I'll hand the report in by three.", "t": null}, {"kind": "extra", "scene": "You check both sentences on the board against the test and they sort themselves immediately, which is the point — the rule is mechanical once you ask the right question.", "jp": "五時まで待ちます。五時までに帰ります。", "en": "I'll wait until five. I'll be home by five.", "t": "The fix is the verb test, every time, and it takes a second. Does the action CONTINUE up to that time, or COMPLETE by it? Continuing takes まで. Completing takes までに. Nothing about the time itself decides it."}], "what": "The smallest particle difference with the biggest scheduling consequences. まで rides continuing states; までに rides completions. Get them backward and you've promised to work at the deadline instead of finishing by it.", "build": "Ask the verb: still happening at that time → まで. Finished at or before it → までに.", "when": "Every deadline, every meeting, every last train.", "watch": "英語 speakers lean on \"until\" for both — the trap is real and the fix is the verb-test, every time.", "ex": [["三時まで会議があります。", "The meeting RUNS until three."], ["三時までにレポートを出します。", "The report lands BY three."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["母", "Mom — the will behind the act"], ["は", "topic marker"], ["弟", "my brother — the one caused"], ["に", "the caused person takes に (a を-object follows)"], ["野菜", "vegetables"], ["を", "object marker"], ["食べさせました。", "THE POINT — the causative: made (or let) him eat", 1]], "segNote": "The letting side of the same form — permission and coercion share machinery; context arbitrates.", "hl": "遊ばせました", "id": "saseru", "step": "Step 20 · Doing to & being done to", "jp": "〜させる", "en": "the causative — making and letting", "setting": {"scene": "A parent describing the evening routine at a parents' evening, and half of it is about getting a nine-year-old to do things he has no intention of doing. English uses make and let and keeps them apart; Japanese uses one form for both and lets the situation decide which you meant.", "jp": "母は弟に野菜を食べさせました。", "en": "Mum made my brother eat his vegetables.", "pattern": "食べさせました"}, "ext": [{"kind": "flip", "scene": "You use the letting half yourself, about a child who wanted to finish something after the bell had gone, and it is the same conjugation carrying the opposite social weight entirely.", "jp": "子どもに歌を歌わせました。", "en": "I let the children sing.", "t": null}, {"kind": "wrinkle", "scene": "Hidden inside this form is the most useful polite request you will learn all year — asking permission by making yourself the person who is being allowed to do the thing.", "jp": "すみません、今日は早く帰らせてください。", "en": "Sorry — please let me leave early today.", "t": "The everyday gold: 〜させてください — \"please let me.\" 帰らせてください asks a favor with the causative's own grammar."}], "what": "One form, two forces: 食べさせました can be MADE him eat or LET him eat — coercion and permission share the machinery, and context arbitrates.", "build": "う-verbs: あ-row + せる (行く→行かせる, 飲む→飲ませる). る-verbs: させる (食べさせる). する→させる, 来る→来させる. The person caused takes に when there's a を-object, を when there isn't.", "when": "Parenting, managing, granting — anywhere one will moves another.", "watch": "The politeness lifeline hiding inside: 〜させてください — \"please let me\" — is the causative's most useful everyday shape: 今日は早く帰らせてください.", "ex": [["母は弟に野菜を食べさせました。", "Mom made my brother eat his vegetables."], ["子どもを公園で遊ばせました。", "We let the kids play in the park."], ["すみません、今日は早く帰らせてください。", "Please let me leave early today — the causative asking a favor."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["母", "Mom — the maker"], ["に", "the maker takes に in the causative-passive"], ["野菜", "vegetables"], ["を", "object marker"], ["食べさせられました。", "THE POINT — causative then passive: made-to, felt keenly", 1]], "segNote": "する-verbs stack the same way: 掃除させる → 掃除させられる.", "hl": "掃除させられました", "id": "saserareru", "step": "Step 20 · Doing to & being done to", "jp": "〜させられる", "en": "made to do — and feeling it", "setting": {"scene": "Half past one, and your class is cleaning the corridor they walk down every day — brooms, cloths, fifteen minutes of it, in the timetable rather than beside it. You say something about it to the teacher next to you, who is old enough to have done it himself for twelve years, and he laughs before he answers.", "jp": "毎日、そうじをさせられました。", "en": "I was made to do the cleaning every day.", "pattern": "させられました"}, "ext": [{"kind": "flip", "scene": "You tell him about your own school in return, about an instrument nobody chose to play, and the form carries the grievance without a single word of complaint anywhere in the sentence.", "jp": "毎日、漢字を書かせられました。", "en": "I was made to write kanji every day.", "t": null}, {"kind": "wrinkle", "scene": "Two moves, in strict order — causative first, then passive — and speech contracts the long ones, so what you actually hear across a table is shorter than what you learn to build.", "jp": "飲まされました。", "en": "Made to drink — the contracted form you'll hear.", "t": "Two moves, strict order: causative first (食べさせる), passive second (させられる). Speech contracts う-verbs — 飲まされる, 行かされる — recognize the short forms, build the long ones."}], "what": "The causative-passive: someone made you, and the grammar carries the grudge. 野菜を食べさせられました — I was made to eat them, resentment included.", "build": "Two moves, always in order: causative first (食べさせる), then passive (食べさせられる). The maker takes に. Speech often contracts う-verbs: 飲まされる, 行かされる.", "when": "Complaints about obligation — school, work, childhood. The natural habitat is the sigh.", "watch": "This is the longest everyday conjugation in the language. Build it in two steps every time — trying to jump straight to させられる is where it breaks.", "ex": [["母に野菜を食べさせられました。", "Mom made me eat the vegetables — and I felt it."], ["母に部屋を掃除させられました。", "Got made to clean my room."], ["会議で歌を歌わせられました。", "They made me sing at the meeting. There are no winners."]], "orphanWr": [], "flags": ["Lloyd teaches in a Japanese school and is the best available check on this one.", "The 用務員 correction lives only in claims[] — it did not fit the setting at 45-80 words. If it should be visible to the learner it needs its own sentence."], "claims": ["A daily cleaning slot of roughly 15-30 minutes, usually after lunch, is standard in Japanese schools", "Cleaning appears in the national curriculum standards (学習指導要領), not as an extracurricular add-on", "CORRECTS A COMMON CLAIM: Japanese schools do employ caretaking staff (用務員) — 'Japanese schools have no janitors' is wrong"], "sources": ["https://omakase-tokyo.com/blogs/news/no-janitors-heres-why-japanese-kids-clean-their-own-schools", "https://web-japan.org/kidsweb/cool/21/202101_on-duty-activity_en.html", "https://www.gov-online.go.jp/hlj/en/december_2025/december_2025-03.html"]}, {"seg": [["がんばれ！", "THE POINT — the bare imperative: え-row command. Cheering suspends the rudeness entirely", 1]], "segNote": "The mirror: dictionary form + な — the sign's don't.", "hl": "入るな", "id": "meirei", "step": "Step 20 · Doing to & being done to", "jp": "命令形・〜な", "en": "the bare command — recognize, rarely produce", "setting": {"scene": "Sports day, and the entire field is shouting one word at a child running the last hundred metres. It is a bare command, the rudest form in the language, and nobody within a kilometre thinks it is rude — because cheering suspends the rudeness completely, which is the only everyday place it does.", "jp": "がんばれ！", "en": "Go on! You've got this!", "pattern": "がんばれ"}, "ext": [{"kind": "flip", "scene": "You shout it yourself, which is the one time all year you will produce this form on purpose, and then you spend the rest of the year only recognising it.", "jp": "見て！", "en": "Look! — the softer everyday alternative.", "t": null}, {"kind": "wrinkle", "scene": "Production is rare and recognition is constant: signs, sports, fiction. Characters bark it at each other for dramatic reasons that do not transfer to a staffroom on an ordinary Tuesday.", "jp": "止まれ", "en": "STOP — on a sign, where it belongs.", "t": "Production is rare; recognition is constant — signs, sports, fiction. Anime characters bark 命令形 at each other for dramatic reasons that do not apply to your office."}], "what": "The imperative and its mirror: 行け — go!; 行くな — don't you dare. Real Japanese, rare in polite speech, everywhere in signs, sports, and fiction.", "build": "う-verbs: え-row (行け, 飲め). る-verbs: ろ (食べろ). する→しろ, 来る→こい. The prohibitive is dictionary form + な: 入るな.", "when": "RECOGNITION is the job: signs (ここに入るな), cheering (がんばれ！), emergencies, and every action scene ever written.", "watch": "がんばれ！ is the one command everyone says — cheering suspends the rudeness entirely. Between adults otherwise, a bare imperative reads as aggression; your request form remains てください.", "ex": [["がんばれ！", "Go! You've got this! — the cheering imperative."], ["ここに入るな。", "KEEP OUT — the sign's な."], ["早くしろ！", "Hurry UP! — fiction and emergencies only."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["早く", "\"quickly / early\" — the adverb from 早い"], ["寝なさい。", "THE POINT — stem + なさい: the parent's imperative, downward only", 1]], "segNote": "Every dinner table, every night — なさい is domestic weather.", "hl": "食べなさい", "id": "nasai", "step": "Step 20 · Doing to & being done to", "jp": "〜なさい", "en": "the parent-and-teacher imperative", "setting": {"scene": "The imperative you will actually meet in print, on every worksheet and every exam paper in the building, and on nobody's lips except a parent's. From a question sheet it is neutral instruction. Aimed sideways at an adult it is parenting them, and it lands exactly that way.", "jp": "早く寝なさい。", "en": "Go to bed.", "pattern": "なさい"}, "ext": [{"kind": "flip", "scene": "You write it on a worksheet yourself, which is where it is entirely neutral — the same word doing an administrative job rather than a domestic one, and nobody reads anything into it.", "jp": "質問に答えなさい。", "en": "Answer the question.", "t": null}, {"kind": "wrinkle", "scene": "Downward only. Used at a colleague it does not read as brisk, it reads as talking to them like a child, and adult-to-adult requests stay with the forms from Step 5.", "jp": "答えてください。", "en": "Please answer — the sideways version.", "t": "Exams speak it too: 答えなさい. From a worksheet it's neutral instruction; from you to a colleague it's parenting them. Downward only."}], "what": "Softer than the bare command, still an order: 早く寝なさい — go to bed. The register of parents, teachers, and worksheets.", "build": "Verb stem + なさい: 食べなさい, 起きなさい. Test papers speak it too: 答えなさい — answer the question.", "when": "Downward only — adult to child, teacher to student, exam to examinee.", "watch": "Never sideways or up: なさい at a colleague is parenting them, and it lands exactly that way. Adult-to-adult requests stay with てください and its softer cousins.", "ex": [["早く寝なさい。", "Go to bed — every parent, every night."], ["野菜も食べなさい。", "Eat your vegetables too."], ["よく読んで、答えなさい。", "Read carefully and answer — the exam's voice."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "質問 is Step 22 bank; used one step early."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-rareru", "step": "Step 20 · Doing to & being done to", "jp": "られる collision", "en": "one shape, three readings", "setting": {"scene": "One shape, three readings, all arriving in the same fortnight: it can be done, it was done to me, and the polite form of a verb. Nothing on the page separates them. The rest of the sentence has to do the disambiguating, which is why this collision gets a lesson of its own.", "jp": "ここから山が見られます。", "en": "The mountain can be seen from here — potential.", "pattern": "見られます"}, "ext": [{"kind": "flip", "scene": "You build the other reading of the identical shape, where something happened to somebody rather than being possible, and only the particles and the surrounding context tell the two of them apart.", "jp": "先生に名前を聞かれました。", "en": "The teacher asked me my name — passive.", "t": null}, {"kind": "extra", "scene": "Half the people around you drop the ら in speech, which removes the ambiguity you have just spent a lesson learning to live with — and a marker will still take it off you in writing.", "jp": "見れる", "en": "Spoken potential, ら dropped — clear, common, and marked wrong on paper.", "t": "ら抜き — 見れる, 食べれる for the potential — is widespread, genuinely useful because it disambiguates, and still marked wrong in formal writing. Recognise both; write the long one."}], "what": "見られる is can-see (potential), is-seen (passive), or — in keigo, waiting in Stage 3 — an exalted person simply seeing. One shape, three machines; particles and context arbitrate.", "build": "Potential: the seeable thing takes が. Passive: a doer stands by with に. Honorific: the subject outranks you and nothing else is odd. る-verbs collide completely; う-verbs split cleanly (読める vs 読まれる) — which is exactly why speech invented ら抜き.", "when": "Every られる you meet from now on: run the three-way check before assuming.", "watch": "ら抜き — 見れる, 食べれる for the potential — is widespread, genuinely disambiguating, and still marked wrong in formal writing. Recognize both; write the full form.", "ex": [["ここから山が見られます。", "The mountain can be seen from here — potential, が."], ["先生に見られました。", "I was seen by the teacher — passive, に. Guilt sold separately."], ["見れる・食べれる", "ら抜き — speech's own fix for this collision. Recognize; don't write."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "山 is outside the Step 20 bank; from the module's own example."], "claims": [], "sources": []}, {"seg": [["安いし", "\"cheap, and…\" — the first stacked reason"], ["、", "a breath"], ["おいしいし", "THE POINT — し: another reason, with more implied beyond it", 1], ["、", "a breath"], ["あの店", "that shop"], ["が", "subject marker"], ["いいですよ。", "the conclusion the reasons were building toward"]], "segNote": "Nouns and な-adjectives bring だ before し: 雨だし.", "hl": "だし", "id": "shi", "step": "Step 21 · Reasons, concessions & flow", "jp": "〜し", "en": "reasons that stack", "setting": {"scene": "Somebody is choosing where to take a visiting inspector to lunch and has asked you, which means your answer needs to sound like a recommendation rather than a single reason. You have three reasons and no wish to rank them, and there is a joint that stacks them while implying there are more.", "jp": "安いし、おいしいし、あの店がいいですよ。", "en": "It's cheap, it's good — that place is the one.", "pattern": "し"}, "ext": [{"kind": "flip", "scene": "You use it about why you are not going out on Sunday, where the same open-ended stacking works as a soft excuse — reasons among others, none of them the whole story.", "jp": "雨だし、時間もないし。", "en": "It's raining, I've no time…", "t": null}, {"kind": "wrinkle", "scene": "One of these is enough to change the flavour. Even a single one hints at unnamed more, where the から from Step 11 names the reason and closes the list.", "jp": "安いから、あの店がいいですよ。", "en": "から names THE reason; し leaves the list open.", "t": "から names THE reason; し offers reasons-among-others, list deliberately unfinished. Even a single し carries that \"and more\" flavor."}], "what": "Reasons piled up, with more implied: 安いし、おいしいし、あの店がいいですよ — cheap, AND tasty, AND (the list could go on) — that shop's the one.", "build": "Plain form + し, stackable. Nouns and な-adjectives bring だ: 雨だし, 静かだし. The conclusion can follow — or the reasons can simply trail off, carrying it unspoken.", "when": "Justifying choices without pinning everything on one cause — the polite pile-up.", "watch": "から names THE reason; し offers reasons-among-others. Even one し hints at unnamed more — that hint is the flavor, use it on purpose.", "ex": [["安いし、おいしいし、あの店がいいですよ。", "Cheap, tasty — that place is the one."], ["今日は雨だし、家にいましょう。", "It's raining (among other things) — let's stay in."], ["時間もないし、また今度。", "No time, and so on — next time, then."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["勉強した", "\"studied\" — plain past; the effort"], ["のに", "THE POINT — のに: and yet — expectation betrayed, sting included", 1], ["、", "a breath"], ["忘れてしまいました。", "\"forgot, alas\" — Step 13's regret stacking onto the ache"]], "segNote": "Nouns take な before のに: 日曜日なのに — it's SUNDAY, and yet.", "hl": "なのに", "id": "noni", "step": "Step 21 · Reasons, concessions & flow", "jp": "〜のに", "en": "although — with feeling", "setting": {"scene": "You spent Saturday morning making something to take to a barbecue — the four-hour version, from scratch, because you wanted to turn up with something real. You arrive and there are three of the same thing already on the table, all shop-bought, and yours goes home again untouched.", "jp": "勉強したのに、忘れてしまいました。", "en": "I studied — and still forgot.", "pattern": "のに"}, "ext": [{"kind": "flip", "scene": "You say it about the barbecue itself rather than about studying, and the joint carries an ache that the neutral but from Step 11 simply does not have available to it.", "jp": "作ったのに、誰も食べませんでした。", "en": "I made it, and nobody ate any.", "t": null}, {"kind": "wrinkle", "scene": "Left trailing and unfinished, it is reproach distilled — and the sentence does not need completing at all, because the ache inside it is already whole without any second half.", "jp": "せっかく作ったのに…", "en": "After I went to all that trouble…", "t": "The trailing のに is reproach distilled: せっかく作ったのに… — after I went to the trouble… The sentence doesn't need finishing; the ache is complete."}], "what": "Expectation betrayed, and the grammar carries the sting: 勉強したのに、忘れました — I studied, AND YET. けど states contrast; のに aches.", "build": "Plain form + のに. Nouns and な-adjectives take な: 日曜日なのに, 静かなのに.", "when": "Disappointments, surprises, gentle reproaches — anywhere the world broke a promise to you.", "watch": "Don't spend のに on neutral contrasts — that's けど's job, and misused のに sounds like sulking. The trailing version is reproach distilled: せっかく作ったのに… — after I went to the trouble…", "ex": [["勉強したのに、忘れてしまいました。", "I studied — and still forgot. The しまう stacks the regret."], ["日曜日なのに、働いています。", "It's SUNDAY, and yet here I am working."], ["高かったのに、おいしくなかったです。", "Expensive — and it wasn't even good."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["雨", "rain"], ["が", "subject marker"], ["降っても", "THE POINT — て-form + も: even if — conceded, and overridden", 1], ["、", "a breath"], ["行きます。", "\"I'm going\" — the spine of the sentence"]], "segNote": "い-adjectives: くても. Nouns and な-adjectives: でも — 雨でも行きます.", "hl": "高くても", "id": "temo", "step": "Step 21 · Reasons, concessions & flow", "jp": "〜ても", "en": "even if — concede and continue", "setting": {"scene": "Sports day again, the forecast is bad, and somebody has to say out loud what happens if it rains — because the answer is that it goes ahead regardless. That is a concession rather than a condition: the rain is granted first, and then overridden.", "jp": "雨が降っても、行きます。", "en": "Even if it rains, I'm going.", "pattern": "ても"}, "ext": [{"kind": "flip", "scene": "You use it about a price rather than about the weather, conceding the objection and then continuing straight past it, which is exactly what makes this different from an if.", "jp": "高くても、買います。", "en": "Even if it's pricey, I'm buying it.", "t": null}, {"kind": "wrinkle", "scene": "Same rain, opposite spines: one form cancels the plan and this one overrides it. And the permission question from Step 5 was this joint all along — even if I do this, is it all right?", "jp": "降ったら行きません / 降っても行きます", "en": "たら cancels; ても overrides.", "t": "たら cancels, ても overrides: 降ったら行きません / 降っても行きます — same rain, opposite spines. And Step 5's てもいいですか was this ても all along."}], "what": "The override: 雨が降っても、行きます — even if it rains, I'm going. ても concedes the condition and drives through it.", "build": "て-form + も: 降っても. い-adjectives: くても (高くても). Nouns and な-adjectives: でも (雨でも). いくら〜ても turns it universal: いくら勉強しても — no matter how much.", "when": "Determination, reassurance, and no-matter-what claims.", "watch": "たら cancels, ても overrides: 降ったら行きません / 降っても行きます — same rain, opposite spines. And Step 5's てもいいですか was this ても all along: \"even if I do it, is it fine?\"", "ex": [["雨が降っても、行きます。", "Even if it rains, I'm going."], ["高くても、買います。", "Even if it's pricey, I'm buying it."], ["いくら勉強しても、忘れます。", "No matter how much I study, it slips away. (The next step's grammar can't fix this; spaced review can.)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["雨が降りました。", "\"It rained.\" — a full sentence, full stop"], ["それで、", "THE POINT — それで: and so — the consequence joint", 1], ["家にいました。",
