 END: 食べてから行きました casts the whole chain into the past. And one てから per sentence is the natural load — chains of three read as a list wearing a costume.", "ex": [["手を洗ってから食べます。", "I eat after washing my hands."], ["仕事が終わってから飲みに行きました。", "After work ended, I went drinking."], ["仕事が終わってから、何をしますか。", "The after-work question — sequence inside a question."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "atode", "step": "Step 7 · Linking actions & time", "jp": "〜たあとで", "en": "after ...", "setting": {"scene": "A colleague asks whether you want to come to the thing after work on Friday, and the answer depends entirely on what order the evening happens in — there is a meeting, then the thing, and you can only manage one of them. The sentence you need is about what follows what.", "jp": "ごはんを食べたあとで散歩します。", "en": "I take a walk after eating.", "pattern": "あとで"}, "ext": [{"kind": "flip", "scene": "You answer with your own version, about the meeting rather than dinner, and the whole sentence is about Friday — which has not happened yet, and which makes the next part surprising.", "jp": "会議が終わったあとで行きます。", "en": "I'll go after the meeting finishes.", "t": null}, {"kind": "wrinkle", "scene": "The verb in front is in the past even though every word of the sentence is about the future. That past is not marking time; it is marking completed-relative-to the other half, and the sentence's real tense waits at the end.", "jp": "食べたあとで散歩します。", "en": "Past form, future sentence — た marks completion, not time.", "t": "The verb before あとで is ALWAYS plain past — even when the whole sentence is about the future: 食べたあとで散歩します, \"after I('ll have) eaten, I'll walk.\" The tense of the sentence lives at its end."}], "what": "After X — looser than てから, and happy to take a noun.", "build": "Plain PAST verb + あとで (食べたあとで), or noun + のあとで (仕事のあとで).", "when": "Afterwards-plans, and gentle scheduling: 会議のあとで話しましょう.", "watch": "The verb before あとで is ALWAYS plain past — even when everything is in the future: 食べたあとで行きます. The た marks completed-relative-to, not past-in-time; English tense instinct fights this exactly once a sentence.", "ex": [["ごはんを食べたあとで散歩します。", "I take a walk after eating."], ["授業のあとで図書館へ行きます。", "After class I go to the library."], ["仕事のあとで、飲みに行きませんか。", "Noun + のあとで, wrapped in an invitation."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "maeni", "step": "Step 7 · Linking actions & time", "jp": "〜まえに", "en": "before ...", "setting": {"scene": "The dentist's form asks what you do before bed, which is a question you can answer in English in four words and cannot answer in Japanese at all. Everything you have learned this step joins two actions in one order; this one joins them in the other.", "jp": "寝るまえに歯をみがきます。", "en": "I brush my teeth before sleeping.", "pattern": "まえに"}, "ext": [{"kind": "flip", "scene": "She asks about the medicine you are on and whether you take it before food, and you build the sentence yourself out of the same joint — with the verb in front sitting in its plain, unbent, dictionary shape.", "jp": "食べるまえに薬を飲みます。", "en": "I take the medicine before eating.", "t": null}, {"kind": "wrinkle", "scene": "Then you say something about last year, and the verb in front stubbornly refuses to go into the past even though the event plainly did. This joint takes the present regardless, and the sentence's tense lives at the very end.", "jp": "日本に来る前に、日本語を勉強しました。", "en": "Before coming to Japan, I studied Japanese — 来る, not 来た.", "t": "The mirror rule to あとで: before-clauses take plain PRESENT even about the past. The sentence's tense lives at the end, never in the joint."}], "what": "Before X — あとで's mirror.", "build": "DICTIONARY form + 前に (寝る前に), or noun + の前に (食事の前に).", "when": "Routines and warnings: before bed, before eating, before the meeting.", "watch": "The mirror rule: BEFORE takes dictionary form even for past events — 食べる前に手を洗いました. Pair it with あとで's rule and keep both: before→る, after→た, regardless of when anything actually happened. The pair is one of the cleanest systems in the language once you stop consulting English tense.", "ex": [["寝るまえに歯をみがきます。", "I brush my teeth before sleeping."], ["食事のまえに手を洗います。", "I wash my hands before meals."], ["日本に来る前に、日本語を勉強しましたか。", "Dictionary form before 前に — even though everything here is past."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "nagara", "step": "Step 7 · Linking actions & time", "jp": "〜ながら", "en": "while doing", "setting": {"scene": "Marking, forty exercise books, and the staffroom radio left on because the room is otherwise quiet enough to hear the clock on the wall. Somebody comes in and asks what you are doing, and the honest answer has two verbs in it — both belonging to the same person, across the same stretch of the same afternoon.", "jp": "音楽を聞きながら勉強します。", "en": "I study while listening to music.", "pattern": "ながら"}, "ext": [{"kind": "flip", "scene": "You ask her the same about her own evenings, and the pattern goes out as easily as it came in — two things, one body, happening across the same stretch of time.", "jp": "話しながら歩きました。", "en": "We walked while talking.", "t": null}, {"kind": "wrinkle", "scene": "You say it the other way round and change what you claimed to be doing. The verb after the joint is the main one, so the order is not decoration — it decides which activity you were actually engaged in.", "jp": "勉強しながら音楽を聞きます。", "en": "Listening to music, with studying alongside — the priority flipped.", "t": "The verb after ながら is the main one. 音楽を聞きながら勉強します is studying (with music on), not listening (while studying) — position assigns the priority."}], "what": "Doing X while doing Y — two actions, one person, one main event.", "build": "ます-stem + ながら, main action LAST: 音楽を聞きながら勉強します — the studying is the point; the music is backdrop.", "when": "Multitasking of every kind — and describing your habits: テレビを見ながら食べます.", "watch": "One body only: both actions belong to the same person. Two different people doing things at once needs 〜ている間に, later. And the order is meaningful — the ながら clause is the background; swap them and you claim to be mainly listening while incidentally studying.", "ex": [["音楽を聞きながら勉強します。", "I study while listening to music."], ["歩きながら話しましょう。", "Let's talk while walking."], ["歩きながら話しましょう。", "Let's talk while we walk — background action first, main action last."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "taritari", "step": "Step 7 · Linking actions & time", "jp": "〜たり〜たりします", "en": "do things like A and B", "setting": {"scene": "Monday morning and the small talk is about the weekend. You did five or six things, none in an order anyone needs, and two of them you would rather not go into. What the question wants is a flavour of two days rather than a timetable of them.", "jp": "週末は本を読んだり、映画を見たりします。", "en": "At weekends I read, watch films, that sort of thing.", "pattern": "たり"}, "ext": [{"kind": "flip", "scene": "You ask her the same back and get a list built the identical way — a sample, openly incomplete, with the honest implication that there were other things and neither of you is listing them.", "jp": "音楽を聞いたり、散歩したりしました。", "en": "I listened to music, went for a walk, and so on.", "t": null}, {"kind": "wrinkle", "scene": "You drop the closing verb because the list already felt finished, and the sentence hangs unfinished instead. That final one is not decoration — it is carrying the tense for everything in front of it.", "jp": "読んだり見たりしました。", "en": "The closing します/しました holds the tense for the whole list.", "t": "たり is the plain past + り, and the sentence MUST close with する — that final します/しました carries tense for the whole list. Dropped closers are the most common たり error."}], "what": "Doing things LIKE X and Y — a sample of activities, order not implied.", "build": "た-form + り, repeat, close with する — which carries all the tense: 読んだり書いたりします, 読んだり書いたりしました.", "when": "Describing weekends, hobbies, and any answer to what-do-you-do questions that deserves more than one verb.", "watch": "The final する is not optional — it holds the tense, and without it the sentence hangs unfinished. And unlike てから, no order is claimed: 食べたり飲んだりしました scatters the evening; 食べてから飲みました schedules it.", "ex": [["週末は本を読んだり、映画を見たりします。", "On weekends I read books, watch movies, and so on."], ["日曜日は掃除したり、洗濯したりしました。", "On Sunday I cleaned, did laundry, and such."], ["週末は何をしますか。— 映画を見たり、買い物したりします。", "The weekend question and its sampling answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "kata", "step": "Step 7 · Linking actions & time", "jp": "〜かた", "en": "how to ...", "setting": {"scene": "A character on a school form that you can see, copy and not read, in a word nobody will pronounce for you because everybody assumes you can. What you need is not the meaning but the method — and Japanese turns a verb into a way-of-doing-it by bolting one syllable onto its stem.", "jp": "漢字の読み方を教えてください。", "en": "Please teach me how to read this kanji.", "pattern": "読み方"}, "ext": [{"kind": "flip", "scene": "It works on anything. The ticket machine at the station has beaten you twice, and the same construction turns using it into a noun you can ask a stranger about.", "jp": "使い方がわかりません。", "en": "I don't know how to use it.", "t": null}, {"kind": "wrinkle", "scene": "What comes out the other end is a full noun, which means the particle in front has to change — the thing you are reading stops taking the object marker and takes the glue from Step 3 instead.", "jp": "漢字の読み方がわかりません。", "en": "漢字の, not 漢字を — the result is a noun.", "t": "The result is a full NOUN — it takes の before it and が・を after it like any other noun: 漢字の読み方がわかりません."}], "what": "How-to as a noun: 方(かた) turns a verb into the way of doing it.", "build": "ます-stem + 方: 読み方, 使い方, 作り方. The result is a NOUN, so it takes の from what it attaches to: 漢字の読み方.", "when": "Asking how anything works — which makes it one of the most useful question machines you own.", "watch": "The を becomes の: 漢字を読む, but 漢字の読み方 — keeping the を (漢字を読み方) is the signature error. This is also の quietly doing its noun-glue job from Step 3, one more time.", "ex": [["漢字の読み方を教えてください。", "Please teach me how to read this kanji."], ["この機械の使い方がわかりません。", "I don't know how to use this machine."], ["すみません、この漢字の読み方を教えてください。", "The learner's power tool: how-to + please-teach in one sentence."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "方 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"id": "toki", "step": "Step 7 · Linking actions & time", "jp": "〜とき", "en": "when ...", "setting": {"scene": "You bought a suitcase for the move. Whether you bought it at home in the week you were packing, or in a department store three days after you landed, is a difference every listener hears — and it turns on one character in the sentence you tell it with.", "jp": "ひまなとき、音楽を聞きます。", "en": "When I'm free, I listen to music.", "pattern": "とき"}, "ext": [{"kind": "flip", "scene": "You use it about your own childhood, which needs the noun version of the joint rather than the verb one — and nouns arrive at it through the same の from Step 3.", "jp": "子どものとき、東京に住んでいました。", "en": "When I was a child, I lived in Tokyo.", "t": null}, {"kind": "wrinkle", "scene": "Then the suitcase sentence, where the tense in front is measured against the other half of the sentence rather than against now. One character decides which country the shop was in.", "jp": "日本に行くとき、空港でかばんを買いました。", "en": "Bought on the way — this side's airport, before arrival.", "t": "Relative tense, the step's hardest idea: 行くとき = on the way, not yet arrived; 行ったとき = after arriving. Same trip, two different bags bought in two different cities."}], "what": "When X, Y — とき turns any clause into a time.", "build": "Plain clause + とき: 子どものとき, 忙しいとき, 雨のとき. Nouns take の, な-adjectives keep な.", "when": "Childhood stories, conditions, habits — when it rains, when I was small, when I'm busy.", "watch": "The famous subtlety: the tense BEFORE とき is relative to the main clause, not to now. 日本に行くとき、かばんを買いました — bought before/while going (still on this side of arrival). 日本に行ったとき、かばんを買いました — bought after arriving. One character, different city where the bag was bought.", "ex": [["ひまなとき、音楽を聞きます。", "When I'm free, I listen to music."], ["日本に来たとき、驚きました。", "When I came to Japan, I was surprised."], ["日本に行くとき、空港でかばんを買いました。", "る + とき: not yet arrived — the bag is from the airport at home."], ["日本に行ったとき、京都でかばんを買いました。", "た + とき: after arriving — the bag is from Kyoto."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "空港 uses kanji outside KANJI_DICT — furigana needed; kept because it is the module's own example."], "claims": [], "sources": []}, {"id": "deshou", "step": "Step 7 · Linking actions & time", "jp": "〜でしょう", "en": "probably", "setting": {"scene": "Sports day is Saturday and the whole school is watching the forecast, because the decision to move it gets made on Friday afternoon by somebody who will ask what you think. The weather report itself never says will. It says something one notch below that, every single evening.", "jp": "明日は晴れるでしょう。", "en": "It'll probably be sunny tomorrow.", "pattern": "でしょう"}, "ext": [{"kind": "flip", "scene": "Asked directly what you reckon, you hedge the same way about something you have no business being certain of — the shape lets you answer the question without pretending to knowledge you do not have.", "jp": "雨が降るでしょう。", "en": "It'll probably rain.", "t": null}, {"kind": "extra", "scene": "Somebody says it back to you with the tone going up at the end, and it is no longer a hedge — it is a request that you agree, which is a different thing to be handed.", "jp": "明日は晴れるでしょう？", "en": "It'll be sunny tomorrow, right? — rising, this presses.", "t": "Said with the pitch rising, でしょう？ is a different move entirely — it means right?, fishing for agreement, and it is ね's pushier cousin. Falling, it hedges; rising, it presses. And だろう is the same word in plain register, common between friends."}], "what": "でしょう states what's probably true — a forecast, a guess said aloud. It's です with the certainty dialed down.", "build": "Plain form + でしょう: 晴れるでしょう, 来ないでしょう. After nouns and な-adjectives there's no だ: 雨でしょう.", "when": "Weather forecasts run on it, and so does any guess about what you can't check — someone else's plans, tomorrow, the crowd at the station.", "watch": "Rising でしょう？ is a different move — \"right?\", fishing for agreement, ね's pushier cousin. And だろう is the same word in plain register, common between friends.", "ex": [["明日は晴れるでしょう。", "It will probably be sunny tomorrow."], ["彼は来ないでしょう。", "He probably won't come."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "晴れる sits outside the Step 7 bank; it is the module's own example verb.", "晴 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"id": "arimasu", "step": "Step 8 · Existence & possession", "jp": "あります / います", "en": "there is / exists", "setting": {"scene": "A restaurant with no pictures on the menu and no English on the wall, and the question you need is not whether they will help you but whether a thing exists on the premises. Japanese has two verbs for existing and the line between them is drawn by aliveness, strictly, with no exceptions for how much you care about the thing.", "jp": "机の上に本があります。", "en": "There's a book on the desk.", "pattern": "あります"}, "ext": [{"kind": "flip", "scene": "At the next table there is a cat asleep on a chair, which is a fact about the same room needing the other verb entirely — because it is alive, and that is the only question the grammar asks.", "jp": "いすの上に猫がいます。", "en": "There's a cat on the chair.", "t": null}, {"kind": "wrinkle", "scene": "Then you ask the actual question, and the verb for existing turns out to cover having as well — which is how you ask a restaurant for an English menu without knowing the verb for have.", "jp": "英語のメニューはありますか。", "en": "Do you have an English menu? — existence covers possession.", "t": "English \"have\" is often just ある: 英語のメニューはありますか — \"DO you have an English menu?\" Existence covers possession more than you'd expect."}], "what": "Existence: there is. ある for things, いる for anything alive — Japanese splits 'is' by animacy before it tells you anything else.", "build": "[place] に [thing] が あります/います. Negatives: ありません, いません.", "when": "What's around you, what a place has — and availability, which makes ありますか one of the most-used questions in the language: Wi-Fiはありますか。英語のメニューはありますか。", "watch": "The animacy line is strict and drawn by aliveness, not importance: your car takes あります, your goldfish います. And the next lesson adds the one twist this rule can't call alone — あります for events happening.", "ex": [["机の上に本があります。", "There is a book on the desk."], ["公園に子どもがいます。", "There are children in the park."], ["すみません、英語のメニューはありますか。— はい、あります。", "THE availability question, asked and answered."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "英語 and メニュー sit outside the Step 8 bank; from the module's own wrinkle.", "英 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"id": "motteiru", "step": "Step 8 · Existence & possession", "jp": "〜を持っています", "en": "have / own", "setting": {"scene": "The bank form has a section about what you own, which is a strange thing to be asked in a language you are still assembling. Ownership has its own verb, and it sits in the continuing form you learned in Step 4 — because owning is a state you are in rather than an action you perform.", "jp": "車を持っています。", "en": "I have a car.", "pattern": "持っています"}, "ext": [{"kind": "flip", "scene": "They ask whether you have a residence card on you, which you do, in the wallet where it has to live — the same verb, the same continuing shape, about the one object you are legally required to be carrying.", "jp": "カードを持っています。", "en": "I have my card with me.", "t": null}, {"kind": "wrinkle", "scene": "The next box asks about family, and the verb quietly refuses. People are never held — a brother is not a possession grammatically, so having one runs through the alive-existence verb instead.", "jp": "兄がいます。", "en": "I have an older brother — います, never 持っています.", "t": "ある-possession and 持っている overlap; 持っている leans toward the concrete and ownable. People are never held — family \"having\" is います: 兄がいます."}], "what": "Having something on you, or owning it — 持つ frozen into the ている state.", "build": "[thing] を持っています; negative 持っていません. The state of having, not the act of holding.", "when": "Do-you-have questions of every kind: ペンを持っていますか。傘を持っていますか。", "watch": "持っています is the state; 持ちます means will take/hold — offering 持ちましょうか uses that one. And living things are never possessions grammatically: 犬がいます, never 犬を持っています — the dog exists at your house; you don't carry it.", "ex": [["車を持っています。", "I have a car."], ["ペンを持っていますか。", "Do you have a pen?"], ["ペン、持っていますか。— はい、どうぞ。", "Got a pen? — casual particle-drop, and the handover."]], "orphanWr": [], "flags": [], "claims": ["Mid-to-long-term residents aged 16 and over must carry the residence card at all times"], "sources": ["https://www.keishicho.metro.tokyo.lg.jp/multilingual/english/finding_services/living_guide/living_guide_e_4.html"]}, {"id": "location", "step": "Step 8 · Existence & possession", "jp": "〜は〜にあります / います", "en": "X is (located) at Y", "setting": {"scene": "Somebody at the station asks you for directions, in Japanese, on the assumption that you live here — which after four months you do. You know exactly where the bank is and cannot say it, because Japanese builds the place first and parks the thing in it afterwards.", "jp": "銀行は駅の前にあります。", "en": "The bank is in front of the station.", "pattern": "にあります"}, "ext": [{"kind": "flip", "scene": "She asks about the post office too, which is behind the same building, and the second sentence comes out faster than the first because the frame is already built and only the landmark has moved.", "jp": "部屋は下にあります。", "en": "The room is downstairs.", "t": null}, {"kind": "wrinkle", "scene": "The landmark comes first and the relationship second, which is the reverse of the English. 机の上 is the desk's top — a place-noun built out of two nouns, and only then does anything get parked in it.", "jp": "机の上にあります。", "en": "It's on the desk — literally, at the desk's top.", "t": "Landmark FIRST: 机の上 is \"the desk's top.\" English says \"on the desk\"; Japanese builds a place-noun and parks things in it with に."}], "what": "Where something IS: the known thing takes は, its place takes に.", "build": "AはBにあります/います, with position words slotting in through の: 駅の前に, いすの下に.", "when": "Directions, descriptions, and the survival question: どこにありますか — or the shorter どこですか, which works everywhere.", "watch": "Compare this to the arimasu-sentence and you are watching は and が at work: 机の上に本があります introduces a book; 本は机の上にあります locates the book we both know about. Same facts, different information flow — sb-waga's whole story, on location duty.", "ex": [["銀行は駅の前にあります。", "The bank is in front of the station."], ["猫はいすの下にいます。", "The cat is under the chair."], ["すみません、トイレはどこにありますか。— あそこです。", "THE survival question."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-nide2", "step": "Step 8 · Existence & possession", "jp": "に vs で · second look", "en": "existing, located — or held", "setting": {"scene": "The same question from Step 2 comes back with something new attached: is something happening here, or simply located here. What has changed is that the existence verb can now sit on either side of that line, because it has a second job — an event being held somewhere is also a thing that exists.", "jp": "机の上に本があります。", "en": "The book exists there → に.", "pattern": "があります"}, "ext": [{"kind": "flip", "scene": "The staffroom noticeboard says there is a party at the school tomorrow, and the same verb takes the other particle — because a party is not sitting there, it is happening there.", "jp": "明日、学校でパーティーがあります。", "en": "There's a party at school tomorrow — happening, so で.", "t": null}, {"kind": "extra", "scene": "You write both sentences down one under the other and the verb is identical in each. Nothing on the page distinguishes them except what the sentence is claiming about the world.", "jp": "部屋に机があります。学校で会議があります。", "en": "A desk exists in the room. A meeting happens at school.", "t": "The particle follows the meaning, not the verb. あります meaning exists takes に; あります meaning takes place takes で. Same word on the page, two different jobs, and only the sense tells you which particle it wants."}], "what": "Step 2's rule: happening → で, located → に. It couldn't be finished there, because the being-somewhere verbs あります and います hadn't arrived. Now they have — and they bring the one case the old rule can't call on its own.", "build": "Location keeps に, exactly as promised: 銀行は駅の前にあります. But あります has a second job — an event being held. パーティーがあります, 会議があります. When あります means 'takes place', the place takes で: 明日、学校でパーティーがあります. Same verb on the page; the meaning switched from existing to happening, and the particle follows the meaning, not the verb.", "when": "Where things are → に. Where events happen → で. Where you're headed → に or へ, as in Step 6 — the destination never takes で.", "watch": "The question is still the one you learned in Step 2 — is something happening here, or simply located here? What's new is that あります can now sit on either side of it. A book あります → に. A party あります → で.", "ex": [["机の上に本があります。", "The book exists there → に."], ["明日、学校でパーティーがあります。", "The party happens there → で, even with あります."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "パーティー and 会議 sit outside the Step 8 bank; 会議 arrives in Step 12."], "claims": [], "sources": []}, {"id": "ageru", "step": "Step 8 · Existence & possession", "jp": "あげる・くれる・もらう", "en": "giving and receiving", "setting": {"scene": "You have been ill for a week and three separate people have done something about it — one lent you a heater, one brought soup, one went to the pharmacy. Telling that story needs three different verbs for what English calls giving, and which one you pick depends on which direction the kindness travelled.", "jp": "友達に本をあげました。", "en": "I gave my friend a book. (away from me)", "pattern": "あげました"}, "ext": [{"kind": "flip", "scene": "The heater came the other way, toward you, and English would use the same verb for both. Japanese will not — giving that arrives at your side of the relationship has its own word and cannot borrow the other.", "jp": "友達が本をくれました。", "en": "My friend gave me a book — toward me, so くれる.", "t": null}, {"kind": "wrinkle", "scene": "The third one you tell from your own end rather than the giver's, which is the receiving verb — and its source takes the particle you would expect to mean a destination.", "jp": "先生に薬をもらいました。", "en": "I got medicine from the teacher — に marks the giver.", "t": "もらう is receiving — and its source takes に. Three verbs, one triangle: give-out (あげる), give-to-me (くれる), receive (もらう)."}], "what": "Three verbs for one English idea. English says give no matter which way the thing travels; Japanese makes you choose based on who ends up holding it. あげる is giving away from you, くれる is someone giving toward you, もらう is you receiving.", "build": "あげる and くれる mark the recipient with に: 友達に本をあげました. 友達が本をくれました. もらう flips the sentence around — the giver takes に or から: 友達に本をもらいました.", "when": "Any exchange at all: presents, help, advice, information, a lift home. It comes up far more often than the textbook placement suggests.", "watch": "くれる can only point toward you or your side of a relationship. 先生が本をあげました, about a teacher giving you a book, is wrong — it has to be くれました. And notice there is no neutral option: Japanese forces you to take a position on who benefited, which English lets you dodge completely.", "ex": [["友達に本をあげました。", "I gave my friend a book. (away from me)"], ["友達が本をくれました。", "My friend gave me a book. (toward me)"], ["先生に薬をもらいました。", "I got medicine from the teacher."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "iadj", "step": "Step 9 · Adjectives & adverbs", "jp": "い形容詞 (i-adjectives)", "en": "i-adjective conjugation", "setting": {"scene": "Apartment hunting again, because the lease is up in March and the agent wants a shortlist by Friday. Every sentence you need is a judgement about a room — big, cheap, cold, far — and the words that carry judgements in Japanese conjugate like verbs rather than sitting still like English adjectives do.", "jp": "この店は高くないです。", "en": "This shop is not expensive.", "pattern": "高くない"}, "ext": [{"kind": "flip", "scene": "You saw one on Tuesday that was fine and one on Wednesday that was not, and reporting that needs the past — which the adjective builds itself, out of its own body, with no help from anything else in the sentence.", "jp": "広かったです。", "en": "It was spacious.", "t": null}, {"kind": "wrinkle", "scene": "Four shapes to own and two classic wrecks. Adding でした to an adjective is the first, because that ending belongs to nouns. Using the noun negative on it is the second, and both look completely reasonable coming out of English.", "jp": "高くなかったです。", "en": "It wasn't expensive — not 高いでした, not 高いじゃない.", "t": "Four shapes to own: 高い・高くない・高かった・高くなかった. The two classic wrecks are 高いでした (adjective refusing でした) and 高いじゃない (noun-negative on an い-adjective)."}], "what": "い-adjectives conjugate themselves — tense and negation live on the adjective, and です contributes only politeness.", "build": "Drop the い: 高くない (negative), 高かった (past), 高くなかった (past negative). です goes after any of them, unchanged.", "when": "Describing anything, and answering どうでしたか — the how-was-it question that follows every movie, meal and trip.", "watch": "Two traps carry most of the failures. 高いでした is the classic — でした belongs to nouns and な-adjectives; い-adjectives carry their own past (高かったです). And いい is irregular everywhere: よくない, よかった, よくなかった — never いくない. Chant it once a day until it's boring.", "ex": [["この店は高くないです。", "This shop is not expensive."], ["昨日は寒かったです。", "It was cold yesterday."], ["映画はどうでしたか。— とても面白かったです。", "Past tense rides the adjective; です just adds polish."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "naadj", "step": "Step 9 · Adjectives & adverbs", "jp": "な形容詞 (na-adjectives)", "en": "na-adjective usage", "setting": {"scene": "The second flat is above a bakery on a street with no through traffic, and the word you want for it is one you have known for weeks — except that it behaves like a noun rather than like the words you learned in the last lesson, and it needs a syllable in front of the thing it describes.", "jp": "静かな町です。", "en": "It's a quiet town.", "pattern": "静かな"}, "ext": [{"kind": "flip", "scene": "You tell the agent what you are after and the same word turns up at the end of the sentence instead of in front of a noun — where the extra syllable vanishes completely, because there is nothing for it to attach to.", "jp": "この部屋は静かです。", "en": "This room is quiet — な only before a noun.", "t": null}, {"kind": "wrinkle", "scene": "Which family a word belongs to has to be learned with the word, because the spelling lies. Two of the commonest end in the same kana as the other family and belong firmly to this one.", "jp": "きれいな部屋です。", "en": "A clean room — きれい ends in い and is な all the same.", "t": "Which family a word belongs to must be learned with the word — きれい ends in い and still isn't an い-adjective: きれいな人, きれいじゃない."}], "what": "な-adjectives are nouns wearing adjective clothing: な before a noun, です-machinery for everything else.", "build": "静かな町 before a noun; 静かです, 静かじゃないです, 静かでした standing alone.", "when": "Description, like the い-family — the split between the two families is arbitrary history, so the family of each word has to be learned with the word.", "watch": "The な appears ONLY before a noun — 静かなです is wrong. The traps are the な-words that end in い: きれい and きらい both belong HERE, so きれいくない is wrong (きれいじゃない), and — from Step 3's の drill — きれいの人 is doubly wrong: it's きれいな人.", "ex": [["静かな町です。", "It's a quiet town."], ["この問題は簡単じゃないです。", "This problem is not easy."], ["どんな町ですか。— 静かで、きれいな町です。", "The what-kind question — な before the noun, で joining."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "kute", "step": "Step 9 · Adjectives & adverbs", "jp": "〜くて / 〜で (connecting)", "en": "and (adjectives)", "setting": {"scene": "One sentence to describe the flat you want, into a phone, to an agent who has four minutes. You have the adjectives and you have been saying them one at a time in separate sentences, which sounds like a list read out by a machine.", "jp": "この部屋は広くて明るいです。", "en": "This room is spacious and bright.", "pattern": "広くて"}, "ext": [{"kind": "flip", "scene": "The one you saw yesterday needs two words from the other family joined together, which uses a different connector — matching the joint to the family is the whole of the rule.", "jp": "静かで簡単でした。", "en": "It was quiet and straightforward — で for な-words.", "t": null}, {"kind": "wrinkle", "scene": "The chain takes its tense from the end, so the last word makes the whole thing past. And the joint only links qualities pulling the same way — for two that disagree, the sentence needs the but from Step 11.", "jp": "安くて、おいしかったです。", "en": "Cheap and good — the final word makes both past.", "t": "The chain inherits its tense from the END: 安くて、おいしかったです makes both past. And くて joins allies — qualities pulling the same direction. Rivals get が (Step 11)."}], "what": "Joining adjectives into one description: and, without a second sentence.", "build": "い-adjectives become 〜くて: 広くて明るい. な-adjectives and nouns take で: 静かで優しい, 先生で母です.", "when": "Descriptions with two or more qualities — which is most descriptions worth giving.", "watch": "Match the connector to the family: くて for い, で for な — mixing them is the visible error. いい joins as よくて. And the て carries a whisper of sequence or cause: 忙しくて、行けません leans on busy as the reason — a preview of how much work て does in this language.", "ex": [["この部屋は広くて明るいです。", "This room is spacious and bright."], ["彼は親切で優しいです。", "He is kind and gentle."], ["この店は安くて、おいしいです。", "Two claims, one sentence — the standard restaurant verdict."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "明るい and おいしい sit outside the Step 9 bank; both are module examples."], "claims": [], "sources": []}, {"id": "narimasu", "step": "Step 9 · Adjectives & adverbs", "jp": "〜くなります / 〜になります", "en": "become", "setting": {"scene": "Four months in, and the thing everybody comments on is that the weather has turned and so has your Japanese. Both are changes that happened without anybody doing anything on purpose, which is one verb in Japanese and the it-happens twin of the pair you met in Step 4.", "jp": "天気がよくなりました。", "en": "The weather got better.", "pattern": "なりました"}, "ext": [{"kind": "flip", "scene": "Somebody says the second one to you at the end of a meeting, and it is the same verb doing the same job about a person rather than a season — a change that arrived rather than one anybody performed.", "jp": "日本語が上手になりましたね。", "en": "Your Japanese has got good, hasn't it.", "t": null}, {"kind": "wrinkle", "scene": "How the word in front joins depends on its family — one drops its last kana and takes a different one, the other takes に — and the commonest adjective in the language is irregular in exactly this spot.", "jp": "よくなりました。", "en": "いい is irregular: よくなる, never いくなる.", "t": "い-adjectives drop い and add く (高くなる); nouns and な-adjectives take に (静かになる). いい is the irregular: よくなる, never いくなる."}], "what": "Becoming — change of state, with the change inside the verb なる.", "build": "い-adjectives: 〜くなります (寒くなりました). な-adjectives and nouns: 〜になります (元気になりました, 医者になりました).", "when": "Weather turning, people recovering, careers happening, prices rising.", "watch": "なる is the it-happens twin — nobody has to do anything for 寒くなる. The someone-does-it twin is する, next lesson, and the pair is the transitivity logic from Step 4 wearing adjective clothing. Watch the joint: 寒くなる, never 寒いなる.", "ex": [["天気がよくなりました。", "The weather got better."], ["兄は医者になりました。", "My brother became a doctor."], ["日本語が上手になりましたね。", "The compliment of progress — becoming, aimed at you."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "shimasu-change", "step": "Step 9 · Adjectives & adverbs", "jp": "〜くします / 〜にします", "en": "make (something) ...", "setting": {"scene": "The staffroom is cold enough that two people are working in coats, and the heater controls are behind your desk. Somebody asks you to do something about it — which is the other twin of the verb you just learned, the one that needs a person to perform it and a thing to perform it on.", "jp": "部屋を暖かくしてください。", "en": "Please make the room warm.", "pattern": "暖かくして"}, "ext": [{"kind": "flip", "scene": "You ask the same of the caretaker about the corridor, which nobody has heated since November — the same twin of the same verb, this time as your request, with a doer in the sentence and a thing being done to.", "jp": "部屋を静かにしてください。", "en": "Please make the room quiet.", "t": null}, {"kind": "wrinkle", "scene": "The pair sit one word apart and mean entirely different things about who is responsible. One says the room warmed up. The other says somebody turned the heating on, and that somebody is in the sentence.", "jp": "部屋が暖かくなりました。", "en": "The room warmed up — nobody did it.", "t": "なる happens on its own; する is done by someone. 暖かくなりました — the room warmed up; 暖かくしました — somebody turned up the heat."}], "what": "Making something become — the deliberate twin of なります.", "build": "い-adjectives: 〜くします (部屋を暖かくします). な-adjectives and nouns: 〜にします (音を静かにします).", "when": "Requests and adjustments: warmer, quieter, cheaper, cleaner.", "watch": "する needs a doer and a を — that is the whole difference from なる. 部屋が暖かくなりました (it warmed up) versus 部屋を暖かくしました (someone warmed it): the verb pair logic from Step 4, one more time, because it never stops applying.", "ex": [["部屋を暖かくしてください。", "Please make the room warm."], ["音を静かにしました。", "I made the sound quiet."], ["すみません、少し静かにしてください。", "The polite adjustment request — change-する riding てください."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "暖かい sits outside the Step 9 bank; it is the module's own example.", "暖 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"id": "nisuru", "step": "Step 9 · Adjectives & adverbs", "jp": "〜にします", "en": "decide on", "setting": {"scene": "A restaurant with the whole section, a laminated menu you can read about a third of, and a waiter already standing at your elbow with a pad. The question he asks is the one every restaurant in the country asks, and the answer is a fixed pattern that means neither becoming nor doing but choosing between things.", "jp": "私はコーヒーにします。", "en": "I'll have the coffee.", "pattern": "にします"}, "ext": [{"kind": "flip", "scene": "Somebody hesitates and you ask them the same question the waiter asked you, which is the shape you will use in every restaurant, ticket office and coffee shop from here on.", "jp": "何にしますか。", "en": "What will you have?", "t": null}, {"kind": "extra", "scene": "You get one kana wrong and announce, to a waiter holding a pad, that you are going to turn into a coffee. He writes down what you meant, because context is generous, and you hear it a second later.", "jp": "コーヒーになります。", "en": "I will become coffee — one kana away from ordering one.", "t": "One vowel from a different world: にします chooses, になります becomes. コーヒーにします orders a coffee; コーヒーになります is a prophecy. Both are grammatical, which is why the slip goes unnoticed by everyone except the waiter."}], "what": "Deciding on something — the choosing にします, mostly heard across counters.", "build": "[chosen thing] にします: コーヒーにします. Question: 何にしますか.", "when": "Ordering, choosing between options, settling any what-will-you-have.", "watch": "One vowel from a different world: にします chooses, になります becomes — コーヒーにします orders a coffee; コーヒーになります is a prophecy. And 何にしますか is THE restaurant question; answering it with にします closes the loop politely.", "ex": [["私はコーヒーにします。", "I'll have coffee."], ["赤いのにします。", "I'll go with the red one."], ["何にしますか。— 私はうどんにします。", "THE ordering exchange, both halves."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "amari", "step": "Step 9 · Adjectives & adverbs", "jp": "あまり〜ない", "en": "not very", "setting": {"scene": "Somebody has cooked and is asking whether you like it, and the honest answer is not very — which in English is a small negative and in Japanese is a whole grammatical contract. The adverb makes a promise at the front of the sentence that the ending has to keep.", "jp": "あまり高くないです。", "en": "It's not very expensive.", "pattern": "あまり"}, "ext": [{"kind": "flip", "scene": "Later somebody asks about a dish you genuinely do not like, and this is the polite machinery for saying so — not the blunt word for dislike, but this adverb doing social work.", "jp": "あまり好きじゃないです。", "en": "I don't like it very much.", "t": null}, {"kind": "wrinkle", "scene": "Start the sentence with it and forget to finish negative, and the contract breaks halfway. The adverb is a promise of a negative ending, and the next lesson's adverb makes the same promise harder.", "jp": "あまり高くないです。", "en": "あまり高いです is broken — the ending must be negative.", "t": "あまり is a promise of a negative ending — あまり高いです breaks the contract mid-sentence. ぜんぜん (next) makes the same promise, harder."}], "what": "Not very — a softener that only works holding hands with a negative.", "build": "あまり + negative: あまり高くないです, あまり食べません.", "when": "Polite lukewarmness — about food, hobbies, weather, and anything you'd rather not condemn outright.", "watch": "The negative is not optional: あまり高いです is broken. In speech you will hear あんまり — same word, relaxed. And あまり好きじゃないです is the polite way to dislike something, which the liking lesson in Step 10 will lean on.", "ex": [["あまり高くないです。", "It's not very expensive."], ["あまりテレビを見ません。", "I don't watch TV much."], ["スポーツをしますか。— あまりしません。", "The polite lukewarm answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "好き arrives in Step 10; used here as the module's own example."], "claims": [], "sources": []}, {"id": "zenzen", "step": "Step 9 · Adjectives & adverbs", "jp": "ぜんぜん〜ない", "en": "not at all", "setting": {"scene": "A meeting in which somebody speaks for six minutes about something you needed to understand, and afterwards asks, kindly, how much of it landed. The honest answer is at the far end of the same dial you learned last lesson, and it makes the same promise about how the sentence has to end.", "jp": "ぜんぜんわかりません。", "en": "I don't understand at all.", "pattern": "ぜんぜん"}, "ext": [{"kind": "flip", "scene": "She asks whether it was too fast and you use it again about something else that was entirely absent — the adverb at the front, the negative at the end, the whole distance between them held open.", "jp": "ぜんぜん時間がありません。", "en": "There's no time at all.", "t": null}, {"kind": "wrinkle", "scene": "Then somebody at lunch uses it with a positive and nobody blinks, because casual speech bends this rule daily. Recognise it, enjoy it, and keep your own version negative in anything written or polite.", "jp": "ぜんぜん大丈夫。", "en": "Totally fine — real, common, and casual only.", "t": "Casual speech bends this: ぜんぜん大丈夫 — \"totally fine\" — is real and common among friends. In writing and polite speech, keep ぜんぜん negative."}], "what": "Not at all — total negation's adverb.", "build": "ぜんぜん + negative: ぜんぜんわかりません, ぜんぜんありません.", "when": "Honest zeroes: no money, no idea, no time.", "watch": "Textbook rule: negative required. Street truth: casual speech says ぜんぜん大丈夫 (totally fine) constantly — recognize it, enjoy it, and keep your own ぜんぜん glued to negatives for now; in writing the positive use still reads as slang.", "ex": [["ぜんぜんわかりません。", "I don't understand at all."], ["お金がぜんぜんありません。", "I have no money at all."], ["わかりましたか。— いいえ、ぜんぜんわかりませんでした。", "The honest zero, politely delivered."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "大丈夫 sits outside the Step 9 bank; it appears in the module's own wrinkle and in the Step 8 culture lesson."], "claims": [], "sources": []}, {"id": "totemo", "step": "Step 9 · Adjectives & adverbs", "jp": "とても / ちょっと", "en": "very / a little", "setting": {"scene": "Parents' evening again, a year on, and every sentence you say tonight is a judgement with a dial on it. There are four settings on that dial and you have been using one of them for everything, which makes twelve conversations sound like the same conversation.", "jp": "この映画はとても面白いです。", "en": "This film is very interesting.", "pattern": "とても"}, "ext": [{"kind": "flip", "scene": "For a child who is nearly there rather than entirely there, you need the small setting instead — the same slot in the sentence, one notch down, and a completely different message home.", "jp": "ちょっと難しいです。", "en": "It's a little difficult.", "t": null}, {"kind": "wrinkle", "scene": "What the big one cannot do is go negative. For not very the language changes machinery altogether and reaches for last lesson's adverb, so the full dial runs across two different systems.", "jp": "あまり面白くないです。", "en": "Not very interesting — とても can't do this job.", "t": "とても doesn't do negatives. For \"not very\" the language switches machinery: あまり + negative. The full dial: とても / ちょっと / あまり〜ない / ぜんぜん〜ない."}], "what": "The everyday degree dials: とても turns it up, ちょっと turns it down.", "build": "Both sit before the adjective or verb: とても面白い, ちょっと疲れました.", "when": "Everywhere — degree words are how opinions get their volume set.", "watch": "ちょっと is double-booked: it measures smallness AND powers the soft refusal (the invitations step's ちょっと…). Tone and the trailing-off decide which. In speech すごく does とても's job, and めっちゃ sits further down the casual ladder — the slang stop next door covers that crowd.", "ex": [["この映画はとても面白いです。", "This movie is very interesting."], ["ちょっと疲れました。", "I'm a little tired."], ["日本の夏はどうですか。— とても暑いです。", "Volume set to high — the standard weather verdict."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "難しい sits outside the Step 9 bank.", "難 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"id": "hou", "step": "Step 10 · Comparing & preferring", "jp": "〜より〜のほうが", "en": "B more than A", "setting": {"scene": "Two routes to work, and after four months of alternating you finally have an opinion. Somebody in the staffroom asks which is better and the answer is a frame with two slots — and the adjective inside it does not change shape at all, however hard English wants it to.", "jp": "電車よりバスのほうが安いです。", "en": "The bus is cheaper than the train.", "pattern": "のほうが"}, "ext": [{"kind": "flip", "scene": "You ask her the same about summer and winter, which is the small talk equivalent of a free square, and the frame goes out exactly as it came in with two new nouns dropped into the slots.", "jp": "夏より冬のほうが好きです。", "en": "I prefer winter to summer.", "t": null}, {"kind": "wrinkle", "scene": "Asked which of two you prefer, the answer keeps the second half of the frame and drops the first entirely — the thing being compared against has already been said, so it does not need saying again.", "jp": "猫のほうが好きです。", "en": "I prefer cats — より gone, のほうが stays.", "t": "どちらのほうが好きですか asks the choice; the answer keeps のほうが even when より drops away entirely: 猫のほうが好きです."}], "what": "Comparing two things: the winner takes のほうが.", "build": "AよりBのほうが + adjective: 電車よりバスのほうが安いです. The question: AとBと、どちらのほうが…ですか.", "when": "Preferences, recommendations, and every which-is-better decision spoken aloud.", "watch": "The adjective never changes — no -er, no more: the frame does all the comparing while 安い stays 安い. English keeps groping for morphology here; stop letting it. And answer the どちら question WITH のほうが even though it repeats: 猫のほうが好きです.", "ex": [["電車よりバスのほうが安いです。", "The bus is cheaper than the train."], ["夏より冬のほうが好きです。", "I like winter more than summer."], ["犬と猫と、どちらのほうが好きですか。— 猫のほうが好きです。", "THE comparison question, frame echoed in the answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "ichiban", "step": "Step 10 · Comparing & preferring", "jp": "〜のなかで〜がいちばん", "en": "the most (superlative)", "setting": {"scene": "The children have worked out that you will answer questions about yourself, and have moved on from two-way comparisons to outright rankings — favourite food, favourite season, favourite animal, in that order, every lunchtime. Two things compare with last lesson's frame; three or more crown a winner, and crowning needs a different word entirely.", "jp": "果物のなかでりんごがいちばん好きです。", "en": "Of all fruit I like apples best.", "pattern": "いちばん"}, "ext": [{"kind": "flip", "scene": "You turn it round on them, which buys four minutes and gets the whole class talking — the group takes one frame, and the thing being crowned takes the particle that has been following 好き around all step.", "jp": "野菜のなかで何がいちばん好きですか。", "en": "Which vegetable do you like best?", "t": null}, {"kind": "wrinkle", "scene": "The question word in that sentence takes the same particle it took back in Step 1, which has been quietly on duty ever since — and the adjective, again, does no work at all.", "jp": "誰がいちばん上手ですか。", "en": "Who is best at it? — question words take が.", "t": "Two things compare with のほうが; three or more crown a winner with いちばん. Asking about the group uses 何・誰 + が + いちばん."}], "what": "The superlative, made of number one: いちばん.", "build": "[group] のなかで [X] がいちばん + adjective. Questions: 何が / 誰が / どこがいちばん…ですか.", "when": "Favourites, records, rankings — and small talk's favourite question shape: 日本料理のなかで何がいちばん好きですか.", "watch": "Question words take が (the rule from Step 1, still on duty), the group takes のなかで, and again no morphology — いちばん does the lifting while the adjective rests. Answering with just the winner + です is natural: 寿司です。", "ex": [["果物のなかでりんごがいちばん好きです。", "Among fruits, I like apples the most."], ["クラスのなかで田中さんがいちばん背が高いです。", "Tanaka-san is the tallest in the class."], ["日本料理のなかで何がいちばん好きですか。— 寿司です。", "Superlative question; predicate-echo answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "suki", "step": "Step 10 · Comparing & preferring", "jp": "〜が好きです / きらいです", "en": "like / dislike", "setting": {"scene": "A welcome dinner for the new term, and the question going round the table is what music you listen to. The sentence you want has a thing you like sitting in the middle of it, and every instinct you own says that thing is the object of the verb.", "jp": "音楽が好きです。", "en": "I like music.", "pattern": "が好きです"}, "ext": [{"kind": "flip", "scene": "You ask it back and get it wrong in the other direction, about a food you would rather avoid — because the blunt word for dislike lands far harder in Japanese than its English translation suggests.", "jp": "あまり好きじゃないです。", "en": "I don't like it much — the polite version of dislike.", "t": null}, {"kind": "wrinkle", "scene": "The error is completely predictable and survives a year if nobody corrects it. 好き is not a verb; it is describing a state, and the thing you like is grammatically what does the pleasing.", "jp": "音楽が好きです。", "en": "音楽を好きです is the classic wreck — が, always.", "t": "音楽を好きです is the single most predictable English-speaker error of this step. 好き describes a state, and states take が."}], "what": "Liking, built as a な-adjective rather than a verb — which is why the liked thing takes が.", "build": "[thing] が好きです. Stronger: 大好きです. Dislike: きらいです — but see the caution.", "when": "Preferences of every kind, and the getting-to-know-you question: 〜が好きですか.", "watch": "が, never を — Step 10's drum, drummed. And きらい lands HARD in conversation; polite dislike is あまり好きじゃないです, the あまり lesson doing social work. きらい also hides in the な-family despite its い — きらいくない is wrong twice.", "ex": [["音楽が好きです。", "I like music."], ["野菜がきらいです。", "I dislike vegetables."], ["日本の食べ物が好きですか。— はい、大好きです。", "The liking question, asked and amplified."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "jouzu", "step": "Step 10 · Comparing & preferring", "jp": "〜が上手です / 下手です", "en": "good at / bad at", "setting": {"scene": "Four months in, somebody tells you your Japanese is good, and it is not — it is better than it was, which is a different thing. What follows is a small ritual with two moves in it, and the word they used is one you must never point back at yourself.", "jp": "妹はピアノが上手です。", "en": "My sister is good at piano.", "pattern": "が上手です"}, "ext": [{"kind": "flip", "scene": "Somebody asks what you are actually good at, and the honest answer needs the modest word instead — the one you use about your own strengths, because the other one aimed inward reads as boasting.", "jp": "料理が得意です。", "en": "Cooking is my strong suit.", "t": null}, {"kind": "wrinkle", "scene": "The second move of the ritual is the deflection, and it is not false modesty so much as the expected next line. Agreeing with the compliment is the move that actually lands badly.", "jp": "いえいえ、まだまだです。", "en": "Not at all, I've a long way to go.", "t": "上手 praises OTHERS. About your own strengths, 得意 is the natural word — and deflecting praise (いえいえ、まだまだです) is half the grammar of this lesson."}], "what": "Skill: good at, bad at — the skill takes が.", "build": "[skill] が上手です / 下手です.", "when": "Praising others' abilities — and hearing your own praised, which will happen the moment you say こんにちは.", "watch": "上手 praises OTHERS; about yourself use 得意 (strong suit) or 苦手 — the 得意 you met in the kanji module. 下手 about someone else is blunt; あまり上手じゃないです spares feelings. And when 日本語が上手ですね lands on you, the native move is deflection: いえいえ、まだまだです.", "ex": [["妹はピアノが上手です。", "My sister is good at piano."], ["私は歌が下手です。", "I'm bad at singing."], ["日本語が上手ですね。— いえいえ、まだまだです。", "The compliment you WILL receive, and its standard deflection."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "料理 and 得意 sit outside the Step 10 bank; 得意 is named in the module's own watch beat."], "claims": [], "sources": []}, {"id": "wakaru", "step": "Step 10 · Comparing & preferring", "jp": "〜がわかります", "en": "understand", "setting": {"scene": "A parent is explaining something at speed and stops to check whether you are following. There are two words that both come out as understand in English and they are not interchangeable — one is having the information, the other is it making sense, and the negatives split harder than the positives do.", "jp": "日本語が少しわかります。", "en": "I understand a little Japanese.", "pattern": "わかります"}, "ext": [{"kind": "flip", "scene": "Somebody asks whether you know a colleague by name, which turns out to be the other verb entirely — that one is about holding a piece of information rather than about anything becoming clear to you.", "jp": "知っています。", "en": "I know (of) her.", "t": null}, {"kind": "wrinkle", "scene": "The particle is the same trap as 好き, one lesson on. It helps to read the verb as is-clear-to-me rather than as understand, because then the が stops looking wrong.", "jp": "日本語がわかります。", "en": "Japanese is clear to me — hence が, not を.", "t": "を…わかる is the same trap as を好き. It helps to read わかる as \"is clear (to me)\": 日本語がわかります — Japanese is clear to me."}], "what": "Understanding — what makes sense to you takes が.", "build": "[thing] がわかります. わかりました — got it. わかりません — I don't understand, or I can't tell.", "when": "Classrooms, directions, and the meta-question that keeps every conversation alive: わかりますか.", "watch": "わかる vs 知る: 知っています is having the information; わかります is it making sense. The negatives split harder — 知りません (never heard of it) about a person you've met sounds cold; わかりません stays safe. When lost, the full sentence すみません、よくわかりません buys help without offence.", "ex": [["日本語が少しわかります。", "I understand a little Japanese."], ["意味がわかりません。", "I don't understand the meaning."], ["この言葉の意味がわかりますか。— いいえ、よくわかりません。", "The meaning question — 意味 from the kanji module, earning its keep."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "nogasuki", "step": "Step 10 · Comparing & preferring", "jp": "〜のが好きです", "en": "like doing", "setting": {"scene": "A form for the school newsletter asks about hobbies, and every answer you want is a verb rather than a noun — reading, walking, cooking. Japanese will not let a verb take the particle that 好き demands until something turns the verb into a thing first, and Step 3 promised this job was coming.", "jp": "本を読むのが好きです。", "en": "I like reading books.", "pattern": "のが好き"}, "ext": [{"kind": "flip", "scene": "You ask a colleague the same and her answer runs the identical machinery on a different verb — the plain form, then the one syllable that turns it into a noun, then the particle that was waiting for one.", "jp": "歌を歌うのが好きです。", "en": "I like singing.", "t": null}, {"kind": "wrinkle", "scene": "It only works on the plain form, and the object inside survives — so the sentence ends up carrying two particles doing two entirely different jobs, one inside the noun and one outside it.", "jp": "本を読むのが好きです。", "en": "を inside, が outside — 読みますのが is out.", "t": "の nominalizes only PLAIN forms — 読みますのが is out. And the inner を survives: 本を読むのが好き carries two particles doing two different jobs."}], "what": "Liking an activity — の turns the verb into a noun first, then 好き treats it like any liked thing.", "build": "Dictionary form + のが好きです: 読むのが好きです.", "when": "Hobbies, and the hobby question: 何をするのが好きですか.", "watch": "This is の's fourth job — the one Step 3's drill promised was coming. Don't drop it: 読むが好き is broken; the verb can't take が until の makes it a noun. こと also works (読むことが好きです) — slightly stiffer, at home in writing; both are correct.", "ex": [["本を読むのが好きです。", "I like reading books."], ["料理を作るのが好きです。", "I like cooking."], ["何をするのが好きですか。— 音楽を聞くのが好きです。", "The hobby question — の quietly making nouns of verbs, twice."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "potential", "step": "Step 10 · Comparing & preferring", "jp": "可能形 (〜られる / 〜える)", "en": "saying you can do something", "setting": {"scene": "The phone shop again, a year on, and the question is whether the card in your hand will work in their machine. It is a question about capability rather than about anybody's intention, and Japanese builds that into the verb itself rather than adding a word in front of it.", "jp": "日本語が少し話せます。", "en": "I can speak a little Japanese.", "pattern": "話せます"}, "ext": [{"kind": "flip", "scene": "You ask about the card, which is a capability belonging to an object rather than a person — the same form, and the grammar does not care that nobody involved has a will.", "jp": "この店でカードが使えますか。", "en": "Can I use a card in this shop?", "t": null}, {"kind": "wrinkle", "scene": "How the verb bends depends on which family it is in, and the thing you are able to do switches its particle at the same time — from the object marker to the one this whole step has been drumming.", "jp": "朝早く起きられません。", "en": "I can't get up early — 起きる → 起きられる, negated.", "t": "う-verbs shift to the え row (話す→話せる, 使う→使える); る-verbs take られる (起きる→起きられる); する→できる, 来る→来られる. And the able-to thing takes が."}], "what": "English adds a separate word, can. Japanese bends the verb itself. There is no equivalent of can sitting in front — the ability is baked into the ending.", "build": "Ichi verbs drop る and add られる: 食べる → 食べられる, 見る → 見られる. Go verbs shift their final sound to the e-row and add る: 話す → 話せる, 読む → 読める, 行く → 行ける, 買う → 買える. Two irregulars, both common: する → できる, 来る → 来られる.", "when": "Ability, but just as often permission or possibility — この店でカードが使えますか asks whether cards are accepted, not whether you personally are capable.", "watch": "The object usually switches from を to が: 日本語が話せます, not 日本語を話せます. This is the が-trap the next lesson drills. Also worth knowing early — for Ichi verbs the potential form is identical to the passive, so 食べられる means both can eat and is eaten. Context sorts it out, which is exactly why casual speech shortens the potential to 食べれる.", "ex": [["日本語が少し話せます。", "I can speak a little Japanese."], ["この店でカードが使えますか。", "Can I use a card at this shop?"], ["朝早く起きられません。", "I can't get up early."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "早く sits outside the Step 10 bank; from the module's own wrinkle."], "claims": [], "sources": []}, {"id": "sb-transitive2", "step": "Step 10 · Comparing & preferring", "jp": "自動詞・他動詞 · second look", "en": "two different がs are about to collide", "setting": {"scene": "Two unrelated particles are about to collide in the same paragraph. One is the が you learned in Step 4, belonging to the twin of a verb that happens by itself. The other is the が this whole step has been handing out to 好き, わかる and the potential form. Same kana, entirely different reasons.", "jp": "ドアが開きました。", "en": "The door opened by itself.", "pattern": "が開きました"}, "ext": [{"kind": "flip", "scene": "One sentence later you use the other kind about something you like, and nothing on the page distinguishes them — which is fine as long as you know which of the two you are writing at the time.", "jp": "音楽が好きです。", "en": "I like music — the state-family's が.", "t": null}, {"kind": "extra", "scene": "You write a paragraph with four of them in it and two are one kind and two the other. Reading it back, the only way to check is to ask of each one what job it thought it was doing.", "jp": "窓が閉まりました。日本語がわかります。", "en": "The window closed. I understand Japanese. Two がs, two reasons.", "t": "The Step 4 self-check still holds and matters more here: を in front of an it-just-happens verb is always an error. What is new is that this step's compositions are full of both がs at once, so naming which one you are using keeps both honest."}], "what": "Step 4 taught the verb pairs and their particles: を for the twin you do, が for the twin that happens. The reason it resurfaces here, of all places: this step hands out が for a completely different reason, and the two がs need to stay apart in your head.", "build": "ドアが開きました — が because 開く is the twin that happens by itself. 音楽が好きです — が because 好き belongs to the small set that demands it. Same particle, two unrelated reasons. In both cases the particle follows the verb's nature; what differs is which nature.", "when": "Any time you catch yourself about to write が and can't say which rule put it there. Say the reason out loud: 'happens by itself', or 'one of the が words'. If neither fits, the particle is probably wrong.", "watch": "The self-check from Step 4 still holds — を in front of an intransitive verb is always an error — and it matters more now, because this step's compositions are full of both がs at once. 窓が開いています and 犬が好きです earn their がs entirely differently.", "ex": [["ドアが開きました。", "It happened by itself → the intransitive twin's が."], ["音楽が好きです。", "A が word → the other が. Same particle, different law."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-ganotwo", "step": "Step 10 · Comparing & preferring", "jp": "を じゃなくて が", "en": "the が-not-を reflex", "setting": {"scene": "This step's real subject is not comparison at all. It is が turning up in exactly the places English swears there should be an object, and the composition ahead is a minefield of them on purpose — every 好き, 上手, 下手 and わかる in anything you write deserves a second look before you hand it in.", "jp": "日本語がわかります。", "en": "I understand Japanese.", "pattern": "がわかります"}, "ext": [{"kind": "flip", "scene": "You check your own newsletter paragraph and find three places where you reached for the object marker out of habit. All three are about states rather than actions, and all three want the other particle.", "jp": "新しいくつがほしいです。", "en": "I want new shoes — ほしい takes が too.", "t": null}, {"kind": "extra", "scene": "The last sentence of the paragraph is about something you are good at, and the particle is right while the word is not — modest about the grammar, immodest about the claim.", "jp": "料理が得意です。", "en": "Cooking is my strong suit — not 私は料理が上手です.", "t": "One more trap in the same family: 上手 is not used about yourself. 得意 states a strength plainly and modestly; 上手 aimed inward reads as self-praise, whatever the particle is doing."}], "what": "", "build": "", "when": "", "watch": "", "ex": [], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "くつ and 料理 sit outside the Step 10 bank; くつ is from the module's own example."], "claims": [], "sources": []}, {"id": "kara-because", "step": "Step 11 · Reasons, contrast & connectors", "jp": "〜から (because)", "en": "because / so", "setting": {"scene": "The staffroom in August with the windows shut because of the insects and the air conditioning fighting a losing battle. Somebody has to say why they are opening one, and in Japanese the reason goes first and the consequence second — which is the mirror of the English sentence you are translating in your head.", "jp": "暑いから、窓を開けました。", "en": "Because it was hot, I opened the window.", "pattern": "から"}, "ext": [{"kind": "flip", "scene": "Ten minutes later you leave early for the clinic, and saying why is the same shape with your own reason in front — the order stops feeling backwards somewhere around the fourth time you build it.", "jp": "頭が痛いから、帰ります。", "en": "I've got a headache, so I'm going home.", "t": null}, {"kind": "wrinkle", "scene": "Asked directly why, the reason can stand entirely on its own with nothing after it — and note the joint: this one takes a whole finished clause, where the から from Step 7 took a connector form.", "jp": "忙しいからです。", "en": "Because I'm busy — the reason alone, closed with です.", "t": "Answering どうして, the reason stands alone with からです: 働きたいからです. And reason-から takes a whole clause — the after-から (Step 7) takes a て-form. The joint tells them apart."}], "what": "Reason first, から, then the result — Japanese states the cause before the effect.", "build": "[reason clause] から、[result]. Standalone answer: 〜からです.", "when": "Explaining yourself, and answering どうして — where 〜からです is the complete polite answer.", "watch": "The order is the mirror of English 'because', which trails its reason — flip your instinct. After a NOUN, から means from (Step 3); after a clause, because — position decides. And a から on every sentence reads as defending yourself; ので, next lesson, is the pressure valve.", "ex": [["暑いから、窓を開けました。", "Because it's hot, I opened the window."], ["時間がないから、急ぎましょう。", "We have no time, so let's hurry."], ["どうして日本語を勉強していますか。— 日本で働きたいからです。", "The why-question and its complete からです answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "node", "step": "Step 11 · Reasons, contrast & connectors", "jp": "〜ので", "en": "because (softer)", "setting": {"scene": "Leaving before the section head does, for the second time this week, with a genuine reason and no wish to sound like you are asserting it. There are two words for because and they differ in force: one states a reason, the other presents it as circumstance, and workplace exits reach for the second.", "jp": "頭が痛いので、帰ります。", "en": "I'm going home because I have a headache.", "pattern": "ので"}, "ext": [{"kind": "flip", "scene": "An email to somebody senior about a deadline you will miss, where the softer of the two is doing real work — it hands over a circumstance rather than pushing a justification across the desk.", "jp": "時間がないので、明日します。", "en": "There's no time, so I'll do it tomorrow.", "t": null}, {"kind": "wrinkle", "scene": "A noun in front of it needs a syllable you would not predict — the same one that turns up before ん in the explanatory form from Step 3, doing exactly the same joining job.", "jp": "雨なので、行きません。", "en": "It's raining, so I won't go — 雨なので, never 雨だので.", "t": "から asserts a reason; ので presents it as circumstance — softer, which is why excuses and workplace exits (お先に失礼します) prefer it."}], "what": "The softer because — presenting the reason as circumstance rather than argument.", "build": "Plain clause + ので. Nouns and な-adjectives interpose な: 雨なので, 静かなので.", "when": "Polite explanations, requests, and apologies — where から might sound like pleading a case, ので simply reports how things stand.", "watch": "The な is the trap: 雨だので is wrong, 雨なので is right — the same な that appears before ん in 学生なんです, doing the same job. Writing to anyone senior, reach for ので; it reads as adult.", "ex": [["頭が痛いので、帰ります。", "I'm going home because I have a headache."], ["雨なので、家にいます。", "Since it's raining, I'll stay home."], ["頭が痛いので、お先に失礼します。", "The polite early exit — reason as circumstance, not excuse."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "ga-but", "step": "Step 11 · Reasons, contrast & connectors", "jp": "〜が / けど (but)", "en": "but / although", "setting": {"scene": "A restaurant recommendation you want to give honestly, which means saying two things that pull against each other in one sentence. The connector that joins opposing halves is a kana you already know as a particle, doing an entirely unrelated job in an entirely different position.", "jp": "高いですが、おいしいです。", "en": "It's expensive, but it's good.", "pattern": "が、"}, "ext": [{"kind": "flip", "scene": "You use the casual cousin of it with the teacher you eat lunch with, which is the same joint one register down and by far the more common of the two in speech.", "jp": "忙しいけど、行きます。", "en": "I'm busy, but I'll go.", "t": null}, {"kind": "wrinkle", "scene": "Then it turns up as a cushion in front of a question, meaning almost nothing at all — not contradiction but courtesy, the polite throat-clearing before you ask a stranger for something.", "jp": "すみませんが、駅はどこですか。", "en": "Excuse me, but where's the station? — が as a cushion.", "t": "すみませんが、… is が's second life: a cushion before a request, meaning almost nothing. And this clause-が has no relation to the particle が — position tells you which is which."}], "what": "Joining two clauses that pull against each other: but.", "build": "[clause] が、[clause] — neutral-polite. けど is its casual cousin, けれど and けれども climb back up the formality ladder.", "when": "Contrasts, concessions, and the polite preamble — すみませんが、 before a request isn't contrasting anything; it's cushioning.", "watch": "That preamble-が is worth having on purpose: すみませんが、駅はどこですか reads as courtesy, not contradiction. And the trailing-off usage — ending AT the けど — is its own move, covered next lesson; don't read those sentences as unfinished.", "ex": [["高いですが、おいしいです。", "It's expensive, but delicious."], ["行きたいけど、時間がありません。", "I want to go, but I have no time."], ["すみませんが、駅はどこですか。", "The cushion-が — no contrast, pure courtesy."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "demo", "step": "Step 11 · Reasons, contrast & connectors", "jp": "でも / そして / それから", "en": "but / and / and then", "setting": {"scene": "Writing the first long thing you have written in Japanese — three paragraphs for the school newsletter — and everything you produce comes out as one enormous sentence, because the words you know for but and and then all join clauses. The ones that start new sentences are different words, and mixing them up is the visible learner seam.", "jp": "雨でした。でも、出かけました。", "en": "It was raining. But I went out.", "pattern": "でも"}, "ext": [{"kind": "flip", "scene": "You break the second paragraph in half and open the new sentence with it, which is the only position it can take — and the paragraph immediately stops sounding like one breath.", "jp": "でも、時間がありませんでした。", "en": "But there wasn't any time.", "t": null}, {"kind": "wrinkle", "scene": "Mid-sentence, the job belongs to the other two words entirely. English uses one word in both positions, so the split has to be watched every single time you join two halves rather than start something new.", "jp": "雨でしたが、出かけました。", "en": "Same meaning, joined rather than started — が, not でも.", "t": "Mid-sentence \"but\" is が/けど; でも only opens a NEW sentence. Same meaning, different positions — English \"but\" covers both, so the split needs watching."}], "what": "The sentence-starters: でも (but), そして (and), それから (and then) — connection across a full stop.", "build": "Start the new sentence with them: 雨でした。でも、出かけました。", "when": "Longer thoughts, stories, and anywhere one sentence isn't enough — which is soon.", "watch": "でも STARTS sentences; が and けど JOIN clauses — でも in the middle of a sentence is the visible learner seam. それから sequences (and then); そして adds without sequencing. Speech also opens with で alone — a clipped それで — recognize it.", "ex": [["雨でした。でも、出かけました。", "It was raining. But I went out."], ["朝ごはんを食べました。それから、学校へ行きました。", "I ate breakfast. Then I went to school."], ["朝ごはんを食べました。それから、学校へ行きました。", "Sequence across the full stop."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "toiu", "step": "Step 11 · Reasons, contrast & connectors", "jp": "〜という", "en": "called / named", "setting": {"scene": "Somebody recommends a film and you catch the shape of the sentence but not the name inside it, which is the ordinary condition of your life here. The frame that attaches a name to a thing is one pattern — and run backwards it becomes the single most useful question a learner can own.", "jp": "「花」という映画を見ました。", "en": "I watched a film called 'Hana'.", "pattern": "という"}, "ext": [{"kind": "flip", "scene": "You use it about the place near the station whose name you finally learned, which is the first time all month you have introduced something rather than asked about it.", "jp": "「さくら」という店に行きました。", "en": "I went to a shop called Sakura.", "t": null}, {"kind": "wrinkle", "scene": "Then the machine runs the other way. Anything you can point at, you can now get the name of — and the answer comes back inside the same frame you asked in.", "jp": "これは日本語で何といいますか。", "en": "What's this called in Japanese?", "t": "Asking for a word runs the same machine backwards — the survival question for every learner."}], "what": "Introducing a name the listener may not know: called, named.", "build": "[name] という [noun]: 「花」という映画, ポチという犬.", "when": "Titles, names, new words — and the learner's power tool: asking what things are called.", "watch": "The question form is the treasure here: これは日本語で何といいますか asks the name of anything you can point at, and the answer comes back in the same frame — 「はさみ」といいます. One pattern, infinite vocabulary lessons, free.", "ex": [["「花」という映画を見ました。", "I watched a movie called 'Hana'."], ["ポチという犬を飼っています。", "I have a dog named Pochi."], ["これは日本語で何といいますか。— 「はさみ」といいます。", "The what's-it-called question — infinite vocabulary, one frame."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "花 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"id": "doushite", "step": "Step 11 · Reasons, contrast & connectors", "jp": "どうして / なぜ〜からです", "en": "why? ... because", "setting": {"scene": "A child has handed nothing in for a week and you have to ask why, in a language where the bare why-question presses considerably harder than its English translation does. The word itself is easy and you have known it since Step 1. The register it lands in, said flat to a twelve-year-old, is the whole of the problem.", "jp": "どうして遅れましたか。", "en": "Why were you late?", "pattern": "どうして"}, "ext": [{"kind": "flip", "scene": "You answer one yourself at the end of the day, about the meeting you missed, and the reply comes back in the frame the question set up — the reason, closed off with the ending from two lessons ago.", "jp": "時間がなかったからです。", "en": "Because there wasn't time.", "t": null}, {"kind": "wrinkle", "scene": "Asked flat, it can land as a demand for justification rather than a question. The explanatory syllable from Step 3 cushions it into curiosity, and in real speech between people it is almost always there.", "jp": "どうして遅れたんですか。", "en": "Why were you late? — the ん softens the asking.", "t": "In real speech the question usually softens with ん: どうして遅れたんですか. A bare どうしてですか can land as blunt — the ん cushions the asking."}], "what": "Asking why, and answering it as a pair: どうして…か。— 〜からです。", "build": "どうして (neutral-polite), なぜ (formal, written), なんで (casual) — three registers of the same question. Answer with 〜からです.", "when": "Any why. どうしてですか alone follows anything anyone says.", "watch": "Bare why-questions can press hard in Japanese — どうして来ないんですか with the explanatory ん (Step 3's cc) softens the demand into curiosity. Choose the register with the relationship: なんで with friends, どうして as default, なぜ on paper.", "ex": [["どうして遅れましたか。", "Why were you late?"], ["電車が止まったからです。", "Because the train stopped."], ["どうして遅れたんですか。— 電車が止まったからです。", "Why softened with ん, answered with からです."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "nanika", "step": "Step 11 · Reasons, contrast & connectors", "jp": "何か / どこか / だれか", "en": "something / somewhere / someone", "setting": {"scene": "Half past nine at night in a town where two things are open, and the question is not what you want but whether you want anything at all. Japanese builds indefinite words out of the question words you already own, plus one kana — and the difference between them and the questions they came from is one syllable wide.", "jp": "何か食べたいです。", "en": "I want to eat something.", "pattern": "何か"}, "ext": [{"kind": "flip", "scene": "Somebody asks where you are going on Sunday and the honest answer is nowhere decided yet — which is the same construction built on a different question word, and it works on every one of them.", "jp": "どこかへ行きます。", "en": "I'm going somewhere.", "t": null}, {"kind": "wrinkle", "scene": "Particles mostly drop off these, and the one-syllable difference decides what kind of answer you are asking for — whether you ate anything is a yes-or-no; what you ate is a list.", "jp": "何か食べましたか。", "en": "Did you eat anything? — a yes/no, not a what.", "t": "Particles often drop after these: 何か食べたい needs no を; どこかへ行く keeps its へ. When unsure, dropping is the safer-sounding move."}], "what": "Something, someone, somewhere — question words plus か stop asking and start gesturing.", "build": "何か, 誰か, どこか, いつか. Particles often drop after them: 何か食べたい.", "when": "Offers, vague plans, and half-formed wants: 何か飲みますか。どこか行きたいです。", "watch": "The one-syllable trap: 何か食べましたか asks WHETHER you ate (yes/no); 何を食べましたか asks WHAT you ate (content). Answer type follows question type — a はい to the を-version answers a question nobody asked. sb-negq's statement-tracking rule, from the other side.", "ex": [["何か食べたいです。", "I want to eat something."], ["どこかへ行きましょう。", "Let's go somewhere."], ["何か飲みますか。— はい、じゃあお茶をください。", "The something-offer: a yes/no question wearing a question word."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-orthography", "step": "Step 11 · Reasons, contrast & connectors", "jp": "漢字とかな", "en": "which script a word gets", "setting": {"scene": "The newsletter draft comes back from the teacher who checks it with four words changed out of kanji and into kana, and none of them were wrong. Which script a word gets is convention rather than rule, and over-using kanji is the more common learner error — not under-using it.", "jp": "きれいな部屋です。", "en": "Conventionally kana, even though 綺麗 exists.", "pattern": "きれい"}, "ext": [{"kind": "flip", "scene": "You rewrite two more of your own on the same principle, and the paragraph stops looking like it was assembled out of a dictionary and starts looking like ordinary writing.", "jp": "ちょっと難しいです。", "en": "A little difficult — kana, by convention.", "t": null}, {"kind": "extra", "scene": "Nothing you wrote would have been marked incorrect by anybody. It simply read as though it had been written by someone with a dictionary open, which after four months it had not been.", "jp": "部屋はきれいです。", "en": "Kana here reads as ordinary; kanji would read as formal.", "t": "This is also why the checker treats script choice as a note ra
