ther than an error. A word written in kanji where convention prefers kana is not wrong; it is loud, and loudness is a register problem rather than a grammar one."}], "what": "Japanese has no spelling in the English sense — you can't misspell 食べる. What it has instead is convention about which script each word wears, and wearing the wrong one reads as odd rather than incorrect.", "build": "The rough division: content words take kanji (食べる, 時間, 会社), grammar takes kana (は, を, ます, ください, から), and loanwords take katakana. A handful of very common words are conventionally kana even though kanji exist for them — ある, いる, する, とても, ちょっと, きれい.", "when": "Every time you write. Handwriting and typing pull in opposite directions: typing hands you kanji for free, so learners routinely over-convert.", "watch": "Over-using kanji is the more common learner error, not under-using — 綺麗 exists but きれい is what ordinary writing uses. This is also why the grader marks kana-where-kanji-is-standard as worth knowing rather than a fix: it isn't wrong, just a chance to level up. The genuine trap is homophones, where the kanji carries the whole meaning: 暑い and 熱い, 会う and 合う, 帰る and 変える.", "ex": [["きれいな部屋です。", "Conventionally kana, even though 綺麗 exists."], ["暑い日に熱いお茶を飲みます。", "A hot day and hot tea — identical sound, different kanji."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "難しい and 綺麗 sit outside the Step 11 bank; both are from the module's own example.", "難 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"id": "sb-waga2", "step": "Step 11 · Reasons, contrast & connectors", "jp": "は vs が · second look", "en": "the refresher, with everything you know now", "setting": {"scene": "The two particles from Step 2 come back with everything you have learned since standing behind them. The topic set at the front of a sentence carries on through the contrast in the middle of it, which is a thing you could not have seen in Step 2 because you had no contrast to see it with.", "jp": "この店は高いですが、おいしいです。", "en": "Topic は carries through the contrast.", "pattern": "は"}, "ext": [{"kind": "flip", "scene": "You write your own two-clause sentence about the flat and the topic set at the front holds for both halves without being said twice — which is most of what makes long sentences bearable to read.", "jp": "この部屋は広いですが、寒いです。", "en": "This room is spacious but cold.", "t": null}, {"kind": "extra", "scene": "The paragraph you have just written has six of them in it, and every single one still answers the same question the Step 2 test asked. The rule did not grow any more complicated; the sentences around it did.", "jp": "誰が来ましたか。— 田中さんが来ました。", "en": "Who came? — Tanaka did. Question and answer, both が.", "t": "The test has not changed since Step 2: if the sentence answers which one, it takes が; if it names what you are already discussing, it takes は. What has changed is the length of the sentences you are testing."}], "what": "", "build": "", "when": "", "watch": "", "ex": [], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "sb-pronouns2", "step": "Step 11 · Reasons, contrast & connectors", "jp": "私・あなた · second look", "en": "when the pronoun must stay", "setting": {"scene": "Step 3 told you to delete the word for I, and you took it to heart, and now you have deleted one that was doing a job. A describing clause needs its own subject inside it — and inside that clause, the subject takes the other particle, which is the part nobody warns you about.", "jp": "私が好きなスポーツはテニスです。", "en": "私 stays: the clause needs its own subject, and it takes が.", "pattern": "私が"}, "ext": [{"kind": "flip", "scene": "You write another one about a book rather than a sport, and the same structure needs the same word in the same place — not because the sentence is about you, but because the clause inside it is.", "jp": "私が読んだ本は面白かったです。", "en": "The book I read was interesting.", "t": null}, {"kind": "extra", "scene": "Reading back a paragraph you pruned last week, two sentences have lost the subject of a clause — and now they describe somebody unspecified doing something you had meant to claim as your own.", "jp": "私が作った料理です。", "en": "It's food I made — drop 私が and the cook goes missing.", "t": "The over-correction is real and it produces sentences that are wrong in a new way. Deleting every 私 is as mechanical as inserting every 私 was; what changed in Step 3 was the default, not the rule."}], "what": "Step 3's advice was delete it — and it couldn't be finished there, because the main place 私 genuinely earns its keep needs grammar you didn't have yet: a whole clause describing a noun (Step 4's 名詞修飾).", "build": "A describing clause carries its own subject slot, and when that subject isn't obvious from context, it has to be said: 私が好きなスポーツはテニスです — the 私が belongs to the clause, telling you whose liking it is. Swap the subject and the clause follows: 母が作った料理. Inside a describing clause the subject takes が, never は — the rule from the lesson next door.", "when": "Describing clauses whose subject needs saying, direct contrast (私は行きますが、妹は行きません — Step 3 already gave you this one), answers to だれが questions, and introducing yourself.", "watch": "The over-correction is real: learners who took Step 3 to heart start deleting every 私, and then a sentence like 私が好きなスポーツはテニスです looks 'too English' to them. It isn't — it is exactly how a native speaker says it when the clause needs an owner. Deleting the pronoun is a default, not a law.", "ex": [["私が好きなスポーツはテニスです。", "私 stays: the describing clause needs its own subject — and it takes が."], ["母が作った料理がいちばんおいしいです。", "Same slot, different owner — the clause says whose."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "スポーツ, テニス, 面白い, 料理 sit outside the Step 11 bank; スポーツ/テニス are from the module's own example."], "claims": [], "sources": []}, {"id": "sb-omou", "step": "Step 12 · Past N5 · the shape-changers", "jp": "〜と思います", "en": "reporting a thought, back to front", "setting": {"scene": "A planning meeting where you have an opinion and no wish to state it as fact, because you have been here five months and the people around the table have been here twenty years. Japanese puts the whole thought first and the reporting verb last, which is the same back-to-front shape as describing a noun with a clause.", "jp": "この店は高いと思います。", "en": "I think this shop is expensive.", "pattern": "と思います"}, "ext": [{"kind": "flip", "scene": "Somebody asks what you reckon about the timing and you build your own — the clause in front stays plain however polite the ending gets, which is the whole division of labour.", "jp": "時間がないと思います。", "en": "I think there isn't time.", "t": null}, {"kind": "extra", "scene": "Your first attempt is polite in the middle, where the politeness does not belong, and your second negates the wrong half of the sentence — both of which sound like careful English and like nothing anybody here says.", "jp": "来ないと思います。", "en": "I think he won't come — negate the thought, not the thinking.", "t": "です never appears in front of と思います — 高いですと思います is wrong; it is 高いと思います. Nouns and な-adjectives take だ instead: 学生だと思います. And Japanese negates the thought rather than the reporting, so 来ないと思います is what gets said, not 来ると思いません."}], "what": "To report a thought, a quote, or anything anyone said, Japanese puts the whole reported thing FIRST and the reporting verb last — the same back-to-front shape you met with noun modification. English says I think that this shop is expensive. Japanese says this-shop-is-expensive, I-think.", "build": "[a complete sentence in PLAIN form] + と思います. 高いと思います. The same frame carries 〜と言いました (said) and 〜と聞きました (heard). The clause before と stays plain however polite the ending is.", "when": "Opinions, hedging, and repeating what someone told you. It is also how you stop stating everything as flat fact, which is most of what makes writing sound adult rather than robotic.", "watch": "です never appears before と思います — 高いですと思います is wrong; it is 高いと思います. Nouns and な-adjectives need だ instead: 学生だと思います. And Japanese negates the thought rather than the verb, so 来ないと思います (I think he won't come) is far more natural than 来ると思いません.", "ex": [["この店は高いと思います。", "I think this shop is expensive."], ["彼は学生だと思います。", "I think he's a student. (noun → だ)"], ["明日は来ないと思います。", "I don't think he'll come tomorrow. (negate the thought)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"id": "passive", "step": "Step 12 · Past N5 · the shape-changers", "jp": "受身形 (〜られる)", "en": "when it happens to you", "setting": {"scene": "Your name got read out in the morning meeting in connection with a form you had not been told about, and telling that story afterwards needs a shape where the thing happens to you rather than by you. English mostly avoids this by rearranging the sentence; Japanese bends the verb.", "jp": "私は先生に名前を聞かれました。", "en": "The teacher asked me my name.", "pattern": "聞かれました"}, "ext": [{"kind": "flip", "scene": "You use it about something smaller and more annoying — the umbrella that went from the stand by the door — and the person responsible does not have to appear in the sentence at all.", "jp": "かさを取られました。", "en": "My umbrella was taken.", "t": null}, {"kind": "wrinkle", "scene": "Then the version English has no grammar for whatsoever: the weather doing something to you. Japanese lets an event happen to a person grammatically, and the sentence carries the grievance without a single word of complaint in it.", "jp": "雨に降られました。", "en": "I got rained on — the suffering passive.", "t": "雨に降られました — the \"suffering passive\": it rained ON me. Japanese lets events happen TO you grammatically; English has to paraphrase."}], "what": "The passive, and the reason it belongs here rather than later: for Ichi verbs it is the exact same form as the potential you just learned. 見られる means both can be seen and is being seen, and the only way to tell is the rest of the sentence.", "build": "Ichi verbs: drop る, add られる — 見る → 見られる. Go verbs shift their final sound to the a-row and add れる — 読む → 読まれる, 言う → 言われる, 使う → 使われる. Irregular: する → される, 来る → 来られる. The person it happened to becomes the topic, and the one who did it takes に: 私は先生に名前を聞かれました.", "when": "Far more often than English passive, because Japanese uses it to say something happened to me, often with a flavour of inconvenience. 雨に降られました means I got rained on, and there is genuine complaint in it.", "watch": "Because Go verbs use the a-row (読まれる) and their potential uses the e-row (読める), those two stay comfortably apart. Ichi verbs give you no such help. This collision is the whole reason casual speech invented 見れる for the potential — the shortcut exists to protect the distinction.", "ex": [["私は先生に名前を聞かれました。", "The teacher asked me my name. (it happened to me)"], ["この店は多くの人に使われています。", "This shop is used by a lot of people."], ["雨に降られました。", "I got caught in the rain. (and I'm not pleased)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "かさ and 取る sit outside the Step 12 bank; かさ arrives in Step 13.", "取 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"id": "tara", "step": "Step 12 · Past N5 · the shape-changers", "jp": "〜たら / 〜と", "en": "if, and when", "setting": {"scene": "A trip with two colleagues and one of them wants a phone call when you land, which is a sentence with a condition in front of it and an instruction behind. Japanese has four words for if and this stage teaches two of them — and only one of the two can be followed by a request.", "jp": "時間があったら、行きます。", "en": "If I have time, I'll go.", "pattern": "たら"}, "ext": [{"kind": "flip", "scene": "You make the promise yourself, to the colleague who asked for it, which is exactly the sentence this whole lesson exists for: a condition in front, and something you are undertaking to do about it behind.", "jp": "日本に着いたら、電話してください。", "en": "Call me when you get to Japan.", "t": null}, {"kind": "wrinkle", "scene": "The other one from this step cannot carry that. It describes something automatic, so a request behind it makes no sense — and the remaining two ifs are deferred to Stage 2, which is a deferral rather than an omission.", "jp": "冬になると、寒くなります。", "en": "When winter comes it gets cold — と is automatic, no requests.", "t": "Japanese has four ifs — たら・と・ば・なら. Stage 1 teaches たら and と; ば and なら arrive in Stage 2. An honest deferral, not an omission."}], "what": "English leans on one word, if, and lets context sort out whether you mean a real possibility or an inevitable consequence. Japanese splits those apart, and picking the wrong one changes what you are claiming about the world.", "build": "〜たら is built from the plain past: 食べる → 食べたら, 行く → 行ったら, 高い → 高かったら. It covers both if and when for one-off events. 〜と attaches to the plain non-past (行くと) and means every single time, without exception — a law of nature, not a plan.", "when": "〜たら for anything that might or might not happen, and for when-then sequences. 〜と for machines, rules, and reliable consequences: このボタンを押すと、ドアが開きます.", "watch": "〜と cannot be followed by a request, an invitation, or anything expressing your will — 東京に行くと、電話してください is wrong, because 〜と describes automatic consequences and a request is not automatic. Use 〜たら. Note also that 〜たら is built from the た-form, which means every sound change you learned in Step 4 is working for you here. One more thing, so the map is honest: Japanese has four ifs — 〜たら, 〜と, 〜ば, 〜なら. Stage 1 gives you the first two; 〜ば and 〜なら arrive in Stage 2, and the four-way choice only makes sense once they do.", "ex": [["時間があったら、行きます。", "If I have time, I'll go."], ["このボタンを押すと、ドアが開きます。", "Press this button and the door opens. (every time)"], ["日本に着いたら、電話してください。", "When you arrive in Japan, please call. (a request → たら)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "着く and 電話 sit outside the Step 12 bank; both are from the module's own wrinkle."], "claims": [], "sources": []}]};
let li = 0, pi = 0;
const esc = s => (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(t, p){ t = esc(t); if(!p) return t; const i = t.indexOf(esc(p));
  return i<0 ? t : t.slice(0,i)+'<span class="hl">'+esc(p)+'</span>'+t.slice(i+esc(p).length); }
function jpbox(jp, en, p){ return '<div class="jpbox"><div class="l">'+hl(jp,p)+'</div><div class="g">'+esc(en)+'</div></div>'; }

function pages(L){
  const out = [{k:'setting'},{k:'idea'},{k:'apart'}];
  if(L.ex.length>1) out.push({k:'again'});
  L.ext.forEach((e,i)=>out.push({k:'ext',i}));
  if(L.watch || L.orphanWr.length) out.push({k:'watch'});
  out.push({k:'try'});
  return out;
}
function render(){
  const L = D.lessons[li], P = pages(L); if(pi>=P.length) pi = P.length-1;
  const pg = P[pi]; let h = '';
  h += '<h2>'+esc(L.jp)+'</h2><div class="en">'+esc(L.en)+' &middot; '+esc(L.step)+'</div>';
  if(pg.k==='setting'){
    h += '<div class="kicker">THE SITUATION</div><p class="body">'+esc(L.setting.scene)+'</p>'
       + jpbox(L.setting.jp, L.setting.en, L.setting.pattern);
  } else if(pg.k==='idea'){
    h += '<div class="kicker">THE IDEA</div><p class="body">'+esc(L.what)+'</p>';
    if(L.when) h += '<div class="kicker">WHEN YOU\'D USE IT</div><p class="body">'+esc(L.when)+'</p>';
  } else if(pg.k==='apart'){
    h += '<div class="kicker">ONE SENTENCE, TAKEN APART</div>';
    if(L.ex[0]) h += jpbox(L.ex[0][0], L.ex[0][1], null);
    h += '<p class="body" style="color:var(--sub);font-size:13px">The live module breaks this into per-word cards from <code>DEEP.seg</code>; the preview shows the sentence whole.</p>';
  } else if(pg.k==='again'){
    h += '<div class="kicker">HOW IT\'S BUILT — AND SIGHTED AGAIN</div>';
    if(L.build) h += '<p class="body">'+esc(L.build)+'</p>';
    L.ex.slice(1).forEach(e => h += jpbox(e[0], e[1], null));
  } else if(pg.k==='ext'){
    const e = L.ext[pg.i];
    const label = e.kind==='flip' ? 'NOW YOU SAY IT' : 'A WRINKLE';
    h += '<div class="kicker'+(e.kind==='flip'?'':' red')+'">'+label+'</div>';
    h += '<p class="body">'+esc(e.scene)+'</p>';
    if(e.t) h += '<div class="wrbox">'+esc(e.t)+'</div>';
    h += jpbox(e.jp, e.en, null);
    h += '<div class="seg"><span class="tag">'+e.kind.toUpperCase()+'</span><span style="font-size:12px;color:var(--sub)">'
       + (e.kind==='flip' ? 'The learner\'s side, different object — this is what replaces the abstract “when”.'
          : e.kind==='wrinkle' ? 'Text above comes from the module\'s own DEEP wrinkle, not from the arcs file.'
          : 'A wrinkle the module did not have; the arc supplies its text.')+'</span></div>';
  } else if(pg.k==='watch'){
    h += '<div class="kicker red">WATCH OUT</div><p class="body">'+esc(L.watch)+'</p>';
    L.orphanWr.forEach(t => h += '<div class="wrbox">'+esc(t)+'</div>');
  } else {
    h += '<div class="kicker">NOW IT\'S YOURS</div><p class="body">You\'ve seen it, seen it taken apart, and seen its edges. In the app this hands off to the drill and free writing.</p>';
  }
  h += '<nav><button class="nav" '+(pi?'':'disabled')+' onclick="go(-1)">← Back</button><div class="dots">'
     + P.map((p,i)=>'<button class="dot'+(i===pi?' on':'')+'" onclick="jump('+i+')" title="'+p.k+'"></button>').join('')
     + '</div><button class="nav primary" '+(pi<P.length-1?'':'disabled')+' onclick="go(1)">Next →</button></nav>';
  document.getElementById('card').innerHTML = h;
  document.getElementById('meta').innerHTML =
    '<b>'+esc(L.id)+'</b> — '+P.length+' pages · '+L.ext.length+' extension(s)'
    + (L.flags.length ? '<br><b>flags:</b> '+L.flags.map(esc).join(' · ') : '')
    + (L.claims.length ? '<br><b>claims:</b> '+L.claims.map(esc).join(' · ') : '')
    + (L.sources.length ? '<br><b>sources:</b> '+L.sources.length : '');
  document.querySelectorAll('.pt').forEach((b,i)=>b.classList.toggle('on', i===li));
}
function go(d){ const P=pages(D.lessons[li]); pi=Math.max(0,Math.min(P.length-1,pi+d)); render(); }
function jump(i){ pi=i; render(); }
function pick(i){ li=i; pi=0; render(); document.getElementById('main').scrollTop=0; }
addEventListener('keydown', e => { if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
(function(){ let h='', cur=null;
  D.lessons.forEach((L,i)=>{ if(L.step!==cur){ cur=L.step; h+='<div class="stepname">'+esc(cur)+'</div>'; }
    h += '<button class="pt" onclick="pick('+i+')">'+esc(L.jp)+'<small>'+esc(L.en)+'</small></button>'; });
  document.getElementById('list').innerHTML=h; })();
render();
</script></body></html>
