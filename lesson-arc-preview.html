 box of textbooks with her chin on top of it and has said nothing, because saying something would be asking. You are not deciding anything jointly here — you are offering, which is the same form with one syllable added and a completely different social job.", "jp": "手伝いましょうか。", "en": "Shall I help you?", "pattern": "ましょうか"}, "ext": [{"kind": "flip", "scene": "Later it is genuinely joint — the two of you are standing in front of a window nobody has opened all afternoon, and the question is what to do rather than whether you will do it for her.", "jp": "窓を開けましょうか。", "en": "Shall we open the window?", "t": null}, {"kind": "extra", "scene": "She answers with two words and you have to know which of them was a yes. One hands you the box; the other means she has it, thank you, and neither contains a no.", "jp": "大丈夫です。", "en": "I'm fine, thanks — a polite decline, not a yes.", "t": "Learn the replies with the offer. お願いします accepts gratefully; 大丈夫です declines politely — the same 大丈夫 from the convenience store lesson, doing the same work. And the か is load-bearing: 手伝いますか asks whether you help in general, which is a different question."}], "what": "Two jobs in one form: shall we? — the genuine-question version of ましょう — and shall I?, the polite offer of help.", "build": "ます-stem + ましょうか: 何を食べましょうか (deciding together), 手伝いましょうか (offering).", "when": "Deciding jointly, and offering: to carry, to open, to help, to pick someone up.", "watch": "As an offer, learn the replies with it: お願いします accepts gratefully; 大丈夫です declines politely — the same 大丈夫 from the konbini lesson. And the か is load-bearing: 手伝いますか asks whether you WILL help; 手伝いましょうか offers to.", "ex": [["手伝いましょうか。", "Shall I help you?"], ["窓を開けましょうか。", "Shall I open the window?"], ["荷物を持ちましょうか。— すみません、お願いします。", "The offer, and its grateful yes."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["一緒に", "\"together\""], ["映画", "a movie"], ["を", "object marker"], ["見ませんか。", "THE POINT — ません + か: \"won't you…?\" — the invitation that leaves room to say no", 1]], "segNote": "", "hl": "飲みませんか", "id": "masenka", "step": "Step 6 · Invitations, desire & intention", "jp": "〜ませんか", "en": "won't you ...? (invitation)", "setting": {"scene": "A month in. The teacher at the next desk has stayed late twice this week and you would like to suggest lunch, without putting her in the position of turning you down to your face — which she would find harder than you would. The negative question builds the exit into the grammar.", "jp": "一緒に昼ごはんを食べませんか。", "en": "Won't you have lunch with me?", "pattern": "ませんか"}, "ext": [{"kind": "flip", "scene": "It goes well enough that you try a second one for the weekend, aimed slightly upward — at somebody senior, where the room to decline matters more rather than less.", "jp": "一緒に映画を見ませんか。", "en": "Won't you come and see a film?", "t": null}, {"kind": "wrinkle", "scene": "The answer is not はい or いいえ. Acceptance comes as いいですね or ぜひ; the refusal comes as ちょっと, trailing off into nothing, and the trailing off is the entire message.", "jp": "いいですね。", "en": "That'd be nice — the acceptance, where a bare はい would be odd.", "t": "Negative on purpose: \"won't you\" presses less than \"will you.\" Answers matter too — いいですね！ accepts; ちょっと… declines softly, and the culture stop right after this is about exactly that."}], "what": "The polite invitation: won't you? Softest of the three proposal forms because the negative question builds room-to-decline into the grammar itself.", "build": "ます-stem negative + か: 見ませんか, 行きませんか, 飲みませんか.", "when": "First invitations, and any invitation upward in politeness — colleagues, seniors, people you'd like to know better.", "watch": "Two earlier lessons come due here at once. The answer to listen for is the soft no — 日曜日はちょっと…. And per the yes/no drill: accepting an invitation is ぜひ or いいですね, almost never a bare はい — answer the invitation, not the grammar.", "ex": [["一緒に映画を見ませんか。", "Won't you watch a movie with me?"], ["お茶を飲みませんか。", "Won't you have some tea?"], ["今度一緒に食べませんか。— いいですね！", "Invitation, and the enthusiastic accept."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["日本", "Japan"], ["へ", "destination marker"], ["行きたいです。", "THE POINT — verb stem + たい: what YOU want to do; it conjugates like an い-adjective", 1]], "segNote": "The wanted thing often takes が with たい — 水が飲みたい. Both が and を are heard; が leans harder on the wanting.", "hl": "飲みたいです", "id": "tai", "step": "Step 6 · Invitations, desire & intention", "jp": "〜たいです", "en": "want to do", "setting": {"scene": "The end-of-year form asks where you would like to be placed next April, and it is the first document since you arrived that has asked what you want rather than what you are. Your own wishes, stated flat, in a form that belongs to you and only to you.", "jp": "日本へ行きたいです。", "en": "I want to go to Japan.", "pattern": "たいです"}, "ext": [{"kind": "flip", "scene": "Somebody asks over lunch what you want to eat, which is this same form pointed at you between equals — and answering it is the easiest complete sentence you have built all week, because it is about the one mind you have access to.", "jp": "お茶を飲みたいです。", "en": "I want some tea.", "t": null}, {"kind": "wrinkle", "scene": "You use it about your sister, who has been talking about visiting for months, and the sentence claims to know something you cannot know. Japanese marks other people's insides differently, and the machinery for it arrives in Stage 2.", "jp": "妹は行きたがっています。", "en": "My sister wants to go — read from outside, not claimed.", "t": "たい is for your OWN wants. Announcing someone else's inner state — 彼は行きたいです — overreaches what you can know; Japanese marks other minds differently (Stage 2 has the machinery)."}], "what": "Wanting to DO something, spoken from the inside: たい bends the verb into an adjective of desire.", "build": "ます-stem + たい(です), then conjugate like an い-adjective: 行きたくない, 行きたかった. The object often switches to が: 水が飲みたい.", "when": "Your own wishes, plans, and cravings — and asking about them between equals: 何がしたいですか.", "watch": "たい reports your OWN inner state. Asking a superior 何を食べたいですか peers inside them — 何にしますか does the job politely. And third parties are off limits: 妹は行きたいです claims to feel her wanting; Japanese reroutes that through 〜たがっている, which arrives in Stage 2.", "ex": [["日本へ行きたいです。", "I want to go to Japan."], ["水が飲みたいです。", "I want to drink water."], ["日本で何がしたいですか。— 京都に行きたいです。", "The want-question between equals, and its answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "行きたがっている is Stage 2 grammar, shown here only as the correct alternative."], "claims": [], "sources": []}, {"seg": [["新しい", "new — い-adjective doing its normal job"], ["かばん", "bag — the wanted thing"], ["が", "ほしい demands が, never を"], ["ほしいです。", "THE POINT — \"want (a thing)\": an い-adjective aimed at nouns", 1]], "segNote": "", "hl": "ほしい", "id": "hoshii", "step": "Step 6 · Invitations, desire & intention", "jp": "〜がほしいです", "en": "want (a thing)", "setting": {"scene": "The apartment came with a fridge, a light and nothing else, and four weeks in you have a list on the back of an envelope. Somebody at work asks what you still need, and the answer is about things rather than actions — which Japanese splits into two different words where English uses one.", "jp": "新しいかばんがほしいです。", "en": "I want a new bag.", "pattern": "がほしいです"}, "ext": [{"kind": "flip", "scene": "Your birthday is in three weeks and the interrogation has started early. Same word, same particle — and the particle is the thing to watch, because the thing you want is not something you are doing anything to.", "jp": "車がほしいです。", "en": "I want a car.", "t": null}, {"kind": "wrinkle", "scene": "Half your list is not things at all but things you want to do, and those need the other form entirely. A new bag wants one word; buying the bag wants the other.", "jp": "かばんを買いたいです。", "en": "I want to buy a bag — actions take たい.", "t": "ほしい wants THINGS; たい wants ACTIONS. A new bag → ほしい; to buy the bag → 買いたい. English \"want\" covers both, which is why the split needs deliberate reps."}], "what": "Wanting a THING. The wanted thing takes が, and the word behaves like an い-adjective.", "build": "[thing] が ほしいです; ほしくない, ほしかった.", "when": "Shopping, wishlists, and the birthday interrogation: 何がほしいですか.", "watch": "The same inner-state restriction as たい: your own wanting only; other people's runs through ほしがっている (Stage 2). And when OFFERING something to a superior, ほしいですか pries — いかがですか is the graceful version; recognize it now.", "ex": [["新しいかばんがほしいです。", "I want a new bag."], ["時間がほしいです。", "I want time."], ["誕生日に何がほしいですか。— 新しいかばんがほしいです。", "The wish question — が on the wanted thing, both directions."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["夏", "summer"], ["に", "time marker — seasons count as calendar"], ["国", "home country"], ["へ", "destination"], ["帰る", "\"return\" — DICTIONARY form; つもり insists on plain"], ["つもりです。", "THE POINT — plain verb + つもり: a formed intention", 1]], "segNote": "", "hl": "買うつもり", "id": "tsumori", "step": "Step 6 · Invitations, desire & intention", "jp": "〜つもりです", "en": "intend to", "setting": {"scene": "Leave has to go in by the end of the month and the section head is asking everyone in turn what they are doing in August. Two of your colleagues answer with something vague. Yours is not vague — the flights are booked — and there is a form for a plan you have actually committed to.", "jp": "夏に国へ帰るつもりです。", "en": "I intend to go home in the summer.", "pattern": "つもりです"}, "ext": [{"kind": "flip", "scene": "She asks what you will do about the apartment while you are away, and the answer is another real decision rather than a hope — the same shape, on a verb of your own.", "jp": "友達に会うつもりです。", "en": "I intend to see a friend.", "t": null}, {"kind": "wrinkle", "scene": "You build it off the polite form out of habit and it will not take it. This pattern grabs the plain verb, and all the politeness waits at the very end, on the last word — the same division of labour as describing a noun with a clause.", "jp": "帰るつもりです。", "en": "Never 帰りますつもり — plain form, politeness at the end.", "t": "つもり follows the PLAIN form: 帰るつもり, never 帰りますつもり. The politeness waits at the very end, on です — the same division of labor as noun modification."}], "what": "Stated intention: a plan you have actually settled on, not a mood.", "build": "Dictionary form + つもりです. Negative plans put the ない first: 行かないつもりです — intending NOT to.", "when": "Answering what-are-you-doing questions with commitment: 夏休みは何をするつもりですか.", "watch": "つもり claims real intention — for a soft maybe, Japanese reaches for 〜たいと思います, which completes in Step 12 when と思います arrives. And the past, 〜るつもりでした, means intended-but-didn't: quiet regret built into tense.", "ex": [["夏に国へ帰るつもりです。", "I intend to return to my country in summer."], ["車を買うつもりです。", "I plan to buy a car."], ["夏休みは何をするつもりですか。— 国へ帰るつもりです。", "Plan question, committed answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["デパート", "the department store — the destination"], ["へ", "destination marker — still its own job"], ["買い物", "shopping — the purpose"], ["に", "THE POINT — links the purpose to the movement: going TO DO", 1], ["行きます。", "\"go\""]], "segNote": "A verb works too: its stem + に — 会い comes from 会います, ます dropped.", "hl": "会いに", "id": "niiku", "step": "Step 6 · Invitations, desire & intention", "jp": "〜に行きます", "en": "go (somewhere) to do", "setting": {"scene": "Saturday, and the list is four errands long: the bank, the ward office, the shop by the station, and the friend who has been holding a parcel for you since Tuesday. Every one of them is a place plus a reason for going there, and Japanese has one pattern that carries both at once.", "jp": "デパートへ買い物に行きます。", "en": "I'm going to the department store to shop.", "pattern": "に行きます"}, "ext": [{"kind": "flip", "scene": "You tell the neighbour where you are off to, and the purpose slot takes a verb this time rather than a noun — but not a whole verb, only the front half of one.", "jp": "友達に会いに行きます。", "en": "I'm going to meet a friend.", "t": null}, {"kind": "wrinkle", "scene": "You try to put the whole verb in the purpose slot and the sentence refuses. It takes a noun or a stem — never a complete clause, which is the shape English keeps trying to hand it.", "jp": "会いに行きます。", "en": "Not 会うに行く, not 会ってに — the stem, 会い.", "t": "The purpose slot takes a noun (買い物) or a verb STEM (会い) — never a whole clause. \"To meet\" is 会いに, not 会うに and not 会ってに."}], "what": "Movement with a mission: a purpose + に + a motion verb says you're going somewhere in order to do something.", "build": "Take the ます form and drop ます to get the stem — 会います → 会い — then stem + に + 行く／来る／帰る. Action nouns slot in directly: 買い物に行きます.", "when": "Any errand — shopping, meeting someone, swimming. One of the most-used everyday patterns there is.", "watch": "The purpose slot holds a stem or a noun, never a whole clause: 会いに行く, not 会うに行く. And the destination keeps its own particle separately — デパートへ買い物に行きます carries both.", "ex": [["デパートへ買い物に行きます。", "I go to the department store to shop."], ["友達に会いに行きました。", "I went to meet a friend."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "デパート and 買い物 sit outside the Step 6 bank; both are in the module's own example."], "claims": [], "sources": []}, {"seg": [["手", "hands"], ["を", "object marker"], ["洗ってから", "THE POINT — て-form + から: \"after doing, then…\" — first action finished before the second starts", 1], ["食べます。", "\"eat\" — the follow-on action"]], "segNote": "", "hl": "終わってから", "id": "tekara", "step": "Step 7 · Linking actions & time", "jp": "〜てから", "en": "after doing", "setting": {"scene": "School lunch is eaten in the classroom with the children, and there is an order to it that nobody writes down: hands, then seats, then the greeting, then anybody touches anything. On your first day you sat down at the wrong point in that sequence and thirty-four children noticed before the teacher did.", "jp": "手を洗ってから食べます。", "en": "We eat after washing our hands.", "pattern": "てから"}, "ext": [{"kind": "flip", "scene": "By the second week you are the one saying it, to a child who has arrived at the table with the sequence in the wrong order. Same shape, your mouth, and the sentence is doing a job rather than describing one.", "jp": "手を洗ってから座ってください。", "en": "Please sit down after washing your hands.", "t": null}, {"kind": "wrinkle", "scene": "The same two kana turn up four lessons later meaning because, and nothing about the characters tells you which is which. The joint does: this one glues to a connector form, the other to a whole finished clause.", "jp": "暑いから、窓を開けました。", "en": "Because it was hot, I opened the window — から on a clause.", "t": "This から glues to a て-form. The reason-から (Step 11) glues to a whole finished clause — same kana, different joint, and the joint tells you which one you're hearing."}], "what": "After doing X, Y — two actions chained in strict order on the て-form.", "build": "て-form + から, then the next clause: 手を洗ってから、食べます.", "when": "Routines, instructions, itineraries — anywhere order matters.", "watch": "This から is pure sequence — the reason-から (Step 11) attaches to whole clauses, this one to て-forms; position tells them apart. Tense lives only at the END: 食べてから行きました casts the whole chain into the past. And one てから per sentence is the natural load — chains of three read as a list wearing a costume.", "ex": [["手を洗ってから食べます。", "I eat after washing my hands."], ["仕事が終わってから飲みに行きました。", "After work ended, I went drinking."], ["仕事が終わってから、何をしますか。", "The after-work question — sequence inside a question."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["ごはん", "the meal"], ["を", "object marker"], ["食べた", "\"ate\" — plain PAST; あとで insists on it"], ["あとで", "THE POINT — \"after\": clause in plain past + あとで", 1], ["散歩します。", "\"take a walk\""]], "segNote": "Nouns join with の: 授業のあとで. Verbs join in plain past: 食べたあとで. Two doors into the same pattern.", "hl": "のあとで", "id": "atode", "step": "Step 7 · Linking actions & time", "jp": "〜たあとで", "en": "after ...", "setting": {"scene": "A colleague asks whether you want to come to the thing after work on Friday, and the answer depends entirely on what order the evening happens in — there is a meeting, then the thing, and you can only manage one of them. The sentence you need is about what follows what.", "jp": "ごはんを食べたあとで散歩します。", "en": "I take a walk after eating.", "pattern": "あとで"}, "ext": [{"kind": "flip", "scene": "You answer with your own version, about the meeting rather than dinner, and the whole sentence is about Friday — which has not happened yet, and which makes the next part surprising.", "jp": "会議が終わったあとで行きます。", "en": "I'll go after the meeting finishes.", "t": null}, {"kind": "wrinkle", "scene": "The verb in front is in the past even though every word of the sentence is about the future. That past is not marking time; it is marking completed-relative-to the other half, and the sentence's real tense waits at the end.", "jp": "食べたあとで散歩します。", "en": "Past form, future sentence — た marks completion, not time.", "t": "The verb before あとで is ALWAYS plain past — even when the whole sentence is about the future: 食べたあとで散歩します, \"after I('ll have) eaten, I'll walk.\" The tense of the sentence lives at its end."}], "what": "After X — looser than てから, and happy to take a noun.", "build": "Plain PAST verb + あとで (食べたあとで), or noun + のあとで (仕事のあとで).", "when": "Afterwards-plans, and gentle scheduling: 会議のあとで話しましょう.", "watch": "The verb before あとで is ALWAYS plain past — even when everything is in the future: 食べたあとで行きます. The た marks completed-relative-to, not past-in-time; English tense instinct fights this exactly once a sentence.", "ex": [["ごはんを食べたあとで散歩します。", "I take a walk after eating."], ["授業のあとで図書館へ行きます。", "After class I go to the library."], ["仕事のあとで、飲みに行きませんか。", "Noun + のあとで, wrapped in an invitation."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["寝る", "\"sleep\" — plain PRESENT, even inside past stories"], ["まえに", "THE POINT — \"before doing\": plain present + まえに", 1], ["歯", "teeth"], ["を", "object marker"], ["みがきます。", "\"brush\""]], "segNote": "Nouns join with の here too: 食事のまえに — the mirror of のあとで.", "hl": "のまえに", "id": "maeni", "step": "Step 7 · Linking actions & time", "jp": "〜まえに", "en": "before ...", "setting": {"scene": "The dentist's form asks what you do before bed, which is a question you can answer in English in four words and cannot answer in Japanese at all. Everything you have learned this step joins two actions in one order; this one joins them in the other.", "jp": "寝るまえに歯をみがきます。", "en": "I brush my teeth before sleeping.", "pattern": "まえに"}, "ext": [{"kind": "flip", "scene": "She asks about the medicine you are on and whether you take it before food, and you build the sentence yourself out of the same joint — with the verb in front sitting in its plain, unbent, dictionary shape.", "jp": "食べるまえに薬を飲みます。", "en": "I take the medicine before eating.", "t": null}, {"kind": "wrinkle", "scene": "Then you say something about last year, and the verb in front stubbornly refuses to go into the past even though the event plainly did. This joint takes the present regardless, and the sentence's tense lives at the very end.", "jp": "日本に来る前に、日本語を勉強しました。", "en": "Before coming to Japan, I studied Japanese — 来る, not 来た.", "t": "The mirror rule to あとで: before-clauses take plain PRESENT even about the past. The sentence's tense lives at the end, never in the joint."}], "what": "Before X — あとで's mirror.", "build": "DICTIONARY form + 前に (寝る前に), or noun + の前に (食事の前に).", "when": "Routines and warnings: before bed, before eating, before the meeting.", "watch": "The mirror rule: BEFORE takes dictionary form even for past events — 食べる前に手を洗いました. Pair it with あとで's rule and keep both: before→る, after→た, regardless of when anything actually happened. The pair is one of the cleanest systems in the language once you stop consulting English tense.", "ex": [["寝るまえに歯をみがきます。", "I brush my teeth before sleeping."], ["食事のまえに手を洗います。", "I wash my hands before meals."], ["日本に来る前に、日本語を勉強しましたか。", "Dictionary form before 前に — even though everything here is past."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["音楽", "music"], ["を", "object marker"], ["聞きながら", "THE POINT — verb stem + ながら: doing both at once; this one is the sidekick", 1], ["勉強します。", "\"study\" — the MAIN action, coming last"]], "segNote": "", "hl": "歩きながら", "id": "nagara", "step": "Step 7 · Linking actions & time", "jp": "〜ながら", "en": "while doing", "setting": {"scene": "Marking, forty exercise books, and the staffroom radio left on because the room is otherwise quiet enough to hear the clock on the wall. Somebody comes in and asks what you are doing, and the honest answer has two verbs in it — both belonging to the same person, across the same stretch of the same afternoon.", "jp": "音楽を聞きながら勉強します。", "en": "I study while listening to music.", "pattern": "ながら"}, "ext": [{"kind": "flip", "scene": "You ask her the same about her own evenings, and the pattern goes out as easily as it came in — two things, one body, happening across the same stretch of time.", "jp": "話しながら歩きました。", "en": "We walked while talking.", "t": null}, {"kind": "wrinkle", "scene": "You say it the other way round and change what you claimed to be doing. The verb after the joint is the main one, so the order is not decoration — it decides which activity you were actually engaged in.", "jp": "勉強しながら音楽を聞きます。", "en": "Listening to music, with studying alongside — the priority flipped.", "t": "The verb after ながら is the main one. 音楽を聞きながら勉強します is studying (with music on), not listening (while studying) — position assigns the priority."}], "what": "Doing X while doing Y — two actions, one person, one main event.", "build": "ます-stem + ながら, main action LAST: 音楽を聞きながら勉強します — the studying is the point; the music is backdrop.", "when": "Multitasking of every kind — and describing your habits: テレビを見ながら食べます.", "watch": "One body only: both actions belong to the same person. Two different people doing things at once needs 〜ている間に, later. And the order is meaningful — the ながら clause is the background; swap them and you claim to be mainly listening while incidentally studying.", "ex": [["音楽を聞きながら勉強します。", "I study while listening to music."], ["歩きながら話しましょう。", "Let's talk while walking."], ["歩きながら話しましょう。", "Let's talk while we walk — background action first, main action last."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["週末", "the weekend"], ["は", "topic marker"], ["本", "books"], ["を", "object marker"], ["読んだり", "THE POINT — plain past + り: \"things like reading…\" — a sampled list, not a sequence", 1], ["、", "a breath"], ["映画", "movies"], ["を", "object marker"], ["見たり", "the second sample — たり again"], ["します。", "closes the list: \"…and such, I do.\" This する carries the tense"]], "segNote": "", "hl": "したり", "id": "taritari", "step": "Step 7 · Linking actions & time", "jp": "〜たり〜たりします", "en": "do things like A and B", "setting": {"scene": "Monday morning and the small talk is about the weekend. You did five or six things, none in an order anyone needs, and two of them you would rather not go into. What the question wants is a flavour of two days rather than a timetable of them.", "jp": "週末は本を読んだり、映画を見たりします。", "en": "At weekends I read, watch films, that sort of thing.", "pattern": "たり"}, "ext": [{"kind": "flip", "scene": "You ask her the same back and get a list built the identical way — a sample, openly incomplete, with the honest implication that there were other things and neither of you is listing them.", "jp": "音楽を聞いたり、散歩したりしました。", "en": "I listened to music, went for a walk, and so on.", "t": null}, {"kind": "wrinkle", "scene": "You drop the closing verb because the list already felt finished, and the sentence hangs unfinished instead. That final one is not decoration — it is carrying the tense for everything in front of it.", "jp": "読んだり見たりしました。", "en": "The closing します/しました holds the tense for the whole list.", "t": "たり is the plain past + り, and the sentence MUST close with する — that final します/しました carries tense for the whole list. Dropped closers are the most common たり error."}], "what": "Doing things LIKE X and Y — a sample of activities, order not implied.", "build": "た-form + り, repeat, close with する — which carries all the tense: 読んだり書いたりします, 読んだり書いたりしました.", "when": "Describing weekends, hobbies, and any answer to what-do-you-do questions that deserves more than one verb.", "watch": "The final する is not optional — it holds the tense, and without it the sentence hangs unfinished. And unlike てから, no order is claimed: 食べたり飲んだりしました scatters the evening; 食べてから飲みました schedules it.", "ex": [["週末は本を読んだり、映画を見たりします。", "On weekends I read books, watch movies, and so on."], ["日曜日は掃除したり、洗濯したりしました。", "On Sunday I cleaned, did laundry, and such."], ["週末は何をしますか。— 映画を見たり、買い物したりします。", "The weekend question and its sampling answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["漢字", "kanji"], ["の", "linking の"], ["読み方", "THE POINT — verb stem + 方: \"way of doing\" — the how-to, as a noun", 1], ["を", "object marker — it's a noun now, so it takes noun particles"], ["教えてください。", "\"please teach (me)\""]], "segNote": "", "hl": "使い方", "id": "kata", "step": "Step 7 · Linking actions & time", "jp": "〜かた", "en": "how to ...", "setting": {"scene": "A character on a school form that you can see, copy and not read, in a word nobody will pronounce for you because everybody assumes you can. What you need is not the meaning but the method — and Japanese turns a verb into a way-of-doing-it by bolting one syllable onto its stem.", "jp": "漢字の読み方を教えてください。", "en": "Please teach me how to read this kanji.", "pattern": "読み方"}, "ext": [{"kind": "flip", "scene": "It works on anything. The ticket machine at the station has beaten you twice, and the same construction turns using it into a noun you can ask a stranger about.", "jp": "使い方がわかりません。", "en": "I don't know how to use it.", "t": null}, {"kind": "wrinkle", "scene": "What comes out the other end is a full noun, which means the particle in front has to change — the thing you are reading stops taking the object marker and takes the glue from Step 3 instead.", "jp": "漢字の読み方がわかりません。", "en": "漢字の, not 漢字を — the result is a noun.", "t": "The result is a full NOUN — it takes の before it and が・を after it like any other noun: 漢字の読み方がわかりません."}], "what": "How-to as a noun: 方(かた) turns a verb into the way of doing it.", "build": "ます-stem + 方: 読み方, 使い方, 作り方. The result is a NOUN, so it takes の from what it attaches to: 漢字の読み方.", "when": "Asking how anything works — which makes it one of the most useful question machines you own.", "watch": "The を becomes の: 漢字を読む, but 漢字の読み方 — keeping the を (漢字を読み方) is the signature error. This is also の quietly doing its noun-glue job from Step 3, one more time.", "ex": [["漢字の読み方を教えてください。", "Please teach me how to read this kanji."], ["この機械の使い方がわかりません。", "I don't know how to use this machine."], ["すみません、この漢字の読み方を教えてください。", "The learner's power tool: how-to + please-teach in one sentence."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "方 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"seg": [["ひまな", "\"free\" — な-adjective wearing its な before a noun"], ["とき、", "THE POINT — \"when\": the clause before it names the time", 1], ["音楽", "music"], ["を", "object marker"], ["聞きます。", "\"listen\""]], "segNote": "Verbs join too — and here in plain past: when I (had) come. The tense inside とき is where this lesson earns its keep.", "hl": "来たとき", "id": "toki", "step": "Step 7 · Linking actions & time", "jp": "〜とき", "en": "when ...", "setting": {"scene": "You bought a suitcase for the move. Whether you bought it at home in the week you were packing, or in a department store three days after you landed, is a difference every listener hears — and it turns on one character in the sentence you tell it with.", "jp": "ひまなとき、音楽を聞きます。", "en": "When I'm free, I listen to music.", "pattern": "とき"}, "ext": [{"kind": "flip", "scene": "You use it about your own childhood, which needs the noun version of the joint rather than the verb one — and nouns arrive at it through the same の from Step 3.", "jp": "子どものとき、東京に住んでいました。", "en": "When I was a child, I lived in Tokyo.", "t": null}, {"kind": "wrinkle", "scene": "Then the suitcase sentence, where the tense in front is measured against the other half of the sentence rather than against now. One character decides which country the shop was in.", "jp": "日本に行くとき、空港でかばんを買いました。", "en": "Bought on the way — this side's airport, before arrival.", "t": "Relative tense, the step's hardest idea: 行くとき = on the way, not yet arrived; 行ったとき = after arriving. Same trip, two different bags bought in two different cities."}], "what": "When X, Y — とき turns any clause into a time.", "build": "Plain clause + とき: 子どものとき, 忙しいとき, 雨のとき. Nouns take の, な-adjectives keep な.", "when": "Childhood stories, conditions, habits — when it rains, when I was small, when I'm busy.", "watch": "The famous subtlety: the tense BEFORE とき is relative to the main clause, not to now. 日本に行くとき、かばんを買いました — bought before/while going (still on this side of arrival). 日本に行ったとき、かばんを買いました — bought after arriving. One character, different city where the bag was bought.", "ex": [["ひまなとき、音楽を聞きます。", "When I'm free, I listen to music."], ["日本に来たとき、驚きました。", "When I came to Japan, I was surprised."], ["日本に行くとき、空港でかばんを買いました。", "る + とき: not yet arrived — the bag is from the airport at home."], ["日本に行ったとき、京都でかばんを買いました。", "た + とき: after arriving — the bag is from Kyoto."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "空港 uses kanji outside KANJI_DICT — furigana needed; kept because it is the module's own example."], "claims": [], "sources": []}, {"seg": [["明日", "tomorrow — bare"], ["は", "topic marker"], ["晴れる", "\"clear up\" — plain form"], ["でしょう。", "THE POINT — \"probably\": です with the certainty dialed down", 1]], "segNote": "Negative guesses work the same way — plain ない form + でしょう.", "hl": "でしょう", "id": "deshou", "step": "Step 7 · Linking actions & time", "jp": "〜でしょう", "en": "probably", "setting": {"scene": "Sports day is Saturday and the whole school is watching the forecast, because the decision to move it gets made on Friday afternoon by somebody who will ask what you think. The weather report itself never says will. It says something one notch below that, every single evening.", "jp": "明日は晴れるでしょう。", "en": "It'll probably be sunny tomorrow.", "pattern": "でしょう"}, "ext": [{"kind": "flip", "scene": "Asked directly what you reckon, you hedge the same way about something you have no business being certain of — the shape lets you answer the question without pretending to knowledge you do not have.", "jp": "雨が降るでしょう。", "en": "It'll probably rain.", "t": null}, {"kind": "extra", "scene": "Somebody says it back to you with the tone going up at the end, and it is no longer a hedge — it is a request that you agree, which is a different thing to be handed.", "jp": "明日は晴れるでしょう？", "en": "It'll be sunny tomorrow, right? — rising, this presses.", "t": "Said with the pitch rising, でしょう？ is a different move entirely — it means right?, fishing for agreement, and it is ね's pushier cousin. Falling, it hedges; rising, it presses. And だろう is the same word in plain register, common between friends."}], "what": "でしょう states what's probably true — a forecast, a guess said aloud. It's です with the certainty dialed down.", "build": "Plain form + でしょう: 晴れるでしょう, 来ないでしょう. After nouns and な-adjectives there's no だ: 雨でしょう.", "when": "Weather forecasts run on it, and so does any guess about what you can't check — someone else's plans, tomorrow, the crowd at the station.", "watch": "Rising でしょう？ is a different move — \"right?\", fishing for agreement, ね's pushier cousin. And だろう is the same word in plain register, common between friends.", "ex": [["明日は晴れるでしょう。", "It will probably be sunny tomorrow."], ["彼は来ないでしょう。", "He probably won't come."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "晴れる sits outside the Step 7 bank; it is the module's own example verb.", "晴 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"seg": [["机の上", "on the desk — landmark + の + position"], ["に", "location of existence"], ["本", "a book"], ["が", "what exists takes が"], ["あります。", "THE POINT — \"exists / there is\" for things; いる is its living twin", 1]], "segNote": "Children breathe, so います. あります for what sits still, います for what could walk away.", "hl": "います", "id": "arimasu", "step": "Step 8 · Existence & possession", "jp": "あります / います", "en": "there is / exists", "setting": {"scene": "A restaurant with no pictures on the menu and no English on the wall, and the question you need is not whether they will help you but whether a thing exists on the premises. Japanese has two verbs for existing and the line between them is drawn by aliveness, strictly, with no exceptions for how much you care about the thing.", "jp": "机の上に本があります。", "en": "There's a book on the desk.", "pattern": "あります"}, "ext": [{"kind": "flip", "scene": "At the next table there is a cat asleep on a chair, which is a fact about the same room needing the other verb entirely — because it is alive, and that is the only question the grammar asks.", "jp": "いすの上に猫がいます。", "en": "There's a cat on the chair.", "t": null}, {"kind": "wrinkle", "scene": "Then you ask the actual question, and the verb for existing turns out to cover having as well — which is how you ask a restaurant for an English menu without knowing the verb for have.", "jp": "英語のメニューはありますか。", "en": "Do you have an English menu? — existence covers possession.", "t": "English \"have\" is often just ある: 英語のメニューはありますか — \"DO you have an English menu?\" Existence covers possession more than you'd expect."}], "what": "Existence: there is. ある for things, いる for anything alive — Japanese splits 'is' by animacy before it tells you anything else.", "build": "[place] に [thing] が あります/います. Negatives: ありません, いません.", "when": "What's around you, what a place has — and availability, which makes ありますか one of the most-used questions in the language: Wi-Fiはありますか。英語のメニューはありますか。", "watch": "The animacy line is strict and drawn by aliveness, not importance: your car takes あります, your goldfish います. And the next lesson adds the one twist this rule can't call alone — あります for events happening.", "ex": [["机の上に本があります。", "There is a book on the desk."], ["公園に子どもがいます。", "There are children in the park."], ["すみません、英語のメニューはありますか。— はい、あります。", "THE availability question, asked and answered."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "英語 and メニュー sit outside the Step 8 bank; from the module's own wrinkle.", "英 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"seg": [["車", "a car"], ["を", "object marker"], ["持っています。", "THE POINT — \"holding\" as a state: the deliberate \"have\" for possessions", 1]], "segNote": "Asked of pockets and bags — got a pen on you? — the same state verb.", "hl": "持っています", "id": "motteiru", "step": "Step 8 · Existence & possession", "jp": "〜を持っています", "en": "have / own", "setting": {"scene": "The bank form has a section about what you own, which is a strange thing to be asked in a language you are still assembling. Ownership has its own verb, and it sits in the continuing form you learned in Step 4 — because owning is a state you are in rather than an action you perform.", "jp": "車を持っています。", "en": "I have a car.", "pattern": "持っています"}, "ext": [{"kind": "flip", "scene": "They ask whether you have a residence card on you, which you do, in the wallet where it has to live — the same verb, the same continuing shape, about the one object you are legally required to be carrying.", "jp": "カードを持っています。", "en": "I have my card with me.", "t": null}, {"kind": "wrinkle", "scene": "The next box asks about family, and the verb quietly refuses. People are never held — a brother is not a possession grammatically, so having one runs through the alive-existence verb instead.", "jp": "兄がいます。", "en": "I have an older brother — います, never 持っています.", "t": "ある-possession and 持っている overlap; 持っている leans toward the concrete and ownable. People are never held — family \"having\" is います: 兄がいます."}], "what": "Having something on you, or owning it — 持つ frozen into the ている state.", "build": "[thing] を持っています; negative 持っていません. The state of having, not the act of holding.", "when": "Do-you-have questions of every kind: ペンを持っていますか。傘を持っていますか。", "watch": "持っています is the state; 持ちます means will take/hold — offering 持ちましょうか uses that one. And living things are never possessions grammatically: 犬がいます, never 犬を持っています — the dog exists at your house; you don't carry it.", "ex": [["車を持っています。", "I have a car."], ["ペンを持っていますか。", "Do you have a pen?"], ["ペン、持っていますか。— はい、どうぞ。", "Got a pen? — casual particle-drop, and the handover."]], "orphanWr": [], "flags": [], "claims": ["Mid-to-long-term residents aged 16 and over must carry the residence card at all times"], "sources": ["https://www.keishicho.metro.tokyo.lg.jp/multilingual/english/finding_services/living_guide/living_guide_e_4.html"]}, {"seg": [["銀行", "the bank — the thing being located"], ["は", "topic marker"], ["駅の前", "THE POINT — landmark + の + position word: \"the station's front\"", 1], ["に", "location of existence"], ["あります。", "\"is (located)\""]], "segNote": "Same machine pointing down: the chair's underneath. Any position word slots in — 上・下・前・中・となり.", "hl": "いすの下に", "id": "location", "step": "Step 8 · Existence & possession", "jp": "〜は〜にあります / います", "en": "X is (located) at Y", "setting": {"scene": "Somebody at the station asks you for directions, in Japanese, on the assumption that you live here — which after four months you do. You know exactly where the bank is and cannot say it, because Japanese builds the place first and parks the thing in it afterwards.", "jp": "銀行は駅の前にあります。", "en": "The bank is in front of the station.", "pattern": "にあります"}, "ext": [{"kind": "flip", "scene": "She asks about the post office too, which is behind the same building, and the second sentence comes out faster than the first because the frame is already built and only the landmark has moved.", "jp": "部屋は下にあります。", "en": "The room is downstairs.", "t": null}, {"kind": "wrinkle", "scene": "The landmark comes first and the relationship second, which is the reverse of the English. 机の上 is the desk's top — a place-noun built out of two nouns, and only then does anything get parked in it.", "jp": "机の上にあります。", "en": "It's on the desk — literally, at the desk's top.", "t": "Landmark FIRST: 机の上 is \"the desk's top.\" English says \"on the desk\"; Japanese builds a place-noun and parks things in it with に."}], "what": "Where something IS: the known thing takes は, its place takes に.", "build": "AはBにあります/います, with position words slotting in through の: 駅の前に, いすの下に.", "when": "Directions, descriptions, and the survival question: どこにありますか — or the shorter どこですか, which works everywhere.", "watch": "Compare this to the arimasu-sentence and you are watching は and が at work: 机の上に本があります introduces a book; 本は机の上にあります locates the book we both know about. Same facts, different information flow — sb-waga's whole story, on location duty.", "ex": [["銀行は駅の前にあります。", "The bank is in front of the station."], ["猫はいすの下にいます。", "The cat is under the chair."], ["すみません、トイレはどこにありますか。— あそこです。", "THE survival question."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-nide2", "step": "Step 8 · Existence & possession", "jp": "に vs で · second look", "en": "existing, located — or held", "setting": {"scene": "The same question from Step 2 comes back with something new attached: is something happening here, or simply located here. What has changed is that the existence verb can now sit on either side of that line, because it has a second job — an event being held somewhere is also a thing that exists.", "jp": "机の上に本があります。", "en": "The book exists there → に.", "pattern": "があります"}, "ext": [{"kind": "flip", "scene": "The staffroom noticeboard says there is a party at the school tomorrow, and the same verb takes the other particle — because a party is not sitting there, it is happening there.", "jp": "明日、学校でパーティーがあります。", "en": "There's a party at school tomorrow — happening, so で.", "t": null}, {"kind": "extra", "scene": "You write both sentences down one under the other and the verb is identical in each. Nothing on the page distinguishes them except what the sentence is claiming about the world.", "jp": "部屋に机があります。学校で会議があります。", "en": "A desk exists in the room. A meeting happens at school.", "t": "The particle follows the meaning, not the verb. あります meaning exists takes に; あります meaning takes place takes で. Same word on the page, two different jobs, and only the sense tells you which particle it wants."}], "what": "Step 2's rule: happening → で, located → に. It couldn't be finished there, because the being-somewhere verbs あります and います hadn't arrived. Now they have — and they bring the one case the old rule can't call on its own.", "build": "Location keeps に, exactly as promised: 銀行は駅の前にあります. But あります has a second job — an event being held. パーティーがあります, 会議があります. When あります means 'takes place', the place takes で: 明日、学校でパーティーがあります. Same verb on the page; the meaning switched from existing to happening, and the particle follows the meaning, not the verb.", "when": "Where things are → に. Where events happen → で. Where you're headed → に or へ, as in Step 6 — the destination never takes で.", "watch": "The question is still the one you learned in Step 2 — is something happening here, or simply located here? What's new is that あります can now sit on either side of it. A book あります → に. A party あります → で.", "ex": [["机の上に本があります。", "The book exists there → に."], ["明日、学校でパーティーがあります。", "The party happens there → で, even with あります."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "パーティー and 会議 sit outside the Step 8 bank; 会議 arrives in Step 12."], "claims": [], "sources": []}, {"seg": [["友達", "my friend — the receiver"], ["に", "the receiver takes に"], ["本", "a book"], ["を", "object marker"], ["あげました。", "THE POINT — giving OUTWARD: I (or we) give to someone else", 1]], "segNote": "The same event seen from the receiving end: they gave TO ME → くれる. Perspective picks the verb.", "hl": "くれました", "id": "ageru", "step": "Step 8 · Existence & possession", "jp": "あげる・くれる・もらう", "en": "giving and receiving", "setting": {"scene": "You have been ill for a week and three separate people have done something about it — one lent you a heater, one brought soup, one went to the pharmacy. Telling that story needs three different verbs for what English calls giving, and which one you pick depends on which direction the kindness travelled.", "jp": "友達に本をあげました。", "en": "I gave my friend a book. (away from me)", "pattern": "あげました"}, "ext": [{"kind": "flip", "scene": "The heater came the other way, toward you, and English would use the same verb for both. Japanese will not — giving that arrives at your side of the relationship has its own word and cannot borrow the other.", "jp": "友達が本をくれました。", "en": "My friend gave me a book — toward me, so くれる.", "t": null}, {"kind": "wrinkle", "scene": "The third one you tell from your own end rather than the giver's, which is the receiving verb — and its source takes the particle you would expect to mean a destination.", "jp": "先生に薬をもらいました。", "en": "I got medicine from the teacher — に marks the giver.", "t": "もらう is receiving — and its source takes に. Three verbs, one triangle: give-out (あげる), give-to-me (くれる), receive (もらう)."}], "what": "Three verbs for one English idea. English says give no matter which way the thing travels; Japanese makes you choose based on who ends up holding it. あげる is giving away from you, くれる is someone giving toward you, もらう is you receiving.", "build": "あげる and くれる mark the recipient with に: 友達に本をあげました. 友達が本をくれました. もらう flips the sentence around — the giver takes に or から: 友達に本をもらいました.", "when": "Any exchange at all: presents, help, advice, information, a lift home. It comes up far more often than the textbook placement suggests.", "watch": "くれる can only point toward you or your side of a relationship. 先生が本をあげました, about a teacher giving you a book, is wrong — it has to be くれました. And notice there is no neutral option: Japanese forces you to take a position on who benefited, which English lets you dodge completely.", "ex": [["友達に本をあげました。", "I gave my friend a book. (away from me)"], ["友達が本をくれました。", "My friend gave me a book. (toward me)"], ["先生に薬をもらいました。", "I got medicine from the teacher."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["この店", "this shop"], ["は", "topic marker"], ["高くないです。", "THE POINT — い-adjectives conjugate THEMSELVES: 高い → 高くない; です is only polish", 1]], "segNote": "The past lives inside the adjective too: 寒い → 寒かった. です never carries the tense.", "hl": "寒かった", "id": "iadj", "step": "Step 9 · Adjectives & adverbs", "jp": "い形容詞 (i-adjectives)", "en": "i-adjective conjugation", "setting": {"scene": "Apartment hunting again, because the lease is up in March and the agent wants a shortlist by Friday. Every sentence you need is a judgement about a room — big, cheap, cold, far — and the words that carry judgements in Japanese conjugate like verbs rather than sitting still like English adjectives do.", "jp": "この店は高くないです。", "en": "This shop is not expensive.", "pattern": "高くない"}, "ext": [{"kind": "flip", "scene": "You saw one on Tuesday that was fine and one on Wednesday that was not, and reporting that needs the past — which the adjective builds itself, out of its own body, with no help from anything else in the sentence.", "jp": "広かったです。", "en": "It was spacious.", "t": null}, {"kind": "wrinkle", "scene": "Four shapes to own and two classic wrecks. Adding でした to an adjective is the first, because that ending belongs to nouns. Using the noun negative on it is the second, and both look completely reasonable coming out of English.", "jp": "高くなかったです。", "en": "It wasn't expensive — not 高いでした, not 高いじゃない.", "t": "Four shapes to own: 高い・高くない・高かった・高くなかった. The two classic wrecks are 高いでした (adjective refusing でした) and 高いじゃない (noun-negative on an い-adjective)."}], "what": "い-adjectives conjugate themselves — tense and negation live on the adjective, and です contributes only politeness.", "build": "Drop the い: 高くない (negative), 高かった (past), 高くなかった (past negative). です goes after any of them, unchanged.", "when": "Describing anything, and answering どうでしたか — the how-was-it question that follows every movie, meal and trip.", "watch": "Two traps carry most of the failures. 高いでした is the classic — でした belongs to nouns and な-adjectives; い-adjectives carry their own past (高かったです). And いい is irregular everywhere: よくない, よかった, よくなかった — never いくない. Chant it once a day until it's boring.", "ex": [["この店は高くないです。", "This shop is not expensive."], ["昨日は寒かったです。", "It was cold yesterday."], ["映画はどうでしたか。— とても面白かったです。", "Past tense rides the adjective; です just adds polish."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["静かな", "THE POINT — な-adjective wearing its な to hold a noun", 1], ["町", "town — the noun being held"], ["です。", "\"is\""]], "segNote": "Negating like a noun — じゃない, the system Step 1 already gave you. な-adjectives are nouns at heart.", "hl": "簡単じゃない", "id": "naadj", "step": "Step 9 · Adjectives & adverbs", "jp": "な形容詞 (na-adjectives)", "en": "na-adjective usage", "setting": {"scene": "The second flat is above a bakery on a street with no through traffic, and the word you want for it is one you have known for weeks — except that it behaves like a noun rather than like the words you learned in the last lesson, and it needs a syllable in front of the thing it describes.", "jp": "静かな町です。", "en": "It's a quiet town.", "pattern": "静かな"}, "ext": [{"kind": "flip", "scene": "You tell the agent what you are after and the same word turns up at the end of the sentence instead of in front of a noun — where the extra syllable vanishes completely, because there is nothing for it to attach to.", "jp": "この部屋は静かです。", "en": "This room is quiet — な only before a noun.", "t": null}, {"kind": "wrinkle", "scene": "Which family a word belongs to has to be learned with the word, because the spelling lies. Two of the commonest end in the same kana as the other family and belong firmly to this one.", "jp": "きれいな部屋です。", "en": "A clean room — きれい ends in い and is な all the same.", "t": "Which family a word belongs to must be learned with the word — きれい ends in い and still isn't an い-adjective: きれいな人, きれいじゃない."}], "what": "な-adjectives are nouns wearing adjective clothing: な before a noun, です-machinery for everything else.", "build": "静かな町 before a noun; 静かです, 静かじゃないです, 静かでした standing alone.", "when": "Description, like the い-family — the split between the two families is arbitrary history, so the family of each word has to be learned with the word.", "watch": "The な appears ONLY before a noun — 静かなです is wrong. The traps are the な-words that end in い: きれい and きらい both belong HERE, so きれいくない is wrong (きれいじゃない), and — from Step 3's の drill — きれいの人 is doubly wrong: it's きれいな人.", "ex": [["静かな町です。", "It's a quiet town."], ["この問題は簡単じゃないです。", "This problem is not easy."], ["どんな町ですか。— 静かで、きれいな町です。", "The what-kind question — な before the noun, で joining."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["この部屋", "this room"], ["は", "topic marker"], ["広くて", "THE POINT — い-adj → くて: chains qualities into one description", 1], ["明るいです。", "\"and bright\" — the chain's last link carries tense and politeness"]], "segNote": "な-adjectives chain with で instead — the two families, again, each with its own connector.", "hl": "親切で", "id": "kute", "step": "Step 9 · Adjectives & adverbs", "jp": "〜くて / 〜で (connecting)", "en": "and (adjectives)", "setting": {"scene": "One sentence to describe the flat you want, into a phone, to an agent who has four minutes. You have the adjectives and you have been saying them one at a time in separate sentences, which sounds like a list read out by a machine.", "jp": "この部屋は広くて明るいです。", "en": "This room is spacious and bright.", "pattern": "広くて"}, "ext": [{"kind": "flip", "scene": "The one you saw yesterday needs two words from the other family joined together, which uses a different connector — matching the joint to the family is the whole of the rule.", "jp": "静かで簡単でした。", "en": "It was quiet and straightforward — で for な-words.", "t": null}, {"kind": "wrinkle", "scene": "The chain takes its tense from the end, so the last word makes the whole thing past. And the joint only links qualities pulling the same way — for two that disagree, the sentence needs the but from Step 11.", "jp": "安くて、おいしかったです。", "en": "Cheap and good — the final word makes both past.", "t": "The chain inherits its tense from the END: 安くて、おいしかったです makes both past. And くて joins allies — qualities pulling the same direction. Rivals get が (Step 11)."}], "what": "Joining adjectives into one description: and, without a second sentence.", "build": "い-adjectives become 〜くて: 広くて明るい. な-adjectives and nouns take で: 静かで優しい, 先生で母です.", "when": "Descriptions with two or more qualities — which is most descriptions worth giving.", "watch": "Match the connector to the family: くて for い, で for な — mixing them is the visible error. いい joins as よくて. And the て carries a whisper of sequence or cause: 忙しくて、行けません leans on busy as the reason — a preview of how much work て does in this language.", "ex": [["この部屋は広くて明るいです。", "This room is spacious and bright."], ["彼は親切で優しいです。", "He is kind and gentle."], ["この店は安くて、おいしいです。", "Two claims, one sentence — the standard restaurant verdict."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "明るい and おいしい sit outside the Step 9 bank; both are module examples."], "claims": [], "sources": []}, {"seg": [["天気", "the weather"], ["が", "subject marker"], ["よくなりました。", "THE POINT — became: いい → よく + なる. Change of state, and いい conjugates on its よ side", 1]], "segNote": "Nouns and な-adjectives take に before なる: 医者になる — became a doctor.", "hl": "になりました", "id": "narimasu", "step": "Step 9 · Adjectives & adverbs", "jp": "〜くなります / 〜になります", "en": "become", "setting": {"scene": "Four months in, and the thing everybody comments on is that the weather has turned and so has your Japanese. Both are changes that happened without anybody doing anything on purpose, which is one verb in Japanese and the it-happens twin of the pair you met in Step 4.", "jp": "天気がよくなりました。", "en": "The weather got better.", "pattern": "なりました"}, "ext": [{"kind": "flip", "scene": "Somebody says the second one to you at the end of a meeting, and it is the same verb doing the same job about a person rather than a season — a change that arrived rather than one anybody performed.", "jp": "日本語が上手になりましたね。", "en": "Your Japanese has got good, hasn't it.", "t": null}, {"kind": "wrinkle", "scene": "How the word in front joins depends on its family — one drops its last kana and takes a different one, the other takes に — and the commonest adjective in the language is irregular in exactly this spot.", "jp": "よくなりました。", "en": "いい is irregular: よくなる, never いくなる.", "t": "い-adjectives drop い and add く (高くなる); nouns and な-adjectives take に (静かになる). いい is the irregular: よくなる, never いくなる."}], "what": "Becoming — change of state, with the change inside the verb なる.", "build": "い-adjectives: 〜くなります (寒くなりました). な-adjectives and nouns: 〜になります (元気になりました, 医者になりました).", "when": "Weather turning, people recovering, careers happening, prices rising.", "watch": "なる is the it-happens twin — nobody has to do anything for 寒くなる. The someone-does-it twin is する, next lesson, and the pair is the transitivity logic from Step 4 wearing adjective clothing. Watch the joint: 寒くなる, never 寒いなる.", "ex": [["天気がよくなりました。", "The weather got better."], ["兄は医者になりました。", "My brother became a doctor."], ["日本語が上手になりましたね。", "The compliment of progress — becoming, aimed at you."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["部屋", "the room"], ["を", "object — someone is acting on it"], ["暖かくしてください。", "THE POINT — the doer twin of なる: MAKE it warm — く/に + する", 1]], "segNote": "Same く/に fork as なる — one rule feeding two verbs.", "hl": "静かにしました", "id": "shimasu-change", "step": "Step 9 · Adjectives & adverbs", "jp": "〜くします / 〜にします", "en": "make (something) ...", "setting": {"scene": "The staffroom is cold enough that two people are working in coats, and the heater controls are behind your desk. Somebody asks you to do something about it — which is the other twin of the verb you just learned, the one that needs a person to perform it and a thing to perform it on.", "jp": "部屋を暖かくしてください。", "en": "Please make the room warm.", "pattern": "暖かくして"}, "ext": [{"kind": "flip", "scene": "You ask the same of the caretaker about the corridor, which nobody has heated since November — the same twin of the same verb, this time as your request, with a doer in the sentence and a thing being done to.", "jp": "部屋を静かにしてください。", "en": "Please make the room quiet.", "t": null}, {"kind": "wrinkle", "scene": "The pair sit one word apart and mean entirely different things about who is responsible. One says the room warmed up. The other says somebody turned the heating on, and that somebody is in the sentence.", "jp": "部屋が暖かくなりました。", "en": "The room warmed up — nobody did it.", "t": "なる happens on its own; する is done by someone. 暖かくなりました — the room warmed up; 暖かくしました — somebody turned up the heat."}], "what": "Making something become — the deliberate twin of なります.", "build": "い-adjectives: 〜くします (部屋を暖かくします). な-adjectives and nouns: 〜にします (音を静かにします).", "when": "Requests and adjustments: warmer, quieter, cheaper, cleaner.", "watch": "する needs a doer and a を — that is the whole difference from なる. 部屋が暖かくなりました (it warmed up) versus 部屋を暖かくしました (someone warmed it): the verb pair logic from Step 4, one more time, because it never stops applying.", "ex": [["部屋を暖かくしてください。", "Please make the room warm."], ["音を静かにしました。", "I made the sound quiet."], ["すみません、少し静かにしてください。", "The polite adjustment request — change-する riding てください."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "暖かい sits outside the Step 9 bank; it is the module's own example.", "暖 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"seg": [["私", "I"], ["は", "topic marker"], ["コーヒー", "coffee — the winning option"], ["にします。", "THE POINT — \"I'll go with…\": にする settles a choice", 1]], "segNote": "の from Step 3 makes \"the red one\"; にする picks it. The two smallest words in the shop, doing all the work.", "hl": "にします", "id": "nisuru", "step": "Step 9 · Adjectives & adverbs", "jp": "〜にします", "en": "decide on", "setting": {"scene": "A restaurant with the whole section, a laminated menu you can read about a third of, and a waiter already standing at your elbow with a pad. The question he asks is the one every restaurant in the country asks, and the answer is a fixed pattern that means neither becoming nor doing but choosing between things.", "jp": "私はコーヒーにします。", "en": "I'll have the coffee.", "pattern": "にします"}, "ext": [{"kind": "flip", "scene": "Somebody hesitates and you ask them the same question the waiter asked you, which is the shape you will use in every restaurant, ticket office and coffee shop from here on.", "jp": "何にしますか。", "en": "What will you have?", "t": null}, {"kind": "extra", "scene": "You get one kana wrong and announce, to a waiter holding a pad, that you are going to turn into a coffee. He writes down what you meant, because context is generous, and you hear it a second later.", "jp": "コーヒーになります。", "en": "I will become coffee — one kana away from ordering one.", "t": "One vowel from a different world: にします chooses, になります becomes. コーヒーにします orders a coffee; コーヒーになります is a prophecy. Both are grammatical, which is why the slip goes unnoticed by everyone except the waiter."}], "what": "Deciding on something — the choosing にします, mostly heard across counters.", "build": "[chosen thing] にします: コーヒーにします. Question: 何にしますか.", "when": "Ordering, choosing between options, settling any what-will-you-have.", "watch": "One vowel from a different world: にします chooses, になります becomes — コーヒーにします orders a coffee; コーヒーになります is a prophecy. And 何にしますか is THE restaurant question; answering it with にします closes the loop politely.", "ex": [["私はコーヒーにします。", "I'll have coffee."], ["赤いのにします。", "I'll go with the red one."], ["何にしますか。— 私はうどんにします。", "THE ordering exchange, both halves."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["あまり", "THE POINT — \"not very\": あまり opens, and a NEGATIVE must close", 1], ["高くないです。", "\"isn't expensive\" — the negative that あまり promised"]], "segNote": "", "hl": "あまり", "id": "amari", "step": "Step 9 · Adjectives & adverbs", "jp": "あまり〜ない", "en": "not very", "setting": {"scene": "Somebody has cooked and is asking whether you like it, and the honest answer is not very — which in English is a small negative and in Japanese is a whole grammatical contract. The adverb makes a promise at the front of the sentence that the ending has to keep.", "jp": "あまり高くないです。", "en": "It's not very expensive.", "pattern": "あまり"}, "ext": [{"kind": "flip", "scene": "Later somebody asks about a dish you genuinely do not like, and this is the polite machinery for saying so — not the blunt word for dislike, but this adverb doing social work.", "jp": "あまり好きじゃないです。", "en": "I don't like it very much.", "t": null}, {"kind": "wrinkle", "scene": "Start the sentence with it and forget to finish negative, and the contract breaks halfway. The adverb is a promise of a negative ending, and the next lesson's adverb makes the same promise harder.", "jp": "あまり高くないです。", "en": "あまり高いです is broken — the ending must be negative.", "t": "あまり is a promise of a negative ending — あまり高いです breaks the contract mid-sentence. ぜんぜん (next) makes the same promise, harder."}], "what": "Not very — a softener that only works holding hands with a negative.", "build": "あまり + negative: あまり高くないです, あまり食べません.", "when": "Polite lukewarmness — about food, hobbies, weather, and anything you'd rather not condemn outright.", "watch": "The negative is not optional: あまり高いです is broken. In speech you will hear あんまり — same word, relaxed. And あまり好きじゃないです is the polite way to dislike something, which the liking lesson in Step 10 will lean on.", "ex": [["あまり高くないです。", "It's not very expensive."], ["あまりテレビを見ません。", "I don't watch TV much."], ["スポーツをしますか。— あまりしません。", "The polite lukewarm answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "好き arrives in Step 10; used here as the module's own example."], "claims": [], "sources": []}, {"seg": [["ぜんぜん", "THE POINT — \"not at all\": total zero, negative required", 1], ["わかりません。", "\"don't understand\" — the required negative"]], "segNote": "", "hl": "ぜんぜん", "id": "zenzen", "step": "Step 9 · Adjectives & adverbs", "jp": "ぜんぜん〜ない", "en": "not at all", "setting": {"scene": "A meeting in which somebody speaks for six minutes about something you needed to understand, and afterwards asks, kindly, how much of it landed. The honest answer is at the far end of the same dial you learned last lesson, and it makes the same promise about how the sentence has to end.", "jp": "ぜんぜんわかりません。", "en": "I don't understand at all.", "pattern": "ぜんぜん"}, "ext": [{"kind": "flip", "scene": "She asks whether it was too fast and you use it again about something else that was entirely absent — the adverb at the front, the negative at the end, the whole distance between them held open.", "jp": "ぜんぜん時間がありません。", "en": "There's no time at all.", "t": null}, {"kind": "wrinkle", "scene": "Then somebody at lunch uses it with a positive and nobody blinks, because casual speech bends this rule daily. Recognise it, enjoy it, and keep your own version negative in anything written or polite.", "jp": "ぜんぜん大丈夫。", "en": "Totally fine — real, common, and casual only.", "t": "Casual speech bends this: ぜんぜん大丈夫 — \"totally fine\" — is real and common among friends. In writing and polite speech, keep ぜんぜん negative."}], "what": "Not at all — total negation's adverb.", "build": "ぜんぜん + negative: ぜんぜんわかりません, ぜんぜんありません.", "when": "Honest zeroes: no money, no idea, no time.", "watch": "Textbook rule: negative required. Street truth: casual speech says ぜんぜん大丈夫 (totally fine) constantly — recognize it, enjoy it, and keep your own ぜんぜん glued to negatives for now; in writing the positive use still reads as slang.", "ex": [["ぜんぜんわかりません。", "I don't understand at all."], ["お金がぜんぜんありません。", "I have no money at all."], ["わかりましたか。— いいえ、ぜんぜんわかりませんでした。", "The honest zero, politely delivered."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "大丈夫 sits outside the Step 9 bank; it appears in the module's own wrinkle and in the Step 8 culture lesson."], "claims": [], "sources": []}, {"seg": [["この映画", "this movie"], ["は", "topic marker"], ["とても", "THE POINT — \"very\": the plain intensifier for positive sentences", 1], ["面白いです。", "\"is interesting\""]], "segNote": "The soft end of the dial — \"a bit.\" Also the polite understater: ちょっと高いです often means \"too expensive for me.\"", "hl": "ちょっと", "id": "totemo", "step": "Step 9 · Adjectives & adverbs", "jp": "とても / ちょっと", "en": "very / a little", "setting": {"scene": "Parents' evening again, a year on, and every sentence you say tonight is a judgement with a dial on it. There are four settings on that dial and you have been using one of them for everything, which makes twelve conversations sound like the same conversation.", "jp": "この映画はとても面白いです。", "en": "This film is very interesting.", "pattern": "とても"}, "ext": [{"kind": "flip", "scene": "For a child who is nearly there rather than entirely there, you need the small setting instead — the same slot in the sentence, one notch down, and a completely different message home.", "jp": "ちょっと難しいです。", "en": "It's a little difficult.", "t": null}, {"kind": "wrinkle", "scene": "What the big one cannot do is go negative. For not very the language changes machinery altogether and reaches for last lesson's adverb, so the full dial runs across two different systems.", "jp": "あまり面白くないです。", "en": "Not very interesting — とても can't do this job.", "t": "とても doesn't do negatives. For \"not very\" the language switches machinery: あまり + negative. The full dial: とても / ちょっと / あまり〜ない / ぜんぜん〜ない."}], "what": "The everyday degree dials: とても turns it up, ちょっと turns it down.", "build": "Both sit before the adjective or verb: とても面白い, ちょっと疲れました.", "when": "Everywhere — degree words are how opinions get their volume set.", "watch": "ちょっと is double-booked: it measures smallness AND powers the soft refusal (the invitations step's ちょっと…). Tone and the trailing-off decide which. In speech すごく does とても's job, and めっちゃ sits further down the casual ladder — the slang stop next door covers that crowd.", "ex": [["この映画はとても面白いです。", "This movie is very interesting."], ["ちょっと疲れました。", "I'm a little tired."], ["日本の夏はどうですか。— とても暑いです。", "Volume set to high — the standard weather verdict."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "難しい sits outside the Step 9 bank.", "難 is outside KANJI_DICT — furigana needed. Kept because the word is the module's own example vocabulary for this point."], "claims": [], "sources": []}, {"seg": [["電車", "the train — about to lose"], ["より", "marks the loser (Step 3's より)"], ["バス", "the bus — the winner"], ["のほうが", "THE POINT — のほう marks the WINNER of the comparison", 1], ["安いです。", "\"is cheap(er)\""]], "segNote": "", "hl": "のほうが", "id": "hou", "step": "Step 10 · Comparing & preferring", "jp": "〜より〜のほうが", "en": "B more than A", "setting": {"scene": "Two routes to work, and after four months of alternating you finally have an opinion. Somebody in the staffroom asks which is better and the answer is a frame with two slots — and the adjective inside it does not change shape at all, however hard English wants it to.", "jp": "電車よりバスのほうが安いです。", "en": "The bus is cheaper than the train.", "pattern": "のほうが"}, "ext": [{"kind": "flip", "scene": "You ask her the same about summer and winter, which is the small talk equivalent of a free square, and the frame goes out exactly as it came in with two new nouns dropped into the slots.", "jp": "夏より冬のほうが好きです。", "en": "I prefer winter to summer.", "t": null}, {"kind": "wrinkle", "scene": "Asked which of two you prefer, the answer keeps the second half of the frame and drops the first entirely — the thing being compared against has already been said, so it does not need saying again.", "jp": "猫のほうが好きです。", "en": "I prefer cats — より gone, のほうが stays.", "t": "どちらのほうが好きですか asks the choice; the answer keeps のほうが even when より drops away entirely: 猫のほうが好きです."}], "what": "Comparing two things: the winner takes のほうが.", "build": "AよりBのほうが + adjective: 電車よりバスのほうが安いです. The question: AとBと、どちらのほうが…ですか.", "when": "Preferences, recommendations, and every which-is-better decision spoken aloud.", "watch": "The adjective never changes — no -er, no more: the frame does all the comparing while 安い stays 安い. English keeps groping for morphology here; stop letting it. And answer the どちら question WITH のほうが even though it repeats: 猫のほうが好きです.", "ex": [["電車よりバスのほうが安いです。", "The bus is cheaper than the train."], ["夏より冬のほうが好きです。", "I like winter more than summer."], ["犬と猫と、どちらのほうが好きですか。— 猫のほうが好きです。", "THE comparison question, frame echoed in the answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["果物", "fruit — the group"], ["のなかで", "\"within\" — sets the arena"], ["りんご", "apples"], ["が", "the winner takes が"], ["いちばん", "THE POINT — \"number one\": the superlative, with no change to the adjective", 1], ["好きです。", "\"liked (best)\""]], "segNote": "", "hl": "いちばん", "id": "ichiban", "step": "Step 10 · Comparing & preferring", "jp": "〜のなかで〜がいちばん", "en": "the most (superlative)", "setting": {"scene": "The children have worked out that you will answer questions about yourself, and have moved on from two-way comparisons to outright rankings — favourite food, favourite season, favourite animal, in that order, every lunchtime. Two things compare with last lesson's frame; three or more crown a winner, and crowning needs a different word entirely.", "jp": "果物のなかでりんごがいちばん好きです。", "en": "Of all fruit I like apples best.", "pattern": "いちばん"}, "ext": [{"kind": "flip", "scene": "You turn it round on them, which buys four minutes and gets the whole class talking — the group takes one frame, and the thing being crowned takes the particle that has been following 好き around all step.", "jp": "野菜のなかで何がいちばん好きですか。", "en": "Which vegetable do you like best?", "t": null}, {"kind": "wrinkle", "scene": "The question word in that sentence takes the same particle it took back in Step 1, which has been quietly on duty ever since — and the adjective, again, does no work at all.", "jp": "誰がいちばん上手ですか。", "en": "Who is best at it? — question words take が.", "t": "Two things compare with のほうが; three or more crown a winner with いちばん. Asking about the group uses 何・誰 + が + いちばん."}], "what": "The superlative, made of number one: いちばん.", "build": "[group] のなかで [X] がいちばん + adjective. Questions: 何が / 誰が / どこがいちばん…ですか.", "when": "Favourites, records, rankings — and small talk's favourite question shape: 日本料理のなかで何がいちばん好きですか.", "watch": "Question words take が (the rule from Step 1, still on duty), the group takes のなかで, and again no morphology — いちばん does the lifting while the adjective rests. Answering with just the winner + です is natural: 寿司です。", "ex": [["果物のなかでりんごがいちばん好きです。", "Among fruits, I like apples the most."], ["クラスのなかで田中さんがいちばん背が高いです。", "Tanaka-san is the tallest in the class."], ["日本料理のなかで何がいちばん好きですか。— 寿司です。", "Superlative question; predicate-echo answer."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["音楽", "music — what English would call the object"], ["が", "THE POINT — 好き demands が: liking is a state, not an action", 1], ["好きです。", "\"is liked\" — a な-adjective, not a verb"]], "segNote": "きらい — dislike — runs on the same rails: が, な-adjective, the whole system.", "hl": "が", "id": "suki", "step": "Step 10 · Comparing & preferring", "jp": "〜が好きです / きらいです", "en": "like / dislike", "setting": {"scene": "A welcome dinner for the new term, and the question going round the table is what music you listen to. The sentence you want has a thing you like sitting in the middle of it, and every instinct you own says that thing is the object of the verb.", "jp": "音楽が好きです。", "en": "I like music.", "pattern": "が好きです"}, "ext": [{"kind": "flip", "scene": "You ask it back and get it wrong in the other direction, about a food you would rather avoid — because the blunt word for dislike lands far harder in Japanese than its English translation suggests.", "jp": "あまり好きじゃないです。", "en": "I don't like it much — the polite version of dislike.", "t": null}, {"kind": "wrinkle", "scene": "The error is completely predictable and survives a year if nobody corrects it. 好き is not a verb; it is describing a state, and the thing you like is grammatically what does the pleasing.", "jp": "音楽が好きです。", "en": "音楽を好きです is the classic wreck — が, always.", "t": "音楽を好きです is the single most predictable English-speaker error of this step. 好き describes a state, and states take が."}], "what": "Liking, built as a な-adjective rather than a verb — which is why the liked thing takes が.", "build": "[thing] が好きです. Stronger: 大好きです. Dislike: きらいです — but see the caution.", "when": "Preferences of every kind, and the getting-to-know-you question: 〜が好きですか.", "watch": "が, never を — Step 10's drum, drummed. And きらい lands HARD in conversation; polite dislike is あまり好きじゃないです, the あまり lesson doing social work. きらい also hides in the な-family despite its い — きらいくない is wrong twice.", "ex": [["音楽が好きです。", "I like music."], ["野菜がきらいです。", "I dislike vegetables."], ["日本の食べ物が好きですか。— はい、大好きです。", "The liking question, asked and amplified."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["妹", "my little sister — the person, as topic"], ["は", "topic marker"], ["ピアノ", "piano — the skill area"], ["が", "THE POINT — 上手・下手 point at the skill with が", 1], ["上手です。", "\"is good at\" — な-adjective"]], "segNote": "下手 — bad at — same structure, humbler content.", "hl": "が", "id": "jouzu", "step": "Step 10 · Comparing & preferring", "jp": "〜が上手です / 下手です", "en": "good at / bad at", "setting": {"scene": "Four months in, somebody tells you your Japanese is good, and it is not — it is better than it was, which is a different thing. What follows is a small ritual with two moves in it, and the word they used is one you must never point back at yourself.", "jp": "妹はピアノが上手です。", "en": "My sister is good at piano.", "pattern": "が上手です"}, "ext": [{"kind": "flip", "scene": "Somebody asks what you are actually good at, and the honest answer needs the modest word instead — the one you use about your own strengths, because the other one aimed inward reads as boasting.", "jp": "料理が得意です。", "en": "Cooking is my strong suit.", "t": null}, {"kind": "wrinkle", "scene": "The second move of the ritual is the deflection, and it is not false modesty so much as the expected next line. Agreeing with the compliment is the move that actually lands badly.", "jp": "いえいえ、まだまだです。", "en": "Not at all, I've a long way to go.", "t": "上手 praises OTHERS. About your own strengths, 得意 is the natural word — and deflecting praise (いえいえ、まだまだです) is half the grammar of this lesson."}], "what": "Skill: good at, bad at — the skill takes が.", "build": "[skill] が上手です / 下手です.", "when": "Praising others' abilities — and hearing your own praised, which will happen the moment you say こんにちは.", "watch": "上手 praises OTHERS; about yourself use 得意 (strong suit) or 苦手 — the 得意 you met in the kanji module. 下手 about someone else is blunt; あまり上手じゃないです spares feelings. And when 日本語が上手ですね lands on you, the native move is deflection: いえいえ、まだまだです.", "ex": [["妹はピアノが上手です。", "My sister is good at piano."], ["私は歌が下手です。", "I'm bad at singing."], ["日本語が上手ですね。— いえいえ、まだまだです。", "The compliment you WILL receive, and its standard deflection."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "料理 and 得意 sit outside the Step 10 bank; 得意 is named in the module's own watch beat."], "claims": [], "sources": []}, {"seg": [["日本語", "Japanese — the thing that is clear"], ["が", "THE POINT — わかる takes が: understanding happens to you", 1], ["少し", "\"a little\""], ["わかります。", "\"is understandable (to me)\""]], "segNote": "", "hl": "が", "id": "wakaru", "step": "Step 10 · Comparing & preferring", "jp": "〜がわかります", "en": "understand", "setting": {"scene": "A parent is explaining something at speed and stops to check whether you are following. There are two words that both come out as understand in English and they are not interchangeable — one is having the information, the other is it making sense, and the negatives split harder than the positives do.", "jp": "日本語が少しわかります。", "en": "I understand a little Japanese.", "pattern": "わかります"}, "ext": [{"kind": "flip", "scene": "Somebody asks whether you know a colleague by name, which turns out to be the other verb entirely — that one is about holding a piece of information rather than about anything becoming clear to you.", "jp": "知っています。", "en": "I know (of) her.", "t": null}, {"kind": "wrinkle", "scene": "The particle is the same trap as 好き, one lesson on. It helps to read the verb as is-clear-to-me rather than as understand, because then the が stops looking wrong.", "jp": "日本語がわかります。", "en": "Japanese is clear to me — hence が, not を.", "t": "を…わかる is the same trap as を好き. It helps to read わかる as \"is clear (to me)\": 日本語がわかります — Japanese is clear to me."}], "what": "Understanding — what makes sense to you takes が.", "build": "[thing] がわかります. わかりました — got it. わかりません — I don't understand, or I can't tell.", "when": "Classrooms, directions, and the meta-question that keeps every conversation alive: わかりますか.", "watch": "わかる vs 知る: 知っています is having the information; わかります is it making sense. The negatives split harder — 知りません (never heard of it) about a person you've met sounds cold; わかりません stays safe. When lost, the full sentence すみません、よくわかりません buys help without offence.", "ex": [["日本語が少しわかります。", "I understand a little Japanese."], ["意味がわかりません。", "I don't understand the meaning."], ["この言葉の意味がわかりますか。— いいえ、よくわかりません。", "The meaning question — 意味 from the kanji module, earning its keep."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["本", "books"], ["を", "object of the inner clause — it survives"], ["読む", "\"read\" — plain form; の insists on it"], ["のが", "THE POINT — の turns the action into a thing; が then does its 好き job", 1], ["好きです。", "\"is liked\""]], "segNote": "", "hl": "のが", "id": "nogasuki", "step": "Step 10 · Comparing & preferring", "jp": "〜のが好きです", "en": "like doing", "setting": {"scene": "A form for the school newsletter asks about hobbies, and every answer you want is a verb rather than a noun — reading, walking, cooking. Japanese will not let a verb take the particle that 好き demands until something turns the verb into a thing first, and Step 3 promised this job was coming.", "jp": "本を読むのが好きです。", "en": "I like reading books.", "pattern": "のが好き"}, "ext": [{"kind": "flip", "scene": "You ask a colleague the same and her answer runs the identical machinery on a different verb — the plain form, then the one syllable that turns it into a noun, then the particle that was waiting for one.", "jp": "歌を歌うのが好きです。", "en": "I like singing.", "t": null}, {"kind": "wrinkle", "scene": "It only works on the plain form, and the object inside survives — so the sentence ends up carrying two particles doing two entirely different jobs, one inside the noun and one outside it.", "jp": "本を読むのが好きです。", "en": "を inside, が outside — 読みますのが is out.", "t": "の nominalizes only PLAIN forms — 読みますのが is out. And the inner を survives: 本を読むのが好き carries two particles doing two different jobs."}], "what": "Liking an activity — の turns the verb into a noun first, then 好き treats it like any liked thing.", "build": "Dictionary form + のが好きです: 読むのが好きです.", "when": "Hobbies, and the hobby question: 何をするのが好きですか.", "watch": "This i
