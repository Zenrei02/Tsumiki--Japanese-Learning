<script>
const D = {"steps": ["Step 0 · Before any Japanese", "Step 1 · Your first sentences", "Step 2 · Core particles", "Step 3 · Joining, choosing & counting", "Step 4 · Verbs: from dictionary form up", "Step 5 · Requests, permission & obligation", "Step 6 · Invitations, desire & intention", "Step 7 · Linking actions & time", "Step 8 · Existence & possession", "Step 9 · Adjectives & adverbs", "Step 10 · Comparing & preferring", "Step 11 · Reasons, contrast & connectors", "Step 12 · Past N5 · the shape-changers", "Step 13 · て-form, second wind", "Step 14 · Giving, receiving & kindness", "Step 15 · Guessing, seeming & hearsay", "Step 16 · The four ifs", "Step 17 · Intentions, decisions & change", "Step 18 · Ability, experience & degrees", "Step 19 · Time's edges", "Step 20 · Doing to & being done to", "Step 21 · Reasons, concessions & flow", "Step 22 · Wrapping thoughts", "Step 23 · Other minds"], "lessons": [{"seg": [], "segNote": "", "hl": "", "id": "prim-shape", "step": "Step 0 · Before any Japanese", "jp": "Backwards, but consistently", "en": "how a Japanese sentence is put together", "setting": {"scene": "The immigration hall, after the flight and before the country starts. The officer takes your passport and the landing card you filled in somewhere over Siberia. If you are staying more than three months you will leave this desk holding a residence card — the document you are then required to carry every day you are here. He asks, in Japanese first, what you have come to do.", "jp": "カードを見せます。", "en": "Card show. — I show the card.", "pattern": "を"}, "ext": [{"kind": "flip", "scene": "An hour later, at the airport post office, you want a travel card for the trains. The words are not in your head yet, but the shape is, and the shape is the reverse of everything you have said out loud since you were two: whatever the thing is goes first, and whatever you are doing to it goes last.", "jp": "カードを買います。", "en": "Card buy. — I'll buy a card.", "t": null}, {"kind": "extra", "scene": "The clerk answers with a sentence that begins exactly like the one you expected and then ends somewhere else entirely. Everything that mattered — whether it was a question, whether it was negative — arrived after you had already stopped listening.", "jp": "カードを買いますか。", "en": "Will you buy a card? — one syllable at the end, and it was a question all along.", "t": "The last word decides everything — tense, politeness, question or statement, and whether the whole sentence was negative. English commits in the first three words; Japanese commits in the last two syllables, which is why you have to listen to the end of a sentence you thought you had already understood."}], "what": "Japanese is not scrambled English. It's English run in a different order — and the order is completely consistent, which means three rules cover most of the shock. You can meet all three before learning a single Japanese word, so everything below is in English, arranged the way Japanese arranges it.", "build": "One: the verb goes last. Always, no exceptions, however long the sentence gets. Two: the little connecting words come after the thing they connect, not before — English says \"in Tokyo,\" Japanese says \"Tokyo-in.\" Three: anything that describes something goes in front of it, including entire clauses. English says \"the book I bought yesterday.\" Japanese says \"the yesterday-I-bought book.\"", "when": "Read the examples below out loud. They look ridiculous in English and they are precisely correct in Japanese. The point is that your first real sentence should feel familiar rather than impossible.", "watch": "Rule one has a delightful consequence: the last word decides everything. Tense, politeness, whether it's a question, and — best of all — whether the whole sentence is negative. \"I to the party go…\" is not yet a finished thought, because \"…not\" might still be coming. There is a reason Japanese listeners are famously patient.", "ex": [], "orphanWr": [], "flags": ["STEP 0 LINES ARE ILLUSTRATIVE — 見せます and 買います are not taught yet. Step 0 exists to show sentence shape before any grammar, exactly as the module's own 'Coffee drink.' example does."], "claims": ["Residence cards are issued to foreign nationals staying more than three months", "Carrying the card is a legal requirement for residents aged 16 and over"], "sources": ["https://www.keishicho.metro.tokyo.lg.jp/multilingual/english/finding_services/living_guide/living_guide_e_4.html", "https://life.m-ri.co.jp/en/zairyu-card-guide.html"]}, {"seg": [], "segNote": "", "hl": "", "id": "prim-drop", "step": "Step 0 · Before any Japanese", "jp": "Half of it isn't there", "en": "what Japanese leaves out", "setting": {"scene": "The ward office, second week, registering the address you must register inside fourteen days. The clerk has your form, your card and your passport laid out in front of her, so she already knows your name, your date of birth and where you now live. She looks up and asks what you do for a living, and there is exactly one piece of information in the room that she does not have.", "jp": "先生です。", "en": "Teacher. — I'm a teacher.", "pattern": null}, "ext": [{"kind": "flip", "scene": "A fortnight later the school hands you a form of its own, and the teacher at the next desk reads the box over your shoulder and asks whether the person in the photo is your brother. He is not. Nothing in the answer needs to name him, or you, or the photograph.", "jp": "友達です。", "en": "A friend. — He's a friend.", "t": null}, {"kind": "extra", "scene": "At the welcome lunch, everyone goes round the table. The person before you says what they do, and then it is your turn, and this is the one time all fortnight the word for I earns its place — because the sentence is not about you, it is about you as opposed to him.", "jp": "私は先生です。", "en": "I'm a teacher — as opposed to whatever he just said.", "t": "私 does not disappear because it is impolite — it disappears because it is already known. Put it back in and you are drawing a contrast: 私は先生です answers 'and what about you?' rather than 'what do you do?'. That is why saying it in every sentence reads as strange rather than wrong."}], "what": "English demands a subject in every sentence, even when the subject means nothing at all — \"it\" is raining, \"there\" is a book on the desk. Nobody can point to that \"it.\" Japanese has no such requirement. If everyone already knows who or what you mean, it simply isn't said, and the sentence is finished without it.", "build": "Nothing to build — this is a rule about what you leave out. \"Delicious was\" is a whole, grammatical, entirely unremarkable Japanese sentence.", "when": "Constantly. Most Japanese sentences you will hear contain no visible subject whatsoever. The moment you stop supplying one out of habit, your writing gets noticeably better.", "watch": "Saying \"I\" in every sentence is the single loudest tell of an English speaker writing Japanese. It isn't wrong so much as strange — a native speaker includes it to draw a contrast, and otherwise doesn't bother. There's a whole lesson on this later; for now, just notice how little is missing from the examples below.", "ex": [], "orphanWr": [], "flags": [], "claims": ["Address registration must be completed within 14 days of moving in"], "sources": ["https://life.m-ri.co.jp/en/jyumin-toroku.html"]}, {"seg": [["私", "I — a noun, about to be introduced as the topic"], ["は", "topic marker — \"as for me…\" (Step 2 takes this apart properly)"], ["学生", "student — the thing being claimed"], ["です。", "THE POINT — the polite \"is\": it equates 私 with 学生 and closes the sentence", 1]], "segNote": "だ is です with the politeness removed — same job, plain register. Recognize it now; you'll produce it later.", "hl": "だ", "id": "desu", "step": "Step 1 · Your first sentences", "jp": "〜です / だ", "en": "how to say what something is", "setting": {"scene": "A police box, a Tuesday evening, and an officer has asked to see your card. The card is in your wallet, which is where it has to be — a photograph of it on your phone does not satisfy the law, and not carrying it is a fine of up to two hundred thousand yen. He reads the status printed on the front and asks, conversationally, what you are here for.", "jp": "学生です。", "en": "I'm a student.", "pattern": "です"}, "ext": [{"kind": "flip", "scene": "Saturday, and a neighbour two doors down stops you by the bins to ask about the dog you have been walking, which is not yours — you are minding it for the family upstairs while they are away. One word and です does the whole job.", "jp": "友達の犬です。", "en": "It's a friend's dog.", "t": null}, {"kind": "wrinkle", "scene": "Later the same conversation she asks whether the vet was expensive, and the answer needs an adjective rather than a noun. です comes along anyway, and this time it is carrying nothing but manners.", "jp": "高いです。", "en": "It's expensive — です adds politeness, nothing else.", "t": "です also rides along after い-adjectives purely for politeness — there it adds no meaning, only polish."}], "what": "Japanese has no verb quite like English \"is.\" Instead, です sits at the end of a sentence and says: that's the statement, and I'm saying it politely. 私は学生です is closer to \"me — student — politely\" than to \"I am a student.\"", "build": "Put です at the very end, after a noun or an adjective. だ is the same word without the politeness, used with close friends. In relaxed speech people often drop だ entirely and just let the noun stand.", "when": "Identifying, describing, stating a plain fact. です is the safe adult default — strangers, staff, teachers, work.", "watch": "です does not mean \"exists.\" \"There is a book on the desk\" needs あります (Step 8), not です. And です never attaches to an ordinary verb: 食べるです isn't a thing.", "ex": [["私は学生です。", "I am a student."], ["これは本だ。", "This is a book."]], "orphanWr": [], "flags": ["How routine such stops are varies by area and is contested; the setting says 'has asked' without claiming a frequency."], "claims": ["Police may ask foreign residents to produce their residence card; failure to carry it is punishable by a fine of up to ¥200,000", "A photocopy or phone photograph does not satisfy the requirement"], "sources": ["https://www.keishicho.metro.tokyo.lg.jp/multilingual/english/finding_services/living_guide/living_guide_e_4.html", "https://oharalaw-japan.com/2016/02/24/do-foreigners-in-japan-need-to-carry-their-residence-card-at-all-times/"]}, {"seg": [["これ", "THE POINT — \"this,\" near me, standing alone as a noun", 1], ["は", "topic marker"], ["私の", "\"my\" — の glues 私 to the noun (Step 3)"], ["本", "book"], ["です。", "\"is\" — closes the statement"]], "segNote": "その is holding the noun 店 — the +の set (この・その・あの) never stands alone, and the bare set (これ・それ・あれ) never holds a noun.", "hl": "その", "id": "kosoado", "step": "Step 1 · Your first sentences", "jp": "これ・それ・あれ / この・その・あの", "en": "this, that, that over there", "setting": {"scene": "The counter at the city office, and three things are on it: the form you have just filled in, in front of you; your residence card, which the clerk has slid to her side to copy the number off; and a rack of leaflets against the far wall that you will need one of before you leave. She asks which of them is yours to take away.", "jp": "それはカードです。", "en": "That one — by you — is the card.", "pattern": "それ"}, "ext": [{"kind": "flip", "scene": "Now you are the one asking. The leaflet you need is behind her on the rack, out of reach of both of you, and pointing at it is the entire sentence — the word you choose says how far away it is from the pair of you.", "jp": "あれをください。", "en": "That one over there, please.", "t": null}, {"kind": "wrinkle", "scene": "Somebody comes to the counter and speaks to the clerk by name, and you want to know who he is. He is not near you and not near her. The far word does the work again, and this time the thing it points at is a person.", "jp": "あの人は誰ですか。", "en": "Who is that person over there?", "t": "あの and あれ point away from BOTH of you. Something in your listener's hands is それ, however far from you it sits — distance is measured from the pair of you."}], "what": "English splits pointing two ways, this and that. Japanese splits it three, by who the thing is near: これ is by me, それ is by you, あれ is away from both of us.", "build": "Two sets, and mixing them up is the classic error. これ・それ・あれ stand alone in place of a noun: これは本です. この・その・あの must be followed by a noun: この本は高いです. どれ and どの are the \"which\" versions.", "when": "Shopping, pointing, choosing — and constantly in conversation, where それ means \"that thing you just said\" rather than anything physical.", "watch": "これ本です is wrong; これ can't lean on a noun, so it's この本です or これは本です. The three-way split is genuinely about the listener, not just distance — something in your hands is それ even if you're sitting together.", "ex": [["これは私の本です。", "This is my book. (near me)"], ["その店は安いですよ。", "That shop is cheap. (near you, or one you mentioned)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-kosoado", "step": "Step 1 · Your first sentences", "jp": "こそあど · 三方向", "en": "three directions, two sets", "setting": {"scene": "The station lost-property window, the morning after you left a bag on the train. The man behind the counter goes into the back and returns with three of them, which he sets on a shelf well out of reach of either of you. He does not ask you to describe it. He waits for you to point, and the choice is not one decision but two.", "jp": "あれです。", "en": "That one — away from us both.", "pattern": "あれ"}, "ext": [{"kind": "flip", "scene": "He brings it down and asks whether the umbrella hooked on the strap is yours too. It is now in his hands, a metre from your face — which by the rule you have just learned is not near you at all, whatever the tape measure says.", "jp": "それも私のです。", "en": "That one's mine too.", "t": null}, {"kind": "extra", "scene": "He asks you to sign for it, and the form wants the item written in — so now the pointing word has a noun to hold, and the word itself has to change to hold it.", "jp": "そのかばんです。", "en": "That bag — pointing word plus noun, so それ becomes その.", "t": "The second decision is which set. これ・それ・あれ stand alone in place of a noun; この・その・あの cannot stand at all and must be holding one. これ本です is the error the two sets produce, and it is the commonest in this step."}], "what": "English points two ways; Japanese points three, and then doubles the system: これ・それ・あれ stand alone, この・その・あの must hold a noun. Two choices in every act of pointing, and both run on instinct in your first language — which is exactly why they need a drill in this one.", "build": "Choose the distance first: near me → こ, near you → そ, away from both of us → あ. Then choose the set: naming the thing itself, bare (これ); pointing at a noun you're about to say, +の (この本). The ど row — どれ, どの — asks the same two questions as a question.", "when": "Every act of pointing, and half of conversation — where それ mostly means 'the thing you just said' rather than anything in the room.", "watch": "The two errors are mirror images. これ本です — a bare pointer leaning on a noun it cannot hold. And あの for anything far from YOU — but あ means far from both of you; something in your listener's hands is それ however far away they're standing. Distance is measured from the pair of you, not from your arm.", "ex": [["この本は高いです。", "Holding a noun → この."], ["それは何ですか。", "Near the listener, standing alone → それ."], ["あれは学校です。", "Away from both of us → あれ."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["これ", "\"this\" — near me"], ["は", "topic marker"], ["水", "water — the thing being denied"], ["じゃないです。", "THE POINT — \"is not\": the denial that stands where です stood", 1]], "segNote": "Same word in formal dress — ではありません is what careful speech and writing use. じゃない, bare, is what friends hear.", "hl": "ではありません", "id": "janai", "step": "Step 1 · Your first sentences", "jp": "〜じゃないです / ではありません", "en": "saying it isn't", "setting": {"scene": "The clerk has been working from your visa category and has ticked the box that says student. You are not one — you are here to work, and that box decides which of two forms you spend the next twenty minutes on. Her hand is already going to the wrong pile, and you have about four seconds and one sentence.", "jp": "学生じゃないです。", "en": "I'm not a student.", "pattern": "じゃないです"}, "ext": [{"kind": "flip", "scene": "A week later, at the school gate, a parent takes you for the other foreign teacher — the one who left in March. Same shape, different noun, and it is the politest available way to stop a conversation going somewhere neither of you wants.", "jp": "日本人じゃないです。", "en": "I'm not Japanese.", "t": null}, {"kind": "wrinkle", "scene": "She apologises and asks whether the textbook you are holding was expensive, meaning to be kind about it. It was not — and the word for expensive refuses this negative entirely, because it is not a noun and it can do the job itself.", "jp": "この本は高くないです。", "en": "This book is not expensive — the adjective negates itself.", "t": "い-adjectives never take this negative. 高い carries its own: 高くない — never 高いじゃない. This split catches every English speaker; Step 9 drills it."}], "what": "The \"no, it isn't\" partner of です.", "build": "Noun + じゃないです (conversational) or + ではありません (formal, and what you'll see in writing). The plain version, for friends, is just じゃない. ではない is the same word as じゃない in its dressed-up spelling.", "when": "Correcting someone, denying something, softening a claim.", "watch": "This negative is only for nouns and な-adjectives. い-adjectives negate on their own — 高い becomes 高くない, never 高いじゃない (Step 9). Learners mix these two systems constantly.", "ex": [["これは水じゃないです。", "This is not water."], ["彼は先生ではありません。", "He is not a teacher."]], "orphanWr": [], "flags": [], "claims": ["The status of residence printed on the card determines which procedures apply"], "sources": ["https://expat.jp/status-of-residence-japan/"]}, {"seg": [["昨日", "yesterday — a bare time word, no particle needed"], ["は", "topic marker"], ["雨", "rain — a noun; \"rainy\" as a state"], ["でした。", "THE POINT — です moved into the past: \"was\"", 1]], "segNote": "", "hl": "でした", "id": "deshita", "step": "Step 1 · Your first sentences", "jp": "〜でした", "en": "saying what something was", "setting": {"scene": "You took the afternoon off, cycled twenty minutes and found the shutters down. Municipal offices keep short weekday hours and shut at weekends, so the errand you have to complete inside fourteen days now has eleven left in it. The next morning somebody at work asks whether you got it sorted.", "jp": "休みでした。", "en": "It was closed.", "pattern": "でした"}, "ext": [{"kind": "flip", "scene": "She asks whether the ride over was at least pleasant, which it was not — it rained the whole way there and stopped the moment you turned round. Same past tense, your sentence this time, and the word in front of it is a noun again.", "jp": "雨でした。", "en": "It was rain. — It was raining.", "t": null}, {"kind": "wrinkle", "scene": "You want to add that it was not raining on the way back, which needs the past and the negative at once. Nothing new is required: two pieces you already own, stacked in that order.", "jp": "昨日は雨じゃなかったです。", "en": "Yesterday it wasn't rainy.", "t": "The past negative stacks pieces you already own: じゃなかったです in conversation, ではありませんでした in formal writing."}, {"kind": "wrinkle", "scene": "What you actually want to say is that it was cold, and that is where the sentence breaks — because cold is not a noun, and it will not accept でした at any price. It carries its own past inside itself.", "jp": "昨日は寒かったです。", "en": "Yesterday was cold — the adjective changed shape.", "t": "い-adjectives refuse でした — 寒い carries its own past, 寒かったです. 寒いでした is the classic miss; Step 9 drills the system."}], "what": "です moved into the past.", "build": "です → でした. For the past negative: じゃなかったです, or the formal ではありませんでした.", "when": "Describing how something or someone was — yesterday's weather, last week's schedule, a past job.", "watch": "Again, nouns and な-adjectives only. 寒いでした is wrong; い-adjectives carry their own past tense (寒かったです).", "ex": [["昨日は雨でした。", "Yesterday it was rainy."], ["先週は休みでした。", "Last week was a holiday."]], "orphanWr": [], "flags": ["Some municipalities run limited evening or Saturday counters; the setting does not claim otherwise."], "claims": ["Municipal offices generally keep weekday daytime hours and close at weekends", "The 14-day registration deadline runs regardless of whether the office was open"], "sources": ["https://life.m-ri.co.jp/en/jyumin-toroku.html"]}, {"seg": [["これ", "\"this\""], ["は", "topic marker"], ["何", "\"what\" — sitting exactly where the answer will sit"], ["です", "the polite closer, unmoved"], ["か。", "THE POINT — the spoken question mark: it turns the whole statement into a question", 1]], "segNote": "Nothing moved. English flips \"you are\" into \"are you\"; Japanese leaves the statement intact and hangs か on the end.", "hl": "か", "id": "ka", "step": "Step 1 · Your first sentences", "jp": "〜か", "en": "turning a statement into a question", "setting": {"scene": "Four windows, four queues, and a numbered ticket in your hand that does not say which of them it belongs to. The signs above each one are in kanji you cannot read yet. Everybody in the room knows where they are going except you, and the only tool you have is a sentence you can already say with one sound added to the end.", "jp": "これですか。", "en": "Is it this one?", "pattern": "か"}, "ext": [{"kind": "flip", "scene": "It was not that one. At the right window the clerk hands you a second form, and now you are asking whether this is the last of them — the same one syllable, doing the same work, on a sentence you built yourself.", "jp": "これは最後ですか。", "en": "Is this the last one?", "t": null}, {"kind": "wrinkle", "scene": "The teacher next to you at lunch asks the same kind of question and it sounds nothing like yours: no か at all, just the pitch going up at the end. Written down, meanwhile, the question you asked at the counter would end with a full stop.", "jp": "学生？", "en": "Student? — casual: か drops, the pitch does the work.", "t": "In writing, a か-question usually ends with 。 rather than ？. And in casual speech か drops entirely — rising pitch does the whole job: 学生？"}], "what": "か is a spoken question mark. It's a word, not punctuation, and it does the whole job on its own.", "build": "Add か to the very end: ですか, ますか. Nothing else moves. Japanese has no equivalent of English flipping \"you are\" into \"are you\" — the word order of the statement stays exactly as it was.", "when": "Any polite question.", "watch": "Two habits surprise people. In writing, Japanese usually ends a か-question with 。 rather than ？. And in casual speech か is dropped altogether — you just raise your pitch: 学生？", "ex": [["これは何ですか。", "What is this?"], ["田中さんは学生ですか。", "Is Tanaka-san a student?"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "最後 uses 後, outside KANJI_DICT — furigana needed, or swap the sentence."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-negq", "step": "Step 1 · Your first sentences", "jp": "「学生じゃないですか」—「はい」", "en": "yes means you're right, no means you're wrong", "setting": {"scene": "The immigration office, renewing your status. The officer is reading from your file and confirming one detail he already believes he knows. 「学生じゃないですか」 — you're not a student, are you? You are not. Your English instinct is about to answer the fact, and the fact is no, so the word arriving in your mouth is the wrong one.", "jp": "はい、学生じゃないです。", "en": "That's right — I'm not a student.", "pattern": "はい、"}, "ext": [{"kind": "flip", "scene": "Later that week you are the one asking. The neighbour has not put her bins out and you want to check she is not away — and the question you build is a negative one, which means her はい will mean yes-you're-right-I'm-not.", "jp": "明日、いませんか。", "en": "You won't be here tomorrow?", "t": null}, {"kind": "extra", "scene": "The officer asks a second one and you can feel yourself computing. So you skip the yes-or-no entirely and say the fact, which is shorter, completely natural, and impossible to get the wrong way round.", "jp": "学生です。", "en": "I'm a student. — answering the fact, not the phrasing.", "t": "The escape while the reflex builds: drop the particle and answer with the predicate. 学生じゃないですか — 学生です。 No はい, no いいえ, nothing to get backwards, and native speakers do it constantly for exactly the same reason."}], "what": "The drill the last lesson promised. English yes/no answers report the FACT: 'Aren't you a student?' — 'Yes' means I am one, however the question was phrased. Japanese はい/いいえ report on the STATEMENT: はい means 'what you said is correct', いいえ means 'what you said is wrong'. With positive questions the two systems agree, so the wiring difference hides. Negative questions expose it.", "build": "学生じゃないですか — you're not a student? はい、学生じゃないです: yes-your-statement-is-right, I'm NOT one. いいえ、学生です: no-your-statement-is-wrong, I AM one. Both answers sit exactly opposite the English instinct.", "when": "Negative questions are everywhere in polite speech precisely because they soften: 行きませんか, 高くないですか, 疲れていませんか. Every one of them is a small trap for this wiring.", "watch": "The reliable escape while the reflex builds: skip the particle and answer with the predicate. 学生じゃないですか — 学生です。 No はい, no いいえ, no ambiguity, completely natural. Native speakers do this constantly for the same reason. And when you do use はい, say the full echo after it — the echo keeps you honest, because you can hear whether it matches what you meant.", "ex": [["学生じゃないですか。— はい、学生じゃないです。", "はい agrees with the STATEMENT: right, not a student."], ["学生じゃないですか。— いいえ、学生です。", "いいえ rejects the statement: wrong — I am one."], ["行きませんか。— 行きます！", "The escape hatch: answer with the predicate and skip the particle entirely."]], "orphanWr": [], "flags": ["The softening claim is the module's own teaching; it is linguistic judgement rather than a sourced fact."], "claims": ["Negative questions are common in polite Japanese because they soften the asking"], "sources": []}, {"seg": [["これ", "\"this\""], ["は", "topic marker"], ["何", "THE POINT — \"what,\" dropped into the exact slot where the answer will go", 1], ["です", "polite closer"], ["か。", "question marker"]], "segNote": "いつ sits where the time would sit; どこ where the place would. The question word fills the answer's slot — nothing gets hauled to the front.", "hl": "いつ", "id": "qwords", "step": "Step 1 · Your first sentences", "jp": "何・誰・どこ・いつ・どう", "en": "the question words", "setting": {"scene": "A form with eleven boxes, of which you have confidently filled in three. The clerk has stepped away. The man beside you is filling in the same form at speed, and you need to know what goes in the fourth box badly enough to interrupt him — with a finger on it, so the question has somewhere to land.", "jp": "これは何ですか。", "en": "What is this?", "pattern": "何"}, "ext": [{"kind": "flip", "scene": "He tells you, and then the next box needs a different question — not what it is but where the thing goes. The word changes and nothing else in the sentence moves, which is the whole trick and takes about a week to trust.", "jp": "どこですか。", "en": "Where is it?", "t": null}, {"kind": "wrinkle", "scene": "A name gets called twice and nobody stands up, and you ask the man beside you who it was. The question word lands in the subject's seat — and that seat, when a question word is sitting in it, never takes は.", "jp": "誰が来ましたか。", "en": "Who came? — 誰が, never 誰は.", "t": "Question words take が, never は. And 何 switches reading: なん before です and counters, なに before を and most particles — copy the examples until it settles."}], "what": "The word that asks the question sits exactly where the answer would sit. Japanese doesn't haul it to the front of the sentence the way English does.", "build": "何 what, 誰 who, どこ where, いつ when, どう how, いくら how much, どうして why. Drop one into the slot you want filled and close with か: 誰が来ましたか。 The statement 田中さんが来ました becomes the question by swapping 田中さん for 誰 — nothing else moves.", "when": "Every question that isn't a yes/no question.", "watch": "Question words take が, never は — 誰が来ましたか, never 誰は. And 何 has two readings depending on what follows it: なん before です and counters (何ですか, 何人), なに before を and most particles (何を食べますか). Nobody teaches the rule because native speakers absorb it; copy the examples until it settles.", "ex": [["これは何ですか。", "What is this?"], ["いつ日本へ来ましたか。", "When did you come to Japan?"], ["どこで買いましたか。", "Where did you buy it?"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["今日", "today — bare time word"], ["は", "topic marker"], ["暑いです", "\"is hot\" — a complete polite statement"], ["ね。", "THE POINT — hands the thought to the listener: \"…right?\"", 1]], "segNote": "", "hl": "ね", "id": "ne", "step": "Step 1 · Your first sentences", "jp": "〜ね", "en": "inviting agreement", "setting": {"scene": "Forty minutes into a numbered wait at the city office, on a row of plastic chairs, beside a woman who arrived before you did. Neither of you is going anywhere. She catches your eye and says something about the weather — and what she is doing is not conveying information, because you are both sitting in the same room and you both already know it.", "jp": "いい天気ですね。", "en": "Nice weather, isn't it.", "pattern": "ね"}, "ext": [{"kind": "flip", "scene": "Your number is two away and hers is next, and the wait has been long enough that saying so out loud is a small act of solidarity rather than a complaint. You go first this time.", "jp": "長いですね。", "en": "It's long, isn't it.", "t": null}, {"kind": "wrinkle", "scene": "Then you nearly tell her something she cannot possibly know — that the counter shuts at five — with the same ね on the end, and it comes out wrong, because there is nothing there for her to agree with.", "jp": "五時までですね。", "en": "It's until five, isn't it — only works if she already knew.", "t": "ね leans on shared ground. If the listener can't already feel or know what you're saying, ね has nothing to lean on — announcing real news is よ's job, next lesson."}], "what": "ね turns a statement into \"…right?\" It hands the thought to the listener and asks them to nod along.", "build": "Tack ね onto the end of a finished sentence.", "when": "Small talk and shared observations — the weather, the food, the room. It's one of the most common sounds in daily Japanese, and it does real social work: it says we're on the same page.", "watch": "ね assumes the listener already knows or feels the same. Announcing something genuinely new with ね sounds off — that job belongs to よ.", "ex": [["今日は暑いですね。", "It's hot today, isn't it?"], ["いい天気ですね。", "Nice weather, isn't it?"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "長い and 五時 sit slightly ahead of the Step 1 bank; both appear in module examples by Step 3."], "claims": [], "sources": []}, {"seg": [["この店", "\"this shop\" — この holding its noun"], ["は", "topic marker"], ["安いです", "\"is cheap\" — a complete polite statement"], ["よ。", "THE POINT — flags the statement as news: \"you didn't know this\"", 1]], "segNote": "", "hl": "よ", "id": "yo", "step": "Step 1 · Your first sentences", "jp": "〜よ", "en": "flagging news", "setting": {"scene": "The same waiting room, a week later. A man two seats along is holding the pale blue form, and you know from getting it wrong yourself last Tuesday that the counter he is queuing for wants the white one. He is about to stand up. You have one short sentence and no vocabulary for any of the nouns involved.", "jp": "それじゃないですよ。", "en": "That's not the one, you know.", "pattern": "よ"}, "ext": [{"kind": "flip", "scene": "He thanks you and asks where the white ones are kept, and you know that too, because you have been here three times this month. Genuine news, delivered by you, to someone who did not have it: the same particle, doing the same job.", "jp": "あそこにありますよ。", "en": "They're over there, you know.", "t": null}, {"kind": "wrinkle", "scene": "What you are less sure about is whether the counter takes cards, and you want to say so in a way that states your belief and asks him to confirm it. Both particles stack, in that order, and only that order.", "jp": "この店は安いですよね。", "en": "This shop's cheap, right? — stating and checking at once.", "t": "よね stacks both particles: fairly sure, wanting backup. The order is fixed — よね, never ねよ."}], "what": "よ marks what you're saying as new to the listener: heads up, you didn't know this.", "build": "Add よ to the end. よね combines both particles — \"it's X, isn't it\" — and is extremely common.", "when": "Correcting a wrong assumption, offering useful information, reassuring someone.", "watch": "よ can land as pushy or lecturing if the listener already knew. When unsure, leave it off — a bare です is never rude, while a misplaced よ can be.", "ex": [["この店は安いですよ。", "This shop is cheap, you know."], ["明日は休みですよ。", "Tomorrow is a day off, you know."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-yone", "step": "Step 1 · Your first sentences", "jp": "ね・よ・よね", "en": "the tuning particles", "setting": {"scene": "August, no air conditioning worth the name in the older part of the building, and an hour on the plastic chairs. The woman beside you has been there as long as you have. The clerk who comes out to call the next number has spent the morning behind a desk in the cooled office at the back, and says the same thing about the heat that everyone has been saying all morning.", "jp": "暑いですね。", "en": "Hot, isn't it — we both feel it.", "pattern": "ですね"}, "ext": [{"kind": "flip", "scene": "You say it back to the clerk as she passes, and it is the wrong particle for her — she has just come out of the cool room and has not been in this since eight. What she needs is the news setting, not the agreement one.", "jp": "暑いですよ。", "en": "It's hot out here — you haven't been in it.", "t": null}, {"kind": "extra", "scene": "An hour later you nearly tell the woman beside you that she must be tired, with よ on the end, and stop — because the one thing you cannot deliver as news is how somebody else feels.", "jp": "疲れましたね。", "en": "You must be tired — shared, not announced.", "t": "The mistake that lands worst is よ about the listener's own experience. 疲れていますよ tells someone how tired they are, which is exactly as presumptuous in Japanese as it sounds in English. When unsure: ね if you are sharing, nothing at all if you are not."}], "what": "English does this entire system with tone of voice, so nothing in your first language tells you which particle you need. The choice is social, not grammatical: ね hands the thought over for agreement, よ delivers news, よね states a belief while asking for backup.", "build": "Same sentence, three settings. 暑いですね — we both feel it; nod along. 暑いですよ — you clearly haven't been outside yet. 暑いですよね — I'm fairly sure; back me up. The order in よね is fixed: there is no ねよ.", "when": "Constantly — these three end an enormous share of spoken sentences. Choosing none is itself a setting: a bare です states a fact and asks nothing of anyone.", "watch": "The mistake that lands worst is よ about the listener's own experience — 疲れていますよ tells someone how they feel, exactly as presumptuous as it sounds in English. When unsure: ね if you're sharing, nothing if you're not. A misplaced ね is friendly noise; a misplaced よ is a small shove.", "ex": [["暑いですね。", "Shared — we both feel it."], ["この店、安いですよ。", "News — you didn't know."], ["明日は休みですよね。", "Fairly sure — back me up?"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["私", "I — the thing about to be put on stage"], ["は", "THE POINT — sets 私 as the topic: everything after this is a comment on it", 1], ["学生", "student — the comment begins"], ["です。", "\"is\" — closes the statement politely"]], "segNote": "Same move: この店 goes on stage, 安いです comments on it. は never means \"is\" — です is doing that job, separately.", "hl": "は", "id": "wa", "step": "Step 2 · Core particles", "jp": "は", "en": "setting the topic", "setting": {"scene": "The bank, opening an account, which needs the card and the address you registered a fortnight ago. The teller is working down a list, and each question puts a different thing on the table — your address, your employer, your reason for opening it. Then she reaches the line about you, and pauses with the pen over it.", "jp": "私は学生です。", "en": "As for me — student.", "pattern": "は"}, "ext": [{"kind": "flip", "scene": "Two questions later she moves the conversation onto the account itself, and you follow her — because は does not mean I, it means here is the thing we are now discussing, and the thing you are discussing has just changed.", "jp": "この口座は新しいです。", "en": "This account is new.", "t": null}, {"kind": "wrinkle", "scene": "You read the form back to yourself under your breath and it does not sound like it is spelled. The character you have been writing all morning is not making the sound it makes anywhere else in the language.", "jp": "私は学生です。", "en": "Read watashi WA — は as a particle is pronounced wa.", "t": "は is pronounced wa — a spelling quirk that applies only to the particle, never to は inside a word. A later skill lesson drills all three quirky particles at once."}], "what": "は sets the stage. It says \"here's what I'm talking about\" — and everything after it is a comment on that thing. It is not a subject marker, and it does not mean \"is.\"", "build": "Place は directly after the thing you're putting on stage. It's written with the character は but pronounced wa. This spelling quirk applies only to the particle, never to は inside a word.", "when": "Opening a conversation, changing subject, or drawing a contrast between two things.", "watch": "Because English collapses \"I am a student\" into one verb, learners read 私は as \"I am.\" It isn't. In 私は学生です, は sets the topic and です makes the statement — two separate jobs.", "ex": [["私は学生です。", "I am a student."], ["この店は安いです。", "As for this shop, it's cheap."]], "orphanWr": [], "flags": ["口座 uses kanji outside KANJI_DICT — furigana needed, or swap for a simpler noun."], "claims": ["Opening a bank account generally requires a residence card and a registered address"], "sources": ["https://www.settlejapan.jp/guides/residence-card-japan"]}, {"seg": [["公園", "the park"], ["に", "location marker — where something exists (Step 8 owns this fully)"], ["犬", "a dog — arriving in the conversation for the first time"], ["が", "THE POINT — points at who or what: the dog, new on the scene", 1], ["います。", "\"is there / exists\" — for living things"]], "segNote": "誰 asks \"which person?\" — exactly が's specialty. Question words take が, never は.", "hl": "が", "id": "ga", "step": "Step 2 · Core particles", "jp": "が", "en": "pointing at who or what", "setting": {"scene": "Your number is called and you stand, and so does somebody else — a friend has come along to help with the Japanese, and the clerk has never met them and has no idea who they are. She looks between the two of you. What the sentence has to do is put a person into the conversation who was not in it a second ago.", "jp": "友達が来ました。", "en": "A friend came with me.", "pattern": "が"}, "ext": [{"kind": "flip", "scene": "Walking home you pass the park and there is a dog loose by the gate with no one anywhere near it. Same job, different thing arriving: nobody knew the dog was there until you said so.", "jp": "公園に犬がいます。", "en": "There's a dog in the park.", "t": null}, {"kind": "wrinkle", "scene": "Your friend asks whether you understood any of what the clerk said at the end. Some words never negotiate about this particle — understanding is one of them, and it takes が whether or not anything is arriving.", "jp": "日本語がわかります。", "en": "I understand Japanese — わかる always takes が.", "t": "A fixed set of words demands が no matter what: ある・いる, 好き, わかる and friends. Step 10 collects them into one drill."}], "what": "が points at the one doing or being something — it answers \"who?\" or \"which one?\"", "build": "[noun] が [verb or adjective].", "when": "Three main situations: introducing something for the first time, answering a who/what question, and with a fixed set of words that demand it (ある, いる, 好き, わかる — Step 10).", "watch": "Both は and が sit where English puts the subject, so they feel interchangeable at first. They aren't. Quick test: if your sentence answers \"which one?\", use が. If it just names what you're discussing, use は. The next lesson takes this apart properly.", "ex": [["公園に犬がいます。", "There's a dog in the park."], ["誰が来ましたか。", "Who came?"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-waga", "step": "Step 2 · Core particles", "jp": "は vs が", "en": "the real difference", "setting": {"scene": "The clerk has understood that somebody came with you and now wants to know what they are to you, which is a second question about a person who has stopped being a surprise. The same human being is about to appear in two consecutive sentences, and the particle changes between them for a reason English has no word for.", "jp": "友達が来ました。友達は日本人です。", "en": "A friend came. The friend is Japanese.", "pattern": "が来ました"}, "ext": [{"kind": "flip", "scene": "That evening you tell the story to someone else and do the same handoff without thinking about it — the cat that turned up on the balcony arrives new, and by the second sentence it is a cat you are both discussing.", "jp": "猫が来ました。その猫は小さかったです。", "en": "A cat came. The cat was small.", "t": null}, {"kind": "extra", "scene": "At the school gate the next morning somebody asks who was at the office with you. The question and the answer both point at a person out of a set of possible people, so both of them take the same particle.", "jp": "誰が来ましたか。— 友達が来ました。", "en": "Who came? — A friend did.", "t": "The question test settles most cases in a second. If the sentence answers which one, it takes が — and so does the question that asked it. If it just names what you are already talking about, it takes は."}], "what": "The single most-asked question in beginner Japanese, and it has a workable answer: は is for information already on the table, が is for information arriving now.", "build": "Introduce something with が, then refer back to it with は. That handoff is the pattern in miniature.", "when": "Any time you're unsure, run the question test. \"Who came?\" and its answer both take が, because the whole point of the sentence is identifying which person. \"How was the movie?\" takes は, because the movie is already what you're discussing.", "watch": "Don't try to translate them. English marks new versus known information with \"a\" and \"the,\" and with stress — Japanese does it with these two particles instead. Thinking of が as roughly \"a\" and は as roughly \"the\" gets you surprisingly far.", "ex": [["昨日、猫が来ました。その猫はとても小さかったです。", "A cat came yesterday (new → が). The cat was tiny (now known → は)."], ["誰が来ましたか。— 田中さんが来ました。", "Who came? — Tanaka-san did. (Who/what questions and their answers → が)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["パン", "bread — the thing the action lands on"], ["を", "THE POINT — tags パン as what gets eaten", 1], ["食べます。", "\"eat\" — the verb, acting on パン"]], "segNote": "見ました acts on 映画 — watched what? The what takes を. The character を exists for nothing else in the language.", "hl": "を", "id": "o", "step": "Step 2 · Core particles", "jp": "を", "en": "marking what the action lands on", "setting": {"scene": "The counter opens at half past eight and the queue starts before it. You have set an alarm for the first time since you arrived and you are eating standing up, because the difference between arriving at twenty-five past and arriving at ten to nine is about ninety minutes of your day. Everything in the sentence is ordinary; the particle is the whole lesson.", "jp": "朝ごはんを食べます。", "en": "I eat breakfast.", "pattern": "を"}, "ext": [{"kind": "flip", "scene": "On the way you stop at the bakery by the station, because the queue will be long and there is nothing to do in it. Different verb, different object, same tag on the thing the action lands on.", "jp": "パンを買います。", "en": "I buy bread.", "t": null}, {"kind": "wrinkle", "scene": "Waiting, you try to say that you like the bakery — and the sentence refuses the particle you have just learned. Liking is not something you do to a bakery; the grammar treats it as a state, and states take a different marker.", "jp": "この店が好きです。", "en": "I like this shop — 好き takes が, not を.", "t": "Not every English object becomes を. 好き, ほしい, わかる and できる all take が instead — the mismatch that catches every English speaker. Step 10 drills it head-on."}], "what": "を tags the thing an action is done to. Eat what? Read what? Buy what? That noun takes を.", "build": "[thing] を [verb]. Written with the character を, which exists for nothing else, and pronounced exactly like お.", "when": "With any verb that acts on something: 食べる, 読む, 買う, 見る, 作る.", "watch": "Not every English object becomes を. 好き, ほしい, わかる and できる all take が instead — a mismatch that catches every English speaker, and one Step 10 drills specifically.", "ex": [["パンを食べます。", "I eat bread."], ["映画を見ました。", "I watched a movie."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["七時", "seven o'clock — a number time, the kind に loves"], ["に", "THE POINT — pins the action to that point on the clock", 1], ["起きます。", "\"get up\" — the pinned action"]], "segNote": "And here is the trap, live: 明日 takes NO に — it's a relative word. (The に in this sentence belongs to 会います — meeting someone — a different job entirely.)", "hl": "明日", "id": "ni-time", "step": "Step 2 · Core particles", "jp": "に (time)", "en": "pinning an action to a time", "setting": {"scene": "You have been putting the ward office off for nine days and there are five left. Somebody at work asks when you are finally going to go, and the honest answer is the one you have been avoiding — not next week, not on some numbered day you could write in a diary, but today, straight after this conversation.", "jp": "今日、行きます。", "en": "I'm going today.", "pattern": "今日、"}, "ext": [{"kind": "flip", "scene": "She asks what time, and the answer is now a number on a clock — which is precisely the kind of time that does take the particle you just left out of the sentence before it. Both rules, one after the other, thirty seconds apart.", "jp": "七時に行きます。", "en": "I'm going at seven.", "t": null}, {"kind": "wrinkle", "scene": "Getting there before it shuts means getting up earlier, every day, for the rest of the week — and that sentence needs both kinds of time at once, one bare and one marked.", "jp": "毎日七時に起きます。", "en": "Every day (bare) at seven (に) I get up.", "t": "に attaches to clock-and-calendar times only. Relative words — 今日, 明日, 昨日, 毎日, 来週 — go bare: 明日行きます, never 明日に行きます. Rule of thumb: if a number is involved, use に."}], "what": "に fixes an action to a specific point on the clock or calendar.", "build": "[time] に [verb].", "when": "Times you could write as a number: 七時に, 月曜日に, 三月に, 十日に.", "watch": "This is the one worth memorizing. に does NOT attach to relative time words — 今日, 明日, 昨日, 毎日, 来週, 今. 明日に行きます is wrong; 明日行きます is right. The rule of thumb: if a number is involved, use に; if the word only makes sense relative to right now, leave it bare.", "ex": [["七時に起きます。", "I get up at seven."], ["明日、友達に会います。", "I'll meet a friend tomorrow. (no に on 明日)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "No error-contrast: the design bans one in Steps 0-2, so 今日に行きます is named in the module's own watch beat rather than shown here."], "claims": [], "sources": []}, {"seg": [["学校", "school — where the movement is headed"], ["に", "THE POINT — marks the destination", 1], ["行きます。", "\"go\" — a movement verb; に/へ need one"]], "segNote": "へ does the same job with a slightly softer, more directional feel — and it's pronounced e, the second spelling quirk.", "hl": "へ", "id": "ni-dest", "step": "Step 2 · Core particles", "jp": "に / へ (destination)", "en": "saying where you're going", "setting": {"scene": "Public libraries are free to people who live in the area and the card takes about ten minutes, provided you can prove you live where you say you live — which is the same piece of paper everything else has wanted this month. It is the first errand of the fortnight nobody is making you do.", "jp": "図書館に行きます。", "en": "I'm going to the library.", "pattern": "に行きます"}, "ext": [{"kind": "flip", "scene": "The librarian asks, making conversation, where you came from — meaning the country, and meaning the journey rather than the place. The other destination particle is a shade softer and does the same job.", "jp": "日本へ来ました。", "en": "I came to Japan.", "t": null}, {"kind": "wrinkle", "scene": "You want to add that you will study there, and the sentence takes a different particle for the same building — because you have stopped talking about going and started talking about doing.", "jp": "図書館で勉強します。", "en": "I study at the library — arriving is に, doing is で.", "t": "Don't reach for で here. で covers what you do once you've arrived, not the going: 学校に行きます, then 学校で勉強します. The next lessons pair them up."}], "what": "Both mark where movement is headed.", "build": "[place] に or へ, followed by a movement verb — 行く, 来る, 帰る. へ is written with the character へ but pronounced e, the same spelling quirk as は.", "when": "Any journey. In practice the two are interchangeable for travel; に is more common in speech, へ has a slightly softer, more directional feel.", "watch": "Don't reach for で here. で covers what you do once you've arrived, not the going: 学校に行きます, then 学校で勉強します. The next-but-one lesson pairs them up.", "ex": [["学校に行きます。", "I go to school."], ["日本へ来ました。", "I came to Japan."]], "orphanWr": [], "flags": ["UNSOURCED: library card requirements are municipal and vary. Stated loosely for that reason; confirm before shipping."], "claims": ["Public library membership is generally free to residents of the municipality and requires proof of address"], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-kanaparticles", "step": "Step 2 · Core particles", "jp": "は・へ・を", "en": "when a kana stops sounding like itself", "setting": {"scene": "An online application, in Japanese, that will not let you past the name field. You have switched the keyboard over and you are typing what you hear, which is how わたしわ has now gone into the box twice. What is on the screen is not what the sentence sounds like, and the two have to be told apart before anything else will work.", "jp": "私は学校へ行きます。", "en": "Read: watashi wa gakkou e ikimasu — two spelling quirks in one short sentence.", "pattern": "は"}, "ext": [{"kind": "flip", "scene": "You get past it and hit the same wall one field later, on the box that wants what you are applying for. The third quirky particle is the easy one — it exists for nothing except this job, so it is always the same sound.", "jp": "本を買います。", "en": "I'm buying a book — を is typed 'wo' and read o.", "t": null}, {"kind": "extra", "scene": "The form's example line has the same character in it twice, and only one of them changes its sound. Nothing marks which is which except what each one is doing.", "jp": "はなはきれいです。", "en": "Flowers are pretty — first は is hana, second is the particle wa.", "t": "One sentence can carry the same kana both ways. はなはきれいです — the first は belongs to the flower, the second is the particle. Reading aloud is where this shows up; typing わたしわ is how it shows up in the other direction."}], "what": "Three particles are written with kana that stop sounding like themselves: は reads wa, へ reads e, and を reads o. The kana module planted this before you knew what a particle was — this is where it lands, because now you own all three as grammar.", "build": "The rule is mercifully clean: the special reading applies ONLY when the kana is working as a particle. はな (flower) reads hana; the は in 私は reads wa. を is the easy one — it exists for nothing except the particle, so it is always o.", "when": "Every sentence you read aloud, and every sentence you type. The IME expects the spelling, not the sound: type 'ha' for the particle は and 'wo' for を — typing 'wa' gets you わ, which is the single most common romaji-input slip there is.", "watch": "One sentence can carry the same kana both ways: はなはきれいです — the first は belongs to hana, the second is the particle, wa. Reading aloud is where this shows; writing わたしわ is how it shows in the other direction.", "ex": [["私は学校へ行きます。", "Read watashi wa gakkō e — two spelling quirks in one short sentence."], ["はなはきれいです。", "Same kana twice, read two ways — the second は is the particle."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "The gloss contains romaji, normally banned outside the kana module. Deliberate: this lesson IS the sound-spelling mismatch and cannot be taught without naming both."], "claims": [], "sources": []}, {"seg": [["図書館", "the library — the stage"], ["で", "THE POINT — marks the stage the action is performed on", 1], ["勉強します。", "\"study\" — a real action, happening there"]], "segNote": "Met a friend — an action — at the park: で again. The に in this sentence belongs to 会います (meeting someone), not to the place.", "hl": "で", "id": "de-place", "step": "Step 2 · Core particles", "jp": "で (place)", "en": "where the action happens", "setting": {"scene": "Your apartment has one room and a wall shared with somebody who works nights. The park by the station has benches, and on Saturday mornings a man practises a wind instrument at the far end of it, which somehow makes concentrating easier rather than harder. You have arranged to meet the friend who came to the ward office with you.", "jp": "公園で友達に会いました。", "en": "I met a friend at the park.", "pattern": "で"}, "ext": [{"kind": "flip", "scene": "It rains, so you move to the library, and the sentence follows you without changing shape — the particle marks wherever the doing happens, and the doing has just moved indoors.", "jp": "図書館で勉強します。", "en": "I study at the library.", "t": null}, {"kind": "wrinkle", "scene": "You want to say the books you need are in there, and the sentence quietly refuses — because nothing is happening in it. Sitting on a shelf is not an action, and a place where nothing is being done takes the other particle.", "jp": "図書館に本があります。", "en": "There are books in the library — existing, not doing.", "t": "で needs a real action. Simply BEING somewhere isn't one — that's に with あります・います, and the next skill lesson drills the split until it holds."}], "what": "で marks the stage an action is performed on.", "build": "[place] で [action verb].", "when": "Studying, eating, working, playing, meeting — anything you actively do, somewhere.", "watch": "で needs a real action. Simply being somewhere isn't one: that's に with あります/います. Two lessons from now you'll drill the split.", "ex": [["図書館で勉強します。", "I study at the library."], ["公園で友達に会いました。", "I met a friend in the park."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["バス", "the bus — the tool for the job"], ["で", "THE POINT — \"by means of\": how the going gets done", 1], ["行きます。", "\"go\""]], "segNote": "Same particle, same idea: Japanese is the tool the speaking is done with.", "hl": "で", "id": "de-means", "step": "Step 2 · Core particles", "jp": "で (means)", "en": "the tool you did it with", "setting": {"scene": "The ward office is two stations away. You have no car — that would mean proving to the police you have somewhere off-street to keep it — and the bicycle a departing colleague left you is still not registered in your name. So every errand this month has started on the same platform, and the sentence for it marks the train as a tool rather than a place.", "jp": "電車で行きます。", "en": "I'll go by train.", "pattern": "電車で"}, "ext": [{"kind": "flip", "scene": "At the counter you cannot follow the clerk's question and ask her to use the other language, which is the same particle again — not a vehicle this time but a medium, which the grammar treats identically.", "jp": "日本語で話します。", "en": "Let's speak in Japanese.", "t": null}, {"kind": "wrinkle", "scene": "Going home you decide to walk it, and the one everyday method that refuses this particle is the one you are using. Walking gets a verb form instead, which arrives properly in Step 4.", "jp": "駅まで歩いて行きます。", "en": "I'll walk to the station — 歩いて, never 歩きで.", "t": "One exception every learner hits early: walking is 歩いて — a て-form, coming in Step 4 — never 歩きで."}], "what": "Same particle, different job — で also marks the instrument, vehicle, language, or material used.", "build": "[thing] で [verb].", "when": "バスで行きます, 日本語で話します, 手で書きます, はしで食べます.", "watch": "For a person you did something with, use と, not で: 友達と行きます. で would suggest you used your friend as a tool.", "ex": [["バスで行きます。", "I go by bus."], ["日本語で話します。", "I speak in Japanese."]], "orphanWr": [], "flags": ["Bicycle registration (防犯登録) is mentioned in passing and not sourced; it is near-universal in practice but the requirement is prefectural."], "claims": ["Registering a car requires a police-issued parking certificate (車庫証明) under the 1962 Garage Act"], "sources": ["https://www.parkingreformatlas.org/parking-reform-cases-1/japan's-proof-of-parking-rule-(shako-shomeisho)"]}, {"seg": [], "segNote": "", "hl": "", "id": "sb-nide", "step": "Step 2 · Core particles", "jp": "に vs で", "en": "place: existing vs doing", "setting": {"scene": "The library card worked. You are in there on a Sunday for the second time and you want to say two things about the same building: that you come here to work, and that the thing you are looking for is somewhere on the second floor. The room does not change between those two sentences. The particle does.", "jp": "図書館に本があります。", "en": "There are books in the library — existence.", "pattern": "に本があります"}, "ext": [{"kind": "flip", "scene": "The librarian asks what you are doing up there every weekend, and the answer is about an action rather than a location. Same building, same shelves, third sentence in a row about them — and the particle flips back, because the verb changed.", "jp": "二階で勉強します。", "en": "I study on the second floor.", "t": null}, {"kind": "extra", "scene": "Both of your sentences were about the same shelves on the same floor of the same building, and nothing about the room had anything to do with which particle each one wanted. The verb decided both times, and the verb was the only thing that changed.", "jp": "公園で会います。公園に犬がいます。", "en": "We meet at the park. There's a dog in the park.", "t": "Ask one question before choosing and it comes out right every time: is something happening here, or is something simply located here? Happening takes で. Located takes に. The place never decides — the verb does."}], "what": "Both translate as \"at\" or \"in,\" which is exactly why they get swapped. The split isn't about the place — it's about the verb.", "build": "で goes with verbs of doing. に goes with verbs of being: あります, います, 住んでいる, and with destinations after movement verbs.", "when": "Ask one question before choosing: is something happening here, or is something simply located here? Happening → で. Located → に.", "watch": "Same building, either particle, depending on the verb. 図書館で勉強します and 図書館に本があります are both correct — the place didn't change, the verb did. The split isn't finished, either — it returns in Step 8, when あります and います give 'being somewhere' a verb of its own, and bring one surprise with them.", "ex": [["図書館で勉強します。", "I study at the library. (action → で)"], ["図書館に本がたくさんあります。", "There are many books in the library. (existence → に)"]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "二階 uses 階, outside KANJI_DICT — furigana needed."], "claims": [], "sources": []}, {"seg": [["パン", "bread"], ["と", "THE POINT — the exhaustive \"and\": this and this, the complete list", 1], ["牛乳", "milk"], ["を", "object marker, covering the whole pair"], ["買いました。", "\"bought\""]], "segNote": "と's second job, same instinct: WITH someone — a companion is \"and\" for people.", "hl": "と", "id": "to-and", "step": "Step 3 · Joining, choosing & counting", "jp": "と (and / with)", "en": "joining nouns, naming your companion", "setting": {"scene": "First proper shop after the arrival week, and you are buying for an empty kitchen. The list in your hand has two things on it because two things is what will fit in the basket alongside the rice you already have. At the till the assistant asks whether that is everything, and it is — exactly that, nothing else.", "jp": "パンと牛乳を買いました。", "en": "I bought bread and milk.", "pattern": "と"}, "ext": [{"kind": "flip", "scene": "On the way out you meet the teacher from the next desk, who asks who you came with. The same particle does a second job that English splits off into a different word entirely — joining things, and naming the person you are with.", "jp": "友達と行きました。", "en": "I went with a friend.", "t": null}, {"kind": "wrinkle", "scene": "She asks what else is in the fridge and you start listing, and this is where と stops being the right tool — because it claims the list is finished, and yours is a sample of a fridge you have not properly looked in.", "jp": "肉や魚があります。", "en": "There's meat and fish and so on — や, not と.", "t": "と claims the list is complete. If you're giving examples rather than the whole set, that's や — two lessons from here."}], "what": "と does two jobs: it links nouns into a list, and it marks who you did something alongside.", "build": "A と B for lists. [person] と [verb] for companionship.", "when": "Shopping lists, pairs of things, and anyone you went somewhere with.", "watch": "と joins nouns only — never two sentences, never two adjectives. \"I ate and went home\" needs the て-form (Step 4), not と. And と implies your list is complete; for \"and so on,\" you'll want や, coming up shortly.", "ex": [["パンと牛乳を買いました。", "I bought bread and milk."], ["友達と映画を見ます。", "I watch a movie with a friend."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["私", "I"], ["も", "THE POINT — \"too\": adds 私 to something already said, REPLACING は", 1], ["学生", "student"], ["です。", "\"am\""]], "segNote": "Doubled, も…も means \"both\" — and with a negative verb it sweeps both away: neither meat nor fish.", "hl": "も", "id": "mo", "step": "Step 3 · Joining, choosing & counting", "jp": "も", "en": "also, too, neither", "setting": {"scene": "The staffroom, the first week of term, and the introductions have been going round the table for ten minutes. The person before you has just said which school they came from, and it happens to be the same one you were at last year in a different country — a coincidence worth one sentence and not more.", "jp": "私も学生です。", "en": "I'm a student too.", "pattern": "も"}, "ext": [{"kind": "flip", "scene": "Later somebody asks whether anyone else is free on Monday and two hands go up including yours. The particle attaches to whatever is being added, and this time what is being added is a day.", "jp": "月曜日も行きます。", "en": "I'm going on Monday as well.", "t": null}, {"kind": "wrinkle", "scene": "You try to say it about yourself with the topic particle still attached and the sentence will not take both. This one arrives and evicts whatever was standing there — it does not stack.", "jp": "私も行きます。", "en": "I'm going too — も replaces は, never joins it.", "t": "も replaces は, が and を — it never stacks on them. 私もは is impossible; the も IS the particle."}], "what": "も says \"this one as well\" — adding something to what's already been said.", "build": "も pushes は, が and を out and takes their place. After other particles it simply stacks on top: 日本にも, 友達とも.", "when": "Agreeing, adding to a list, and — paired with a negative — saying \"neither… nor.\"", "watch": "私はも and 本をも are both wrong. When も arrives, は, が and を leave.", "ex": [["私も学生です。", "I am also a student."], ["肉も魚も食べません。", "I eat neither meat nor fish."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [["私", "I / me — the owner, coming first"], ["の", "THE POINT — the glue: links two nouns, the second one being the main thing", 1], ["本", "book — the main noun, always last"], ["です。", "\"is\""]], "segNote": "Wider than owning: a teacher OF Japanese. の links any two nouns — origin, type, topic, possession.", "hl": "の", "id": "no", "step": "Step 3 · Joining, choosing & counting", "jp": "の (possession)", "en": "gluing two nouns together", "setting": {"scene": "Somebody has left a textbook on the shared desk and nobody has claimed it for three days. It has your surname written inside the cover in roman letters, which is either a coincidence or the school office being efficient about the order you put in a fortnight ago. The teacher beside you picks it up and holds it out, eyebrows raised.", "jp": "私の本です。", "en": "It's my book.", "pattern": "の"}, "ext": [{"kind": "flip", "scene": "You hand back a different one that has been sitting under it, because that one is hers — same glue, other direction, and the owner always comes first while the thing owned comes last.", "jp": "先生の本です。", "en": "It's the teacher's book.", "t": null}, {"kind": "wrinkle", "scene": "A third book turns up belonging to the teacher who teaches you Japanese on Wednesdays, and now the chain has three links in it. Read from the right and it unwinds cleanly; read from the left and it makes no sense at all.", "jp": "私の日本語の先生の本です。", "en": "My Japanese teacher's book — the LAST noun is the thing.", "t": "Order is fixed: describer first, main noun last. 本の私 is nonsense. When chains grow — 私の日本語の先生 — read from the back: the LAST noun is the thing."}], "what": "の connects one noun to another: of, 's, from, about, made of. It's the most flexible particle you'll meet.", "build": "A の B, where B is the main thing and A describes it. 日本語の先生 is a teacher of Japanese, not a Japanese-language teacher who happens to be Japanese. Chains are fine: 私の学校の先生.", "when": "Possession, affiliation, origin, topic, material — whenever two nouns need joining.", "watch": "The order reverses several English phrasings, so read it as \"B of A\" while it's still new. の can also stand in for a noun you've already established: 赤いの means \"the red one.\"", "ex": [["私の本です。", "It's my book."], ["日本語の先生です。", "He's a Japanese language teacher."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-no", "step": "Step 3 · Joining, choosing & counting", "jp": "の · 一人四役", "en": "one particle, four jobs", "setting": {"scene": "The stationery order form has a column you cannot parse, because every line on it is three nouns stuck together with the same character and no clue about which one is the item. It is the commonest particle on the page and it is doing a different job in almost every row.", "jp": "私の日本語の先生の本です。", "en": "Chains unwind from the right: my Japanese teacher's book.", "pattern": "の"}, "ext": [{"kind": "flip", "scene": "You fill in your own line and the same particle does a job that is not possession at all — it names where something is from, which English would need a whole preposition for.", "jp": "日本の本です。", "en": "It's a Japanese book — origin, not ownership.", "t": null}, {"kind": "extra", "scene": "You try to write pretty notebook in the description column, reach for the particle that has worked all morning, and produce something that is not a phrase in any register of the language.", "jp": "きれいなノートです。", "en": "A pretty notebook — きれい brings its own な.", "t": "The classic overreach: の does NOT attach describing-words to nouns. きれいの人 is wrong — words like きれい bring their own connector (きれいな人), and words like 高い attach directly (高い店). If both sides are not nouns, this is not the particle you want."}], "what": "English has no single word doing what の does, so your instinct has nothing to map it onto — which is exactly why it gets a drill of its own. Count the jobs: possession (私の本), description (日本語の先生), standing in for a noun you already named (赤いの — the red one), and a fourth — turning whole verbs into nouns — that arrives in Step 10.", "build": "A の B — B is the main thing, A describes it. Read it as 'B of A' while it's new. For the stand-in job, drop the noun and keep の: 赤いのをください.", "when": "Whenever two nouns need connecting, and whenever repeating a noun would be clumsy. Japanese reaches for の far more often than English reaches for 'of'.", "watch": "The classic overreach: の does NOT attach describing-words to nouns. きれいの人 is wrong — words like きれい bring their own connector (きれいな人), and words like 高い attach directly (高い店). If both sides aren't nouns, の isn't the glue; the two describing-word families get their full lessons in Step 9. Long chains unwind from the right: 私の日本語の先生の本 — the book of the teacher of my Japanese.", "ex": [["私の日本語の先生の本です。", "Chains unwind from the right: my Japanese teacher's book."], ["赤いのをください。", "の standing in for the noun: the red one, please."], ["きれいな人です。", "NOT きれいの人 — describing-words bring their own connector."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "ノート is katakana and unlisted; harmless, but flagging the vocabulary reach."], "claims": [], "sources": []}, {"seg": [], "segNote": "", "hl": "", "id": "sb-pronouns", "step": "Step 3 · Joining, choosing & counting", "jp": "私・あなたを省く", "en": "when to drop pronouns", "setting": {"scene": "You have been in the country a month and somebody who read your self-introduction says, kindly, that it sounded a little stiff. Reading it back, every sentence starts the same way — the word for I, eleven times in nine lines, because that is what English taught your hands to do.", "jp": "昨日映画を見ました。とても面白かったです。", "en": "No 私 anywhere — and completely natural.", "pattern": null}, "ext": [{"kind": "flip", "scene": "You rewrite it. The one place the word stays is the line where you are being contrasted with the teacher who left — because there the sentence is genuinely about which of the two of you is meant.", "jp": "私は先生です。", "en": "I'M the teacher — contrast, so 私 earns its place.", "t": null}, {"kind": "extra", "scene": "You try to ask the teacher beside you what she thinks, reach for the word every phrasebook gives for you, and get a small pause in return. Her name has been on the desk sign the whole time.", "jp": "田中さんはどう思いますか。", "en": "What do you think? — the name, not あなた.", "t": "あなた is not the fix. Toward someone whose name you know it reads as cold or confrontational, whatever the textbook says. The word English uses for you is done in Japanese with the person's name plus さん — 田中さんは — which is what あなた's job actually is."}], "what": "English requires a subject in every clause. Japanese doesn't — and leaves it out whenever context makes it obvious. Sentences with no visible subject at all are the norm, not an abbreviation.", "build": "Just delete it. If it's clear who you're talking about, the sentence is finished without a pronoun.", "when": "Keep 私 only for genuine contrast, or when introducing yourself as a new topic. For other people, use their name plus さん — 田中さんは — which is what あなた's job actually is.", "watch": "Repeating 私 in every sentence is the single loudest marker of an English-speaking learner. And あなた toward someone whose name you know can read as cold or even confrontational, despite every textbook glossing it as \"you.\" And this is only half the lesson — Step 11 covers the cases where 私 has to stay, once you can build the clauses it stays for.", "ex": [["昨日映画を見ました。とても面白かったです。", "No 私 anywhere — and completely natural."], ["私は行きますが、妹は行きません。", "私 kept on purpose: contrast."], ["田中さんは今日も忙しいですか。", "Their name, not あなた."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "思う arrives in Step 12; used here as a fixed phrase."], "claims": [], "sources": []}, {"seg": [["九時", "nine o'clock — the starting edge"], ["から", "THE POINT — \"from\": opens the span", 1], ["五時", "five o'clock — the far edge"], ["まで", "\"until / up to\" — the bookend partner"], ["働きます。", "\"work\" — what fills the span"]], "segNote": "Space, not just time: from home to the station. から〜まで brackets any kind of span.", "hl": "から", "id": "kara-from", "step": "Step 3 · Joining, choosing & counting", "jp": "から〜まで", "en": "from here to there", "setting": {"scene": "The ward office notice is four lines long and two of them are numbers. You have been caught out once already by turning up at the wrong end of the afternoon, and the counter you need has different hours from the rest of the building. The pair of particles on that line is the whole message.", "jp": "九時から五時まで働きます。", "en": "Open from nine to five.", "pattern": "から"}, "ext": [{"kind": "flip", "scene": "You tell the school office when you are around on Thursdays, and it is the same pair doing the same work on your own timetable — a start, an end, and nothing needed in between.", "jp": "月曜日から金曜日まで学校にいます。", "en": "I'm at school Monday to Friday.", "t": null}, {"kind": "extra", "scene": "Halfway down the same notice the character turns up again, and this time nothing in front of it is a place or a time — it is a whole sentence, and the meaning has quietly changed underneath you.", "jp": "休みですから、行きません。", "en": "It's closed, so I'm not going — から after a clause is because.", "t": "から has a second life meaning because, arriving in Step 11. Position tells you which is which: after a noun it is from; after a whole clause it is because. Same word, two stations."}], "what": "A matched pair marking a start point and an end point — in time or in space.", "build": "A から B まで. Either half works alone: 九時から on its own is fine, and so is 駅まで.", "when": "Working hours, opening times, routes, page ranges.", "watch": "から has a second life meaning \"because\" (Step 11). Position tells you which: after a noun it's \"from\"; after a whole clause it's \"because.\"", "ex": [["九時から五時まで働きます。", "I work from nine to five."], ["家から駅まで歩きます。", "I walk from home to the station."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "金曜日 uses 金, outside KANJI_DICT — furigana needed."], "claims": [], "sources": []}, {"seg": [["犬", "dogs — the topic being measured"], ["は", "topic marker"], ["猫", "cats — the yardstick"], ["より", "THE POINT — \"than\": marks what's being measured against", 1], ["大きいです。", "\"are big\" — which より turns into \"are bigger\""]], "segNote": "", "hl": "より", "id": "yori", "step": "Step 3 · Joining, choosing & counting", "jp": "より", "en": "than", "setting": {"scene": "Two apartments, both within cycling distance of the school, and you have to tell the agent which one by Friday. One is cheaper and forty minutes from the station; the other is neither. Everybody who asks wants the comparison in one sentence, and the sentence puts the two things in an order English would reverse.", "jp": "この家はあの家より安いです。", "en": "This place is cheaper than that one.", "pattern": "より"}, "ext": [{"kind": "flip", "scene": "The agent asks it back the other way round, about the commute rather than the rent, so you rebuild it with the other option as the yardstick — because より attaches to the thing being measured against, not to the thing being measured.", "jp": "バスは電車より安いです。", "en": "The bus is cheaper than the train.", "t": null}, {"kind": "wrinkle", "scene": "You listen for the word to change the way English changes cheap into cheaper, and it never does. The adjective stands exactly as it is and the particle carries the entire comparison on its own.", "jp": "犬は猫より大きいです。", "en": "The dog is bigger than the cat — 大きい never inflects.", "t": "The adjective never changes. English inflects big → bigger; Japanese leaves 大きい alone and lets より carry the whole comparison."}], "what": "より marks the thing you're measuring against — the loser of the comparison.", "build": "A より B が [adjective]. B is the one that wins.", "when": "Any straightforward comparison of two things.", "watch": "It reads backwards from English. 犬は猫より大きい unpacks as \"the dog, compared to the cat, is big\" — より attaches to the cat, not the dog. Step 10 adds the fuller のほうが version you'll actually hear most often.", "ex": [["犬は猫より大きいです。", "The dog is bigger than the cat."], ["今日は昨日より寒いです。", "Today is colder than yesterday."]], "orphanWr": [], "flags": ["No factual claims — an ordinary situation.", "速い and 家 sit at the edge of the Step 3 bank; 家 is in it, 速い is not."], "claims": [], "sources": []}, {"seg": [["コーヒー", "coffee — option one"], ["か", "THE POINT — \"or\": between nouns, offering a choice", 1], ["お茶", "tea — option two"], ["を", "object marker over whichever wins"], ["飲みます。", "\"drink\""]], "segNote": "", "hl": "か", "id": "ka-or", "step": "Step 3 · Joining, choosing & counting", "jp": "か (or)", "en": "offering a choice", "setting": {"scene": "The school lunch order form wants a choice for each day of the coming month, and the two options are printed side by side with a sing
