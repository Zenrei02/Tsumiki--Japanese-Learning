# Netlify build configuration.
#
# Lives at the repository root, and exists so the deploy settings are version
# controlled rather than typed into a web form. A netlify.toml takes precedence
# over the values in the Netlify UI, so this is now the single source of truth.
#
# THE PROBLEM IT FIXES: the app is in a subdirectory. Without `base`, Netlify
# runs `npm run build` from the repository root, finds no package.json, and
# fails with ENOENT before it starts.
#
# Paths below are relative to `base`, so `publish = "dist"` means
# naoshi-app/dist.

[build]
  base = "naoshi-app"
  command = "npm run build"
  publish = "dist"
  # Skip the production build when the pushed range changed nothing the app
  # actually ships. $CACHED_COMMIT_REF..$COMMIT_REF is the range Netlify is
  # deciding about; paths are relative to `base`, so `./` means naoshi-app/.
  # Exit 0 = skip. Deploys cost 15 credits apiece (noticed Aug 13 2026 after
  # ~10 pushes), so a docs/tracker-only push now costs zero.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ./"

[build.environment]
  # Netlify picked Node 24 on its own, but pinning it means a future default
  # change cannot quietly alter the build. 24 is Active LTS.
  NODE_VERSION = "24"

# Single-page app: every path serves index.html rather than 404ing. Not needed
# today — the app switches modules in React without changing the URL — but it
# costs nothing and prevents a confusing 404 the moment routing is added.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite fingerprints these filenames, so a changed file is a changed name.
    # Safe to cache hard, and it is what makes a return visit instant.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    # The kana sprite is not fingerprinted. A week is long enough to spare
    # testers the 750 KB on every visit, short enough that a re-recording
    # reaches them without anyone clearing a cache.
    Cache-Control = "public, max-age=604800"

# ── Previewing on a phone ───────────────────────────────────────────────────
# Lloyd works from a phone and cannot run `npm run dev` there, so "check it
# locally first" is not advice that applies. Branch deploys are the substitute:
# push any branch other than main and Netlify builds it at its own URL, which
# opens on a phone like any other link. main stays untouched until it is merged.
#
# Deploy Previews (pull requests) are on by default for GitHub-connected sites.
# Branch deploys need enabling once, in Netlify:
#   Site configuration → Build & deploy → Branches and deploy contexts
#   → "Deploy all branches pushed to the repository"
#
# The contexts below just make the branch build behave exactly like production,
# so what you see on the phone is what merging will publish.

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
