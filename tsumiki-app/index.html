<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tsumiki — practice</title>
    <!-- Tatami rework (2026-09-27): Shippori Mincho for Japanese text, headings
         and the big block glyphs; Zen Kaku Gothic New for UI and English.
         Both stacks fall back to the system Japanese fonts in lib/tokens.js,
         so a blocked Google Fonts request degrades to the previous look. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <meta name="description" content="Japanese reading and writing practice." />
    <style>
      html, body, #root { height: 100%; margin: 0; }

      /* ⭐ THE TEXT SCALE — the whole app's type size is this one number.
         Every font size in the app is rem, so changing this percentage
         rescales all of them together. 112.5% puts the base at 18px, which
         lands 13px→14.6, 14px→15.75, 16px→18.
         TO REVERT THE ENTIRE TEXT SCALE, set this back to 100%.
         It MUST stay a percentage: a px root is exactly what stops the
         browser's own text-size setting working, which is the point of
         having done this at all. */
      html { font-size: 112.5%; }

      /* Tatami under everything, so an overscroll or a slow first paint shows
         the floor rather than a white flash. The weave itself is .ts-tatami. */
      body { background: #C6BE8E; -webkit-text-size-adjust: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
